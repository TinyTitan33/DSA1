<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moving arrows — Java Memory Model</title>
<style>
:root{--ink:#1d2433;--mute:#5d6678;--line:#dde2ea;--blue:#2f6fdb;--blue-active:#2054ab;--blue-bg:#eef4fe;--purple:#8a4fd1;--amber-bg:#fff7eb;--green:#17855c;--green-bg:#e3f5ec;--red:#c93c3c;--red-bg:#fbe6e6}
*{box-sizing:border-box}
body{margin:0;padding:clamp(12px,3vw,20px);background:#f4f6fa;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto}
.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:5px;font-size:.92em}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title-sub{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.step-badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eef2f8;color:var(--blue);border:1px solid var(--line)}
.step-badge.done{background:var(--green-bg);color:var(--green);border-color:#bfead4}

/* Code panel */
.code{margin:0 0 10px;padding:10px 12px;background:#1d2433;border-radius:12px;font-size:clamp(13px,3.6vw,15px);line-height:1.7;overflow-x:auto}
.ln{white-space:pre;padding:0 8px;border-radius:6px;color:#9aa6bd}
.ln::before{content:"  "}
.ln.cur{background:#2f4a80;color:#fff}
.ln.cur::before{content:"▶ ";color:#8fb4ff}

/* Stage */
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(14px,4vw,24px);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.heads,.cols{display:grid;grid-template-columns:1fr 1fr;position:relative;z-index:1}
.heads{margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.heads span:last-child{text-align:right}
.cols{gap:clamp(18px,4vw,28px) clamp(24px,8vw,70px);align-items:center}
.cols>.box{justify-self:end}
.ghost{visibility:hidden}
.tag{width:min(120px,100%);border:2px solid;border-radius:14px;padding:clamp(8px,2vw,12px);text-align:center;position:relative;background:#fbfcff;font-size:clamp(20px,5vw,24px);font-weight:700;user-select:none}
.tag.a{border-color:var(--blue)}
.tag.b{border-color:var(--purple)}
.tag.empty{border-style:dashed;opacity:.6}
.tag.empty .nm::after{content:" null";font-size:.5em;font-weight:600;color:var(--mute)}
.box{width:min(140px,100%);border:2px solid var(--line);border-radius:12px;padding:clamp(10px,2.5vw,14px);position:relative;background:#fff;text-align:center;font-size:clamp(20px,5vw,24px);font-weight:700;user-select:none;transition:opacity .4s}
.box.gc{opacity:.45;border-style:dashed}
.box.gc::after{content:"garbage";position:absolute;top:-10px;right:10px;font:700 11px system-ui,sans-serif;background:#fff;color:var(--ink);padding:0 6px;border-radius:6px}
.box-val{display:inline-block;padding:0 4px}
.port{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;border:2px solid #fff;transform:translateY(-50%)}
.tag .port{right:-8px}
.box .port{left:-8px}
path.ar{fill:none;stroke-width:3.5;stroke-linecap:round}

@keyframes haloSame{0%,100%{box-shadow:0 0 0 2px #fff,0 0 0 7px var(--green)}50%{box-shadow:0 0 0 2px #fff,0 0 0 14px rgba(23,133,92,.35)}}
@keyframes haloDiff{0%,100%{box-shadow:0 0 0 2px #fff,0 0 0 7px var(--red)}50%{box-shadow:0 0 0 2px #fff,0 0 0 14px rgba(201,60,60,.35)}}
@keyframes valGlow{0%,100%{background:transparent}50%{background:#d1fae5;color:#065f46;box-shadow:0 0 0 6px #d1fae5;border-radius:6px}}
.halo-same{animation:haloSame 1s ease-in-out infinite;z-index:10}
.halo-diff{animation:haloDiff 1s ease-in-out infinite;z-index:10}
.val-glow{animation:valGlow .9s ease-in-out infinite}

/* Message */
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;background:#eaf1ff;font-size:clamp(14px,3.8vw,16px);min-height:52px}
.msg.t{background:var(--green-bg)}
.msg.f{background:var(--red-bg)}
.res{font-weight:800;text-decoration:underline}

/* Controls */
.ctl{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.hint{display:flex;align-items:center;gap:10px;flex-basis:100%;font-size:clamp(16px,4.4vw,18px);font-weight:800;padding:8px 16px;border-radius:14px}
.hint .ha{font-size:32px;line-height:1;animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(5px)}}
.hint-run{background:var(--blue-bg);color:var(--blue-active);border:2px solid #9fc0f7}
.hint-predict{background:#f3ebfc;color:var(--purple);border:2px solid #d0b3f2}
.hint-observe{background:var(--amber-bg);color:#925c04;border:2px solid #f6d297}
.hint-done{background:var(--green-bg);color:var(--green);border:2px solid #bfead4}
.btn{border-radius:12px;padding:12px 20px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation;transition:background .15s,transform .1s,border-color .15s}
.btn:active{transform:scale(.97)}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(47,111,219,.6)}50%{box-shadow:0 0 0 10px rgba(47,111,219,0)}}
.btn-run{flex:1 1 240px;border:2px solid var(--blue);background:var(--blue);color:#fff;animation:ring 1.4s ease-out infinite}
.btn-run:active{background:var(--blue-active)}
@media(hover:hover){.btn-run:hover{background:#2560c4}}
.choices{display:none;gap:10px;flex:1 1 240px}
.btn-choice{flex:1;border:2px solid var(--line);background:#fff;color:var(--ink);min-width:96px}
.choices.live .btn-choice{animation:ring 1.4s ease-out infinite}
.btn-choice:disabled{cursor:default;opacity:.5}
.btn-choice.true.picked{opacity:1;border-color:var(--green);background:#f0fdf4;color:var(--green)}
.btn-choice.false.picked{opacity:1;border-color:var(--red);background:#fef2f2;color:var(--red)}
@media(hover:hover){
.btn-choice.true:not(:disabled):hover{border-color:var(--green);background:#f0fdf4;color:var(--green)}
.btn-choice.false:not(:disabled):hover{border-color:var(--red);background:#fef2f2;color:var(--red)}}
.btn-ghost{border:2px solid var(--line);background:#fff;color:var(--mute);min-height:48px;padding:10px 16px;font-size:15px;font-weight:600}
.reset{flex:1 1 240px;background:none;border:0;color:var(--mute);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <span class="title-sub mono" id="part">Memory Model</span>
    <span class="step-badge mono" id="stepBadge">Step 1 of 7</span>
  </div>

  <div class="code mono" id="code"></div>

  <div class="stage" id="stage">
    <svg id="sv">
      <defs>
        <marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8 5L0 8.5z" fill="#2f6fdb"/></marker>
        <marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1.5L8 5L0 8.5z" fill="#8a4fd1"/></marker>
      </defs>
      <path id="pa" class="ar" stroke="#2f6fdb" marker-end="url(#mb)"/>
      <path id="pb" class="ar" stroke="#8a4fd1" marker-end="url(#mp)"/>
    </svg>
    <div class="heads mono"><span>Stack (names)</span><span>Heap (boxes)</span></div>
    <div class="cols">
      <div class="tag a mono" id="tagA"><span class="nm" id="nmA">a</span><span class="port" id="portA" style="background:#2f6fdb"></span></div>
      <div class="box mono" id="box1"><span class="port" id="port1" style="background:#d98f0b"></span><span class="box-val" id="val1">42</span></div>
      <div class="tag b mono empty" id="tagB"><span class="nm" id="nmB">b</span><span class="port" id="portB" style="background:#8a4fd1"></span></div>
      <div class="box mono ghost" id="box2"><span class="port" id="port2" style="background:#d98f0b"></span><span class="box-val" id="val2">42</span></div>
    </div>
  </div>

  <div class="msg" id="msg" aria-live="polite"></div>

  <div class="ctl">
    <div class="hint" id="hint"></div>
    <button class="btn btn-run mono" id="btnRun"></button>
    <div class="choices" id="choices">
      <button class="btn btn-choice true mono" id="btnTrue">✓ True</button>
      <button class="btn btn-choice false mono" id="btnFalse">✗ False</button>
    </div>
    <button class="btn btn-run mono" id="btnNext" style="display:none"></button>
    <button class="reset" id="btnReset" style="display:none">Start over ↺</button>
    <button class="btn btn-ghost" id="btnBack" style="display:none">← Back</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), sv=$('sv'), PT={box1:'port1',box2:'port2'};
const pt=el=>{const r=el.getBoundingClientRect(),s=sv.getBoundingClientRect();return[r.left-s.left+r.width/2,r.top-s.top+r.height/2]};
const mk=(p,f)=>({p:$(p),f:$(f),t:null,e:null,raf:0});
const A=mk('pa','portA'), B=mk('pb','portB');
const tp=t=>t?pt($(PT[t])):null;

// Draw an arrow from its tag to point `end` (hidden when it has no length).
function paint(a,end){
  const s=pt(a.f); a.e=end;
  if(!end||Math.hypot(end[0]-s[0],end[1]-s[1])<10){a.p.style.display='none';return}
  a.p.style.display='';
  const d=Math.max(20,(end[0]-s[0])*.45);
  a.p.setAttribute('d',`M${s[0]} ${s[1]}C${s[0]+d} ${s[1]},${end[0]-d} ${end[1]},${end[0]} ${end[1]}`);
}
// Move an arrow's head to a new target (slides if anim is true).
function aim(a,t,anim){
  cancelAnimationFrame(a.raf); a.t=t;
  const to=tp(t), s=pt(a.f), from=a.e||s;
  if(!anim||(!to&&!a.e)){paint(a,to);return}
  const goal=to||s, t0=performance.now();
  (function f(n){
    const k=Math.min(1,(n-t0)/450), e=1-Math.pow(1-k,3);
    paint(a,[from[0]+(goal[0]-from[0])*e,from[1]+(goal[1]-from[1])*e]);
    if(k<1)a.raf=requestAnimationFrame(f); else paint(a,to);
  })(t0);
}
const draw=()=>[A,B].forEach(a=>paint(a,tp(a.t)));

const M=['// Item holds an int; its equals() compares that int','Item a = new Item(42);','Item b;','b = a;','System.out.println(a == b);','b = new Item(42);','System.out.println(a == b);','System.out.println(a.equals(b));','b = a;','System.out.println(a == b);'];
const I1=['Integer x = 127, y = 127;','System.out.println(x == y);'];
const I2=['Integer p = 128, q = 128;','System.out.println(p == q);'];

// [correct answer, expression, why, extra note shown after a wrong guess]
const ANS={
 1:[true,'a == b','Both arrows land at the same box.',''],
 4:[false,'a == b','The arrows end at two different boxes, even though both hold 42.','It is tempting to think <code>==</code> looks inside the boxes. It only checks where the arrows land.'],
 6:[true,'a.equals(b)','<code>equals</code> opens the boxes and compares what is inside. Both hold 42. (This works because Item overrides <code>equals</code>; the default <code>Object.equals</code> would compare arrows, just like <code>==</code>.)','<code>equals</code> is the one that opens the boxes, as long as the class overrides it.'],
 9:[true,'a == b','Both arrows land at the first box again. Nothing points at the second box any more, so Java can eventually reclaim it (garbage collection).',''],
 11:[true,'x == y','Java keeps cached <code>Integer</code> boxes for -128 to 127, so both arrows land at the same box.','Small Integers come from a cache, so the same box is reused.'],
 13:[false,'p == q','128 is outside the cache, so each one gets a new box. Different boxes, different arrows. Compare Integers with <code>.equals()</code>.','Outside the cache every boxing creates a new box, just like <code>new Item(42)</code>.']
};

let st=0, hist=[], guess={}, ready=false;
const clear=()=>['port1','port2'].forEach(i=>$(i).classList.remove('halo-same','halo-diff'))||['val1','val2'].forEach(i=>$(i).classList.remove('val-glow'));

function view(o){
  clear();
  $('part').textContent=o.part||'Memory Model';
  const sb=$('stepBadge'); sb.textContent=o.badge; sb.className='step-badge mono'+(o.done?' done':'');
  $('code').innerHTML=o.code.slice(0,o.cur+1).map((l,i)=>`<div class="ln${i==o.cur?' cur':''}">${l}</div>`).join('');
  $('nmA').textContent=o.nA||'a'; $('nmB').textContent=o.nB||'b';
  $('tagA').classList.toggle('empty',!o.aT); $('tagB').classList.toggle('empty',!o.bT);
  $('val1').textContent=$('val2').textContent=o.v||42;
  $('box1').classList.toggle('ghost',!o.b1); $('box2').classList.toggle('ghost',!o.b2); $('box2').classList.toggle('gc',!!o.gc);
  aim(A,o.aT||null,ready); aim(B,o.bT||null,ready);
  (o.hl||[]).forEach(i=>$(i).classList.add(o.hc));
  if(o.glow)['val1','val2'].forEach(i=>$(i).classList.add('val-glow'));
  const m=$('msg'); m.innerHTML=o.msg; m.className='msg'+(o.mt?' '+o.mt:'');

  const mode=o.mode, f=mode=='fb';
  $('btnRun').style.display=mode=='run'?'':'none'; if(mode=='run')$('btnRun').textContent=o.run;
  const ch=$('choices'); ch.style.display=(mode=='pred'||f)?'flex':'none'; ch.classList.toggle('live',mode=='pred');
  [['btnTrue',true],['btnFalse',false]].forEach(([id,v])=>{const c=$(id);c.disabled=f;c.classList.toggle('picked',f&&o.g===v)});
  $('btnNext').style.display=f&&o.next?'':'none'; if(o.next)$('btnNext').textContent=o.next;
  $('btnReset').style.display=f&&!o.next?'':'none';
  $('btnBack').style.display=hist.length?'':'none';
  const h=$('hint');
  h.className='hint '+(o.done?'hint-done':{run:'hint-run',pred:'hint-predict',fb:'hint-observe'}[mode]);
  h.innerHTML=o.done?'<span> You got it now!</span>':f?`<span>👀 ${o.look}</span>`
    :`<span class="ha">↓</span><span>${mode=='run'?'Tap the button to run this line':'Predict before checking'}</span>`;
  if(ready)$({run:'btnRun',pred:'btnTrue',fb:o.next?'btnNext':'btnReset'}[mode]).focus({preventScroll:true});
}

function render(){
  const m=o=>view({aT:'box1',b1:1,code:M,...o});
  const n=o=>view({code:o.code,part:'Bonus · Integer cache',...o});
  const fb=(base,o)=>{
    const [ans,ex,why,note]=ANS[st-1], g=guess[st-1], ok=g===ans;
    base({...o,mode:'fb',g,mt:ok?'t':'f',msg:`<b>${ok?'✓ Correct.':'Not quite.'}</b> <code>${ex}</code> is <span class="res">${ans}</span>. ${why}${ok?'':' '+note}`});
  };
  switch(st){
  case 0:m({badge:'Step 1 of 7',cur:3,msg:'Tag <b>a</b> points to a box holding 42. Tag <b>b</b> has no arrow yet (<code>null</code>).',mode:'run',run:'Run: b = a'});break;
  case 1:m({badge:'Step 2 of 7',cur:4,bT:'box1',msg:'<b>b = a</b> copied the arrow, not the box. Will <code>a == b</code> be true or false?',mode:'pred'});break;
  case 2:fb(m,{badge:'Step 2 of 7',cur:4,bT:'box1',hl:['port1'],hc:'halo-same',look:'Notice the highlighted port where both arrows meet.',next:'Next: b = new Item(42) →'});break;
  case 3:m({badge:'Step 3 of 7',cur:5,bT:'box1',msg:'Next, allocate a separate box on the heap with <code>new</code>.',mode:'run',run:'Run: b = new Item(42)'});break;
  case 4:m({badge:'Step 4 of 7',cur:6,bT:'box2',b2:1,msg:'<b>new</b> created a second box and <b>b</b> now points to it. Will <code>a == b</code> be true or false?',mode:'pred'});break;
  case 5:fb(m,{badge:'Step 4 of 7',cur:6,bT:'box2',b2:1,hl:['port1','port2'],hc:'halo-diff',look:'The highlighted ports show the arrows land at different boxes.',next:'Next: a.equals(b) →'});break;
  case 6:m({badge:'Step 5 of 7',cur:7,bT:'box2',b2:1,msg:'Both boxes hold 42. Will <code>a.equals(b)</code> be true or false?',mode:'pred'});break;
  case 7:fb(m,{badge:'Step 5 of 7',cur:7,bT:'box2',b2:1,glow:1,look:'Both values glow: equals compared what is inside.',next:'Next: b = a →'});break;
  case 8:m({badge:'Step 6 of 7',cur:8,bT:'box2',b2:1,msg:'Arrow <b>b</b> still points to the second box. Now re-point it with an assignment.',mode:'run',run:'Run: b = a'});break;
  case 9:m({badge:'Step 7 of 7',cur:9,bT:'box1',b2:1,gc:1,msg:'<b>b = a</b> moved the arrow back to the first box. The second box has no arrows left: it is garbage. Will <code>a == b</code> be true again?',mode:'pred'});break;
  case 10:fb(m,{badge:'Step 7 of 7',cur:9,bT:'box1',b2:1,gc:1,hl:['port1'],hc:'halo-same',look:'Box 2 is faded: no arrow leads to it.',next:'Bonus: Integer caching →'});break;
  case 11:n({code:I1,cur:1,badge:'Bonus 1 of 2',nA:'x',nB:'y',v:127,msg:'<code>Integer</code> is an object too. Java boxes each <code>127</code> for you. The arrows are hidden until you answer: will <code>x == y</code> be true or false?',mode:'pred'});break;
  case 12:fb(n,{code:I1,cur:1,badge:'Bonus 1 of 2',nA:'x',nB:'y',v:127,aT:'box1',bT:'box1',b1:1,hl:['port1'],hc:'halo-same',look:'Both arrows land at one cached box.',next:'Next: 128 →'});break;
  case 13:n({code:I2,cur:1,badge:'Bonus 2 of 2',nA:'p',nB:'q',v:128,msg:'Same idea with <code>128</code>. Arrows hidden again: will <code>p == q</code> be true or false?',mode:'pred'});break;
  case 14:fb(n,{code:I2,cur:1,badge:'Completed',done:1,nA:'p',nB:'q',v:128,aT:'box1',bT:'box2',b1:1,b2:1,hl:['port1','port2'],hc:'halo-diff',look:''});break;
  }
  draw();
}

const go=k=>{hist.push(st);st=k;render()};
$('btnRun').onclick=$('btnNext').onclick=()=>go(st+1);
$('btnTrue').onclick=()=>{guess[st]=true;go(st+1)};
$('btnFalse').onclick=()=>{guess[st]=false;go(st+1)};
$('btnBack').onclick=()=>{st=hist.pop();render()};
$('btnReset').onclick=()=>{st=0;hist=[];guess={};render()};

if(window.ResizeObserver)new ResizeObserver(draw).observe($('stage')); else addEventListener('resize',draw);
addEventListener('load',draw);
render(); ready=true;
</script>
</body>
</html>
