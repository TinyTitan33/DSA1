  /* ---------- Geometry Drawing ---------- */

  function drawGeometry(modeState, posMap) {
    const activeNodes = modeState.root ? inorder(modeState.root) : [];
    const activeSet = new Set(activeNodes.map(n => n.id));
    const isSucc = activeTab === "succ";

    const edgeCaseByChild = {};
    const arrowCaseByChild = {};
    const climbNoteByNode = {};
    const climbedAncestorSet = new Set();

    if (isSucc) {
      const steps = modeState.activeSteps || [];
      const count = modeState.revealedStepsCount || 0;
      const startNode = modeState.startId ? modeState.byId[modeState.startId] : null;
      for (let i = 0; i < count && i < steps.length; i++) {
        const s = steps[i];
        if (s.dir === "down") {
          edgeCaseByChild[s.to.id] = s.caseType;
        } else {
          arrowCaseByChild[s.from.id] = s.caseType;
          if (startNode && s.smallerAncestor) {
            climbedAncestorSet.add(s.to.id);
            climbNoteByNode[s.to.id] = "from right";
          } else if (startNode && s.largerAncestor) {
            climbedAncestorSet.add(s.to.id);
            climbNoteByNode[s.to.id] = "from left";
          }
        }
      }
    } else {
      for (const item of modeState.activeWalkEdges) {
        edgeCaseByChild[item.childId] = item.caseType;
      }
    }

    const allKnownIds = Object.keys(svgPool.nodes);

    // Update child edges & parent arrows
    for (const id of allKnownIds) {
      const edgeEl = svgPool.edges[id];
      const arrowEl = svgPool.arrows[id];
      if (!edgeEl || !arrowEl) continue;

      const node = modeState.byId[id];
      const show = node && !node.removed && node.parent && !node.parent.removed && activeSet.has(id) && posMap[id] && posMap[node.parent.id];
      if (!show) {
        edgeEl.style.display = "none";
        arrowEl.style.display = "none";
        continue;
      }

      const pPos = posMap[node.parent.id];
      const cPos = posMap[id];
      const dx = cPos.x - pPos.x;
      const dy = cPos.y - pPos.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;

      edgeEl.style.display = "";
      edgeEl.setAttribute("x1", (pPos.x + ux * (RADIUS + 0.5)).toFixed(1));
      edgeEl.setAttribute("y1", (pPos.y + uy * (RADIUS + 0.5)).toFixed(1));
      edgeEl.setAttribute("x2", (cPos.x - ux * (RADIUS + 0.5)).toFixed(1));
      edgeEl.setAttribute("y2", (cPos.y - uy * (RADIUS + 0.5)).toFixed(1));
      edgeEl.setAttribute("opacity", modeState.fadingNodeId === id ? "0.25" : "1");

      const ec = edgeCaseByChild[id];
      edgeEl.classList.toggle("is-c1", ec === 1);
      edgeEl.classList.toggle("is-c2", ec === 2);

      const sideSign = dx < 0 ? 1 : -1;
      const ox = (-uy) * sideSign * 6.5;
      const oy = (ux) * sideSign * 6.5;
      const startTrim = RADIUS + 1.5;
      const endTrim = RADIUS + 3.5;

      arrowEl.style.display = "";
      arrowEl.setAttribute("x1", (cPos.x + ox - ux * startTrim).toFixed(1));
      arrowEl.setAttribute("y1", (cPos.y + oy - uy * startTrim).toFixed(1));
      arrowEl.setAttribute("x2", (pPos.x + ox + ux * endTrim).toFixed(1));
      arrowEl.setAttribute("y2", (pPos.y + oy + uy * endTrim).toFixed(1));
      arrowEl.setAttribute("opacity", modeState.fadingNodeId === id ? "0.25" : "1");

      const ac = arrowCaseByChild[id];
      arrowEl.classList.toggle("is-c1", ac === 1);
      arrowEl.classList.toggle("is-c2", ac === 2);
      if (ac === 2) arrowEl.setAttribute("marker-end", "url(#arrow-c2)");
      else if (ac === 1) arrowEl.setAttribute("marker-end", "url(#arrow-c1)");
      else arrowEl.setAttribute("marker-end", "url(#arrow-grey)");
    }

    let sugObj = null;
    if (isSucc && (modeState.phase === "pick" || modeState.phase === "done")) {
      sugObj = succSuggestion(modeState);
    } else if (!isSucc && (modeState.phase === "pick" || modeState.phase === "done")) {
      sugObj = delSuggestion(modeState);
    }
    const suggestedId = sugObj && sugObj.node ? sugObj.node.id : null;

    const showSuccPairInStrip =
      isSucc &&
      (modeState.phase === "done" ||
        (modeState.phase === "animating" &&
          modeState.revealedStepsCount >= modeState.activeSteps.length));

    const startOrTargetKey = isSucc
      ? (modeState.startId && modeState.byId[modeState.startId] ? modeState.byId[modeState.startId].key : null)
      : (modeState.targetId && modeState.byId[modeState.targetId] ? modeState.byId[modeState.targetId].key : null);

    // Update node elements & vertical projection guides
    for (const id of allKnownIds) {
      const ui = svgPool.nodes[id];
      const guideEl = svgPool.guides[id];
      const node = modeState.byId[id];
      if (!node || node.removed || !activeSet.has(id) || !posMap[id]) {
        ui.g.style.display = "none";
        ui.g.setAttribute("tabindex", "-1");
        ui.g.setAttribute("aria-hidden", "true");
        guideEl.style.display = "none";
        continue;
      }

      const p = posMap[id];
      ui.g.style.display = "";
      ui.g.setAttribute("tabindex", "0");
      ui.g.removeAttribute("aria-hidden");
      if (modeState.fadingNodeId !== id) {
        ui.g.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
        ui.g.style.opacity = "";
      }
      ui.keyText.textContent = String(node.key);

      let isStart = false;
      let isDeleteTarget = false;
      let isCandidate = false;
      let isClimbedAncestor = climbedAncestorSet.has(id);
      let isAnswer = false;
      let isGuessWrong = false;
      let isGuessRight = false;
      let isJustUpdated = false;
      let label = "";
      let labelVer = false;
      let labelHoverPrompt = false;

      if (isSucc) {
        isStart = modeState.startId === id && modeState.phase !== "pick";
        isCandidate = modeState.phase === "predict" && modeState.startId !== id;

        if (showSuccPairInStrip && modeState.answerId === id) {
          isAnswer = true;
        }
        if (showSuccPairInStrip && modeState.guess && modeState.guess !== "skip") {
          if (modeState.guess === id && modeState.answerId !== id) {
            isGuessWrong = true;
          } else if (modeState.guess === id && modeState.answerId === id) {
            isGuessRight = true;
          }
        }
        if (isAnswer) {
          label = modeState.dir === "succ" ? "successor" : "predecessor";
        } else if (isGuessWrong) {
          label = "your guess";
          labelVer = true;
        } else if (isStart) {
          label = "start";
        } else if (isCandidate) {
          label = "guess " + node.key + "?";
          labelHoverPrompt = true;
        }
      } else {
        isDeleteTarget = modeState.targetId === id && (modeState.phase === "predict" || modeState.phase === "animating");
        isCandidate = modeState.phase === "predict" && modeState.targetId !== id;
        const wasKey = modeState.lastChanges && modeState.lastChanges[id];
        isJustUpdated = modeState.justUpdatedId === id || (modeState.phase === "done" && wasKey !== undefined);

        if (modeState.guessWrongId === id) {
          isGuessWrong = true;
          label = "your guess";
          labelVer = true;
        } else if (isDeleteTarget) {
          label = "delete";
        } else if (modeState.phase === "done" && wasKey !== undefined) {
          label = "was " + wasKey;
          labelVer = true;
        } else if (isCandidate && startOrTargetKey !== null) {
          label = "moves to " + startOrTargetKey + "?";
          labelHoverPrompt = true;
        }
      }

      ui.g.classList.toggle("is-suggested", suggestedId === id);
      ui.g.classList.toggle("is-candidate", isCandidate);
      ui.g.classList.toggle("is-start", isStart);
      ui.g.classList.toggle("is-delete-target", isDeleteTarget);
      ui.g.classList.toggle("is-climbed-ancestor", isClimbedAncestor);
      ui.g.classList.toggle("is-answer", isAnswer);
      ui.g.classList.toggle("is-guess-wrong", isGuessWrong);
      ui.g.classList.toggle("is-guess-right", isGuessRight);
      ui.g.classList.toggle("is-just-updated", isJustUpdated);

      ui.stateLabel.textContent = label;
      ui.stateLabel.classList.toggle("is-ver", labelVer);
      ui.stateLabel.classList.toggle("is-hover-prompt", labelHoverPrompt);

      ui.climbNote.textContent = climbNoteByNode[id] || "";

      // Vertical projection drop-line connecting focal tree nodes directly to their strip cells
      const showGuide =
        (isSucc && showSuccPairInStrip && (id === modeState.startId || id === modeState.answerId)) ||
        (!isSucc && (isDeleteTarget || isJustUpdated || modeState.leavingStripId === id));

      if (showGuide && modeState.fadingNodeId !== id) {
        guideEl.style.display = "";
        guideEl.setAttribute("x1", p.x.toFixed(1));
        guideEl.setAttribute("y1", (p.y + RADIUS + 2).toFixed(1));
        guideEl.setAttribute("x2", p.x.toFixed(1));
        guideEl.setAttribute("y2", (STRIP_Y - 2).toFixed(1));
        guideEl.classList.toggle("is-ver", isJustUpdated || modeState.leavingStripId === id);
      } else {
        guideEl.style.display = "none";
      }

      const ariaParts = ["Node " + node.key];
      if (label && !labelHoverPrompt) ariaParts.push(label);
      if (climbNoteByNode[id]) ariaParts.push(climbNoteByNode[id]);
      if (isCandidate) ariaParts.push("candidate prediction target");
      if (suggestedId === id) ariaParts.push("suggested");
      ui.g.setAttribute("aria-label", ariaParts.join(", "));
    }

    // Update in-order strip (always visible so vertical alignment is always clear; masked during Tab 1 predict)
    const showStrip = activeNodes.length > 0;
    const maskStripForPredict = isSucc && modeState.phase === "predict";
    stripLayer.style.display = showStrip ? "" : "none";

    if (showStrip && activeNodes.length > 0) {
      const firstPos = posMap[activeNodes[0].id];
      if (firstPos) {
        svgPool.stripHeading.setAttribute("x", Math.max(16, firstPos.x - STRIP_W / 2).toFixed(1));
      }
      svgPool.stripHeading.textContent = maskStripForPredict
        ? "In order (masked while you predict)"
        : "In order";
    }

    for (const id of allKnownIds) {
      const cell = svgPool.stripCells[id];
      const node = modeState.byId[id];
      if (!showStrip || !node || node.removed || !activeSet.has(id) || !posMap[id]) {
        cell.g.style.display = "none";
        continue;
      }
      const p = posMap[id];
      cell.g.style.display = "";
      if (modeState.fadingNodeId !== id) {
        cell.g.setAttribute("transform", "translate(" + p.x.toFixed(1) + ",0)");
        cell.g.style.opacity = "";
      }
      cell.text.textContent = maskStripForPredict ? "·" : String(node.key);
      cell.g.classList.toggle("is-masked", maskStripForPredict);

      const cellStart = isSucc && showSuccPairInStrip && modeState.startId === id;
      const cellAns = isSucc && showSuccPairInStrip && modeState.answerId === id;
      const cellLeaving = !isSucc && modeState.leavingStripId === id;
      const wasKey = !isSucc && modeState.lastChanges ? modeState.lastChanges[id] : undefined;
      const cellWasUpdated = !isSucc && modeState.phase === "done" && wasKey !== undefined;
      const cellUpdated = !isSucc && (modeState.justUpdatedId === id || cellWasUpdated);

      if (cellLeaving) {
        cell.subLabel.textContent = "leaving";
      } else if (cellWasUpdated) {
        cell.subLabel.textContent = "was " + wasKey;
      } else {
        cell.subLabel.textContent = "";
      }

      cell.g.classList.toggle("is-start", cellStart);
      cell.g.classList.toggle("is-answer", cellAns);
      cell.g.classList.toggle("is-leaving", cellLeaving);
      cell.g.classList.toggle("is-was-updated", cellWasUpdated);
      cell.g.classList.toggle("is-just-updated", cellUpdated);
    }

    if (showSuccPairInStrip && modeState.startId && modeState.answerId && posMap[modeState.startId] && posMap[modeState.answerId]) {
      const sx = posMap[modeState.startId].x;
      const ax = posMap[modeState.answerId].x;
      const midX = (sx + ax) / 2;
      const bottomY = STRIP_Y + STRIP_H + 2;
      const ctrlY = STRIP_Y + STRIP_H + 32;
      svgPool.stripArcGroup.style.display = "";
      svgPool.stripArcPath.setAttribute(
        "d",
        "M " + sx.toFixed(1) + " " + bottomY + " Q " + midX.toFixed(1) + " " + ctrlY + " " + ax.toFixed(1) + " " + (bottomY + 3)
      );
      svgPool.stripArcLabel.setAttribute("x", midX.toFixed(1));
      svgPool.stripArcLabel.textContent = modeState.dir === "succ" ? "next" : "prev";
    } else {
      svgPool.stripArcGroup.style.display = "none";
    }
  }

  /* ---------- Full UI Render ---------- */

  function render() {
    const isSucc = activeTab === "succ";
    const st = isSucc ? succState : delState;

    tabSuccBtn.setAttribute("aria-selected", String(isSucc));
    tabSuccBtn.setAttribute("tabindex", isSucc ? "0" : "-1");
    tabDelBtn.setAttribute("aria-selected", String(!isSucc));
    tabDelBtn.setAttribute("tabindex", !isSucc ? "0" : "-1");

    if (isSucc) {
      const s = succState;
      const isMirror = s.dir === "pred";
      const startNode = s.startId ? s.byId[s.startId] : null;
      const nextSug = succSuggestion(s);

      conceptText.textContent = isMirror
        ? "Predecessor is what an in-order iterator visited just before, and delete can equally use it to keep the tree sorted. Every node here also stores a link to its parent (the thin grey arrows), which is what lets us go up."
        : "Successor is what an in-order iterator does next, and it's how delete keeps the tree sorted. Every node here also stores a link to its parent (the thin grey arrows), which is what lets us go up.";

      if (s.phase === "pick") {
        taskLabel.textContent = "Your task · Step 1 of 2";
        taskText.textContent = nextSug && nextSug.node
          ? "Click node " + nextSug.node.key + " (or any node) to start from it."
          : "Click any node to find its " + (isMirror ? "predecessor" : "successor") + ".";
      } else if (s.phase === "predict") {
        taskLabel.textContent = "Your task · Step 2 of 2";
        taskText.textContent = isMirror
          ? "Click the node that comes right before " + startNode.key + ", or press No predecessor."
          : "Click the node that comes right after " + startNode.key + ", or press No successor.";
      } else if (s.phase === "animating") {
        taskLabel.textContent = "Your task";
        taskText.textContent = "Watch the path from node " + startNode.key + " (or press Skip animation).";
      } else {
        taskLabel.textContent = "Your task";
        if (nextSug && nextSug.node) {
          taskText.textContent = "Click node " + nextSug.node.key + " (" + nextSug.reason + "), or pick any node.";
        } else {
          taskText.textContent = "Click another node to test, or press Next: Delete →.";
        }
      }

      delLegend.hidden = true;
      succLegend.hidden = false;
      legCase1Text.textContent = isMirror
        ? "Case 1 — Left child exists: go left once, then right as far as possible."
        : "Case 1 — Right child exists: go right once, then left as far as possible.";
      legCase2Text.textContent = isMirror
        ? "Case 2 — No left child: go up until you arrive from a right child. That parent is the predecessor."
        : "Case 2 — No right child: go up until you arrive from a left child. That parent is the successor.";

      checkCase1.textContent = s.seen.case1 ? "[✓]" : "[ ]";
      checkCase2.textContent = s.seen.case2 ? "[✓]" : "[ ]";
      legCase1.classList.toggle("seen", s.seen.case1);
      legCase2.classList.toggle("seen", s.seen.case2);

      const activeCaseType =
        (s.phase === "animating" || s.phase === "done") ? s.caseType : null;
      legCase1.classList.toggle("active", activeCaseType === 1);
      legCase2.classList.toggle("active", activeCaseType === 2);

      const showMirror = s.phase === "pick" || s.phase === "done";
      mirrorBtn.hidden = !showMirror;
      mirrorBtn.textContent = isMirror ? "Show successor instead" : "Show predecessor instead";

      if (s.phase === "predict") {
        altPredictBtn.hidden = false;
        altPredictBtn.textContent = isMirror ? "No predecessor" : "No successor";
        skipBtn.hidden = false;
        skipBtn.textContent = "Skip, show me";
      } else if (s.phase === "animating") {
        altPredictBtn.hidden = true;
        skipBtn.hidden = false;
        skipBtn.textContent = "Skip animation";
      } else {
        altPredictBtn.hidden = true;
        skipBtn.hidden = true;
      }
      resetBtn.className = "btn secondary";

      const allSeen = s.seen.case1 && s.seen.case2 && s.seen.none;
      footerNavBtn.textContent = "Next: Delete →";
      footerNavBtn.className = allSeen ? "btn primary" : "btn secondary";
      footerNote.textContent = "Next page: delete nodes by copying a neighbour's value so the strip stays sorted.";
    } else {
      const d = delState;
      const targetNode = d.targetId ? d.byId[d.targetId] : null;
      const nextSug = delSuggestion(d);
      const baseCount = activeKeySequence.length;

      conceptText.textContent =
        "A leaf can simply go; any other node copies its predecessor or successor, and that neighbour node is removed instead.";

      if (d.phase === "empty") {
        taskLabel.textContent = "Your task";
        taskText.textContent = "Press Reset to bring the tree back.";
      } else if (d.phase === "pick") {
        taskLabel.textContent = "Your task · Step 1 of 2";
        taskText.textContent = nextSug && nextSug.node
          ? "Click node " + nextSug.node.key + " (or any node) to delete it."
          : "Click any node to delete it.";
      } else if (d.phase === "predict") {
        taskLabel.textContent = "Your task · Step 2 of 2";
        taskText.textContent =
          "Click the neighbour whose value will move into " + targetNode.key + "'s place, or press Just remove it (leaf).";
      } else if (d.phase === "animating") {
        taskLabel.textContent = "Your task";
        taskText.textContent = "Deleting node " + targetNode.key + " (or press Skip animation).";
      } else {
        taskLabel.textContent = "Your task";
        taskText.textContent = nextSug && nextSug.node
          ? "Click node " + nextSug.node.key + " (" + nextSug.reason + "), or pick any node."
          : "Click another node to delete, or press Reset.";
      }

      succLegend.hidden = true;
      mirrorBtn.hidden = true;
      delLegend.hidden = false;

      const innerSeen = d.seen.pred || d.seen.succ;
      checkDelLeaf.textContent = d.seen.leaf ? "[✓]" : "[ ]";
      checkDelInner.textContent = innerSeen ? "[✓]" : "[ ]";
      checkDelChain.textContent = d.seen.chain ? "[✓]" : "[ ]";
      delLegLeaf.classList.toggle("seen", d.seen.leaf);
      delLegInner.classList.toggle("seen", innerSeen);
      delLegChain.classList.toggle("seen", d.seen.chain);

      const showDelCase = d.phase === "animating" || d.phase === "done";
      delLegLeaf.classList.toggle("active", showDelCase && d.activeCase === "leaf");
      delLegInner.classList.toggle("active", showDelCase && d.activeCase === "inner");
      delLegChain.classList.toggle("active", showDelCase && !!d.activeChain);

      if (d.phase === "predict") {
        altPredictBtn.hidden = false;
        altPredictBtn.textContent = "Just remove it (leaf)";
        skipBtn.hidden = false;
        skipBtn.textContent = "Skip, show me";
      } else if (d.phase === "animating") {
        altPredictBtn.hidden = true;
        skipBtn.hidden = false;
        skipBtn.textContent = "Skip animation";
      } else {
        altPredictBtn.hidden = true;
        skipBtn.hidden = true;
      }

      resetBtn.className = d.phase === "empty" ? "btn primary" : "btn secondary";

      footerNavBtn.textContent = "← Back: Successor";
      footerNavBtn.className = "btn secondary";
      footerNote.textContent = "Last page. Reset brings back all " + baseCount + (baseCount === 1 ? " key." : " keys.");
    }

    statusWhat.textContent = st.statusWhat;
    statusNext.textContent = st.statusNext;

    const layout = computeLayout(st.root);
    livePositions = layout.pos;
    drawGeometry(st, livePositions);
  }

  /* ---------- Successor Mode Logic ---------- */

  function succFeedbackText(dir, startNode, guess, answer, steps) {
    const word = dir === "succ" ? "successor" : "predecessor";
    if (guess === "skip") return "Here is the answer.";

    if (answer === null) {
      if (guess === "none") return "Right: " + startNode.key + " has no " + word + ".";
      const gNode = succState.byId[guess];
      return dir === "succ"
        ? "You guessed " + gNode.key + ", but " + gNode.key + " < " + startNode.key + ". Nothing is bigger than " + startNode.key + " (last in the strip)."
        : "You guessed " + gNode.key + ", but " + gNode.key + " > " + startNode.key + ". Nothing is smaller than " + startNode.key + " (first in the strip).";
    }

    if (guess === answer.id) {
      return "Right: " + answer.key + " is the " + word + " of " + startNode.key + ".";
    }

    if (guess === "none") {
      if (dir === "succ") {
        return !startNode.right
          ? startNode.key + " has no right child, so go up until you arrive from a left child (" + answer.key + ")."
          : startNode.key + " has a right subtree with bigger keys (smallest is " + answer.key + ").";
      }
      return !startNode.left
        ? startNode.key + " has no left child, so go up until you arrive from a right child (" + answer.key + ")."
        : startNode.key + " has a left subtree with smaller keys (largest is " + answer.key + ").";
    }

    const gNode = succState.byId[guess];
    const firstChildStep = steps.length > 0 && steps[0].dir === "down" ? steps[0].to : null;

    if (dir === "succ") {
      if (gNode.key < startNode.key) {
        if (startNode.left && isInSubtree(gNode, startNode.left)) {
          return gNode.key + " is in " + startNode.key + "'s left subtree (" + gNode.key + " < " + startNode.key + "). Go up instead until you arrive at a parent from its left child (" + answer.key + ").";
        }
        if (isInSubtree(startNode, gNode)) {
          return "You went up to " + gNode.key + ", but you arrived from its right child. Keep going up until you arrive from a left child (" + answer.key + ").";
        }
        return gNode.key + " is smaller than " + startNode.key + "; the successor must be bigger (" + answer.key + ").";
      }
      if (firstChildStep && gNode.id === firstChildStep.id && answer.id !== firstChildStep.id) {
        return "You went right once to " + gNode.key + ", then stopped — keep going left as far as possible to " + answer.key + ".";
      }
      if (startNode.right && !isInSubtree(gNode, startNode.right)) {
        return gNode.key + " is an ancestor above " + startNode.key + ", but " + startNode.key + " has a right child (" + startNode.right.key + "). Use Case 1 first: right once, then left to " + answer.key + ".";
      }
      return gNode.key + " is bigger than " + startNode.key + ", but " + answer.key + " sits between them.";
    } else {
      if (gNode.key > startNode.key) {
        if (startNode.right && isInSubtree(gNode, startNode.right)) {
          return gNode.key + " is in " + startNode.key + "'s right subtree (" + gNode.key + " > " + startNode.key + "). Go up instead until you arrive at a parent from its right child (" + answer.key + ").";
        }
        if (isInSubtree(startNode, gNode)) {
          return "You went up to " + gNode.key + ", but you arrived from its left child. Keep going up until you arrive from a right child (" + answer.key + ").";
        }
        return gNode.key + " is bigger than " + startNode.key + "; the predecessor must be smaller (" + answer.key + ").";
      }
      if (firstChildStep && gNode.id === firstChildStep.id && answer.id !== firstChildStep.id) {
        return "You went left once to " + gNode.key + ", then stopped — keep going right as far as possible to " + answer.key + ".";
      }
      if (startNode.left && !isInSubtree(gNode, startNode.left)) {
        return gNode.key + " is an ancestor above " + startNode.key + ", but " + startNode.key + " has a left child (" + startNode.left.key + "). Use Case 1 first: left once, then right to " + answer.key + ".";
      }
      return gNode.key + " is smaller than " + startNode.key + ", but " + answer.key + " sits between them.";
    }
  }

  function succExplanationText(dir, startNode, pathRes) {
    const { caseType, steps, answer } = pathRes;

    if (caseType === 1) {
      const first = steps[0].to;
      if (dir === "succ") {
        return steps.length === 1
          ? "Case 1: right once from " + startNode.key + " to " + answer.key + " (no left child)."
          : "Case 1: right once to " + first.key + ", then left as far as possible to " + answer.key + ".";
      }
      return steps.length === 1
        ? "Case 1: left once from " + startNode.key + " to " + answer.key + " (no right child)."
        : "Case 1: left once to " + first.key + ", then right as far as possible to " + answer.key + ".";
    }

    if (answer === null) {
      return dir === "succ"
        ? startNode.key + " has no right child and every step up to the root arrives from a right child — no successor."
        : startNode.key + " has no left child and every step up to the root arrives from a left child — no predecessor.";
    }

    const passedAncestors = [];
    for (let i = 0; i < steps.length - 1; i++) {
      passedAncestors.push(steps[i].to.key);
    }
    if (dir === "succ") {
      const viaText = passedAncestors.length > 0
        ? "past " + passedAncestors.join(" and ") + " (arrived from right) "
        : "";
      return "Case 2: no right child, so go up " + viaText + "until arriving from a left child at " + answer.key + ".";
    } else {
      const viaText = passedAncestors.length > 0
        ? "past " + passedAncestors.join(" and ") + " (arrived from left) "
        : "";
      return "Case 2: no left child, so go up " + viaText + "until arriving from a right child at " + answer.key + ".";
    }
  }

  function succDoneStatus(s, feedback, explanation) {
    s.statusWhat = feedback + " " + explanation;
    const allSeen = s.seen.case1 && s.seen.case2 && s.seen.none;
    if (allSeen) {
      const lessonSummary = s.dir === "succ"
        ? "Lesson: whether going right-then-left (Case 1) or up until arriving from a left child (Case 2), the successor is always the next item in the strip."
        : "Lesson: whether going left-then-right (Case 1) or up until arriving from a right child (Case 2), the predecessor is always the previous item in the strip.";
      s.statusWhat = feedback + " " + explanation + " " + lessonSummary;
      s.statusNext = s.dir === "succ"
        ? "Next: press Show predecessor instead, or press Next: Delete →."
        : "Next: press Next: Delete →, or click another node.";
    } else {
      const sug = succSuggestion(s);
      if (sug && sug.node) {
        s.statusNext = "Next: click node " + sug.node.key + " (" + sug.reason + ").";
      } else {
        s.statusNext = "Next: click another node.";
      }
    }
  }

  function finalizeSuccSync(s) {
    if (s.phase !== "animating") return;
    const startNode = s.byId[s.startId];
    const pathRes = s.dir === "succ" ? succPath(startNode) : predPath(startNode);
    s.revealedStepsCount = pathRes.steps.length;
    s.phase = "done";
    if (pathRes.answer === null) s.seen.none = true;
    else if (pathRes.caseType === 1) s.seen.case1 = true;
    else s.seen.case2 = true;

    const fb = succFeedbackText(s.dir, startNode, s.guess, pathRes.answer, pathRes.steps);
    const exp = succExplanationText(s.dir, startNode, pathRes);
    succDoneStatus(s, fb, exp);
    hideCursor();
  }

  async function runSuccReveal(guess) {
    const s = succState;
    const startNode = s.byId[s.startId];
    const pathRes = s.dir === "succ" ? succPath(startNode) : predPath(startNode);
    const myId = ++anim.id;
    anim.fast = false;

    s.phase = "animating";
    s.guess = guess;
    s.answerId = pathRes.answer ? pathRes.answer.id : null;
    s.caseType = pathRes.caseType;
    s.activeSteps = pathRes.steps;
    s.revealedStepsCount = 0;
    s.statusWhat = "Tracing from node " + startNode.key + "...";
    s.statusNext = "";
    render();

    const color = pathRes.caseType === 1 ? "#2b5c8a" : "#2f7a5b";

    try {
      const startPos = livePositions[startNode.id];
      if (startPos) showCursorAt(startPos.x, startPos.y, color);

      for (let i = 0; i < pathRes.steps.length; i++) {
        const step = pathRes.steps[i];
        s.statusWhat = step.narration;
        statusWhat.textContent = s.statusWhat;

        const fromPos = livePositions[step.from.id];
        const toPos = livePositions[step.to.id];

        await tween(STEP_MS * 0.72, function (t) {
          const x = fromPos.x + (toPos.x - fromPos.x) * t;
          const y = fromPos.y + (toPos.y - fromPos.y) * t;
          showCursorAt(x, y, color);
        }, myId);

        s.revealedStepsCount = i + 1;
        drawGeometry(s, livePositions);

        await pause(STEP_MS * 0.35, myId);
      }

      if (pathRes.answer === null) {
        s.statusWhat = s.dir === "succ"
          ? "Reached the root: every step up arrived from a right child → no successor."
          : "Reached the root: every step up arrived from a left child → no predecessor.";
        statusWhat.textContent = s.statusWhat;
        await pause(STEP_MS * 0.5, myId);
      }

      hideCursor();
      if (pathRes.answer === null) s.seen.none = true;
      else if (pathRes.caseType === 1) s.seen.case1 = true;
      else s.seen.case2 = true;

      s.phase = "done";
      const fb = succFeedbackText(s.dir, startNode, guess, pathRes.answer, pathRes.steps);
      const exp = succExplanationText(s.dir, startNode, pathRes);
      succDoneStatus(s, fb, exp);
      render();
    } catch (err) {
      if (err !== CANCEL) throw err;
    }
  }

  function startSuccPredict(nodeId) {
    const s = succState;
    const node = s.byId[nodeId];
    const hasChild = s.dir === "succ" ? !!node.right : !!node.left;
    s.phase = "predict";
    s.startId = nodeId;
    s.guess = null;
    s.answerId = null;
    s.caseType = null;
    s.activeSteps = [];
    s.revealedStepsCount = 0;
    if (s.dir === "succ") {
      s.statusWhat = hasChild
        ? "Node " + node.key + " has a right child (" + node.right.key + "), so Case 1 applies."
        : "Node " + node.key + " has no right child, so Case 2 applies (go up until you arrive from a left child).";
      s.statusNext = "Next: click its successor on the tree, or press No successor.";
    } else {
      s.statusWhat = hasChild
        ? "Node " + node.key + " has a left child (" + node.left.key + "), so Case 1 applies."
        : "Node " + node.key + " has no left child, so Case 2 applies (go up until you arrive from a right child).";
      s.statusNext = "Next: click its predecessor on the tree, or press No predecessor.";
    }
    render();
  }

  function handleSuccNodeClick(nodeId) {
    const s = succState;
    if (s.phase === "animating") {
      anim.fast = true;
      return;
    }
    if (s.phase === "pick" || s.phase === "done") {
      startSuccPredict(nodeId);
      return;
    }
    if (s.phase === "predict") {
      if (nodeId === s.startId) {
        const altLabel = s.dir === "succ" ? "No successor" : "No predecessor";
        s.statusWhat = "That is the starting node (" + s.byId[nodeId].key + ").";
        s.statusNext = "Next: click a different node as your prediction, or press " + altLabel + ".";
        render();
        return;
      }
      runSuccReveal(nodeId);
    }
  }

  function toggleDirection() {
    const s = succState;
    if (s.phase === "animating" || s.phase === "predict") return;
    anim.id++;
    hideCursor();
    s.dir = s.dir === "succ" ? "pred" : "succ";
    s.phase = "pick";
    s.startId = null;
    s.guess = null;
    s.answerId = null;
    s.caseType = null;
    s.activeSteps = [];
    s.revealedStepsCount = 0;
    const sug = succSuggestion(s);
    if (s.dir === "pred") {
      s.statusWhat = "Showing predecessor (mirror of successor: swap left and right).";
      s.statusNext = sug && sug.node ? "Next: click node " + sug.node.key + " (" + sug.reason + ")." : "Next: click any node.";
    } else {
      s.statusWhat = "Showing successor.";
      s.statusNext = sug && sug.node ? "Next: click node " + sug.node.key + " (" + sug.reason + ")." : "Next: click any node.";
    }
    render();
  }

  /* ---------- Delete Mode Logic ---------- */

  function delWalkSteps(node, preferVia) {
    const steps = [];
    const useSucc = preferVia === "succ" ? !!node.right : !node.left;
    if (!useSucc && node.left) {
      steps.push({ from: node, to: node.left });
      let cur = node.left;
      while (cur.right) {
        steps.push({ from: cur, to: cur.right });
        cur = cur.right;
      }
      return { via: "pred", rep: cur, steps };
    }
    steps.push({ from: node, to: node.right });
    let cur = node.right;
    while (cur.left) {
      steps.push({ from: cur, to: cur.left });
      cur = cur.left;
    }
    return { via: "succ", rep: cur, steps };
  }

  function evaluateDelPrediction(target, guess) {
    if (isLeaf(target)) {
      const isRight = guess === "remove";
      const fb = guess === "skip"
        ? "Here is what happens."
        : (isRight
          ? "Right: " + target.key + " is a leaf, so it is simply removed."
          : target.key + " has no children, so no value moves into its place — it is simply removed.");
      return { isRight, chosenVia: null, expectedId: "remove", feedback: fb };
    }

    const predNode = target.left ? pred(target) : null;
    const succNode = target.right ? succ(target) : null;
    const hasTwoChildren = !!(target.left && target.right);

    // Accept BOTH predecessor and successor when a node has two children!
    if (hasTwoChildren) {
      if (guess === predNode.id) {
        return {
          isRight: true,
          chosenVia: "pred",
          expectedId: predNode.id,
          feedback: "Right: " + predNode.key + " (predecessor) moves into " + target.key + "'s place (successor " + succNode.key + " also works)."
        };
      }
      if (guess === succNode.id) {
        return {
          isRight: true,
          chosenVia: "succ",
          expectedId: succNode.id,
          feedback: "Right: " + succNode.key + " (successor) moves into " + target.key + "'s place (predecessor " + predNode.key + " is the default convention; both work)."
        };
      }
    }

    const defaultVia = target.left ? "pred" : "succ";
    const ansNode = defaultVia === "pred" ? predNode : succNode;

    if (guess === "skip") {
      return { isRight: false, chosenVia: defaultVia, expectedId: ansNode.id, feedback: "Here is what happens." };
    }
    if (guess === ansNode.id) {
      return {
        isRight: true,
        chosenVia: defaultVia,
        expectedId: ansNode.id,
        feedback: "Right: " + ansNode.key + " moves into " + target.key + "'s place."
      };
    }
    if (guess === "remove") {
      return {
        isRight: false,
        chosenVia: defaultVia,
        expectedId: ansNode.id,
        feedback: target.key + " has children; removing it directly would cut off its subtrees. Copy an adjacent neighbour (" + ansNode.key + ") instead."
      };
    }

    const gNode = delState.byId[guess];
    if (target.left && gNode.id === target.left.id && ansNode.id !== target.left.id) {
      return {
        isRight: false,
        chosenVia: defaultVia,
        expectedId: ansNode.id,
        feedback: "You went left once to " + gNode.key + ", but " + gNode.key + " has a right child (" + ansNode.key + "). Keep going right to predecessor " + ansNode.key + " (or use successor " + (succNode ? succNode.key : "") + ")."
      };
    }
    if (target.right && gNode.id === target.right.id && (!succNode || succNode.id !== target.right.id)) {
      return {
        isRight: false,
        chosenVia: defaultVia,
        expectedId: ansNode.id,
        feedback: "You went right once to " + gNode.key + ", but " + gNode.key + " has a left child (" + (succNode ? succNode.key : ansNode.key) + "). Keep going left to the adjacent neighbour."
      };
    }
    const validChoicesText = hasTwoChildren
      ? "predecessor " + predNode.key + " or successor " + succNode.key
      : (defaultVia === "pred" ? "predecessor " + ansNode.key : "successor " + ansNode.key);
    return {
      isRight: false,
      chosenVia: defaultVia,
      expectedId: ansNode.id,
      feedback: "Moving " + gNode.key + " into " + target.key + " would break sorted order. Only an adjacent key (" + validChoicesText + ") keeps the strip sorted."
    };
  }

  function delNarrativeText(records) {
    if (records.length === 1 && records[0].type === "leaf") {
      return "Leaf " + records[0].key + " was removed, leaving the strip sorted.";
    }
    const parts = [];
    for (let i = 0; i < records.length; i++) {
      const r = records[i];
      if (r.type === "copy") {
        if (i === 0) {
          parts.push(
            (r.via === "pred" ? "Predecessor " : "Successor ") +
              r.from + " copied into " + r.to + "'s place."
          );
        } else {
          parts.push("Old " + r.to + " still had a child, so " + r.from + " copied into it.");
        }
      } else {
        parts.push("Leaf " + r.key + " was removed; the strip stayed sorted.");
      }
    }
    return parts.join(" ");
  }

  function delDoneStatus(d, feedback, narrative) {
    if (!d.root) {
      d.phase = "empty";
      d.statusWhat = feedback + " " + narrative + " The tree is now empty.";
      d.statusNext = "Next: press Reset.";
      return;
    }

    d.phase = "done";
    const allSeen = delAllCategoriesSeen(d);
    const sug = delSuggestion(d);

    if (allSeen) {
      d.statusWhat =
        feedback + " " + narrative +
        " Lesson: delete never breaks sorted order because only a leaf ever disappears, and any other node takes an adjacent neighbour's value.";
      if (sug && sug.node) {
        d.statusNext = "Next: click node " + sug.node.key + " (" + sug.reason + "), or press Reset.";
      } else {
        d.statusNext = "Next: click another node, or press Reset.";
      }
    } else {
      d.statusWhat = feedback + " " + narrative;
      d.statusNext = sug && sug.node
        ? "Next: click node " + sug.node.key + " (" + sug.reason + ")."
        : "Next: click another node.";
    }
  }

  function detachLeaf(d, leaf, receiverNode) {
    const leafEl = svgPool.nodes[leaf.id].g;
    const hadFocus = document.activeElement === leafEl;
    const oldOrder = inorder(d.root);
    const idx = oldOrder.indexOf(leaf);

    if (!leaf.parent) {
      d.root = null;
    } else if (leaf.parent.left === leaf) {
      leaf.parent.left = null;
    } else {
      leaf.parent.right = null;
    }
    leaf.parent = null;
    leaf.removed = true;

    if (hadFocus) {
      if (receiverNode && !receiverNode.removed) {
        svgPool.nodes[receiverNode.id].g.focus();
      } else {
        const nextNode = idx >= 0 && idx + 1 < oldOrder.length ? oldOrder[idx + 1] : null;
        if (nextNode && !nextNode.removed) {
          svgPool.nodes[nextNode.id].g.focus();
        } else {
          resetBtn.focus();
        }
      }
    }
  }

  function finishDeleteSync(d) {
    if (d.phase !== "animating") return;
    let cur = d.pendingNodeId ? d.byId[d.pendingNodeId] : null;
    let lastReceiver = d.pendingReceiverId ? d.byId[d.pendingReceiverId] : null;
    let preferVia = d.pendingVia;
    while (cur && !cur.removed) {
      if (isLeaf(cur)) {
        if (d.guessWrongId === cur.id) d.guessWrongId = null;
        detachLeaf(d, cur, lastReceiver);
        if (d.pendingRecords.length === 0) d.seen.leaf = true;
        d.pendingRecords.push({ type: "leaf", key: cur.key });
        break;
      }
      const walk = delWalkSteps(cur, preferVia);
      preferVia = null;
      if (d.pendingRecords.length === 0) {
        if (walk.via === "pred") d.seen.pred = true;
        else d.seen.succ = true;
      } else {
        d.seen.chain = true;
      }
      const fromKey = walk.rep.key;
      const toKey = cur.key;
      d.lastChanges[cur.id] = toKey;
      cur.key = fromKey;
      if (d.guessWrongId === cur.id) d.guessWrongId = null;
      d.pendingRecords.push({ type: "copy", from: fromKey, to: toKey, via: walk.via });
      lastReceiver = cur;
      cur = walk.rep;
    }

    d.pendingNodeId = null;
    d.pendingReceiverId = null;
    d.pendingVia = null;
    d.activeWalkEdges = [];
    d.leavingStripId = null;
    d.justUpdatedId = null;
    d.fadingNodeId = null;
    svgPool.flyGroup.style.display = "none";
    hideCursor();

    const fb = d.pendingFeedback || "Here is what happens.";
    const nar = delNarrativeText(d.pendingRecords);
    delDoneStatus(d, fb, nar);
  }

  async function delRecursive(node, receiverNode, preferVia, myId) {
    const d = delState;
    d.pendingNodeId = node.id;
    d.pendingReceiverId = receiverNode ? receiverNode.id : null;
    d.pendingVia = preferVia || null;

    if (isLeaf(node)) {
      d.statusWhat = "Removing leaf " + node.key + "...";
      statusWhat.textContent = d.statusWhat;

      d.fadingNodeId = node.id;
      const nodeUi = svgPool.nodes[node.id];
      const cellUi = svgPool.stripCells[node.id];
      nodeUi.circle.style.stroke = "#d63a24";
      nodeUi.circle.style.strokeWidth = "3.2";
      const basePos = livePositions[node.id];

      await pause(FADE_MS * 0.55, myId);

      await tween(FADE_MS, function (t) {
        const s = 1 - 0.5 * t;
        nodeUi.g.setAttribute(
          "transform",
          "translate(" + basePos.x.toFixed(1) + "," + basePos.y.toFixed(1) + ") scale(" + s.toFixed(3) + ")"
        );
        nodeUi.g.style.opacity = String((1 - t).toFixed(3));
        cellUi.g.style.opacity = String((1 - t).toFixed(3));
      }, myId);

      nodeUi.circle.style.stroke = "";
      nodeUi.circle.style.strokeWidth = "";
      nodeUi.g.style.opacity = "";
      cellUi.g.style.opacity = "";
      d.fadingNodeId = null;
      d.leavingStripId = null;
      d.justUpdatedId = null;
      if (d.guessWrongId === node.id) d.guessWrongId = null;

      const oldPos = Object.assign({}, livePositions);
      detachLeaf(d, node, receiverNode);
      if (d.pendingRecords.length === 0) {
        d.seen.leaf = true;
      }
      d.pendingRecords.push({ type: "leaf", key: node.key });
      d.pendingNodeId = null;
      d.pendingReceiverId = null;
      d.pendingVia = null;

      const newLayout = computeLayout(d.root);
      const newPos = newLayout.pos;

      await tween(RELAYOUT_MS, function (t) {
        const interp = {};
        for (const id in newPos) {
          const a = oldPos[id] || newPos[id];
          const b = newPos[id];
          interp[id] = {
            x: a.x + (b.x - a.x) * t,
            y: a.y + (b.y - a.y) * t
          };
        }
        livePositions = interp;
        drawGeometry(d, livePositions);
      }, myId);

      livePositions = newPos;
      return;
    }

    const walk = delWalkSteps(node, preferVia);
    if (d.pendingRecords.length === 0) {
      if (walk.via === "pred") d.seen.pred = true;
      else d.seen.succ = true;
    } else {
      d.seen.chain = true;
    }

    d.statusWhat = walk.via === "pred"
      ? "Finding predecessor of " + node.key + " (left once, then right as far as possible)..."
      : "Finding successor of " + node.key + " (right once, then left as far as possible)...";
    statusWhat.textContent = d.statusWhat;

    const startP = livePositions[node.id];
    showCursorAt(startP.x, startP.y, "#2b5c8a");
    d.activeWalkEdges = [];

    for (let i = 0; i < walk.steps.length; i++) {
      const step = walk.steps[i];
      const fromP = livePositions[step.from.id];
      const toP = livePositions[step.to.id];

      await tween(STEP_MS * 0.68, function (t) {
        showCursorAt(fromP.x + (toP.x - fromP.x) * t, fromP.y + (toP.y - fromP.y) * t, "#2b5c8a");
      }, myId);

      d.activeWalkEdges.push({ childId: step.to.id, caseType: 1 });
      drawGeometry(d, livePositions);
      await pause(STEP_MS * 0.25, myId);
    }

    hideCursor();

    const rep = walk.rep;
    const fromKey = rep.key;
    const toKey = node.key;
    d.statusWhat = "Copying " + fromKey + " into " + toKey + "'s place...";
    statusWhat.textContent = d.statusWhat;

    const repPos = livePositions[rep.id];
    const targetPos = livePositions[node.id];
    svgPool.flyText.textContent = String(fromKey);
    svgPool.flyGroup.style.display = "";

    await tween(FLY_MS, function (t) {
      const x = repPos.x + (targetPos.x - repPos.x) * t;
      const y = repPos.y + (targetPos.y - repPos.y) * t;
      svgPool.flyGroup.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")");
    }, myId);

    svgPool.flyGroup.style.display = "none";

    d.lastChanges[node.id] = toKey;
    node.key = fromKey;
    d.pendingRecords.push({ type: "copy", from: fromKey, to: toKey, via: walk.via });
    d.pendingNodeId = rep.id;
    d.pendingReceiverId = node.id;
    d.pendingVia = null;
    if (d.guessWrongId === node.id) d.guessWrongId = null;
    d.justUpdatedId = node.id;
    d.leavingStripId = rep.id;
    d.activeWalkEdges = [];
    d.statusWhat = fromKey + " copied into " + toKey + " (strip stays sorted); now remove old " + fromKey + "...";
    statusWhat.textContent = d.statusWhat;
    drawGeometry(d, livePositions);

    await pause(STEP_MS, myId);
    d.justUpdatedId = null;

    await delRecursive(rep, node, null, myId);
  }

  async function runDelSequence(guess) {
    const d = delState;
    const target = d.byId[d.targetId];
    const myId = ++anim.id;
    anim.fast = false;

    const evalRes = evaluateDelPrediction(target, guess);
    const activeCase = isLeaf(target) ? "leaf" : "inner";
    const firstRep = isLeaf(target)
      ? null
      : (evalRes.chosenVia === "succ" ? succ(target) : (target.left ? pred(target) : succ(target)));
    const activeChain = !!(firstRep && !isLeaf(firstRep));

    d.phase = "animating";
    d.guess = guess;
    d.answer = evalRes.expectedId;
    d.chosenVia = evalRes.chosenVia;
    d.activeCase = activeCase;
    d.activeChain = activeChain;
    d.guessWrongId = (!evalRes.isRight && guess !== "skip" && guess !== "remove") ? guess : null;
    d.lastChanges = {};
    d.pendingFeedback = evalRes.feedback;
    d.pendingRecords = [];
    d.activeWalkEdges = [];
    d.leavingStripId = null;
    d.justUpdatedId = null;
    d.statusNext = "";
    render();

    try {
      await delRecursive(target, null, evalRes.chosenVia, myId);
      d.pendingFeedback = "";
      const nar = delNarrativeText(d.pendingRecords);
      delDoneStatus(d, evalRes.feedback, nar);
      render();
    } catch (err) {
      if (err !== CANCEL) throw err;
    }
  }

  function startDelPredict(nodeId) {
    const d = delState;
    const node = d.byId[nodeId];
    const leaf = isLeaf(node);
    d.phase = "predict";
    d.targetId = nodeId;
    d.guess = null;
    d.answer = null;
    d.chosenVia = null;
    d.activeCase = null;
    d.activeChain = false;
    d.guessWrongId = null;
    d.lastChanges = {};
    d.activeWalkEdges = [];
    d.leavingStripId = null;
    d.justUpdatedId = null;
    if (leaf) {
      d.statusWhat = "Selected node " + node.key + " (it has no children).";
    } else if (node.left && node.right) {
      d.statusWhat = "Selected node " + node.key + " (has two children: either predecessor or successor works).";
    } else {
      d.statusWhat = "Selected node " + node.key + " (has one child: copy its adjacent neighbour).";
    }
    d.statusNext = "Next: click the neighbour whose value replaces it, or press Just remove it (leaf).";
    render();
  }

  function handleDelNodeClick(nodeId) {
    const d = delState;
    if (d.phase === "animating") {
      anim.fast = true;
      return;
    }
    if (d.phase === "empty") return;
    if (d.phase === "pick" || d.phase === "done") {
      startDelPredict(nodeId);
      return;
    }
    if (d.phase === "predict") {
      if (nodeId === d.targetId) {
        const onlyOne = d.root && isLeaf(d.root);
        d.statusWhat = onlyOne
          ? "That is the only node left (" + d.byId[nodeId].key + ")."
          : "That is the node being deleted (" + d.byId[nodeId].key + ").";
        d.statusNext = onlyOne
          ? "Next: press Just remove it (leaf)."
          : "Next: click a different node whose value replaces it, or press Just remove it (leaf).";
        render();
        return;
      }
      runDelSequence(nodeId);
    }
  }

  /* ---------- Top-Level & Custom Tree Interactions ---------- */

  function onNodeActivate(nodeId) {
    if (activeTab === "succ") handleSuccNodeClick(nodeId);
    else handleDelNodeClick(nodeId);
  }

  function cleanTransientVisuals() {
    hideCursor();
    svgPool.flyGroup.style.display = "none";
    for (const id in svgPool.nodes) {
      const nUi = svgPool.nodes[id];
      const cUi = svgPool.stripCells[id];
      nUi.circle.style.stroke = "";
      nUi.circle.style.strokeWidth = "";
      nUi.g.style.opacity = "";
      cUi.g.style.opacity = "";
    }
  }

  function switchTab(nextTab) {
    if (activeTab === nextTab) return;
    if (activeTab === "succ" && succState.phase === "animating") {
      finalizeSuccSync(succState);
    } else if (activeTab === "del" && delState.phase === "animating") {
      finishDeleteSync(delState);
    }
    anim.id++;
    cleanTransientVisuals();
    activeTab = nextTab;
    syncPoolForTree(activeTab === "succ" ? succState.byId : delState.byId, activeTab === "succ" ? succState.root : delState.root);
    render();
  }

  function resetActiveMode() {
    anim.id++;
    cleanTransientVisuals();
    customFeedback.textContent = "";
    if (activeTab === "succ") {
      const keepDir = succState.dir;
      const keepSeen = succState.seen;
      const fresh = createSuccState(false);
      fresh.dir = keepDir;
      fresh.seen = { case1: keepSeen.case1, case2: keepSeen.case2, none: keepSeen.none };
      const sug = succSuggestion(fresh);
      fresh.statusWhat = "Cleared highlights.";
      fresh.statusNext = sug && sug.node
        ? "Next: click node " + sug.node.key + " (" + sug.reason + ")."
        : "Next: click any node.";
      succState = fresh;
      syncPoolForTree(succState.byId, succState.root);
    } else {
      delState = createDelState();
      const count = activeKeySequence.length;
      const sug = delSuggestion(delState);
      delState.statusWhat = "All " + count + (count === 1 ? " key is" : " keys are") + " back.";
      delState.statusNext = sug && sug.node
        ? "Next: click node " + sug.node.key + " (" + sug.reason + ")."
        : "Next: click any node.";
      syncPoolForTree(delState.byId, delState.root);
    }
    render();
  }

  function applyCustomTreeKeys(newKeys, message) {
    anim.id++;
    cleanTransientVisuals();
    activeKeySequence = newKeys.slice();
    const keepDir = succState.dir;
    succState = createSuccState(false);
    succState.dir = keepDir;
    delState = createDelState();
    const activeSt = activeTab === "succ" ? succState : delState;
    syncPoolForTree(activeSt.byId, activeSt.root);
    if (message) {
      activeSt.statusWhat = message;
    }
    render();
  }

  function handleCustomAdd() {
    const raw = parseInt(customKeyInput.value, 10);
    if (isNaN(raw) || raw < 1 || raw > 99) {
      customFeedback.textContent = "Enter a number from 1 to 99.";
      return;
    }
    if (activeKeySequence.includes(raw)) {
      customFeedback.textContent = raw + " is already in the tree — try another number.";
      return;
    }
    if (activeKeySequence.length >= MAX_CUSTOM_NODES) {
      customFeedback.textContent = "Tree has " + MAX_CUSTOM_NODES + " keys (maximum for clear spacing). Try Small 5-key tree first.";
      return;
    }
    customFeedback.textContent = "Inserted " + raw + ".";
    const nextKeys = activeKeySequence.concat([raw]);
    // Suggest a nearby unused number for next time
    const nextCandidate = ((raw + 11) % 90) + 5;
    if (!nextKeys.includes(nextCandidate)) customKeyInput.value = String(nextCandidate);
    applyCustomTreeKeys(nextKeys, "Inserted " + raw + " into the tree (" + nextKeys.length + " keys).");
  }

  /* ---------- Event Wiring ---------- */

  tabSuccBtn.addEventListener("click", function () {
    switchTab("succ");
  });
  tabDelBtn.addEventListener("click", function () {
    switchTab("del");
  });

  function handleTabKey(e) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const target = activeTab === "succ" ? "del" : "succ";
      switchTab(target);
      (target === "succ" ? tabSuccBtn : tabDelBtn).focus();
    }
  }
  tabSuccBtn.addEventListener("keydown", handleTabKey);
  tabDelBtn.addEventListener("keydown", handleTabKey);

  mirrorBtn.addEventListener("click", toggleDirection);

  altPredictBtn.addEventListener("click", function () {
    if (activeTab === "succ") {
      if (succState.phase === "predict") {
        if (document.activeElement === altPredictBtn && succState.startId) {
          svgPool.nodes[succState.startId].g.focus();
        }
        runSuccReveal("none");
      }
    } else {
      if (delState.phase === "predict") {
        if (document.activeElement === altPredictBtn && delState.targetId) {
          svgPool.nodes[delState.targetId].g.focus();
        }
        runDelSequence("remove");
      }
    }
  });

  skipBtn.addEventListener("click", function () {
    const st = activeTab === "succ" ? succState : delState;
    if (st.phase === "animating") {
      if (document.activeElement === skipBtn) {
        const focusId = activeTab === "succ" ? succState.startId : delState.targetId;
        if (focusId && svgPool.nodes[focusId] && st.byId[focusId] && !st.byId[focusId].removed) {
          svgPool.nodes[focusId].g.focus();
        } else {
          resetBtn.focus();
        }
      }
      anim.fast = true;
      return;
    }
    if (activeTab === "succ") {
      if (succState.phase === "predict") {
        if (document.activeElement === skipBtn && succState.startId) {
          svgPool.nodes[succState.startId].g.focus();
        }
        runSuccReveal("skip");
      }
    } else {
      if (delState.phase === "predict") {
        if (document.activeElement === skipBtn && delState.targetId) {
          svgPool.nodes[delState.targetId].g.focus();
        }
        runDelSequence("skip");
      }
    }
  });

  resetBtn.addEventListener("click", resetActiveMode);

  customAddBtn.addEventListener("click", handleCustomAdd);
  customKeyInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      handleCustomAdd();
    }
  });

  customSmallBtn.addEventListener("click", function () {
    customFeedback.textContent = "Loaded 5-key tree (20, 30, 40, 50, 70).";
    applyCustomTreeKeys(SMALL_KEYS, "Loaded 5-key starter tree — insert your own keys or test directly.");
  });

  customDefaultBtn.addEventListener("click", function () {
    customFeedback.textContent = "Restored default 15-key tree.";
    applyCustomTreeKeys(DEFAULT_KEYS, "Restored default 15-key tree.");
  });

  footerNavBtn.addEventListener("click", function () {
    switchTab(activeTab === "succ" ? "del" : "succ");
    window.scrollTo({ top: 0, behavior: reducedMotion() ? "auto" : "smooth" });
  });

  /* ---------- Initialize ---------- */

  initSvgPool();
  render();
})();
</script>
</body>
</html>
