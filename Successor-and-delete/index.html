<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Successor and delete in a binary search tree</title>
<style>
  :root {
    --paper: #faf8f3;
    --card: #fffdf8;
    --ink: #1d1d1b;
    --mid: #595853;
    --faint: #c9c5bb;
    --tint: #efe9dc;
    --ver: #d63a24;
    --c1: #2b5c8a;
    --c2: #2f7a5b;
    --c2-tint: #e7f1ec;
    --arrow-grey: #8a877f;
    --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.42;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 940px;
    margin: 0 auto;
    padding: 16px 16px 32px;
  }

  .page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 18px;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* Segmented tab switch */
  .tabs {
    display: inline-flex;
    background: var(--tint);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 3px;
    gap: 4px;
  }

  .tab-btn {
    appearance: none;
    background: transparent;
    color: var(--mid);
    border: 0;
    border-radius: 4px;
    padding: 8px 15px;
    min-height: 44px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease;
  }

  .tab-btn:hover {
    color: var(--ink);
    background: rgba(255, 253, 248, 0.55);
  }

  .tab-btn[aria-selected="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow: inset 0 -3px 0 var(--ink);
  }

  .tab-btn:focus-visible,
  .btn:focus-visible,
  .custom-summary:focus-visible,
  .custom-input:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  /* Task box */
  .task-box {
    background: var(--tint);
    border-left: 5px solid var(--ink);
    padding: 9px 14px;
    margin-bottom: 6px;
    border-radius: 0 4px 4px 0;
  }

  .task-label {
    display: block;
    font-size: 0.71rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--mid);
    margin-bottom: 1px;
  }

  .task-text {
    margin: 0;
    font-size: 1.03rem;
    font-weight: 600;
    color: var(--ink);
  }

  .concept {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: var(--mid);
  }

  /* Main widget card */
  .card {
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 12px 14px 14px;
  }

  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px 14px;
    margin-bottom: 6px;
  }

  .legend {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 0.88rem;
    color: var(--mid);
    flex: 1 1 420px;
  }

  .legend[hidden] {
    display: none;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.32;
    padding: 2px 6px;
    border-left: 3px solid transparent;
    border-radius: 2px;
  }

  .legend-item.active {
    color: var(--ink);
    font-weight: 700;
    background: var(--tint);
    border-left-color: var(--ink);
  }

  .check-mark {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.78rem;
    color: var(--mid);
    flex: 0 0 auto;
  }

  .legend-item.seen .check-mark {
    color: var(--ink);
    font-weight: 700;
  }

  .swatch {
    flex: 0 0 auto;
    width: 24px;
    height: 10px;
  }

  /* Responsive SVG with horizontal scroll on narrow screens so labels stay readable */
  .svg-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 2px 0 8px;
  }

  .tree-svg {
    display: block;
    width: 100%;
    min-width: 560px;
    height: auto;
    user-select: none;
    touch-action: manipulation;
  }

  .svg-corner-note {
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    fill: var(--mid);
    pointer-events: none;
  }

  /* Projection guides connecting tree nodes straight down to in-order strip */
  .proj-guide {
    stroke: var(--ink);
    stroke-width: 1.2;
    stroke-dasharray: 3 4;
    opacity: 0.34;
    pointer-events: none;
  }

  .proj-guide.is-ver {
    stroke: var(--ver);
    opacity: 0.55;
  }

  /* SVG node & strip styling */
  .node {
    cursor: pointer;
    outline: none;
  }

  .node-hit {
    fill: transparent;
  }

  .node-circle {
    fill: var(--card);
    stroke: var(--ink);
    stroke-width: 1.7;
    transition: fill 120ms ease, stroke 120ms ease, stroke-width 120ms ease;
  }

  .node:hover .node-circle {
    fill: var(--tint);
    stroke-width: 2.5;
  }

  .candidate-ring {
    fill: none;
    stroke: var(--mid);
    stroke-width: 1.25;
    stroke-dasharray: 3 3;
    opacity: 0;
    pointer-events: none;
  }

  .node.is-candidate .candidate-ring {
    opacity: 0.65;
  }

  .node.is-candidate:hover .candidate-ring,
  .node.is-candidate:focus-visible .candidate-ring {
    stroke: var(--ink);
    stroke-width: 1.9;
    opacity: 1;
  }

  .node-key {
    fill: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .node-state-label {
    font-family: var(--font);
    font-size: 11.5px;
    font-weight: 700;
    text-anchor: middle;
    fill: var(--ink);
    paint-order: stroke fill;
    stroke: var(--card);
    stroke-width: 5px;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .node-state-label.is-ver {
    fill: var(--ver);
  }

  .node-state-label.is-c2 {
    fill: var(--c2);
  }

  .node-state-label.is-hover-prompt {
    fill: var(--mid);
    font-style: italic;
    opacity: 0;
  }

  .node.is-candidate:hover .node-state-label.is-hover-prompt,
  .node.is-candidate:focus-visible .node-state-label.is-hover-prompt {
    opacity: 1;
    fill: var(--ink);
  }

  .node-climb-note {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    text-anchor: middle;
    fill: var(--c2);
    paint-order: stroke fill;
    stroke: var(--card);
    stroke-width: 5px;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .focus-ring {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.8;
    opacity: 0;
    pointer-events: none;
  }

  .node:focus-visible .focus-ring {
    opacity: 1;
  }

  .pulse-ring {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.1;
    opacity: 0;
    pointer-events: none;
    transform-origin: 0 0;
  }

  .node.is-suggested .pulse-ring {
    animation: pulseRing 1.6s ease-in-out infinite;
  }

  @keyframes pulseRing {
    0%, 100% {
      opacity: 0.18;
      transform: scale(0.98);
    }
    50% {
      opacity: 0.88;
      transform: scale(1.08);
    }
  }

  .node.is-start .node-circle,
  .node.is-delete-target .node-circle {
    stroke: var(--ink);
    stroke-width: 3.5;
  }

  /* Lit-up ancestor chain during Case 2 climb */
  .node.is-climbed-ancestor .node-circle {
    fill: var(--c2-tint);
    stroke: var(--c2);
    stroke-width: 2.6;
  }

  .node.is-answer .node-circle {
    fill: var(--ink);
    stroke: var(--ink);
    stroke-width: 2;
  }

  .node.is-answer .node-key {
    fill: var(--paper);
    font-weight: 700;
  }

  .node.is-guess-wrong .node-circle {
    stroke: var(--ver);
    stroke-width: 3.2;
  }

  .ver-ring {
    fill: none;
    stroke: var(--ver);
    stroke-width: 2.5;
    opacity: 0;
    pointer-events: none;
  }

  .node.is-guess-right .ver-ring,
  .node.is-just-updated .ver-ring {
    opacity: 1;
  }

  /* Child edge & parent arrow */
  .child-edge {
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-linecap: round;
  }

  .child-edge.is-c1 {
    stroke: var(--c1);
    stroke-width: 3.5;
  }

  .child-edge.is-c2 {
    stroke: var(--c2);
    stroke-width: 3.5;
    stroke-dasharray: 6 4;
  }

  .parent-arrow {
    stroke: var(--arrow-grey);
    stroke-width: 1.05;
    fill: none;
  }

  .parent-arrow.is-c2 {
    stroke: var(--c2);
    stroke-width: 2.7;
    stroke-dasharray: 6 4;
  }

  .parent-arrow.is-c1 {
    stroke: var(--c1);
    stroke-width: 2.7;
  }

  /* In-order strip (non-interactive) */
  #strip-layer {
    cursor: default;
    pointer-events: none;
  }

  .strip-heading {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    fill: var(--mid);
  }

  .strip-rect {
    fill: var(--paper);
    stroke: var(--faint);
    stroke-width: 1.25;
  }

  .strip-text {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    fill: var(--ink);
    text-anchor: middle;
    dominant-baseline: central;
    font-variant-numeric: tabular-nums;
  }

  .strip-cell.is-masked .strip-text {
    fill: var(--mid);
    font-weight: 400;
  }

  .strip-cell.is-start .strip-rect {
    stroke: var(--ink);
    stroke-width: 2.3;
  }

  .strip-cell.is-answer .strip-rect {
    fill: var(--ink);
    stroke: var(--ink);
    stroke-width: 1.5;
  }

  .strip-cell.is-answer .strip-text {
    fill: var(--paper);
  }

  .strip-cell.is-just-updated .strip-rect {
    stroke: var(--ver);
    stroke-width: 2.3;
  }

  .strip-strike {
    stroke: var(--ver);
    stroke-width: 2.1;
    opacity: 0;
  }

  .strip-cell.is-leaving .strip-strike {
    opacity: 1;
  }

  .strip-sub-label {
    font-family: var(--font);
    font-size: 10.5px;
    font-weight: 700;
    fill: var(--ver);
    text-anchor: middle;
    opacity: 0;
  }

  .strip-cell.is-leaving .strip-sub-label,
  .strip-cell.is-was-updated .strip-sub-label {
    opacity: 1;
  }

  .strip-arc {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.8;
  }

  .strip-arc-label {
    font-family: var(--font);
    font-size: 11px;
    font-style: italic;
    font-weight: 700;
    fill: var(--ink);
    text-anchor: middle;
  }

  /* Buttons & action row */
  .action-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .action-left {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 44px;
    padding: 8px 15px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 0.94rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .btn.primary {
    background: var(--ink);
    color: var(--paper);
    border: 1.5px solid var(--ink);
  }

  .btn.primary:hover {
    background: #333330;
    border-color: #333330;
  }

  .btn.secondary {
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--ink);
  }

  .btn.secondary:hover {
    background: var(--tint);
  }

  .btn.subtle {
    background: transparent;
    color: var(--mid);
    border: 1.5px solid var(--faint);
  }

  .btn.subtle:hover {
    color: var(--ink);
    border-color: var(--ink);
    background: var(--tint);
  }

  .btn[hidden] {
    display: none;
  }

  /* Unified single status line (live step narration + what happened + next action) */
  .status {
    border-top: 1px solid var(--faint);
    padding-top: 9px;
    font-size: 0.95rem;
    min-height: 2.5em;
  }

  .status .what {
    color: var(--ink);
  }

  .status .next {
    color: var(--ink);
    font-weight: 700;
  }

  /* Optional collapsed "Try your own tree" drawer */
  .custom-drawer {
    margin-top: 10px;
    border-top: 1px dashed var(--faint);
    padding-top: 8px;
  }

  .custom-summary {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 4px 10px;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--mid);
    cursor: pointer;
    border-radius: 4px;
    user-select: none;
  }

  .custom-summary:hover {
    color: var(--ink);
    background: var(--tint);
  }

  .custom-body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    padding: 8px 4px 2px;
  }

  .custom-input {
    width: 84px;
    min-height: 44px;
    padding: 6px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  .custom-hint {
    font-size: 0.85rem;
    color: var(--mid);
    margin-left: 4px;
  }

  /* Footer */
  .page-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    margin-top: 12px;
  }

  .footer-note {
    margin: 0;
    font-size: 0.89rem;
    color: var(--mid);
  }

  @media (max-width: 520px) {
    .page {
      padding: 12px 8px 24px;
    }
    .card {
      padding: 10px 8px 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .node.is-suggested .pulse-ring {
      animation: none;
      opacity: 0.65;
    }
    .tab-btn,
    .btn,
    .node-circle {
      transition: none;
    }
  }
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <h1>Successor and delete in a binary search tree</h1>
    <div class="tabs" role="tablist" aria-label="Lesson section">
      <button type="button" role="tab" id="tab-succ" class="tab-btn" aria-selected="true" tabindex="0">1 Successor</button>
      <button type="button" role="tab" id="tab-del" class="tab-btn" aria-selected="false" tabindex="-1">2 Delete</button>
    </div>
  </header>

  <section class="task-box" aria-label="Current task">
    <span class="task-label" id="task-label">Your task</span>
    <p class="task-text" id="task-text"></p>
  </section>

  <p class="concept" id="concept-text"></p>

  <section class="card" aria-label="Interactive tree">
    <div class="card-head" id="card-head">
      <div class="legend" id="succ-legend">
        <div class="legend-item" id="leg-case1">
          <span class="check-mark" id="check-case1">[ ]</span>
          <svg class="swatch" viewBox="0 0 24 10" aria-hidden="true">
            <line x1="0" y1="5" x2="24" y2="5" stroke="#2b5c8a" stroke-width="3.2" stroke-linecap="round"/>
          </svg>
          <span id="leg-case1-text"></span>
        </div>
        <div class="legend-item" id="leg-case2">
          <span class="check-mark" id="check-case2">[ ]</span>
          <svg class="swatch" viewBox="0 0 24 10" aria-hidden="true">
            <line x1="0" y1="5" x2="24" y2="5" stroke="#2f7a5b" stroke-width="2.8" stroke-dasharray="6 4"/>
          </svg>
          <span id="leg-case2-text"></span>
        </div>
      </div>

      <div class="legend" id="del-legend" hidden>
        <div class="legend-item" id="del-leg-leaf">
          <span class="check-mark" id="check-del-leaf">[ ]</span>
          <span>Leaf (no children): remove it.</span>
        </div>
        <div class="legend-item" id="del-leg-inner">
          <span class="check-mark" id="check-del-inner">[ ]</span>
          <span>Has children: copy its predecessor or successor into it, then remove that neighbour.</span>
        </div>
        <div class="legend-item" id="del-leg-chain">
          <span class="check-mark" id="check-del-chain">[ ]</span>
          <span>Neighbour has a child too: the removal repeats on the neighbour.</span>
        </div>
      </div>

      <button type="button" id="mirror-btn" class="btn secondary">Show predecessor instead</button>
    </div>

    <div class="svg-wrap" id="svg-wrap">
      <svg id="tree-svg" class="tree-svg" viewBox="0 0 820 490" role="img" aria-label="Binary search tree with parent pointers and aligned in-order strip">
        <defs>
          <marker id="arrow-grey" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M 0.5 1 L 7 4 L 0.5 7 Z" fill="#8a877f"/>
          </marker>
          <marker id="arrow-c1" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M 0.5 1 L 7 4 L 0.5 7 Z" fill="#2b5c8a"/>
          </marker>
          <marker id="arrow-c2" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M 0.5 1 L 7 4 L 0.5 7 Z" fill="#2f7a5b"/>
          </marker>
          <marker id="arrow-ink" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M 0.5 1 L 7 4 L 0.5 7 Z" fill="#1d1d1b"/>
          </marker>
        </defs>
        <text class="svg-corner-note" x="18" y="20">Thin grey arrows point to parent</text>
        <g id="guides-layer"></g>
        <g id="edges-layer"></g>
        <g id="arrows-layer"></g>
        <g id="nodes-layer"></g>
        <g id="strip-layer"></g>
        <g id="cursor-layer"></g>
        <g id="fly-layer"></g>
      </svg>
    </div>

    <div class="action-row">
      <div class="action-left" id="predict-actions">
        <button type="button" id="alt-predict-btn" class="btn secondary" hidden></button>
        <button type="button" id="skip-btn" class="btn subtle" hidden>Skip, show me</button>
      </div>
      <button type="button" id="reset-btn" class="btn secondary">Reset</button>
    </div>

    <div class="status" id="status-line" aria-live="polite" role="status">
      <span class="what" id="status-what"></span>
      <strong class="next" id="status-next"></strong>
    </div>

    <details class="custom-drawer" id="custom-drawer">
      <summary class="custom-summary">Try your own tree</summary>
      <div class="custom-body">
        <label for="custom-key-input" class="custom-hint">Key (1–99):</label>
        <input type="number" id="custom-key-input" class="custom-input" min="1" max="99" value="48">
        <button type="button" id="custom-add-btn" class="btn secondary">Insert key</button>
        <button type="button" id="custom-small-btn" class="btn secondary">Small 5-key tree</button>
        <button type="button" id="custom-default-btn" class="btn subtle">Default 15-key tree</button>
        <span class="custom-hint" id="custom-feedback"></span>
      </div>
    </details>
  </section>

  <footer class="page-foot">
    <p class="footer-note" id="footer-note"></p>
    <button type="button" id="footer-nav-btn" class="btn secondary"></button>
  </footer>
</main>

<script>
(function () {
  "use strict";

  const SVG_NS = "http://www.w3.org/2000/svg";
  const VIEW_W = 820;
  const RADIUS = 20;
  const COL_W = 52;
  const ROW_H = 74;
  const TOP_Y = 48;
  const STRIP_Y = 404;
  const STRIP_W = 46;
  const STRIP_H = 34;
  const STEP_MS = 350;
  const FLY_MS = 340;
  const FADE_MS = 280;
  const RELAYOUT_MS = 300;
  const MAX_CUSTOM_NODES = 16;
  const CANCEL = Symbol("cancel");

  const DEFAULT_KEYS = [50, 30, 70, 20, 40, 10, 25, 35, 45, 42, 60, 85, 65, 80, 90];
  const SMALL_KEYS = [50, 30, 70, 20, 40];

  // Current base insertion sequence used by both tabs and Reset
  let activeKeySequence = DEFAULT_KEYS.slice();

  function reducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  /* ---------- Pure Tree Helpers ---------- */

  function buildTreeFromKeys(keys) {
    const byId = {};
    let root = null;

    for (const k of keys) {
      const id = "n" + k;
      if (byId[id]) continue;
      const node = { id, key: k, left: null, right: null, parent: null, removed: false };
      byId[id] = node;
      if (!root) {
        root = node;
      } else {
        let cur = root;
        while (cur) {
          if (k < cur.key) {
            if (!cur.left) {
              cur.left = node;
              node.parent = cur;
              break;
            }
            cur = cur.left;
          } else {
            if (!cur.right) {
              cur.right = node;
              node.parent = cur;
              break;
            }
            cur = cur.right;
          }
        }
      }
    }
    return { root, byId };
  }

  function inorder(root) {
    const out = [];
    function walk(n) {
      if (!n) return;
      walk(n.left);
      out.push(n);
      walk(n.right);
    }
    walk(root);
    return out;
  }

  function depthOf(node) {
    let d = 0;
    let cur = node;
    while (cur.parent) {
      d++;
      cur = cur.parent;
    }
    return d;
  }

  function maxDepthOf(list) {
    let m = 0;
    for (const n of list) {
      const d = depthOf(n);
      if (d > m) m = d;
    }
    return m;
  }

  function computeLayout(root) {
    const list = inorder(root);
    const n = list.length;
    const pos = {};
    const maxD = maxDepthOf(list);
    const rowStep = maxD > 4 ? Math.floor(296 / maxD) : ROW_H;
    const totalW = n * COL_W;
    const leftX = (VIEW_W - totalW) / 2 + COL_W / 2;
    for (let rank = 0; rank < n; rank++) {
      const node = list[rank];
      pos[node.id] = {
        x: leftX + rank * COL_W,
        y: TOP_Y + depthOf(node) * rowStep
      };
    }
    return { pos, order: list };
  }

  function succ(node) {
    if (!node) return null;
    if (node.right) {
      let cur = node.right;
      while (cur.left) cur = cur.left;
      return cur;
    }
    let cur = node;
    let p = cur.parent;
    while (p && cur === p.right) {
      cur = p;
      p = cur.parent;
    }
    return p || null;
  }

  function pred(node) {
    if (!node) return null;
    if (node.left) {
      let cur = node.left;
      while (cur.right) cur = cur.right;
      return cur;
    }
    let cur = node;
    let p = cur.parent;
    while (p && cur === p.left) {
      cur = p;
      p = cur.parent;
    }
    return p || null;
  }

  function succPath(node) {
    const steps = [];
    if (node.right) {
      steps.push({
        from: node,
        to: node.right,
        dir: "down",
        caseType: 1,
        narration: "Case 1: right once " + node.key + " → " + node.right.key + " (keys here are bigger than " + node.key + ")..."
      });
      let cur = node.right;
      while (cur.left) {
        steps.push({
          from: cur,
          to: cur.left,
          dir: "down",
          caseType: 1,
          narration: "Case 1: go left " + cur.key + " → " + cur.left.key + " (find the smallest of those bigger keys)..."
        });
        cur = cur.left;
      }
      return { caseType: 1, steps, answer: cur };
    }
    let cur = node;
    let p = cur.parent;
    while (p && cur === p.right) {
      steps.push({
        from: cur,
        to: p,
        dir: "up",
        smallerAncestor: true,
        caseType: 2,
        narration: "Case 2: go up " + cur.key + " → " + p.key + " (arrived from right child, keep going up)..."
      });
      cur = p;
      p = cur.parent;
    }
    if (p) {
      steps.push({
        from: cur,
        to: p,
        dir: "up",
        smallerAncestor: false,
        caseType: 2,
        narration: "Case 2: go up " + cur.key + " → " + p.key + " (arrived from left child — stop! " + p.key + " is the successor)"
      });
      return { caseType: 2, steps, answer: p };
    }
    return { caseType: 2, steps, answer: null };
  }

  function predPath(node) {
    const steps = [];
    if (node.left) {
      steps.push({
        from: node,
        to: node.left,
        dir: "down",
        caseType: 1,
        narration: "Case 1: left once " + node.key + " → " + node.left.key + " (keys here are smaller than " + node.key + ")..."
      });
      let cur = node.left;
      while (cur.right) {
        steps.push({
          from: cur,
          to: cur.right,
          dir: "down",
          caseType: 1,
          narration: "Case 1: go right " + cur.key + " → " + cur.right.key + " (find the largest of those smaller keys)..."
        });
        cur = cur.right;
      }
      return { caseType: 1, steps, answer: cur };
    }
    let cur = node;
    let p = cur.parent;
    while (p && cur === p.left) {
      steps.push({
        from: cur,
        to: p,
        dir: "up",
        largerAncestor: true,
        caseType: 2,
        narration: "Case 2: go up " + cur.key + " → " + p.key + " (arrived from left child, keep going up)..."
      });
      cur = p;
      p = cur.parent;
    }
    if (p) {
      steps.push({
        from: cur,
        to: p,
        dir: "up",
        largerAncestor: false,
        caseType: 2,
        narration: "Case 2: go up " + cur.key + " → " + p.key + " (arrived from right child — stop! " + p.key + " is the predecessor)"
      });
      return { caseType: 2, steps, answer: p };
    }
    return { caseType: 2, steps, answer: null };
  }

  function findByKey(root, key) {
    let cur = root;
    while (cur) {
      if (key === cur.key) return cur;
      cur = key < cur.key ? cur.left : cur.right;
    }
    return null;
  }

  function isLeaf(node) {
    return !!node && !node.left && !node.right;
  }

  function isInSubtree(node, ancestor) {
    let cur = node;
    while (cur) {
      if (cur === ancestor) return true;
      cur = cur.parent;
    }
    return false;
  }

  /* ---------- Dynamic Pedagogical Suggestions ---------- */

  function succSuggestion(st) {
    const list = inorder(st.root);
    if (list.length === 0) return null;

    if (st.dir === "succ") {
      if (!st.seen.case1) {
        const n30 = findByKey(st.root, 30);
        if (n30 && n30.right && n30.right.left) return { node: n30, reason: "has a right child — Case 1" };
        const deepC1 = list.find(n => n.right && n.right.left);
        if (deepC1) return { node: deepC1, reason: "has a right child — Case 1" };
        const anyC1 = list.find(n => !!n.right);
        if (anyC1) return { node: anyC1, reason: "has a right child — Case 1" };
      }
      if (!st.seen.case2) {
        const n45 = findByKey(st.root, 45);
        if (n45 && !n45.right && succ(n45)) return { node: n45, reason: "no right child — Case 2" };
        const multiUp = list.find(n => !n.right && n.parent && n === n.parent.right && succ(n));
        if (multiUp) return { node: multiUp, reason: "no right child — Case 2" };
        const anyC2 = list.find(n => !n.right && succ(n));
        if (anyC2) return { node: anyC2, reason: "no right child — Case 2" };
      }
      if (!st.seen.none) {
        const maxNode = list[list.length - 1];
        return { node: maxNode, reason: "the largest key" };
      }
      return null;
    } else {
      if (!st.seen.case1) {
        const n70 = findByKey(st.root, 70);
        if (n70 && n70.left && n70.left.right) return { node: n70, reason: "has a left child — Case 1" };
        const deepC1 = list.find(n => n.left && n.left.right);
        if (deepC1) return { node: deepC1, reason: "has a left child — Case 1" };
        const anyC1 = list.find(n => !!n.left);
        if (anyC1) return { node: anyC1, reason: "has a left child — Case 1" };
      }
      if (!st.seen.case2) {
        const n35 = findByKey(st.root, 35);
        if (n35 && !n35.left && pred(n35)) return { node: n35, reason: "no left child — Case 2" };
        const multiUp = list.find(n => !n.left && n.parent && n === n.parent.left && pred(n));
        if (multiUp) return { node: multiUp, reason: "no left child — Case 2" };
        const anyC2 = list.find(n => !n.left && pred(n));
        if (anyC2) return { node: anyC2, reason: "no left child — Case 2" };
      }
      if (!st.seen.none) {
        const minNode = list[0];
        return { node: minNode, reason: "the smallest key" };
      }
      return null;
    }
  }

  function delSuggestion(st) {
    if (!st.root) return null;
    const nodes = inorder(st.root);
    if (!st.seen.leaf) {
      const leaf = nodes.find(isLeaf);
      if (leaf) return { node: leaf, reason: "a leaf" };
    }
    if (!st.seen.pred) {
      const n30 = findByKey(st.root, 30);
      if (n30 && n30.left) return { node: n30, reason: "has two children" };
      const anyPred = nodes.find(n => !!n.left);
      if (anyPred) return { node: anyPred, reason: "has a left child" };
    }
    if (!st.seen.succ) {
      const n60 = findByKey(st.root, 60);
      if (n60 && !n60.left && n60.right) return { node: n60, reason: "only a right child" };
      const anySucc = nodes.find(n => !n.left && !!n.right);
      if (anySucc) return { node: anySucc, reason: "only a right child" };
    }
    if (!st.seen.chain) {
      const n50 = findByKey(st.root, 50);
      if (n50 && !isLeaf(n50)) {
        const rep = n50.left ? pred(n50) : succ(n50);
        if (rep && !isLeaf(rep)) return { node: n50, reason: "its neighbour also has a child" };
      }
      const anyChain = nodes.find(n => {
        if (isLeaf(n)) return false;
        const rep = n.left ? pred(n) : succ(n);
        return rep && !isLeaf(rep);
      });
      if (anyChain) return { node: anyChain, reason: "its neighbour also has a child" };
    }
    return null;
  }

  function hasAnyNonLeaf(root) {
    return inorder(root).some(n => !isLeaf(n));
  }

  function delAllCategoriesSeen(st) {
    const leafOk = st.seen.leaf;
    const innerOk = (st.seen.pred || st.seen.succ) || !hasAnyNonLeaf(st.root);
    return leafOk && innerOk;
  }

  /* ---------- Mode State ---------- */

  function createSuccState(withInitialExample) {
    const tree = buildTreeFromKeys(activeKeySequence);
    const list = inorder(tree.root);
    const st = {
      root: tree.root,
      byId: tree.byId,
      dir: "succ",
      phase: "pick", // pick | predict | animating | done
      startId: null,
      guess: null,
      answerId: null,
      caseType: null,
      activeSteps: [],
      revealedStepsCount: 0,
      seen: { case1: false, case2: false, none: false },
      statusWhat: "Tree with " + list.length + (list.length === 1 ? " key." : " keys."),
      statusNext: ""
    };

    // Show a brief worked example on initial load so the rule and strip are clear before the student predicts
    const exStart = findByKey(tree.root, 20) || list.find(n => !!n.right);
    if (withInitialExample && exStart && exStart.right) {
      const pathRes = succPath(exStart);
      st.phase = "done";
      st.startId = exStart.id;
      st.answerId = pathRes.answer ? pathRes.answer.id : null;
      st.caseType = 1;
      st.activeSteps = pathRes.steps;
      st.revealedStepsCount = pathRes.steps.length;
      st.statusWhat = "Worked example: " + exStart.key + " has right child " + pathRes.answer.key +
        ", so " + exStart.key + "'s successor is " + pathRes.answer.key + " (the next key in the strip).";
    }

    const sug = succSuggestion(st);
    st.statusNext = sug && sug.node
      ? "Next: click node " + sug.node.key + " (" + sug.reason + ")."
      : "Next: click any node.";
    return st;
  }

    };

    st.statusNext = sug && sug.node
      ? "Next: click node " + sug.node.key + " (" + sug.reason + ")."

    return st;
  }

  /* ---------- Animation Utilities ---------- */

  function tween(ms, onUpdate, myId) {
    if (ms <= 0 || anim.fast || reducedMotion()) {
      if (anim.id !== myId) return Promise.reject(CANCEL);
      onUpdate(1);
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const start = performance.now();
      function tick(now) {
        if (anim.id !== myId) return reject(CANCEL);
        if (anim.fast) {
          onUpdate(1);
          return resolve();
        }
        const t = Math.min(1, (now - start) / ms);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        onUpdate(eased);
        if (t >= 1) return resolve();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function pause(ms, myId) {
    if (ms <= 0 || anim.fast || reducedMotion()) {
      if (anim.id !== myId) return Promise.reject(CANCEL);
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const start = performance.now();
      function tick(now) {
        if (anim.id !== myId) return reject(CANCEL);
        if (anim.fast || now - start >= ms) return resolve();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }
