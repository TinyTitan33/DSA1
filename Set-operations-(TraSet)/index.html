    refTagCommon: document.getElementById('ref-tag-common'),
    refTagB: document.getElementById('ref-tag-B'),
    refBoxA: document.getElementById('ref-box-A'),
    refBoxCommon: document.getElementById('ref-box-common'),
    refBoxB: document.getElementById('ref-box-B'),
    declLine: document.getElementById('decl-line'),
    taskQuestion: document.getElementById('task-question'),
    methodPill: document.getElementById('method-pill'),
    taskMeta: document.getElementById('task-meta'),
    thumbStrip: document.getElementById('thumb-strip'),
    choiceRow: document.getElementById('choice-row'),
    step4Code: document.getElementById('step4-code'),
    trayWrap: document.getElementById('tray-wrap'),
    trayLabel: document.getElementById('tray-label'),
    trayChips: document.getElementById('tray-chips'),
    emptyBtn: document.getElementById('empty-btn'),
    paletteRow: document.getElementById('palette-row'),
    actionRow: document.getElementById('action-row'),
    checkBtn: document.getElementById('check-btn'),
    showAnswerBtn: document.getElementById('show-answer-btn'),
    feedback: document.getElementById('feedback'),
    codeOut: document.getElementById('code-out'),
    cheatWrap: document.getElementById('cheat-wrap'),
    backBtn: document.getElementById('back-btn'),
    nextBtn: document.getElementById('next-btn'),
    stepBtns: [...document.querySelectorAll('.step-btn')],
  };

  function currentTask() {
    if (state.step === 1) return STEP1_TASKS[state.s1Idx];
    if (state.step === 2) return STEP2_TASK;
    if (state.step === 5) return state.practiceCurrent.task;
    return null;
  }

  function currentShape() {
    if (state.step === 1 || state.step === 2) return 'overlap';
    if (state.step === 5) return state.practiceCurrent.shape;
    return 'compact';
  }

  function kindOfValue(val, sets) {
    const inA = sets.A.includes(val);
    const inB = sets.B.includes(val);
    if (inA && inB) return 'AB';
    if (inA) return 'A';
    if (inB) return 'B';
    return 'neutral';
  }

  function setFeedback(text, tone = '') {
    el.feedback.className = tone;
    el.feedback.innerHTML = '';
    if (!text) return;
    if (tone === 'ok' || tone === 'bad') {
      const icon = svgEl('svg', {
        class: 'fb-icon',
        width: 16,
        height: 16,
        viewBox: '0 0 16 16',
        'aria-hidden': 'true',
      });
      if (tone === 'ok') {
        icon.appendChild(svgEl('path', {
          d: 'M 2.5 8.5 L 6.2 12.2 L 13.5 4.2',
          fill: 'none',
          stroke: '#3E8E6A',
          'stroke-width': 2.3,
          'stroke-linecap': 'round',
          'stroke-linejoin': 'round',
        }));
      } else {
        icon.appendChild(svgEl('path', {
          d: 'M 3.5 3.5 L 12.5 12.5 M 12.5 3.5 L 3.5 12.5',
          fill: 'none',
          stroke: '#C23B4A',
          'stroke-width': 2.3,
          'stroke-linecap': 'round',
        }));
      }
      el.feedback.appendChild(icon);
    }
    el.feedback.appendChild(document.createTextNode(text));
  }

  function showCode(content, isHtml = false) {
    if (isHtml) el.codeOut.innerHTML = content;
    else el.codeOut.textContent = content;
    el.codeOut.classList.remove('hidden');
  }

  function hideCode() {
    el.codeOut.innerHTML = '';
    el.codeOut.classList.add('hidden');
  }

  // ---- Stage rendering ----
  function addSvgDefs(svg) {
    const defs = svgEl('defs');
    const pat = svgEl('pattern', {
      id: 'hatch-pat',
      width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)',
    });
    pat.appendChild(svgEl('line', {
      x1: 0, y1: 0, x2: 0, y2: 8,
      stroke: '#2B1B2E', 'stroke-opacity': 0.30, 'stroke-width': 1.8,
    }));
    defs.appendChild(pat);
    svg.appendChild(defs);
  }

  function renderShadeOverlay(svg, opKey, geom, opts = {}) {
    const paths = regionOutlinePaths(opKey, geom);
    if (paths.length === 0) return null;
    const grp = svgEl('g', { class: opts.flipClass || '' });
    if (opts.originX !== undefined) {
      grp.style.transformOrigin = `${opts.originX}px ${opts.originY}px`;
    }
    paths.forEach((d) => {
      grp.appendChild(svgEl('path', {
        d,
        fill: '#B9573A',
        'fill-opacity': 0.40,
        'fill-rule': geom.shape === 'subset' && opKey === 'AminusB' ? 'evenodd' : 'nonzero',
        stroke: 'none',
      }));
      grp.appendChild(svgEl('path', {
        d,
        fill: 'url(#hatch-pat)',
        'fill-rule': geom.shape === 'subset' && opKey === 'AminusB' ? 'evenodd' : 'nonzero',
        stroke: '#2B1B2E',
        'stroke-width': 2,
      }));
    });
    svg.appendChild(grp);
    return grp;
  }

  function renderVennStage() {
    const W = state.stageW;
    const H = state.stageH;
    const svg = el.svg;
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    if (state.step === 3) {
      el.chipLayer.innerHTML = '';
      renderStep3Stage(svg, W, H);
      return;
    }

    s3Dom = null;
    clearS3Timers();
    svg.innerHTML = '';
    el.chipLayer.innerHTML = '';

    addSvgDefs(svg);

    const shape = currentShape();
    const geom = layout(shape, W, H);
    const task = currentTask();

    // Base circles
    const cA = svgEl('circle', {
      cx: geom.A.cx, cy: geom.A.cy, r: geom.A.r,
      fill: '#7A3E7D', 'fill-opacity': 0.25,
      stroke: '#7A3E7D', 'stroke-width': 2.5,
    });
    const cB = svgEl('circle', {
      cx: geom.B.cx, cy: geom.B.cy, r: geom.B.r,
      fill: '#E9A23B', 'fill-opacity': 0.25,
      stroke: '#C9861F', 'stroke-width': 2.5,
    });
    if (shape === 'equal') {
      cB.setAttribute('stroke-dasharray', '7 5');
    }
    svg.appendChild(cA);
    svg.appendChild(cB);

    // Shading if taskDone
    if (state.taskDone && task) {
      if (state.step === 2) {
        const midX = (geom.A.cx + geom.B.cx) / 2;
        const midY = geom.A.cy;
        const grp = renderShadeOverlay(svg, 'AminusB', geom, {
          flipClass: 'flip-group',
          originX: midX,
          originY: midY,
        });
        if (grp) {
          if (reducedMotion() || state._flipInstant) {
            grp.style.transform = 'scaleX(-1)';
          } else {
            grp.style.transform = 'scaleX(1)';
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                grp.style.transform = 'scaleX(-1)';
              });
            });
          }
        }
      } else {
        renderShadeOverlay(svg, opToKey(task), geom);
      }

      const res = answer(task);
      const lbl = svgEl('text', {
        x: W / 2,
        y: H - 6,
        'text-anchor': 'middle',
        fill: '#2B1B2E',
        'font-size': 13,
        'font-weight': 700,
      });
      lbl.textContent = `${symbolText(task)} = ${fmt(res)}`;
      svg.appendChild(lbl);
    }

    // Labels above circles
    if (shape === 'equal') {
      const lA = svgEl('text', {
        x: geom.A.cx - 28, y: geom.A.cy - geom.A.r - 8,
        'text-anchor': 'middle', fill: '#7A3E7D', 'font-size': 16, 'font-weight': 800,
      });
      lA.textContent = 'A';
      const lEq = svgEl('text', {
        x: geom.A.cx, y: geom.A.cy - geom.A.r - 8,
        'text-anchor': 'middle', fill: '#2B1B2E', 'font-size': 14, 'font-weight': 700,
      });
      lEq.textContent = '=';
      const lB = svgEl('text', {
        x: geom.A.cx + 28, y: geom.A.cy - geom.A.r - 8,
        'text-anchor': 'middle', fill: '#C9861F', 'font-size': 16, 'font-weight': 800,
      });
      lB.textContent = 'B';
      svg.append(lA, lEq, lB);
    } else {
      const lA = svgEl('text', {
        x: geom.A.cx, y: geom.A.cy - geom.A.r - 8,
        'text-anchor': 'middle', fill: '#7A3E7D', 'font-size': 16, 'font-weight': 800,
      });
      lA.textContent = 'A';
      const lB = svgEl('text', {
        x: geom.B.cx, y: geom.B.cy - geom.B.r - 8,
        'text-anchor': 'middle', fill: '#C9861F', 'font-size': 16, 'font-weight': 800,
      });
      lB.textContent = 'B';
      svg.append(lA, lB);
    }

    // Chips
    const sets = task ? task.sets : { A: BASE_A, B: BASE_B };
    const placed = placeChips(sets, geom) || [];
    const disabled = state.locked || (state.step === 2 && !state.s2Choice);

    placed.forEach((p) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `chip-btn kind-${p.kind}`;
      btn.style.left = `${p.x}px`;
      btn.style.top = `${p.y}px`;
      btn.textContent = String(p.val);
      btn.dataset.val = String(p.val);
      btn.disabled = disabled;
      btn.setAttribute('aria-label', `Add ${p.val} to the result`);
      btn.addEventListener('click', () => onSourceChipClick(p.val, btn, sets));
      el.chipLayer.appendChild(btn);
    });
  }

  let s3Dom = null;
  let s3Timers = [];
  let s3Raf = 0;
  function clearS3Timers() {
    s3Timers.forEach((id) => clearTimeout(id));
    s3Timers = [];
    if (s3Raf) {
      cancelAnimationFrame(s3Raf);
      s3Raf = 0;
    }
  }

  function makeChipRingLayer(kind, chipR) {
    const layer = svgEl('g');
    if (kind === 'AB') {
      layer.appendChild(svgEl('circle', {
        cx: 0, cy: 0, r: chipR,
        fill: '#F3E2D9', stroke: 'none',
      }));
      layer.appendChild(svgEl('path', {
        d: `M 0 ${-chipR} A ${chipR} ${chipR} 0 0 0 0 ${chipR}`,
        fill: 'none', stroke: '#7A3E7D', 'stroke-width': 2.4,
      }));
      layer.appendChild(svgEl('path', {
        d: `M 0 ${-chipR} A ${chipR} ${chipR} 0 0 1 0 ${chipR}`,
        fill: 'none', stroke: '#C9861F', 'stroke-width': 2.4,
      }));
    } else {
      const style = kind === 'A'
        ? { fill: '#EBDCEC', stroke: '#7A3E7D' }
        : { fill: '#FBE7C6', stroke: '#C9861F' };
      layer.appendChild(svgEl('circle', {
        cx: 0, cy: 0, r: chipR,
        fill: style.fill, stroke: style.stroke, 'stroke-width': 2.4,
      }));
    }
    return layer;
  }

  function makeStep3SvgChip(val, kind, chipR, extraClass = '') {
    const g = svgEl('g', { class: extraClass });
    g.appendChild(svgEl('circle', {
      cx: 0, cy: 0, r: chipR,
      fill: '#FFFDF9', stroke: 'none',
    }));
    g.appendChild(makeChipRingLayer(kind, chipR));
    const t = svgEl('text', {
      x: 0, y: 5,
      'text-anchor': 'middle', fill: '#2B1B2E',
      'font-size': Math.max(12, chipR - 1), 'font-weight': 750,
    });
    t.textContent = String(val);
    g.appendChild(t);
    return g;
  }

  function renderStep3Stage(svg, W, H) {
    const cg = compactLayout(W, H);
    const r3 = cg.r3;
    const midX = (cg.A.cx + cg.B.cx) / 2;
    const spreadY = Math.min(20, r3 * 0.36);
    const chipR = Math.max(13, Math.min(17, Math.floor(r3 * 0.26)));

    if (!s3Dom || s3Dom.W !== W || s3Dom.H !== H || s3Dom.root.parentNode !== svg) {
      svg.innerHTML = '';
      addSvgDefs(svg);
      const root = svgEl('g');

      const cA = svgEl('circle', {
        class: 'venn-circle',
        cx: cg.A.cx, cy: cg.A.cy, r: cg.A.r,
        fill: '#7A3E7D', 'fill-opacity': 0.25,
        stroke: '#7A3E7D', 'stroke-width': 2.5,
      });
      const cB = svgEl('circle', {
        class: 'venn-circle',
        cx: cg.B.cx, cy: cg.B.cy, r: cg.B.r,
        fill: '#E9A23B', 'fill-opacity': 0.25,
        stroke: '#C9861F', 'stroke-width': 2.5,
      });
      root.append(cA, cB);

      const lblA = svgEl('text', {
        class: 's3-lbl-a',
        x: 0, y: 0,
        'text-anchor': 'middle', fill: '#7A3E7D', 'font-size': 15, 'font-weight': 800,
      });
      lblA.textContent = 'A';
      lblA.style.transform = `translate(${cg.A.cx}px, ${cg.A.cy - cg.A.r - 8}px)`;

      const lblB = svgEl('text', {
        x: cg.B.cx, y: cg.B.cy - cg.B.r - 8,
        'text-anchor': 'middle', fill: '#C9861F', 'font-size': 15, 'font-weight': 800,
      });
      lblB.textContent = 'B';
      root.append(lblA, lblB);

      // Persistent circle C group (hidden until 3a reveal)
      const cGrp = svgEl('g', { class: 's3-c-grp' });
      cGrp.style.transformOrigin = `${cg.C.cx}px ${cg.C.cy}px`;
      cGrp.style.opacity = '0';
      cGrp.style.transform = 'scale(0.78)';
      const cCircle = svgEl('circle', {
        cx: cg.C.cx, cy: cg.C.cy, r: cg.C.r,
        fill: 'rgba(43, 27, 46, 0.06)',
        stroke: '#2B1B2E', 'stroke-width': 2.2,
      });
      const lblC = svgEl('text', {
        x: cg.C.cx, y: cg.C.cy - cg.C.r - 8,
        'text-anchor': 'middle', fill: '#2B1B2E', 'font-size': 15, 'font-weight': 800,
      });
      lblC.textContent = 'C';
      cGrp.append(cCircle, lblC);

      const cr = cg.C.r * 0.50;
      const angles = [-2.3, -0.8, 0.2, 1.3, 2.4];
      const cChips = [1, 2, 3, 4, 5].map((v, i) => {
        const px = cg.C.cx + Math.cos(angles[i]) * cr;
        const py = cg.C.cy + Math.sin(angles[i]) * cr;
        const ch = makeStep3SvgChip(v, kindOfValue(v, { A: BASE_A, B: BASE_B }), chipR, 's3-c-chip');
        ch.setAttribute('transform', `translate(${px}, ${py})`);
        ch.style.opacity = '0';
        cGrp.appendChild(ch);
        return ch;
      });
      root.appendChild(cGrp);

      // Unchanged pills (74 x 20 px, 11 px font)
      const unchangedGrp = svgEl('g', { class: 's3-unchanged' });
      unchangedGrp.style.opacity = '0';
      const addTag = (x, y) => {
        const pill = svgEl('rect', {
          x: x - 37, y: y - 10, width: 74, height: 20, rx: 10,
          fill: '#3E8E6A',
        });
        const txt = svgEl('text', {
          x, y: y + 4, 'text-anchor': 'middle', fill: '#fff',
          'font-size': 11, 'font-weight': 700,
        });
        txt.textContent = 'unchanged';
        unchangedGrp.append(pill, txt);
      };
      addTag(cg.A.cx - 8, cg.A.cy + cg.A.r + 14);
      addTag(cg.B.cx + 8, cg.B.cy + cg.B.r + 14);
      root.appendChild(unchangedGrp);

      // Persistent A & B chips 1..5 (chip 5 has solo + both ring layers)
      const chips = {};
      [1, 2, 3, 4].forEach((v) => {
        const ch = makeStep3SvgChip(v, kindOfValue(v, { A: BASE_A, B: BASE_B }), chipR, 's3-chip');
        chips[v] = ch;
        root.appendChild(ch);
      });

      const ch5 = svgEl('g', { class: 's3-chip' });
      ch5.appendChild(svgEl('circle', {
        cx: 0, cy: 0, r: chipR,
        fill: '#FFFDF9', stroke: 'none',
      }));
      const chip5Solo = makeChipRingLayer('B', chipR);
      chip5Solo.style.transition = 'opacity 0.4s ease';
      chip5Solo.style.opacity = '1';
      const chip5Both = makeChipRingLayer('AB', chipR);
      chip5Both.style.transition = 'opacity 0.4s ease';
      chip5Both.style.opacity = '0';
      const t5 = svgEl('text', {
        x: 0, y: 5,
        'text-anchor': 'middle', fill: '#2B1B2E',
        'font-size': Math.max(12, chipR - 1), 'font-weight': 750,
      });
      t5.textContent = '5';
      ch5.append(chip5Solo, chip5Both, t5);
      chips[5] = ch5;
      root.appendChild(ch5);

      svg.appendChild(root);
      s3Dom = { W, H, root, cA, cB, lblA, lblB, cGrp, cChips, unchangedGrp, chips, chip5Solo, chip5Both };
    }

    const posStart = {
      1: [cg.A.cx - 0.42 * r3, cg.A.cy - spreadY],
      2: [cg.A.cx - 0.42 * r3, cg.A.cy + spreadY],
      3: [midX, cg.A.cy - spreadY],
      4: [midX, cg.A.cy + spreadY],
      5: [cg.B.cx + 0.50 * r3, cg.B.cy],
    };
    const ringX = cg.grownA.cx - cg.grownA.r * 0.66;
    const posGrown = {
      1: [ringX, cg.A.cy - spreadY],
      2: [ringX, cg.A.cy + spreadY],
      3: [midX, cg.A.cy - spreadY],
      4: [midX, cg.A.cy + spreadY],
      5: [cg.B.cx + 0.08 * r3, cg.B.cy],
    };

    const setCircleA = (circleGeom) => {
      s3Dom.cA.setAttribute('cx', circleGeom.cx);
      s3Dom.cA.setAttribute('cy', circleGeom.cy);
      s3Dom.cA.setAttribute('r', circleGeom.r);
      s3Dom.cA.style.cx = `${circleGeom.cx}px`;
      s3Dom.cA.style.cy = `${circleGeom.cy}px`;
      s3Dom.cA.style.r = `${circleGeom.r}px`;
      s3Dom.lblA.style.transform = `translate(${circleGeom.cx}px, ${circleGeom.cy - circleGeom.r - 8}px)`;
    };

    const setChipPos = (val, xy) => {
      s3Dom.chips[val].style.transform = `translate(${xy[0]}px, ${xy[1]}px)`;
    };

    const setChip5Both = (on) => {
      s3Dom.chip5Both.style.opacity = on ? '1' : '0';
      s3Dom.chip5Solo.style.opacity = on ? '0' : '1';
    };

    // Place chips at posStart without initial (0,0)->posStart transition on first build
    if (!s3Dom.initialized) {
      s3Dom.initialized = true;
      [1, 2, 3, 4, 5].forEach((v) => {
        s3Dom.chips[v].style.transition = 'none';
        setChipPos(v, posStart[v]);
      });
      s3Dom.cA.style.transition = 'none';
      s3Dom.lblA.style.transition = 'none';
      setCircleA(cg.A);
      void s3Dom.root.getBoundingClientRect();
      [1, 2, 3, 4, 5].forEach((v) => { s3Dom.chips[v].style.transition = ''; });
      s3Dom.cA.style.transition = '';
      s3Dom.lblA.style.transition = '';
    }

    const just = state.s3JustRevealed;
    state.s3JustRevealed = null;

    // 3a C-circle state
    if (!state.s3RevealedC) {
      clearS3Timers();
      s3Dom.cGrp.style.transition = 'none';
      s3Dom.cGrp.style.opacity = '0';
      s3Dom.cGrp.style.transform = 'scale(0.78)';
      s3Dom.cChips.forEach((ch) => { ch.style.transition = 'none'; ch.style.opacity = '0'; });
      s3Dom.unchangedGrp.style.transition = 'none';
      s3Dom.unchangedGrp.style.opacity = '0';
      void s3Dom.cGrp.getBoundingClientRect();
      s3Dom.cGrp.style.transition = '';
      s3Dom.cChips.forEach((ch) => { ch.style.transition = ''; });
      s3Dom.unchangedGrp.style.transition = '';
    } else if (just === '3a' && !reducedMotion()) {
      clearS3Timers();
      s3Raf = requestAnimationFrame(() => {
        s3Raf = 0;
        if (state.step !== 3 || !state.s3RevealedC) return;
        s3Dom.cGrp.style.opacity = '1';
        s3Dom.cGrp.style.transform = 'scale(1)';
      });
      s3Dom.cChips.forEach((ch, idx) => {
        s3Timers.push(setTimeout(() => {
          if (state.step === 3 && state.s3RevealedC) ch.style.opacity = '1';
        }, 400 + idx * 80));
      });
      s3Timers.push(setTimeout(() => {
        if (state.step === 3 && state.s3RevealedC) s3Dom.unchangedGrp.style.opacity = '1';
      }, 820));
    } else {
      clearS3Timers();
      s3Dom.cGrp.style.opacity = '1';
      s3Dom.cGrp.style.transform = 'scale(1)';
      s3Dom.cChips.forEach((ch) => { ch.style.opacity = '1'; });
      s3Dom.unchangedGrp.style.opacity = '1';
    }

    // 3b & 3c circle A + chips 1..5 state
    if (!state.s3GrownA) {
      setCircleA(cg.A);
      setChip5Both(false);
      [1, 2, 3, 4, 5].forEach((v) => {
        setChipPos(v, posStart[v]);
        s3Dom.chips[v].style.opacity = '1';
      });
    } else if (just === '3b' && !reducedMotion()) {
      clearS3Timers();
      setChip5Both(false);
      // Step 1: chip 5 slides from B's region to its new spot (0.5 s)
      s3Raf = requestAnimationFrame(() => {
        s3Raf = 0;
        if (state.step !== 3 || !state.s3GrownA) return;
        setChipPos(5, posGrown[5]);
      });
      // Step 2: A grows around B (0.8 s ease-in-out) and 1, 2 glide into left ring
      s3Timers.push(setTimeout(() => {
        if (state.step !== 3 || !state.s3GrownA) return;
        setCircleA(cg.grownA);
        setChipPos(1, posGrown[1]);
        setChipPos(2, posGrown[2]);
      }, 500));
      // Step 3: after chip 5 has moved and A finished growing, switch 5 to both-ring
      s3Timers.push(setTimeout(() => {
        if (state.step === 3 && state.s3GrownA) setChip5Both(true);
      }, 1300));
    } else {
      clearS3Timers();
      setCircleA(cg.grownA);
      setChip5Both(true);
      [1, 2, 3, 4, 5].forEach((v) => setChipPos(v, posGrown[v]));
      const op12 = state.s3Faded12 ? '0.16' : '1';
      if (just === '3c' && !reducedMotion()) {
        s3Raf = requestAnimationFrame(() => {
          s3Raf = 0;
          if (state.step !== 3 || !state.s3Faded12) return;
          s3Dom.chips[1].style.opacity = op12;
          s3Dom.chips[2].style.opacity = op12;
        });
      } else {
        s3Dom.chips[1].style.opacity = op12;
        s3Dom.chips[2].style.opacity = op12;
      }
      [3, 4, 5].forEach((v) => { s3Dom.chips[v].style.opacity = '1'; });
    }
  }

  // ---- Step 4: Tags and Boxes ----
  function renderStep4Stage() {
    el.svg.innerHTML = '';
    el.chipLayer.innerHTML = '';
    el.refLayer.classList.add('active');

    const fillBox = (box, vals, fadedVals = [], unchanged = false) => {
      box.innerHTML = '';
      vals.forEach((v) => {
        const span = document.createElement('span');
        const kind = kindOfValue(v, { A: BASE_A, B: BASE_B });
        span.className = `mini-chip kind-${kind}` + (fadedVals.includes(v) ? ' faded' : '');
        span.textContent = String(v);
        box.appendChild(span);
      });
      if (unchanged) {
        const pill = document.createElement('span');
        pill.className = 'unchanged-pill';
        pill.textContent = 'unchanged';
        box.appendChild(pill);
      }
    };

    const showCommonTag = state.s4Line >= 1;
    const showCommonBox = state.s4Part === 2 && state.s4Line >= 1;
    const shrinkShared = state.s4Part === 1 && state.s4Line >= 2;
    const shrinkCopy = state.s4Part === 2 && state.s4Line >= 2;

    el.refTagCommon.classList.toggle('hidden', !showCommonTag);
    el.refBoxCommon.classList.toggle('hidden', !showCommonBox);

    fillBox(el.refBoxA, BASE_A, shrinkShared ? [1, 2] : [], shrinkCopy);
    fillBox(el.refBoxB, BASE_B);
    if (showCommonBox) {
      fillBox(el.refBoxCommon, BASE_A, shrinkCopy ? [1, 2] : []);
    }

    requestAnimationFrame(() => drawRefArrows());
  }

  function drawRefArrows() {
    if (state.step !== 4) return;
    const svg = el.refSvg;
    const rect = el.refLayer.getBoundingClientRect();
    const W = rect.width || state.stageW;
    const H = rect.height || state.stageH;
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = '';

    const defs = svgEl('defs');
    const mkArrow = (id, color) => {
      const m = svgEl('marker', {
        id, viewBox: '0 0 10 10', refX: 8, refY: 5,
        markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse',
      });
      m.appendChild(svgEl('path', { d: 'M 0 1.5 L 8.5 5 L 0 8.5 z', fill: color }));
      defs.appendChild(m);
    };
    mkArrow('arr-plum', '#7A3E7D');
    mkArrow('arr-ink', '#2B1B2E');
    mkArrow('arr-saff', '#C9861F');
    mkArrow('arr-bad', '#C23B4A');
    svg.appendChild(defs);

    const anchor = (tagEl, boxEl, color, markerId, yOff = 0, pulse = false) => {
      const tr = tagEl.getBoundingClientRect();
      const br = boxEl.getBoundingClientRect();
      if (!tr.width || !br.width) return;
      const x1 = tr.right - rect.left + 4;
      const y1 = tr.top - rect.top + tr.height / 2;
      const x2 = br.left - rect.left - 5;
      const y2 = br.top - rect.top + br.height / 2 + yOff;
      const cx = (x1 + x2) / 2;
      const path = svgEl('path', {
        d: `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`,
        fill: 'none',
        stroke: pulse ? '#C23B4A' : color,
        'stroke-width': pulse ? 4 : 2.6,
        'marker-end': `url(#${pulse ? 'arr-bad' : markerId})`,
      });
      svg.appendChild(path);
    };

    const pulseBoth = state.s4Part === 1 && state.s4Line === 2;
    anchor(el.refTagA, el.refBoxA, '#7A3E7D', 'arr-plum', state.s4Part === 1 && state.s4Line >= 1 ? -7 : 0, pulseBoth);
    anchor(el.refTagB, el.refBoxB, '#C9861F', 'arr-saff');

    if (state.s4Line >= 1) {
      if (state.s4Part === 1) {
        anchor(el.refTagCommon, el.refBoxA, '#2B1B2E', 'arr-ink', 7, pulseBoth);
      } else {
        anchor(el.refTagCommon, el.refBoxCommon, '#2B1B2E', 'arr-ink');
      }
    }
  }

  // ---- Tray & Chip interaction ----
  function renderTray(setsForStyle = { A: BASE_A, B: BASE_B }, neutralChips = false) {
    el.trayChips.innerHTML = '';
    const sorted = sortNums(state.tray);
    sorted.forEach((v) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const kind = neutralChips ? 'neutral' : kindOfValue(v, setsForStyle);
      btn.className = `tray-chip kind-${kind}`;
      btn.textContent = String(v);
      btn.dataset.val = String(v);
      btn.disabled = state.locked || (state.step === 2 && !state.s2Choice);
      btn.setAttribute('aria-label', `Remove ${v} from the result`);
      btn.addEventListener('click', () => removeFromTray(v, setsForStyle, neutralChips));
      el.trayChips.appendChild(btn);
    });

    el.emptyBtn.setAttribute('aria-pressed', state.emptySelected ? 'true' : 'false');
    el.emptyBtn.disabled = state.locked || (state.step === 2 && !state.s2Choice);

    const hasInput = state.tray.length > 0 || state.emptySelected;
    if (state.step === 1 || state.step === 2 || state.step === 3 || state.step === 5) {
      if (state.taskDone) {
        el.checkBtn.disabled = false;
      } else {
        el.checkBtn.disabled = !hasInput || (state.step === 2 && !state.s2Choice);
      }
    }
  }

  function animateFly(sourceBtn, targetBtn, onArrive) {
    if (reducedMotion() || !sourceBtn || !targetBtn) {
      onArrive();
      return;
    }
    const sr = sourceBtn.getBoundingClientRect();
    const tr = targetBtn.getBoundingClientRect();
    const clone = sourceBtn.cloneNode(true);
    clone.classList.add('fly-clone');
    clone.style.position = 'fixed';
    clone.style.left = `${sr.left}px`;
    clone.style.top = `${sr.top}px`;
    clone.style.width = `${sr.width}px`;
    clone.style.height = `${sr.height}px`;
    clone.style.transform = 'none';
    document.body.appendChild(clone);

    requestAnimationFrame(() => {
      const dx = tr.left - sr.left;
      const dy = tr.top - sr.top;
      clone.style.transform = `translate(${dx}px, ${dy}px)`;
    });
    setTimeout(() => {
      clone.remove();
      onArrive();
    }, 300);
  }

  function onSourceChipClick(val, sourceBtn, setsForStyle, neutralChips = false) {
    if (state.locked) return;
    if (state.step === 2 && !state.s2Choice) return;

    if (state.tray.includes(val)) {
      const existing = el.trayChips.querySelector(`[data-val="${val}"]`);
      if (existing) {
        const cls = reducedMotion() ? 'static-bad-ring' : 'shake';
        existing.classList.remove('shake', 'static-bad-ring');
        void existing.offsetWidth;
        existing.classList.add(cls);
        setTimeout(() => existing.classList.remove(cls), 600);
      }
      setFeedback('Already in the set. A set holds each element once.', 'bad');
      return;
    }

    state.emptySelected = false;
    state.tray = sortNums([...state.tray, val]);
    renderTray(setsForStyle, neutralChips);

    const destBtn = el.trayChips.querySelector(`[data-val="${val}"]`);
    if (destBtn && !reducedMotion()) {
      destBtn.style.opacity = '0';
      animateFly(sourceBtn, destBtn, () => {
        if (destBtn) destBtn.style.opacity = '1';
      });
    }
  }

  function removeFromTray(val, setsForStyle, neutralChips = false) {
    if (state.locked) return;
    const prevIdx = state.tray.indexOf(val);
    state.tray = state.tray.filter((x) => x !== val);
    renderTray(setsForStyle, neutralChips);

    const remaining = [...el.trayChips.querySelectorAll('button')];
    if (remaining.length > 0) {
      const nextEl = remaining[Math.min(prevIdx, remaining.length - 1)];
      nextEl.focus();
    } else {
      el.emptyBtn.focus();
    }
  }

  el.emptyBtn.addEventListener('click', () => {
    if (state.locked) return;
    if (state.step === 2 && !state.s2Choice) return;
    state.tray = [];
    state.emptySelected = !state.emptySelected;
    const sets = state.step === 3 ? { A: BASE_A, B: BASE_B } : (currentTask()?.sets || { A: BASE_A, B: BASE_B });
    renderTray(sets, state.step === 3);
  });

  // ---- Check & Show answer ----
  function runCheck() {
    if (state.taskDone) {
      advanceWithinStep();
      return;
    }

    const given = state.emptySelected ? [] : sortNums(state.tray);

    if (state.step === 3) {
      const part = STEP3_PARTS[state.s3Idx];
      if (eq(given, part.expected)) {
        finishStep3Part(part, false);
      } else {
        state.wrongTries += 1;
        if (state.wrongTries >= 2) el.showAnswerBtn.hidden = false;
        const gKey = given.join(',');
        if (part.specialWrong && gKey === part.specialWrong.key) {
          setFeedback(part.specialWrong.msg, 'bad');
        } else {
          setFeedback('Not quite. Follow the code one line at a time.', 'bad');
        }
      }
      return;
    }

    const task = currentTask();
    if (!task) return;
    const exp = answer(task);
    if (eq(given, exp)) {
      finishStandardTask(task, false);
    } else {
      state.wrongTries += 1;
      if (state.wrongTries >= 2) el.showAnswerBtn.hidden = false;
      if (state.step === 5) state.streak = 0;
      setFeedback(feedbackFor(task, given), 'bad');
      updateTaskMeta();
    }
  }

  function runShowAnswer() {
    if (state.step === 3) {
      const part = STEP3_PARTS[state.s3Idx];
      state.tray = [...part.expected];
      state.emptySelected = part.expected.length === 0;
      renderTray({ A: BASE_A, B: BASE_B }, true);
      finishStep3Part(part, true);
      return;
    }

    const task = currentTask();
    if (!task) return;
    const exp = answer(task);
    state.tray = [...exp];
    state.emptySelected = exp.length === 0;
    if (state.step === 5) state.streak = 0;
    renderTray(task.sets, false);
    finishStandardTask(task, true);
  }

  function finishStandardTask(task, wasShown) {
    state.taskDone = true;
    state.locked = true;
    el.showAnswerBtn.hidden = true;
    const exp = answer(task);

    if (state.step === 1) {
      setFeedback(
        wasShown ? `Here is the answer. ${shortRule(task)}.` : correctMsg(task),
        'ok'
      );
      showCode(`${methodName(task)} \u2192 ${fmtCode(exp)}`);
      state.s1Thumbs[state.s1Idx] = { opKey: opToKey(task), sym: symbolText(task) };
      renderThumbs();

      if (state.s1Idx < STEP1_TASKS.length - 1) {
        el.checkBtn.textContent = 'Next task';
      } else {
        state.completedSteps.add(1);
        state.maxReached = Math.max(state.maxReached, 2);
        el.checkBtn.hidden = true;
        setFeedback('Union: in either. Intersection: in both. Difference: in the first, not the second.', 'ok');
      }
    } else if (state.step === 2) {
      state.completedSteps.add(2);
      state.maxReached = Math.max(state.maxReached, 3);
      el.checkBtn.hidden = true;
      const prefix = wasShown
        ? 'Here is the answer. Difference: in B, not in A.'
        : (state.s2Choice === 'yes'
          ? 'Surprise: the order matters for difference.'
          : 'Right, the order matters.');
      setFeedback(`${prefix} Union and intersection give the same result in either order. Difference does not.`, 'ok');
      showCode(
        `<span class="code-muted">A.difference(B) \u2192 ${fmtCode(diff(BASE_A, BASE_B))}</span>` +
        `B.difference(A) \u2192 ${fmtCode(exp)}`,
        true
      );
    } else if (state.step === 5) {
      if (!wasShown) state.streak += 1;
      setFeedback(
        wasShown ? `Here is the answer. ${shortRule(task)}.` : correctMsg(task),
        'ok'
      );
      showCode(`${methodName(task)} \u2192 ${fmtCode(exp)}`);
      el.checkBtn.textContent = 'New sets';
      updateTaskMeta();
    }

    renderTray(task.sets, false);
    renderVennStage();
    updateNavButtons();
  }

  function finishStep3Part(part, wasShown) {
    state.taskDone = true;
    state.locked = true;
    el.showAnswerBtn.hidden = true;

    if (part.id === '3a') {
      state.s3RevealedC = true;
      state.s3JustRevealed = '3a';
    } else if (part.id === '3b') {
      state.s3GrownA = true;
      state.s3JustRevealed = '3b';
    } else if (part.id === '3c') {
      state.s3Faded12 = true;
      state.s3JustRevealed = '3c';
    }

    showCode(part.revealCode);

    if (state.s3Idx < STEP3_PARTS.length - 1) {
      setFeedback(
        wasShown ? `Here is the answer: ${fmt(part.expected)}.` : part.okMsg,
        'ok'
      );
      el.checkBtn.textContent = 'Next part';
    } else {
      state.completedSteps.add(3);
      state.maxReached = Math.max(state.maxReached, 4);
      el.checkBtn.hidden = true;
      const head = wasShown ? `Here is the answer: ${fmt(part.expected)}.` : part.okMsg;
      setFeedback(`${head} TraSet operations return a new set. java.util operations change the calling set.`, 'ok');
    }

    renderTray({ A: BASE_A, B: BASE_B }, true);
    renderVennStage();
    updateNavButtons();
  }

  function advanceWithinStep() {
    if (state.step === 1 && state.s1Idx < STEP1_TASKS.length - 1) {
      state.s1Idx += 1;
      resetTaskFlags();
      renderCurrentStep();
    } else if (state.step === 3 && state.s3Idx < STEP3_PARTS.length - 1) {
      state.s3Idx += 1;
      if (state.s3Idx === 1) state.s3RevealedC = false;
      resetTaskFlags();
      renderCurrentStep();
    } else if (state.step === 5) {
      state.practiceCurrent = nextPracticeDeal(state, state.stageW, state.stageH);
      resetTaskFlags();
      renderCurrentStep();
    }
  }

  el.checkBtn.addEventListener('click', runCheck);
  el.showAnswerBtn.addEventListener('click', runShowAnswer);

  // ---- Step 4 logic ----
  function renderStep4Controls() {
    const lines = state.s4Part === 1
      ? ['Set<Integer> common = A;', 'common.retainAll(B);']
      : ['Set<Integer> common = new TreeSet<>(A);', 'common.retainAll(B);'];

    el.step4Code.hidden = false;
    el.step4Code.innerHTML = lines
      .map((ln, idx) => {
        const cls = idx < state.s4Line ? 'done' : (idx === state.s4Line ? 'active' : '');
        return `<div class="code-line-item ${cls}">${ln.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
      })
      .join('');

    el.actionRow.hidden = false;
    el.checkBtn.hidden = false;
    el.showAnswerBtn.hidden = true;

    if (state.s4Part === 1) {
      if (state.s4Line === 0) {
        el.choiceRow.hidden = true;
        el.checkBtn.textContent = 'Run next line';
        el.checkBtn.disabled = false;
      } else if (state.s4Line === 1) {
        el.choiceRow.hidden = false;
        el.choiceRow.innerHTML = '';
        const qLbl = document.createElement('span');
        qLbl.style.cssText = 'width:100%;font-weight:700;';
        qLbl.textContent = 'After common.retainAll(B), what does A hold?';
        el.choiceRow.appendChild(qLbl);

        [
          { key: 'orig', label: '{1, 2, 3, 4}' },
          { key: 'shrunk', label: '{3, 4}' },
        ].forEach((opt) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'choice-btn' + (state.s4Prediction === opt.key ? ' picked' : '');
          b.textContent = opt.label;
          b.addEventListener('click', () => {
            state.s4Prediction = opt.key;
            renderStep4Controls();
          });
          el.choiceRow.appendChild(b);
        });

        el.checkBtn.textContent = 'Run next line';
        el.checkBtn.disabled = !state.s4Prediction;
      } else {
        el.choiceRow.hidden = true;
        el.checkBtn.textContent = 'Reset and fix';
        el.checkBtn.disabled = false;
      }
    } else {
      el.choiceRow.hidden = true;
      if (state.s4Line < 2) {
        el.checkBtn.textContent = 'Run next line';
        el.checkBtn.disabled = false;
      } else {
        el.checkBtn.hidden = true;
        el.cheatWrap.hidden = false;
      }
    }
  }

  function onStep4Action() {
    if (state.s4Part === 1) {
      if (state.s4Line === 0) {
        state.s4Line = 1;
        setFeedback('common points to the same set as A.');
      } else if (state.s4Line === 1) {
        state.s4Line = 2;
        if (state.s4Prediction === 'orig') {
          setFeedback('common and A are two names for one set, so A shrank too.', 'bad');
        } else {
          setFeedback('Right. One set, two names.', 'ok');
        }
      } else {
        state.s4Part = 2;
        state.s4Line = 0;
        state.s4Prediction = null;
        setFeedback('Now copy first, then change the copy.');
      }
    } else {
      if (state.s4Line === 0) {
        state.s4Line = 1;
        setFeedback('new TreeSet<>(A) creates a separate copy.');
      } else if (state.s4Line === 1) {
        state.s4Line = 2;
        state.s4Done = true;
        state.completedSteps.add(4);
        state.maxReached = Math.max(state.maxReached, 5);
        setFeedback('TraSet does not need this: A.intersection(B) already returns a new set.', 'ok');
      }
    }
    renderStep4Stage();
    renderStep4Controls();
    if (state.step === 4) {
      el.taskQuestion.textContent = state.s4Part === 1
        ? 'Two names for one set?'
        : 'Copy first, then change the copy.';
    }
    updateNavButtons();
  }

  // Override checkBtn click for step 4 seamlessly
  el.checkBtn.removeEventListener('click', runCheck);
  el.checkBtn.addEventListener('click', () => {
    if (state.step === 4) onStep4Action();
    else runCheck();
  });

  // ---- Render step & UI ----
  function resetTaskFlags() {
    state.tray = [];
    state.emptySelected = false;
    state.wrongTries = 0;
    state.taskDone = false;
    state.locked = false;
    el.showAnswerBtn.hidden = true;
    el.checkBtn.hidden = false;
    el.checkBtn.textContent = 'Check';
    setFeedback('');
    hideCode();
  }

  function renderThumbs() {
    if (state.step !== 1 || state.s1Thumbs.length === 0) {
      el.thumbStrip.hidden = true;
      el.thumbStrip.innerHTML = '';
      return;
    }
    el.thumbStrip.hidden = false;
    el.thumbStrip.innerHTML = '';
    state.s1Thumbs.forEach((th) => {
      if (!th) return;
      const item = document.createElement('div');
      item.className = 'thumb-item';
      item.appendChild(shadeThumb(th.opKey));
      const sp = document.createElement('span');
      sp.textContent = th.sym;
      item.appendChild(sp);
      el.thumbStrip.appendChild(item);
    });
  }

  function updateTaskMeta() {
    if (state.step === 1) {
      el.taskMeta.textContent = `${state.s1Idx + 1} of ${STEP1_TASKS.length}`;
    } else if (state.step === 3) {
      el.taskMeta.textContent = `${state.s3Idx + 1} of ${STEP3_PARTS.length}`;
    } else if (state.step === 5) {
      el.taskMeta.innerHTML = '';
      const streak = document.createElement('span');
      streak.textContent = `${state.streak} in a row`;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-secondary';
      btn.textContent = 'New sets';
      btn.addEventListener('click', () => {
        state.practiceCurrent = nextPracticeDeal(state, state.stageW, state.stageH);
        resetTaskFlags();
        renderCurrentStep();
      });
      el.taskMeta.append(streak, btn);
    } else {
      el.taskMeta.textContent = '';
    }
  }

  function updateNavButtons() {
    el.stepBtns.forEach((b) => {
      const n = parseInt(b.dataset.step, 10);
      b.disabled = n > state.maxReached;
      if (n === state.step) b.setAttribute('aria-current', 'step');
      else b.removeAttribute('aria-current');
    });

    el.backBtn.disabled = state.step <= 1;
    const canNext = state.step < 5 && (state.completedSteps.has(state.step) || state.maxReached > state.step);
    el.nextBtn.disabled = !canNext;
  }

  function renderStep3Palette() {
    el.paletteRow.innerHTML = '';
    [1, 2, 3, 4, 5].forEach((v) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tray-chip kind-neutral';
      btn.textContent = String(v);
      btn.disabled = state.locked;
      btn.setAttribute('aria-label', `Add ${v} to A after`);
      btn.addEventListener('click', () => onSourceChipClick(v, btn, { A: BASE_A, B: BASE_B }, true));
      el.paletteRow.appendChild(btn);
    });
  }

  function renderCurrentStep() {
    el.refLayer.classList.remove('active');
    el.thumbStrip.hidden = true;
    el.choiceRow.hidden = true;
    el.step4Code.hidden = true;
    el.paletteRow.hidden = true;
    el.cheatWrap.hidden = true;
    el.trayWrap.hidden = false;
    el.declLine.textContent = '';

    if (state.step === 1) {
      const t = STEP1_TASKS[state.s1Idx];
      el.taskQuestion.textContent = `Which elements are in ${symbolText(t)}?`;
      el.methodPill.textContent = methodName(t);
      el.methodPill.hidden = false;
      el.trayLabel.textContent = 'Result';
      renderThumbs();
      renderTray(t.sets, false);
      renderVennStage();
    } else if (state.step === 2) {
      el.taskQuestion.textContent = state.s2Choice
        ? 'Now tap the elements of B \\ A.'
        : 'Will B \\ A give the same result as A \\ B?';
      el.methodPill.textContent = 'B.difference(A)';
      el.methodPill.hidden = false;
      el.trayLabel.textContent = 'Result';

      el.choiceRow.hidden = false;
      el.choiceRow.innerHTML = '';
      [
        { k: 'yes', label: 'Yes' },
        { k: 'no', label: 'No' },
      ].forEach((opt) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'choice-btn' + (state.s2Choice === opt.k ? ' picked' : '');
        b.textContent = opt.label;
        b.disabled = state.taskDone;
        b.addEventListener('click', () => {
          state.s2Choice = opt.k;
          renderCurrentStep();
        });
        el.choiceRow.appendChild(b);
      });

      renderTray(STEP2_TASK.sets, false);
      renderVennStage();
    } else if (state.step === 3) {
      const p = STEP3_PARTS[state.s3Idx];
      el.declLine.textContent = p.decl;
      el.taskQuestion.textContent = 'What does A hold afterwards?';
      el.methodPill.textContent = p.code;
      el.methodPill.hidden = false;
      el.trayLabel.textContent = 'A after';
      if (p.hint && !state.taskDone) setFeedback(p.hint);
      el.paletteRow.hidden = false;
      renderStep3Palette();
      renderTray({ A: BASE_A, B: BASE_B }, true);
      renderVennStage();
    } else if (state.step === 4) {
      el.trayWrap.hidden = true;
      el.taskQuestion.textContent = state.s4Part === 1
        ? 'Two names for one set?'
        : 'Copy first, then change the copy.';
      el.methodPill.hidden = true;
      hideCode();
      renderStep4Stage();
      renderStep4Controls();
    } else if (state.step === 5) {
      if (!state.practiceCurrent) {
        state.practiceCurrent = nextPracticeDeal(state, state.stageW, state.stageH);
      }
      const t = state.practiceCurrent.task;
      el.taskQuestion.textContent = `Which elements are in ${symbolText(t)}?`;
      el.methodPill.textContent = methodName(t);
      el.methodPill.hidden = false;
      el.trayLabel.textContent = 'Result';
      renderTray(t.sets, false);
      renderVennStage();
    }

    updateTaskMeta();
    updateNavButtons();
  }

  function goToStep(n) {
    if (n < 1 || n > 5 || n > state.maxReached) return;
    state.step = n;
    resetTaskFlags();
    if (n === 1) {
      state.s1Idx = 0;
      state.s1Thumbs = [];
    } else if (n === 2) {
      state.s2Choice = null;
    } else if (n === 3) {
      state.s3Idx = 0;
      state.s3RevealedC = false;
      state.s3GrownA = false;
      state.s3Faded12 = false;
    } else if (n === 4) {
      state.s4Part = 1;
      state.s4Line = 0;
      state.s4Prediction = null;
      state.s4Done = false;
    } else if (n === 5) {
      state.practiceCurrent = nextPracticeDeal(state, state.stageW, state.stageH);
    }
    renderCurrentStep();
  }

  el.stepBtns.forEach((b) => {
    b.addEventListener('click', () => goToStep(parseInt(b.dataset.step, 10)));
  });
  el.backBtn.addEventListener('click', () => goToStep(state.step - 1));
  el.nextBtn.addEventListener('click', () => {
    if (state.step < 5) goToStep(state.step + 1);
  });

  // ResizeObserver keeps #stage height strictly fixed per width
  let resizeRaf = 0;
  const ro = new ResizeObserver((entries) => {
    const w = Math.round(entries[0].contentRect.width);
    if (!w) return;
    const h = Math.round(Math.max(250, Math.min(340, 0.62 * w)));
    state.stageW = w;
    state.stageH = h;
    el.stage.style.height = `${h}px`;
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      if (state.step === 4) drawRefArrows();
      else renderVennStage();
    });
  });
  ro.observe(el.stage);

  // Initial measure & render
  const initW = Math.round(el.stage.getBoundingClientRect().width) || 600;
  const initH = Math.round(Math.max(250, Math.min(340, 0.62 * initW)));
  state.stageW = initW;
  state.stageH = initH;
  el.stage.style.height = `${initH}px`;
  renderCurrentStep();

  // ---- Self-test harness (?selftest=1) ----
  if (params.get('selftest') === '1') {
    const out = document.getElementById('selftest');
    out.style.display = 'block';
    const results = [];
    const assert = (name, cond, detail = '') => {
      const line = `${cond ? 'PASS' : 'FAIL'}: ${name}${detail ? ' — ' + detail : ''}`;
      results.push(line);
      if (!cond) console.error(line);
      else console.log(line);
    };

    const sAB = { A: [1, 2, 3, 4], B: [3, 4, 5] };
    assert('Example union', eq(answer({ op: 'union', X: 'A', Y: 'B', sets: sAB }), [1, 2, 3, 4, 5]));
    assert('Example inter', eq(answer({ op: 'inter', X: 'A', Y: 'B', sets: sAB }), [3, 4]));
    assert('Example A\\B', eq(answer({ op: 'diff', X: 'A', Y: 'B', sets: sAB }), [1, 2]));
    assert('Example B\\A', eq(answer({ op: 'diff', X: 'B', Y: 'A', sets: sAB }), [5]));
    assert('Example addAll', eq(union(sAB.A, sAB.B), [1, 2, 3, 4, 5]));
    assert('Example addAll then retainAll', eq(inter(union(sAB.A, sAB.B), sAB.B), [3, 4, 5]));

    const tUnion = { op: 'union', X: 'A', Y: 'B', sets: sAB };
    const tInter = { op: 'inter', X: 'A', Y: 'B', sets: sAB };
    const tDiff = { op: 'diff', X: 'A', Y: 'B', sets: sAB };
    assert('FB union missing 5', feedbackFor(tUnion, [1, 2, 3, 4]) === 'Almost. Union takes elements from B too.');
    assert('FB union missing 1/2', feedbackFor(tUnion, [2, 3, 4, 5]) === 'Almost. Union keeps everything from A too.');
    assert('FB inter extra', feedbackFor(tInter, [2, 3, 4]) === 'Only elements in both circles belong here.');
    assert('FB inter extra 5', feedbackFor(tInter, [3, 4, 5]) === 'Only elements in both circles belong here.');
    assert('FB diff overlap', feedbackFor(tDiff, [1, 2, 3]) === '3 and 4 are also in B, so they are taken away.');
    assert('FB diff 5', feedbackFor(tDiff, [1, 2, 5]) === '5 was never in A. Difference only keeps elements of A.');
    assert('FB fallback', feedbackFor(tInter, [3]) === 'Not quite. Look at which region the question asks about.');

    assert('3a expected', eq(STEP3_PARTS[0].expected, [1, 2, 3, 4]));
    assert('3b expected', eq(STEP3_PARTS[1].expected, [1, 2, 3, 4, 5]));
    assert('3c expected', eq(STEP3_PARTS[2].expected, [3, 4, 5]));
    assert('3a wrong msg', STEP3_PARTS[0].specialWrong.msg === 'union builds a new set C. A itself is untouched.');
    assert('3b wrong msg', STEP3_PARTS[1].specialWrong.msg === 'addAll does not build a new set. It writes into A itself.');
    assert('3c wrong msg', STEP3_PARTS[2].specialWrong.msg === 'That is the intersection of the original sets. But addAll already changed A.');

    let allShapesOk = true;
    let emptyOk = true;
    let layout340Ok = true;
    let layout1000Ok = true;
    for (let trial = 0; trial < 300; trial++) {
      const deck = createPracticeDeck();
      const shapes = new Set(deck.map((d) => d.shape));
      if (shapes.size !== 4) allShapesOk = false;
      if (!deck.some((d) => answer(d.task).length === 0)) emptyOk = false;
      for (const d of deck) {
        if (!placeChips(d.task.sets, layout(d.shape, 340, 250))) layout340Ok = false;
        if (!placeChips(d.task.sets, layout(d.shape, 1000, 340))) layout1000Ok = false;
      }
    }
    assert('300 practice: all 4 shapes in first 4', allShapesOk);
    assert('300 practice: >=1 empty set in first 4', emptyOk);
    assert('300 practice: placeChips W=340', layout340Ok);
    assert('300 practice: placeChips W=1000', layout1000Ok);

    out.textContent = results.join('\n');
  }
})();
</script>
</body>
</html>
