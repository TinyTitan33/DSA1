      /* ---------------- STEP 2 ---------------- */
      function resetStep2() {
        cancelPendingAnimations();
        state.step2 = {
          rowIndex: 0,
          counts: { apple: 4, banana: 1 },
          prediction: "",
          running: false,
          fadingApple: false,
          status: "idle",
          wrongMessage: "",
          completedRows: []
        };
        render();
        announce("Step 2 reset.");
      }

      async function runStep2Row() {
        const s2 = state.step2;
        if (s2.running || s2.prediction === "" || s2.status === "done" || s2.status === "wrong") return;

        const row = STEP2_SCRIPT[s2.rowIndex];
        const prevCounts = { ...s2.counts };
        const nextCounts = row.apply(prevCounts);

        cancelPendingAnimations();
        const token = state.runToken;
        s2.running = true;
        render();
        focusByIdNoScroll("s2-run-btn");

        if (!row.isFinalSize) {
          if (prevCounts.apple > 0 && nextCounts.apple === 0) {
            s2.fadingApple = true;
            render();
            focusByIdNoScroll("s2-run-btn");
            const ok = await waitMs(390, token);
            if (!ok) return;
            s2.fadingApple = false;
            s2.counts = nextCounts;
            render();
            focusByIdNoScroll("s2-run-btn");
          } else {
            s2.counts = nextCounts;
            render();
            focusByIdNoScroll("s2-run-btn");
            const ok = await waitMs(340, token);
            if (!ok) return;
          }
        } else {
          const ok = await waitMs(220, token);
          if (!ok) return;
        }

        s2.running = false;
        const val = parseInt(s2.prediction, 10);

        if (val !== row.answer) {
          s2.status = "wrong";
          s2.wrongMessage = row.wrongReason;
          // Store previous counts so Try again restores cleanly
          s2.prevCountsForRetry = prevCounts;
          render();
          focusByIdNoScroll("step2-try-btn");
          announce(row.wrongReason);
          return;
        }

        s2.completedRows.push({ index: s2.rowIndex, answer: row.answer });
        s2.prediction = "";

        if (s2.rowIndex < STEP2_SCRIPT.length - 1) {
          s2.rowIndex += 1;
          s2.status = "idle";
          render();
          const nextRow = STEP2_SCRIPT[s2.rowIndex];
          announce(`Confirmed. Next line: ${nextRow.code}`);
          const inp = document.getElementById("s2-active-input");
          if (inp) inp.focus({ preventScroll: true });
        } else {
          s2.status = "done";
          if (state.maxUnlockedStep < 2) state.maxUnlockedStep = 2;
          render();
          focusByIdNoScroll("step2-next-btn");
          announce("Confirmed: bag size is 1. Next step is unlocked.");
        }
      }

      function renderStep2() {
        const s2 = state.step2;

        const header = document.createElement("div");
        header.className = "step-header";
        header.innerHTML = `<h2 class="step-title" tabindex="-1">Predict the script</h2>`;
        const resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.className = "btn btn-secondary btn-small";
        resetBtn.textContent = "Reset";
        resetBtn.addEventListener("click", resetStep2);
        header.appendChild(resetBtn);
        mainEl.appendChild(header);

        const cols = document.createElement("div");
        cols.className = "two-col step2-cols";

        // Left: Bag (Counts view)
        const bagPanel = document.createElement("section");
        bagPanel.className = "panel";
        bagPanel.setAttribute("aria-label", "Bag counts view");
        const bagHead = document.createElement("div");
        bagHead.className = "panel-head";
        const totalSize = (s2.counts.apple || 0) + (s2.counts.banana || 0);
        const sizeBadge = s2.status === "done"
          ? `<span class="count-pill">bag.size() = ${totalSize}</span>`
          : `<span class="count-pill">Counts view</span>`;
        bagHead.innerHTML = `<h3 class="panel-title">Bag</h3>${sizeBadge}`;
        bagPanel.appendChild(bagHead);

        const startCaption = document.createElement("p");
        startCaption.className = "muted-note";
        startCaption.textContent = "Start: apple \u00d74, banana \u00d71";
        bagPanel.appendChild(startCaption);

        const basket = document.createElement("div");
        basket.className = "basket-wrap";
        let hasItems = false;
        if (s2.counts.apple > 0 || s2.fadingApple) {
          hasItems = true;
          const displayCount = s2.fadingApple ? 0 : s2.counts.apple;
          basket.insertAdjacentHTML(
            "beforeend",
            renderFruitToken("apple", {
              count: displayCount,
              extraClass: s2.fadingApple ? "fade-out" : ""
            })
          );
        }
        if (s2.counts.banana > 0) {
          hasItems = true;
          basket.insertAdjacentHTML("beforeend", renderFruitToken("banana", { count: s2.counts.banana }));
        }
        if (!hasItems) {
          basket.innerHTML = `<span class="empty-label">Empty basket</span>`;
        }
        bagPanel.appendChild(basket);
        cols.appendChild(bagPanel);

        // Right: Script rows
        const scriptPanel = document.createElement("section");
        scriptPanel.className = "panel";
        scriptPanel.setAttribute("aria-label", "Bag operations script");

        const instr = document.createElement("p");
        instr.className = "instruction-line";
        if (s2.status === "done") {
          instr.textContent = "All lines complete.";
        } else if (STEP2_SCRIPT[s2.rowIndex].isFinalSize) {
          instr.textContent = "Predict the total bag size now, then tap Check.";
        } else {
          instr.textContent = "Predict apples after the highlighted line, then tap Run line.";
        }
        scriptPanel.appendChild(instr);

        const list = document.createElement("div");
        list.className = "script-list";

        STEP2_SCRIPT.forEach((row, idx) => {
          const isDone = s2.completedRows.some((c) => c.index === idx);
          const isActive = s2.status !== "done" && idx === s2.rowIndex;
          const rowEl = document.createElement("div");
          rowEl.className = `script-row ${isActive ? "is-active" : (isDone ? "is-done" : "is-future")}`;

          const top = document.createElement("div");
          top.className = "script-row-top";
          top.innerHTML = `<code class="code-inline">${idx < 5 ? `${idx + 1}. ` : ""}${row.code}</code>`;

          if (isDone) {
            const label = row.isFinalSize ? `size: ${row.answer}` : `apples: ${row.answer}`;
            top.insertAdjacentHTML("beforeend", `<span class="done-pill">${checkIconSvg()} ${label}</span>`);
            rowEl.appendChild(top);
          } else if (isActive) {
            rowEl.appendChild(top);
            const ctrls = document.createElement("div");
            ctrls.className = "script-row-controls";

            const stepper = createNumberStepper({
              id: "s2-active-input",
              labelHtml: `<span class="row-prompt">${row.prompt}:</span>`,
              value: s2.prediction,
              disabled: s2.running || s2.status === "wrong",
              statusClass: s2.status === "wrong" ? "is-wrong" : "",
              onChange: (v) => {
                s2.prediction = v;
                const btn = document.getElementById("s2-run-btn");
                if (btn) btn.disabled = v === "" || s2.running || s2.status === "wrong";
              },
              onEnter: runStep2Row
            });
            stepper.style.flex = "1 1 200px";
            ctrls.appendChild(stepper);

            const runBtn = document.createElement("button");
            runBtn.type = "button";
            runBtn.id = "s2-run-btn";
            runBtn.className = "btn btn-primary";
            runBtn.textContent = s2.running ? "Running..." : (row.isFinalSize ? "Check" : "Run line");
            if (s2.running) {
              runBtn.setAttribute("aria-disabled", "true");
            } else {
              runBtn.disabled = s2.prediction === "" || s2.status === "wrong";
            }
            runBtn.addEventListener("click", runStep2Row);
            ctrls.appendChild(runBtn);

            rowEl.appendChild(ctrls);
          } else {
            top.insertAdjacentHTML("beforeend", `<span class="row-prompt">${row.prompt}</span>`);
            rowEl.appendChild(top);
          }

          list.appendChild(rowEl);
        });

        scriptPanel.appendChild(list);
        cols.appendChild(scriptPanel);
        mainEl.appendChild(cols);

        if (s2.status === "wrong") {
          const fb = document.createElement("div");
          fb.className = "feedback feedback-wrong";
          fb.innerHTML = `<p class="feedback-text">${s2.wrongMessage}</p>`;
          const tryBtn = document.createElement("button");
          tryBtn.type = "button";
          tryBtn.id = "step2-try-btn";
          tryBtn.className = "btn btn-try";
          tryBtn.textContent = "Try again";
          tryBtn.addEventListener("click", () => {
            s2.counts = { ...(s2.prevCountsForRetry || s2.counts) };
            s2.prediction = "";
            s2.status = "idle";
            s2.wrongMessage = "";
            render();
            const inp = document.getElementById("s2-active-input");
            if (inp) inp.focus({ preventScroll: true });
          });
          fb.appendChild(tryBtn);
          mainEl.appendChild(fb);
        } else if (s2.status === "done") {
          const fb = document.createElement("div");
          fb.className = "feedback feedback-ok";
          fb.innerHTML = `<p class="feedback-text">Confirmed: apple dropped to 0 and left the bag, leaving 1 banana.</p>`;
          mainEl.appendChild(fb);
        }

        // Footer
        const footer = document.createElement("div");
        footer.className = "step-footer";
        const backBtn = document.createElement("button");
        backBtn.type = "button";
        backBtn.className = "btn btn-secondary";
        backBtn.textContent = "\u2190 Back";
        backBtn.addEventListener("click", () => goToStep(0));
        footer.appendChild(backBtn);

        const rightBtns = document.createElement("div");
        rightBtns.className = "footer-right";
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "step2-next-btn";
        nextBtn.className = "btn btn-active";
        nextBtn.textContent = "Next \u2192";
        nextBtn.disabled = state.maxUnlockedStep < 2;
        nextBtn.addEventListener("click", () => goToStep(2));
        rightBtns.appendChild(nextBtn);
        footer.appendChild(rightBtns);
        mainEl.appendChild(footer);
      }

      /* ---------------- STEP 3 ---------------- */
      function initSubStep(subIdx) {
        cancelPendingAnimations();
        const s3 = state.step3;
        s3.subIndex = subIdx;
        s3.changedKey = null;
        s3.ghostKeyActive = false;
        s3.choicePred = "";
        s3.sizePred = "";
        s3.containsPred = "";
        s3.running = false;
        s3.activeLines = [];
        s3.crashLine = -1;
        s3.lineTag = null;
        s3.getResult = null;
        s3.status = "idle";
        s3.wrongMessages = [];
        s3.showCrash = false;
        s3.showSideBySide = false;
        s3.showFixCode = false;

        if (subIdx === 0) {
          s3.counts = { apple: 3, banana: 1 };
        } else if (subIdx === 1) {
          s3.counts = { apple: 4, banana: 1 };
        } else if (subIdx === 2) {
          s3.counts = { apple: 4, banana: 1, kiwi: 1 };
        } else if (subIdx === 3) {
          // Retain live banana/kiwi from earlier substeps and set apple down to 1
          s3.counts = { apple: 1, banana: 1, kiwi: 1 };
        }
      }

      function resetStep3() {
        state.step3.completedSubs = { 0: false, 1: false, 2: false, 3: false };
        initSubStep(0);
        render();
        announce("Step 3 reset to 3a.");
      }

      function computeBuggy3dMap(baseCounts) {
        return { ...baseCounts, apple: (baseCounts.apple || 1) - 1 };
      }

      function updateStep3RunBtn() {
        const s3 = state.step3;
        const btn = document.getElementById("s3-run-btn");
        if (!btn) return;
        const locked = s3.running || s3.status === "revealed" || s3.status === "fixed" || s3.status === "wrong";
        const ready = s3.subIndex < 3
          ? s3.choicePred !== ""
          : (s3.sizePred !== "" && s3.containsPred !== "");
        btn.disabled = !ready || locked;
      }

      async function runStep3Action() {
        const s3 = state.step3;
        if (s3.running || s3.status === "revealed" || s3.status === "fixed" || s3.status === "wrong") return;
        if (s3.subIndex < 3) {
          if (s3.choicePred === "") return;
        } else {
          if (s3.sizePred === "") return;
          if (s3.containsPred === "") {
            const grpBtn = mainEl.querySelector('[data-group="s3d-contains"] [tabindex="0"]');
            if (grpBtn) grpBtn.focus();
            return;
          }
        }

        cancelPendingAnimations();
        const token = state.runToken;
        s3.running = true;
        s3.wrongMessages = [];
        s3.lineTag = null;
        s3.getResult = null;
        render();
        focusByIdNoScroll("s3-run-btn");

        if (s3.subIndex === 0) {
          // 3a: add(apple)
          s3.activeLines = [0];
          s3.getResult = { key: "apple", valueText: "3", isNull: false };
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(420, token))) return;

          s3.activeLines = [1];
          s3.lineTag = { line: 1, text: "false" };
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(400, token))) return;

          s3.activeLines = [2];
          s3.lineTag = null;
          s3.getResult = null;
          s3.counts = { ...s3.counts, apple: 4 };
          s3.changedKey = "apple";
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(380, token))) return;

          s3.running = false;
          if (s3.choicePred === "3") {
            s3.status = "revealed";
            s3.completedSubs[0] = true;
            render();
            focusByIdNoScroll("step3-next-btn");
            announce("Confirmed: counts.get(apple) returns 3, then put updates apple to 4 in both views.");
          } else {
            s3.status = "wrong";
            s3.wrongMessages = ["apple is already a key in the map with value 3, so counts.get(apple) returns 3."];
            render();
            focusByIdNoScroll("step3-try-btn");
            announce(s3.wrongMessages[0]);
          }
        } else if (s3.subIndex === 1) {
          // 3b: add(kiwi)
          s3.activeLines = [0];
          s3.getResult = { key: "kiwi", valueText: "null", isNull: true };
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(440, token))) return;

          s3.activeLines = [1];
          s3.lineTag = { line: 1, text: "true" };
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(400, token))) return;

          s3.activeLines = [1];
          s3.lineTag = null;
          s3.getResult = null;
          s3.counts = { ...s3.counts, kiwi: 1 };
          s3.changedKey = "kiwi";
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(380, token))) return;

          s3.running = false;
          if (s3.choicePred === "null") {
            s3.status = "revealed";
            s3.completedSubs[1] = true;
            render();
            focusByIdNoScroll("step3-next-btn");
            announce("Confirmed: counts.get(kiwi) returns null, so the if-branch puts kiwi = 1.");
          } else {
            s3.status = "wrong";
            s3.wrongMessages = ["kiwi is not in the map yet, so counts.get(kiwi) returns null."];
            render();
            focusByIdNoScroll("step3-try-btn");
            announce(s3.wrongMessages[0]);
          }
        } else if (s3.subIndex === 2) {
          // 3c: Spot the bug with grape
          s3.crashLine = 0;
          s3.getResult = { key: "grape", valueText: "null", isNull: true };
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(420, token))) return;

          s3.showCrash = true;
          s3.running = false;
          if (s3.choicePred === "crash") {
            s3.status = "revealed";
            s3.showSideBySide = true;
            s3.completedSubs[2] = true;
            render();
            focusByIdNoScroll("step3-next-btn");
            announce("Confirmed: NullPointerException. get(grape) is null, and null plus 1 is not a number.");
          } else {
            s3.status = "wrong";
            s3.wrongMessages = ["counts.get(grape) returns null, and Java crashes trying to compute null + 1."];
            render();
            focusByIdNoScroll("step3-try-btn");
            announce(s3.wrongMessages[0]);
          }
        } else if (s3.subIndex === 3) {
          // 3d: Back to zero (buggy subtract)
          const baseSnapshot = { ...s3.counts };
          const postBuggyMap = computeBuggy3dMap(baseSnapshot);
          const expectedSize = Object.keys(postBuggyMap).length;
          const expectedContains = Object.prototype.hasOwnProperty.call(postBuggyMap, "apple") ? "true" : "false";

          s3.activeLines = [0];
          s3.getResult = { key: "apple", valueText: String(baseSnapshot.apple || 1), isNull: false };
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(380, token))) return;

          s3.getResult = null;
          s3.counts = postBuggyMap;
          s3.ghostKeyActive = true;
          s3.changedKey = "apple";
          render();
          focusByIdNoScroll("s3-run-btn");
          if (!(await waitMs(360, token))) return;

          s3.running = false;

          const wrongs = [];
          if (parseInt(s3.sizePred, 10) !== expectedSize) {
            wrongs.push(`counts.size() is ${expectedSize}: apple = 0 is still a key in the map.`);
          }
          if (s3.containsPred !== expectedContains) {
            wrongs.push(`counts.containsKey(apple) is ${expectedContains}: putting 0 leaves the apple key in the map.`);
          }

          if (wrongs.length > 0) {
            s3.status = "wrong";
            s3.wrongMessages = wrongs;
            render();
            focusByIdNoScroll("step3-try-btn");
            announce(wrongs.join(" "));
          } else {
            s3.status = "revealed";
            s3.showFixCode = true;
            render();
            focusByIdNoScroll("s3-fix-btn");
            announce("Confirmed: the bag shows no apple, but the map keeps an apple = 0 ghost key.");
          }
        }
      }

      async function runStep3Fix() {
        const s3 = state.step3;
        if (s3.running || s3.subIndex !== 3 || s3.status !== "revealed") return;

        cancelPendingAnimations();
        const token = state.runToken;
        s3.running = true;
        // Restore apple: 1 briefly before showing the fixed removal
        s3.counts = { ...s3.counts, apple: 1 };
        s3.ghostKeyActive = false;
        s3.changedKey = null;
        s3.activeLines = [0];
        s3.lineTag = null;
        s3.getResult = { key: "apple", valueText: "1", isNull: false };
        render();
        focusByIdNoScroll("s3-fix-btn");
        if (!(await waitMs(380, token))) return;

        s3.activeLines = [1];
        s3.lineTag = { line: 1, text: "false" };
        render();
        focusByIdNoScroll("s3-fix-btn");
        if (!(await waitMs(380, token))) return;

        s3.activeLines = [2];
        s3.lineTag = { line: 2, text: "true" };
        render();
        focusByIdNoScroll("s3-fix-btn");
        if (!(await waitMs(380, token))) return;

        const fixedMap = { ...s3.counts };
        delete fixedMap.apple;
        s3.counts = fixedMap;
        s3.lineTag = null;
        s3.getResult = null;
        s3.changedKey = null;
        s3.running = false;
        s3.status = "fixed";
        s3.completedSubs[3] = true;
        if (state.maxUnlockedStep < 3) state.maxUnlockedStep = 3;
        render();
        focusByIdNoScroll("step3-next-btn");
        announce("Fixed: counts.remove(apple) removes the key completely so Bag and Map agree. Done is unlocked.");
      }

      function renderStep3Code(lines, activeLines, crashLine, argsLabel, lineTag) {
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";

        if (argsLabel) {
          const args = document.createElement("p");
          args.className = "code-args";
          args.textContent = argsLabel;
          wrap.appendChild(args);
        }

        const pre = document.createElement("pre");
        pre.className = "code-box";
        lines.forEach((txt, i) => {
          const span = document.createElement("span");
          let cls = "code-line";
          if (crashLine === i) cls += " is-crash";
          else if (activeLines.includes(i)) cls += " is-running";
          span.className = cls;
          span.textContent = txt;
          if (lineTag && lineTag.line === i) {
            const tag = document.createElement("span");
            tag.className = "line-tag";
            tag.textContent = lineTag.text;
            span.appendChild(tag);
          }
          pre.appendChild(span);
        });
        wrap.appendChild(pre);
        return wrap;
      }

      function renderStep3Views(parent) {
        const s3 = state.step3;
        const cols = document.createElement("div");
        cols.className = "two-col";

        // Left: Bag (Counts view)
        const bagPanel = document.createElement("section");
        bagPanel.className = "panel";
        bagPanel.setAttribute("aria-label", "Bag counts view");
        const bagEntries = Object.entries(s3.counts).filter(([, v]) => v > 0);
        const totalBag = bagEntries.reduce((acc, [, v]) => acc + v, 0);
        bagPanel.innerHTML = `
          <div class="panel-head">
            <h3 class="panel-title">Bag (Counts)</h3>
            <span class="count-pill">size: ${totalBag}</span>
          </div>
        `;
        const basket = document.createElement("div");
        basket.className = "basket-wrap";
        if (bagEntries.length === 0) {
          basket.innerHTML = `<span class="empty-label">Empty basket</span>`;
        } else {
          bagEntries.forEach(([k, v]) => {
            basket.insertAdjacentHTML(
              "beforeend",
              renderFruitToken(k, {
                count: v,
                extraClass: s3.changedKey === k ? "pop-in" : ""
              })
            );
          });
        }
        bagPanel.appendChild(basket);
        cols.appendChild(bagPanel);

        // Right: Map<String,Integer> counts
        const mapPanel = document.createElement("section");
        mapPanel.className = "panel";
        mapPanel.setAttribute("aria-label", "Map key-count table");
        const mapEntries = Object.entries(s3.counts);
        mapPanel.innerHTML = `
          <div class="panel-head">
            <h3 class="panel-title"><code>Map&lt;String,Integer&gt; counts</code></h3>
            <span class="count-pill">size: ${mapEntries.length}</span>
          </div>
        `;

        const table = document.createElement("table");
        table.className = "map-table";
        table.innerHTML = `<thead><tr><th scope="col">key</th><th scope="col">count</th></tr></thead>`;
        const tbody = document.createElement("tbody");

        mapEntries.forEach(([k, v]) => {
          const tr = document.createElement("tr");
          const isGhost = s3.ghostKeyActive && k === "apple" && v === 0;
          if (isGhost) tr.className = "map-row-ghost";
          else if (s3.changedKey === k) tr.className = "map-row-changed";

          const extraChip = isGhost ? `<span class="ghost-tag">ghost key</span>` : "";
          tr.innerHTML = `<td>${k}${extraChip}</td><td>${v}</td>`;
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        mapPanel.appendChild(table);

        if (s3.getResult) {
          const strip = document.createElement("div");
          strip.className = "get-result-strip";
          const chipCls = s3.getResult.isNull ? "null-chip" : "val-chip";
          strip.innerHTML = `<code>counts.get(${s3.getResult.key}) \u2192</code> <span class="${chipCls}">${s3.getResult.valueText}</span>`;
          mapPanel.appendChild(strip);
        }

        cols.appendChild(mapPanel);
        parent.appendChild(cols);
      }

      function renderStep3() {
        const s3 = state.step3;

        const header = document.createElement("div");
        header.className = "step-header";
        header.innerHTML = `<h2 class="step-title" tabindex="-1">Two views of one bag</h2>`;
        const resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.className = "btn btn-secondary btn-small";
        resetBtn.textContent = "Reset";
        resetBtn.addEventListener("click", resetStep3);
        header.appendChild(resetBtn);
        mainEl.appendChild(header);

        // Sub-step pills
        const subBar = document.createElement("div");
        subBar.className = "substep-bar";
        const subTitles = [
          "3a Add existing",
          "3b Add new",
          "3c Spot the bug",
          "3d Back to zero"
        ];
        SUBSTEPS.forEach((_, idx) => {
          const pill = document.createElement("span");
          let cls = "sub-pill";
          if (idx === s3.subIndex) cls += " is-active";
          else if (s3.completedSubs[idx]) cls += " is-done";
          pill.className = cls;
          pill.innerHTML = `${s3.completedSubs[idx] ? checkIconSvg() : ""}<span>${subTitles[idx]}</span>`;
          subBar.appendChild(pill);
        });
        mainEl.appendChild(subBar);

        const subHeading = document.createElement("p");
        subHeading.className = "instruction-line";
        if (s3.subIndex === 0) subHeading.textContent = "3a \u2014 Add a fruit that is already there";
        else if (s3.subIndex === 1) subHeading.textContent = "3b \u2014 Add a brand-new fruit";
        else if (s3.subIndex === 2) subHeading.textContent = "3c \u2014 Spot the bug";
        else subHeading.textContent = "3d \u2014 Back to zero (Now apple is down to 1.)";
        mainEl.appendChild(subHeading);

        // Linked Bag + Map panels
        renderStep3Views(mainEl);

        const SAFE_ADD_LINES = [
          "Integer c = counts.get(x);",
          "if (c == null) counts.put(x, 1);",
          "else counts.put(x, c + 1);"
        ];

        const argsLabels = ["x = apple", "x = kiwi", "x = grape", "x = apple, i = 1"];

        // Code box
        if (s3.subIndex === 0 || s3.subIndex === 1) {
          mainEl.appendChild(renderStep3Code(SAFE_ADD_LINES, s3.activeLines, -1, argsLabels[s3.subIndex], s3.lineTag));
        } else if (s3.subIndex === 2) {
          mainEl.appendChild(renderStep3Code(["counts.put(x, counts.get(x) + 1);"], s3.activeLines, s3.crashLine, argsLabels[2], null));
        } else {
          if (!s3.showFixCode) {
            mainEl.appendChild(renderStep3Code(["counts.put(x, counts.get(x) - i);"], s3.activeLines, -1, argsLabels[3], null));
          }
        }

        // Crash panel & side-by-side in 3c
        if (s3.subIndex === 2 && s3.showCrash) {
          const crash = document.createElement("div");
          crash.className = "crash-panel";
          crash.textContent = "NullPointerException: get(grape) is null, and null + 1 is not a number.";
          mainEl.appendChild(crash);
        }

        if (s3.subIndex === 2 && s3.showSideBySide) {
          const comp = document.createElement("div");
          comp.className = "two-col";

          const bugCol = document.createElement("div");
          bugCol.className = "panel";
          bugCol.innerHTML = `<h3 class="panel-title">Buggy</h3>`;
          bugCol.appendChild(renderStep3Code(["counts.put(x, counts.get(x) + 1);"], [], 0, null, null));

          const fixCol = document.createElement("div");
          fixCol.className = "panel";
          fixCol.innerHTML = `<h3 class="panel-title">Correct</h3>`;
          fixCol.appendChild(renderStep3Code(SAFE_ADD_LINES, [], -1, null, null));

          comp.appendChild(bugCol);
          comp.appendChild(fixCol);
          mainEl.appendChild(comp);
        }

        // 3b note
        if (s3.subIndex === 1 && s3.status === "revealed") {
          const note = document.createElement("div");
          note.className = "feedback feedback-note";
          note.innerHTML = `<p class="feedback-text">Same as on the Map ADT page: get returns null for a missing key.</p>`;
          mainEl.appendChild(note);
        }

        // 3d fix code
        if (s3.subIndex === 3 && s3.showFixCode) {
          const fixNote = document.createElement("div");
          fixNote.className = "feedback feedback-note";
          fixNote.innerHTML = `<p class="feedback-text">The bag has no apple, but the map kept apple = 0 as a ghost key. Fix remove(x, i) below:</p>`;
          mainEl.appendChild(fixNote);

          const FIX_LINES = [
            "Integer c = counts.get(x);",
            "if (c == null) return;",
            "if (c <= i) counts.remove(x);",
            "else counts.put(x, c - i);"
          ];
          const fixActiveLines = (s3.running || s3.status === "fixed") ? s3.activeLines : [];
          mainEl.appendChild(renderStep3Code(FIX_LINES, fixActiveLines, -1, argsLabels[3], s3.lineTag));

          const remNote = document.createElement("p");
          remNote.className = "muted-note";
          remNote.innerHTML = `And <code>remove(x)</code> is simply: <code>counts.remove(x);</code>`;
          mainEl.appendChild(remNote);
        }

        // Prediction controls per sub-step
        const locked = s3.running || s3.status === "revealed" || s3.status === "fixed" || s3.status === "wrong";

        if (s3.subIndex === 0) {
          mainEl.appendChild(createChoiceGroup({
            groupId: "s3a-choice",
            labelText: "What does counts.get(apple) return?",
            options: ["3", "null", "0"],
            selectedValue: s3.choicePred,
            disabled: locked,
            onSelect: (opt) => {
              s3.choicePred = opt;
              updateStep3RunBtn();
            }
          }));
        } else if (s3.subIndex === 1) {
          mainEl.appendChild(createChoiceGroup({
            groupId: "s3b-choice",
            labelText: "What does counts.get(kiwi) return?",
            options: ["1", "null", "0"],
            selectedValue: s3.choicePred,
            disabled: locked,
            onSelect: (opt) => {
              s3.choicePred = opt;
              updateStep3RunBtn();
            }
          }));
        } else if (s3.subIndex === 2) {
          mainEl.appendChild(createChoiceGroup({
            groupId: "s3c-choice",
            labelText: "Run this with grape. What happens?",
            options: ["grape \u00d71", "grape \u00d70", "crash"],
            selectedValue: s3.choicePred,
            disabled: locked,
            onSelect: (opt) => {
              s3.choicePred = opt;
              updateStep3RunBtn();
            }
          }));
        } else if (s3.subIndex === 3 && !s3.showFixCode) {
          const grid = document.createElement("div");
          grid.className = "predict-grid";
          grid.appendChild(createNumberStepper({
            id: "s3d-size-pred",
            labelHtml: "<code>counts.size()?</code>",
            value: s3.sizePred,
            disabled: locked,
            onChange: (v) => {
              s3.sizePred = v;
              updateStep3RunBtn();
            },
            onEnter: runStep3Action
          }));
          grid.appendChild(createChoiceGroup({
            groupId: "s3d-contains",
            labelText: "counts.containsKey(apple)?",
            options: ["true", "false"],
            selectedValue: s3.containsPred,
            disabled: locked,
            onSelect: (opt) => {
              s3.containsPred = opt;
              updateStep3RunBtn();
            }
          }));
          mainEl.appendChild(grid);
        }

        // Action button
        const actRow = document.createElement("div");
        actRow.className = "action-row";

        if (s3.subIndex < 3 || !s3.showFixCode) {
          const btnLabels = ["add(apple)", "add(kiwi)", "Run add(grape)", "Run remove(apple, 1)"];
          const ready = s3.subIndex < 3
            ? s3.choicePred !== ""
            : (s3.sizePred !== "" && s3.containsPred !== "");

          const runBtn = document.createElement("button");
          runBtn.type = "button";
          runBtn.id = "s3-run-btn";
          runBtn.className = "btn btn-primary";
          runBtn.textContent = s3.running ? "Running..." : btnLabels[s3.subIndex];
          if (s3.running) {
            runBtn.setAttribute("aria-disabled", "true");
          } else {
            runBtn.disabled = !ready || locked;
          }
          runBtn.addEventListener("click", runStep3Action);
          actRow.appendChild(runBtn);
        } else if (s3.subIndex === 3 && s3.status === "revealed") {
          const fixBtn = document.createElement("button");
          fixBtn.type = "button";
          fixBtn.id = "s3-fix-btn";
          fixBtn.className = "btn btn-primary";
          fixBtn.textContent = s3.running ? "Running..." : "Re-run with fix: remove(apple, 1)";
          if (s3.running) {
            fixBtn.setAttribute("aria-disabled", "true");
          }
          fixBtn.addEventListener("click", runStep3Fix);
          actRow.appendChild(fixBtn);
        }

        if (actRow.children.length > 0) mainEl.appendChild(actRow);

        // Feedback
        if (s3.status === "wrong") {
          const fb = document.createElement("div");
          fb.className = "feedback feedback-wrong";
          const ul = document.createElement("ul");
          ul.className = "feedback-list";
          s3.wrongMessages.forEach((m) => {
            const li = document.createElement("li");
            li.textContent = m;
            ul.appendChild(li);
          });
          fb.appendChild(ul);

          const tryBtn = document.createElement("button");
          tryBtn.type = "button";
          tryBtn.id = "step3-try-btn";
          tryBtn.className = "btn btn-try";
          tryBtn.textContent = "Try again";
          tryBtn.addEventListener("click", () => {
            initSubStep(s3.subIndex);
            render();
            const target = document.getElementById("s3d-size-pred") || mainEl.querySelector('[data-group] [tabindex="0"]');
            if (target) target.focus({ preventScroll: true });
          });
          fb.appendChild(tryBtn);
          mainEl.appendChild(fb);
        } else if (s3.status === "revealed" && s3.subIndex < 3) {
          const fb = document.createElement("div");
          fb.className = "feedback feedback-ok";
          const msgs = [
            "Confirmed: apple increased from 3 to 4 in both Bag and Map.",
            "Confirmed: null triggered the if-branch and added kiwi = 1 to both views.",
            "Confirmed: checking for null prevents the crash."
          ];
          fb.innerHTML = `<p class="feedback-text">${msgs[s3.subIndex]}</p>`;
          mainEl.appendChild(fb);
        } else if (s3.status === "fixed") {
          const fb = document.createElement("div");
          fb.className = "feedback feedback-ok";
          fb.innerHTML = `<p class="feedback-text">Confirmed: counts.remove(apple) removes the zero key, so Bag and Map agree.</p>`;
          mainEl.appendChild(fb);
        }

        // Footer
        const footer = document.createElement("div");
        footer.className = "step-footer";

        const backBtn = document.createElement("button");
        backBtn.type = "button";
        backBtn.className = "btn btn-secondary";
        backBtn.textContent = s3.subIndex === 0 ? "\u2190 Back" : `\u2190 ${SUBSTEPS[s3.subIndex - 1]}`;
        backBtn.addEventListener("click", () => {
          if (s3.subIndex === 0) {
            goToStep(1);
          } else {
            initSubStep(s3.subIndex - 1);
            render();
            focusStepTitleAndScroll();
            announce(`Moved back to ${SUBSTEPS[s3.subIndex]}.`);
          }
        });
        footer.appendChild(backBtn);

        const rightBtns = document.createElement("div");
        rightBtns.className = "footer-right";
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.id = "step3-next-btn";
        nextBtn.className = "btn btn-active";
        if (s3.subIndex < 3) {
          nextBtn.textContent = `Next: ${SUBSTEPS[s3.subIndex + 1]} \u2192`;
          nextBtn.disabled = s3.status !== "revealed";
          nextBtn.addEventListener("click", () => {
            initSubStep(s3.subIndex + 1);
            render();
            focusStepTitleAndScroll();
            announce(`Starting ${SUBSTEPS[s3.subIndex]}.`);
          });
        } else {
          nextBtn.textContent = "Next: Done \u2192";
          nextBtn.disabled = state.maxUnlockedStep < 3;
          nextBtn.addEventListener("click", () => goToStep(3));
        }
        rightBtns.appendChild(nextBtn);
        footer.appendChild(rightBtns);
        mainEl.appendChild(footer);
      }

      /* ---------------- DONE CARD ---------------- */
      function renderDone() {
        const header = document.createElement("div");
        header.className = "step-header";
        header.innerHTML = `<h2 class="step-title" tabindex="-1">Java has no Bag class</h2>`;
        mainEl.appendChild(header);

        const list = document.createElement("div");
        list.className = "summary-list";
        list.innerHTML = `
          <div class="summary-row">
            <strong>1. Count map:</strong> <code>Map&lt;E,Integer&gt;</code>. Works when equal elements are truly identical (no need to keep separate objects).
          </div>
          <div class="summary-row">
            <strong>2. Library:</strong> <code>org.apache.commons.collections4.Bag</code>; its <code>remove(x)</code> removes all copies, like our bag.
          </div>
          <div class="summary-row">
            <strong>3. Set with a suitable <code>compareTo()</code>:</strong> equal elements stored next to each other in a fixed order; the <code>...All()</code> operations won't work, though.
          </div>
        `;
        mainEl.appendChild(list);

        const closing = document.createElement("div");
        closing.className = "closing-banner";
        closing.textContent = "Duplicates allowed? Use a bag. Only counting? A map of counts is enough.";
        mainEl.appendChild(closing);

        const footer = document.createElement("div");
        footer.className = "step-footer";
        const backBtn = document.createElement("button");
        backBtn.type = "button";
        backBtn.className = "btn btn-secondary";
        backBtn.textContent = "\u2190 Back";
        backBtn.addEventListener("click", () => goToStep(2));
        footer.appendChild(backBtn);

        const rightBtns = document.createElement("div");
        rightBtns.className = "footer-right";
        const restartBtn = document.createElement("button");
        restartBtn.type = "button";
        restartBtn.className = "btn btn-active";
        restartBtn.textContent = "Start from Step 1";
        restartBtn.addEventListener("click", () => goToStep(0));
        rightBtns.appendChild(restartBtn);
        footer.appendChild(rightBtns);
        mainEl.appendChild(footer);
      }

      function render() {
        renderStepper();
        mainEl.innerHTML = "";
        if (state.currentStep === 0) renderStep1();
        else if (state.currentStep === 1) renderStep2();
        else if (state.currentStep === 2) renderStep3();
        else renderDone();
      }

      render();
    })();
  </script>
</body>
</html>
