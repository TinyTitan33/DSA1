        }
        return {
          text: 'Current state: p is INVALID because its node was removed without saving r first. Click First (L.first()), Last (L.last()), or Undo last step to recover.',
          warn: true
        };
      }
      if (liveCount === 0) {
        return {
          text: 'Current state: List is empty (0 live nodes, p = L.EOL). Click Insert (L.insert(p, ...)) to add a first node, or Undo last step.',
          warn: false
        };
      }
      if (cs.p === 'EOL') {
        return {
          text: 'Current state: p is on sentinel L.EOL (no data element here). Insert appends at the end; First and Last jump back onto data nodes.',
          warn: true
        };
      }
      const pLbl = labelForTarget(cs, cs.p);
      const rNote = (cs.r && cs.r !== 'INVALID') ? ` (r points to ${labelForTarget(cs, cs.r)})` : '';
      return {
        text: `Current state: p is on ${pLbl}${rNote}. Move p along links, hover Insert to preview the +slot before p, or run 1. Save next → 2. Remove → 3. Restore.`,
        warn: false
      };
    }

    function renderGoalAndState() {
      const def = getActiveDef();
      el.stageGoal.textContent = def.goal;
    }

    function renderCodeAndPrompt() {
      const def = getActiveDef();
      const st = getActiveStage();
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      const isSandbox = def.id === 'sandbox';

      el.lessonGrid.classList.toggle('hidden', isSandbox);
      el.tryBar.classList.toggle('hidden', !isSandbox);
      el.sandboxPanel.classList.toggle('hidden', !isSandbox);
      el.trail.classList.toggle('hidden', !isSandbox || cs.trail.length === 0);

      if (isSandbox) {
        el.tipTag.textContent = `Try ${cs.ideaIndex + 1}/${SANDBOX_IDEAS.length}`;
        el.tryMsg.textContent = SANDBOX_IDEAS[cs.ideaIndex];
        const nextLabel = LETTERS[cs.letterCursor % LETTERS.length];
        el.insertBtn.innerHTML = `Insert <span class="op-code">L.insert(p, ${nextLabel})</span>`;
        el.restoreBtn.disabled = !cs.r;
        el.restoreBtn.classList.toggle('ready-highlight', !!cs.r && cs.p === 'INVALID');
        el.undoBtn.disabled = cs.history.length === 0;
        const sg = getSandboxGuide(cs);
        el.sandboxGuide.textContent = sg.text;
        el.sandboxGuide.classList.toggle('warn', sg.warn);
        updateSandboxBoundaryStyles(cs);
        renderTrail(cs);
        return;
      }

      const step = cDef.steps[cs.stepIndex];

      // Code lines with highlight & arrow
      el.codeLines.innerHTML = '';
      step.codeLines.forEach((line, idx) => {
        const row = document.createElement('div');
        const isCrash = !cs.awaiting && Array.isArray(step.crashLines) && step.crashLines.includes(idx);
        const isHl = !isCrash && step.hl.includes(idx);
        row.className = 'code-line' + (isCrash ? ' crash' : isHl ? ' hl' : '');
        if (isCrash) row.dataset.crash = 'true';
        if (isHl || isCrash) row.setAttribute('aria-current', 'step');

        const num = document.createElement('span');
        num.className = 'line-num';
        num.textContent = String(idx + 1);

        const arrow = document.createElement('span');
        arrow.className = 'line-arrow';
        arrow.textContent = isCrash ? '✕' : isHl ? '→' : ' ';

        const code = document.createElement('span');
        code.textContent = line;

        row.appendChild(num);
        row.appendChild(arrow);
        row.appendChild(code);
        el.codeLines.appendChild(row);
      });

      // Loop variables watch bar
      if (cs.sum !== null) {
        el.watchBar.classList.remove('hidden');
        el.watchBar.innerHTML = '';
        [
          `sum = ${cs.sum}`,
          `iterations = ${cs.iters}`,
          `p = ${labelForTarget(cs, cs.p)}`
        ].forEach(txt => {
          const span = document.createElement('span');
          span.className = 'watch-chip';
          span.textContent = txt;
          el.watchBar.appendChild(span);
        });
      } else {
        el.watchBar.classList.add('hidden');
      }

      // Prompt card
      el.stepBadge.textContent = `Step ${cs.stepIndex + 1} of ${cDef.steps.length}`;
      const stepRes = cs.results[cs.stepIndex];
      if (stepRes === 'first-try') {
        el.attemptPill.textContent = 'Solved ✓';
        el.attemptPill.className = 'attempt-pill';
      } else if (stepRes === 'assisted') {
        el.attemptPill.textContent = 'Solved (guided)';
        el.attemptPill.className = 'attempt-pill used';
      } else if (cs.hintsUsed > 0 || cs.attempts > 0) {
        el.attemptPill.textContent = cs.hintsUsed ? 'Hint viewed' : `Attempts: ${cs.attempts}`;
        el.attemptPill.className = 'attempt-pill used';
      } else {
        el.attemptPill.textContent = '';
        el.attemptPill.className = 'attempt-pill';
      }

      el.questionText.textContent = step.prompt;

      // MCQ options when kind === 'mcq' or 'dual'
      if (step.kind === 'mcq' || step.kind === 'dual') {
        el.mcqRow.classList.remove('hidden');
        el.mcqRow.innerHTML = '';
        if (step.valLabel) {
          const lbl = document.createElement('span');
          lbl.style.fontSize = '0.8rem';
          lbl.style.fontWeight = '700';
          lbl.style.alignSelf = 'center';
          lbl.textContent = step.valLabel;
          el.mcqRow.appendChild(lbl);
        }
        const choices = (cs.choiceOrders && cs.choiceOrders[cs.stepIndex]) || step.choices;
        choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isCorrectChoice = !cs.awaiting && choice === step.targetVal;
          btn.className = 'mcq-btn' + (isCorrectChoice ? ' correct-choice' : '');
          if (isCorrectChoice) btn.dataset.correct = 'true';
          btn.textContent = choice;
          btn.disabled = !cs.awaiting;
          btn.setAttribute('aria-pressed', cs.pendingVal === choice ? 'true' : 'false');
          btn.addEventListener('click', () => {
            if (!cs.awaiting) return;
            if (step.kind === 'mcq') {
              submitMcqPrediction(choice);
            } else {
              cs.pendingVal = choice;
              renderCodeAndPrompt();
            }
          });
          el.mcqRow.appendChild(btn);
        });
      } else {
        el.mcqRow.classList.add('hidden');
        el.mcqRow.innerHTML = '';
      }

      // Action buttons
      const showCheck = cs.awaiting && step.kind === 'dual';
      el.checkBtn.classList.toggle('hidden', !showCheck);
      el.checkBtn.disabled = !(cs.pendingVal !== null && cs.pendingNode !== null);
      el.hintBtn.classList.toggle('hidden', !cs.awaiting);
      el.revealBtn.classList.toggle('hidden', !cs.awaiting);

      const hasNextStep = !cs.awaiting && cs.stepIndex + 1 < cDef.steps.length;
      el.nextStepBtn.classList.toggle('hidden', !hasNextStep);
      el.actionGuide.textContent = getActionGuideText(def, st, cDef, cs, step);
    }

    function updateSandboxBoundaryStyles(cs) {
      const liveNodes = cs.nodes.filter(n => !n.ghost);
      const liveIdx = liveNodes.findIndex(n => n.id === cs.p);
      const isInvalid = cs.p === 'INVALID';
      const isEol = cs.p === 'EOL';
      const atFirst = liveIdx === 0;

      const mapBoundary = {
        first: false,
        prev: isInvalid || isEol || atFirst,
        next: isInvalid || isEol,
        last: false,
        read: isInvalid || isEol,
        insert: isInvalid,
        save: isInvalid || isEol,
        remove: isInvalid || isEol,
        restore: !cs.r
      };

      document.querySelectorAll('.op-btn[data-op]').forEach(btn => {
        btn.classList.toggle('boundary', !!mapBoundary[btn.dataset.op]);
      });
    }

    function renderTrail(cs) {
      if (cs.trail.length === 0) {
        el.trail.innerHTML = '';
        return;
      }
      el.trail.innerHTML = '<strong>History:</strong>';
      cs.trail.slice(-8).forEach(entry => {
        const chip = document.createElement('span');
        chip.className = 'trail-chip';
        chip.textContent = entry;
        el.trail.appendChild(chip);
      });
    }

    function buildNodeAriaLabel(cs, id, baseLabel, opts = {}) {
      const notes = [];
      if (opts.ghost) notes.push('removed node, neighbors relinked');
      if (opts.isNew) notes.push('newly inserted');
      if (cs.p === id) notes.push('pointer p here');
      if (cs.q === id) notes.push('pointer q here');
      if (cs.r === id) notes.push('saved pointer r here');
      return notes.length ? `${baseLabel} (${notes.join(', ')})` : baseLabel;
    }

    function renderNodes() {
      const def = getActiveDef();
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      const step = cDef.steps[cs.stepIndex];
      const nodesInteractive = def.id !== 'sandbox' && cs.awaiting && (step.kind === 'node' || step.kind === 'dual');

      el.nodesRow.innerHTML = '';

      cs.nodes.forEach(node => {
        const isGhost = !!node.ghost;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'node-box';
        btn.dataset.id = node.id;
        if (isGhost) btn.dataset.ghost = 'true';

        const lblSpan = document.createElement('span');
        if (isGhost) lblSpan.className = 'ghost-label';
        lblSpan.textContent = node.label;
        btn.appendChild(lblSpan);

        const baseAria = isGhost ? `Removed node ${node.label}` : `Node ${node.label}`;
        btn.setAttribute('aria-label', buildNodeAriaLabel(cs, node.id, baseAria, { ghost: isGhost, isNew: node.isNew }));
        btn.disabled = isGhost || !nodesInteractive;

        if (isGhost) {
          btn.classList.add('ghost');
          const rBadge = document.createElement('span');
          rBadge.className = 'removed-badge';
          rBadge.textContent = 'removed';
          btn.appendChild(rBadge);
        } else {
          if (nodesInteractive) btn.classList.add('clickable');
          if (cs.pendingNode === node.id) btn.classList.add('selected-node');
          if (cs.p === node.id) btn.classList.add('active-p');
          if (cs.q === node.id) btn.classList.add('active-q');
          if (cs.r === node.id) btn.classList.add('active-r');
        }

        if (node.isNew && !isGhost) {
          const badge = document.createElement('span');
          badge.className = 'new-badge';
          badge.textContent = 'new';
          btn.appendChild(badge);
        }

        if (nodesInteractive && !isGhost) {
          btn.addEventListener('click', () => handleNodeClick(node.id, btn));
        }

        el.nodesRow.appendChild(btn);
      });

      const eolBtn = document.createElement('button');
      eolBtn.type = 'button';
      eolBtn.className = 'node-box eol';
      eolBtn.dataset.id = 'EOL';
      eolBtn.textContent = 'L.EOL';
      eolBtn.setAttribute('aria-label', buildNodeAriaLabel(cs, 'EOL', 'L.EOL end of list sentinel'));
      eolBtn.disabled = !nodesInteractive;

      if (nodesInteractive) {
        eolBtn.classList.add('clickable');
        eolBtn.addEventListener('click', () => handleNodeClick('EOL', eolBtn));
      }
      if (cs.pendingNode === 'EOL') eolBtn.classList.add('selected-node');
      if (cs.p === 'EOL') eolBtn.classList.add('active-p');

      el.nodesRow.appendChild(eolBtn);
    }

    function positionBadge(ptrEl, targetId, offsetPx) {
      const wrapRect = el.canvasWrap.getBoundingClientRect();
      const boxes = Array.from(el.nodesRow.querySelectorAll('.node-box'));
      const box = boxes.find(b => b.dataset.id === targetId && b.dataset.ghost !== 'true');
      if (box) {
        const r = box.getBoundingClientRect();
        const cx = (r.left + r.right) / 2 - wrapRect.left;
        ptrEl.style.left = (cx + offsetPx) + 'px';
        ptrEl.style.opacity = '1';
      } else {
        ptrEl.style.opacity = '0';
      }
    }

    function layoutArrowsAndPointers() {
      const cs = getActiveCaseState();
      const wrapRect = el.canvasWrap.getBoundingClientRect();
      const boxes = Array.from(el.nodesRow.querySelectorAll('.node-box'));
      const liveBoxes = boxes.filter(b => b.dataset.ghost !== 'true');

      let svgHtml = '';
      for (let i = 0; i < liveBoxes.length - 1; i++) {
        const b1 = liveBoxes[i];
        const b2 = liveBoxes[i + 1];
        const idx1 = boxes.indexOf(b1);
        const idx2 = boxes.indexOf(b2);
        const r1 = b1.getBoundingClientRect();
        const r2 = b2.getBoundingClientRect();

        if (idx2 === idx1 + 1) {
          const x1 = r1.right - wrapRect.left + 4;
          const x2 = r2.left - wrapRect.left - 4;
          const y = (r1.top + r1.bottom) / 2 - wrapRect.top;

          if (x2 > x1 + 6) {
            const yf = y - 5;
            svgHtml += `<line x1="${x1}" y1="${yf}" x2="${x2 - 5}" y2="${yf}" stroke="#5c574f" stroke-width="1.7" stroke-linecap="round"/>`;
            svgHtml += `<path d="M${x2 - 6} ${yf - 3.5} L${x2} ${yf} L${x2 - 6} ${yf + 3.5}" fill="none" stroke="#5c574f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;

            const yb = y + 5;
            svgHtml += `<line x1="${x2}" y1="${yb}" x2="${x1 + 5}" y2="${yb}" stroke="#9c9488" stroke-width="1.5" stroke-linecap="round"/>`;
            svgHtml += `<path d="M${x1 + 6} ${yb - 3.5} L${x1} ${yb} L${x1 + 6} ${yb + 3.5}" fill="none" stroke="#9c9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
          }
        } else {
          // Curved relink bypass underneath ghosted removed node(s)
          const ybTop = r1.bottom - wrapRect.top + 3;
          const sx1 = r1.right - wrapRect.left - 10;
          const ex1 = r2.left - wrapRect.left + 10;
          svgHtml += `<path d="M${sx1} ${ybTop} C${sx1} ${ybTop + 26}, ${ex1} ${ybTop + 26}, ${ex1} ${ybTop + 2}" fill="none" stroke="#5c574f" stroke-width="1.7" stroke-linecap="round"/>`;
          svgHtml += `<path d="M${ex1 - 4} ${ybTop + 8} L${ex1} ${ybTop + 1} L${ex1 + 4} ${ybTop + 8}" fill="none" stroke="#5c574f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;

          const sx2 = r2.left - wrapRect.left + 22;
          const ex2 = r1.right - wrapRect.left - 22;
          svgHtml += `<path d="M${sx2} ${ybTop} C${sx2} ${ybTop + 40}, ${ex2} ${ybTop + 40}, ${ex2} ${ybTop + 2}" fill="none" stroke="#9c9488" stroke-width="1.5" stroke-linecap="round"/>`;
          svgHtml += `<path d="M${ex2 - 4} ${ybTop + 8} L${ex2} ${ybTop + 1} L${ex2 + 4} ${ybTop + 8}" fill="none" stroke="#9c9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
        }
      }
      el.linksSvg.innerHTML = svgHtml;

      // Status pill for special p states and crash warnings
      const pLabel = el.ptrP.querySelector('.ptr-label');
      const pSvg = el.ptrP.querySelector('svg');
      if (cs.p === 'INVALID' || cs.p === 'HIDDEN' || cs.p === 'UNSET') {
        el.ptrStatus.classList.remove('hidden', 'crash');
        el.ptrStatus.classList.toggle('invalid', cs.p === 'INVALID');
        el.ptrStatus.textContent = cs.pBadge || (cs.p === 'INVALID' ? 'p = INVALID (removed)' : 'p = ?');
        el.ptrP.style.opacity = '0';
        if (pLabel) { pLabel.classList.remove('crash'); pLabel.textContent = 'p'; }
        if (pSvg) pSvg.style.color = '#185a4f';
      } else {
        if (cs.pCrash) {
          el.ptrStatus.classList.remove('hidden', 'invalid');
          el.ptrStatus.classList.add('crash');
          el.ptrStatus.textContent = cs.pBadge || 'CRASH: p.next() called on L.EOL!';
          if (pLabel) { pLabel.classList.add('crash'); pLabel.textContent = 'p ✕ crash'; }
          if (pSvg) pSvg.style.color = '#a12828';
        } else {
          el.ptrStatus.classList.add('hidden');
          el.ptrStatus.classList.remove('invalid', 'crash');
          if (pLabel) { pLabel.classList.remove('crash'); pLabel.textContent = 'p'; }
          if (pSvg) pSvg.style.color = '#185a4f';
        }
        const pOverlapR = cs.r && cs.r === cs.p ? -18 : 0;
        const pOverlapQ = cs.q && cs.q === cs.p ? -18 : 0;
        positionBadge(el.ptrP, cs.p, pOverlapR || pOverlapQ);
      }

      const qOffset = (cs.p && cs.p === cs.q) ? 18 : 0;
      positionBadge(el.ptrQ, cs.q, qOffset);

      const rOffset = (cs.p && cs.p === cs.r) ? 18 : 0;
      positionBadge(el.ptrR, cs.r, rOffset);
    }

    function renderFeedbackBar() {
      const def = getActiveDef();
      const st = getActiveStage();
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();

      el.feedbackMsg.textContent = cs.feedbackText;
      el.feedback.className = 'feedback' + (
        cs.feedbackTone === 'ok' ? ' ok'
        : cs.feedbackTone === 'warn' ? ' warn'
        : cs.feedbackTone === 'err' ? ' err'
        : ''
      );

      if (cs.ruleText) {
        el.ruleCallout.textContent = cs.ruleText;
        el.ruleCallout.classList.remove('hidden');
      } else {
        el.ruleCallout.classList.add('hidden');
      }

      const caseDone = def.id !== 'sandbox' && !cs.awaiting && cs.stepIndex === cDef.steps.length - 1;
      const hasNextCase = st.caseIndex + 1 < def.cases.length;

      if (caseDone && hasNextCase) {
        const nextCaseTitle = def.cases[st.caseIndex + 1].title;
        el.nextStageBtn.textContent = `Next loop case: ${nextCaseTitle} →`;
        el.nextStageBtn.dataset.action = 'next-case';
        el.nextStageBtn.classList.remove('hidden');
      } else if (caseDone && def.nextStageTitle) {
        el.nextStageBtn.textContent = `Continue to ${def.nextStageTitle} →`;
        el.nextStageBtn.dataset.action = 'next-stage';
        el.nextStageBtn.classList.remove('hidden');
      } else {
        el.nextStageBtn.classList.add('hidden');
      }
    }

    function renderAll() {
      renderTopScore();
      renderTabs();
      renderGoalAndState();
      renderSubtabs();
      renderCodeAndPrompt();
      renderNodes();
      renderFeedbackBar();
      requestAnimationFrame(layoutArrowsAndPointers);
    }

    function escalateHint(step, attempts, clickedArg) {
      const idx = Math.min(attempts - 1, step.hints.length - 1);
      return step.hints[idx](clickedArg);
    }

    function resolveCurrentStep(revealed) {
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      const step = cDef.steps[cs.stepIndex];

      step.apply(cs);
      cs.awaiting = false;
      cs.pendingNode = null;
      cs.pendingVal = null;

      if (!revealed && cs.attempts === 0 && !cs.hintsUsed) {
        cs.results[cs.stepIndex] = 'first-try';
        cs.feedbackText = 'Correct on the first try!';
      } else if (revealed) {
        cs.results[cs.stepIndex] = 'assisted';
        cs.feedbackText = 'Answer revealed.';
      } else {
        cs.results[cs.stepIndex] = 'assisted';
        cs.feedbackText = cs.hintsUsed ? 'Solved with hint!' : `Solved in ${cs.attempts + 1} attempts.`;
      }

      cs.feedbackTone = revealed ? 'warn' : 'ok';
      cs.ruleText = step.rule;
      renderAll();

      if (step.targetNode) {
        requestAnimationFrame(() => {
          const box = el.nodesRow.querySelector(`.node-box[data-id="${step.targetNode}"]`);
          if (box) {
            box.classList.add('correct-flash');
            setTimeout(() => box.classList.remove('correct-flash'), 650);
          }
        });
      }
    }

    function handleNodeClick(clickedId, btnEl) {
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      if (!cs.awaiting) return;
      const step = cDef.steps[cs.stepIndex];

      if (step.kind === 'dual') {
        cs.pendingNode = clickedId;
        renderNodes();
        renderCodeAndPrompt();
        return;
      }

      if (clickedId === step.targetNode) {
        resolveCurrentStep(false);
      } else {
        cs.attempts += 1;
        cs.feedbackTone = 'err';
        cs.feedbackText = `Not "${labelForTarget(cs, clickedId)}" — ` + escalateHint(step, cs.attempts, clickedId);
        // Rule only unlocks after solving or >= 2 attempts? Show subtle rule after reveal/solve, escalating hints on wrong tries.
        renderAll();
        requestAnimationFrame(() => {
          const badBox = el.nodesRow.querySelector(`.node-box[data-id="${clickedId}"]`);
          if (badBox) {
            badBox.classList.remove('wrong-flash');
            void badBox.offsetWidth;
            badBox.classList.add('wrong-flash');
          }
        });
      }
    }

    function submitMcqPrediction(choice) {
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      if (!cs.awaiting) return;
      const step = cDef.steps[cs.stepIndex];

      if (choice === step.targetVal) {
        resolveCurrentStep(false);
      } else {
        cs.attempts += 1;
        cs.feedbackTone = 'err';
        cs.feedbackText = `Not "${choice}" — ` + escalateHint(step, cs.attempts, choice);
        renderAll();
      }
    }

    function checkDualPrediction() {
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      if (!cs.awaiting) return;
      const step = cDef.steps[cs.stepIndex];
      if (cs.pendingVal === null || cs.pendingNode === null) return;

      const valOk = cs.pendingVal === step.targetVal;
      const nodeOk = cs.pendingNode === step.targetNode;

      if (valOk && nodeOk) {
        resolveCurrentStep(false);
      } else {
        cs.attempts += 1;
        cs.feedbackTone = 'err';
        const partMsg = !valOk && nodeOk
          ? `Node ${labelForTarget(cs, cs.pendingNode)} is right, but sum "${cs.pendingVal}" isn't. `
          : valOk && !nodeOk
          ? `sum = ${cs.pendingVal} is right, but p doesn't land on ${labelForTarget(cs, cs.pendingNode)}. `
          : 'Neither matches yet — ';
        cs.feedbackText = partMsg + escalateHint(step, cs.attempts, cs.pendingNode);
        renderAll();
      }
    }

    function advanceStep() {
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      if (cs.stepIndex + 1 >= cDef.steps.length) return;

      cs.stepIndex += 1;
      cs.awaiting = true;
      cs.attempts = 0;
      cs.hintsUsed = 0;
      cs.pendingNode = null;
      cs.pendingVal = null;
      cs.pCrash = false;
      cs.feedbackTone = 'neutral';
      cs.feedbackText = 'Trace the highlighted code, then make your prediction.';
      cs.ruleText = '';

      cDef.steps[cs.stepIndex].setup(cs);
      renderAll();
    }

    function pushSandboxHistory(cs, label) {
      cs.history.push({
        nodes: cloneNodes(cs.nodes),
        p: cs.p,
        r: cs.r,
        letterCursor: cs.letterCursor,
        trailLen: cs.trail.length
      });
      cs.trail.push(label);
    }

    function runSandboxOp(op) {
      const cs = getActiveCaseState();
      const liveNodes = cs.nodes.filter(n => !n.ghost);
      const liveIdx = liveNodes.findIndex(n => n.id === cs.p);
      const pIdx = cs.nodes.findIndex(n => n.id === cs.p);
      cs.nodes.forEach(n => { n.isNew = false; });
      cs.ruleText = '';

      if (op === 'first') {
        pushSandboxHistory(cs, 'p = L.first()');
        cs.p = liveNodes.length > 0 ? liveNodes[0].id : 'EOL';
        cs.feedbackTone = 'ok';
        cs.feedbackText = cs.p === 'EOL'
          ? 'Empty list: L.first() returned L.EOL.'
          : `L.first() placed p on "${labelForTarget(cs, cs.p)}".`;
      } else if (op === 'last') {
        pushSandboxHistory(cs, 'p = L.last()');
        cs.p = liveNodes.length > 0 ? liveNodes[liveNodes.length - 1].id : 'EOL';
        cs.feedbackTone = 'ok';
        cs.feedbackText = cs.p === 'EOL'
          ? 'Empty list: L.last() returned L.EOL.'
          : `L.last() placed p on "${labelForTarget(cs, cs.p)}".`;
      } else if (op === 'prev') {
        if (cs.p === 'INVALID') {
          cs.feedbackTone = 'err';
          cs.feedbackText = 'Undefined! p points to a removed node. Jump with L.first() or L.last(), or click Restore (p = r).';
          renderAll();
          return;
        }
        if (cs.p === 'EOL' || liveIdx <= 0) {
          cs.feedbackTone = 'warn';
          cs.feedbackText = cs.p === 'EOL'
            ? 'Undefined! Cannot call p.previous() on L.EOL — use L.last() to jump to the last node.'
            : 'Undefined! p is already at the first node; there is no predecessor.';
          renderAll();
          return;
        }
        pushSandboxHistory(cs, 'p = p.previous()');
        cs.p = liveNodes[liveIdx - 1].id;
        cs.feedbackTone = 'ok';
        cs.feedbackText = `p.previous() moved p left to "${labelForTarget(cs, cs.p)}".`;
      } else if (op === 'next') {
        if (cs.p === 'INVALID') {
          cs.feedbackTone = 'err';
          cs.feedbackText = 'Undefined! p points to a removed node. Jump with L.first() or L.last(), or click Restore (p = r).';
          renderAll();
          return;
        }
        if (cs.p === 'EOL') {
          cs.feedbackTone = 'warn';
          cs.feedbackText = 'Undefined! p is already on L.EOL — cannot step past L.EOL.';
          renderAll();
          return;
        }
        pushSandboxHistory(cs, 'p = p.next()');
        cs.p = (liveIdx + 1 < liveNodes.length) ? liveNodes[liveIdx + 1].id : 'EOL';
        cs.feedbackTone = 'ok';
        cs.feedbackText = `p.next() moved p right to ${labelForTarget(cs, cs.p)}.`;
      } else if (op === 'read') {
        if (cs.p === 'INVALID' || cs.p === 'EOL') {
          cs.feedbackTone = 'err';
          cs.feedbackText = cs.p === 'INVALID'
            ? 'Undefined! p\'s node was removed, so p.getElement() cannot read from the list.'
            : 'Undefined! L.EOL is a sentinel marker and holds no element.';
          renderAll();
          return;
        }
        cs.feedbackTone = 'ok';
        cs.feedbackText = `p.getElement() returned "${labelForTarget(cs, cs.p)}" (p did not move).`;
        renderAll();
        requestAnimationFrame(() => {
          const box = el.nodesRow.querySelector(`.node-box[data-id="${cs.p}"]`);
          if (box) {
            box.classList.add('read-pulse');
            setTimeout(() => box.classList.remove('read-pulse'), 650);
          }
        });
        return;
      } else if (op === 'insert') {
        if (cs.p === 'INVALID') {
          cs.feedbackTone = 'err';
          cs.feedbackText = 'Undefined! p points to a removed node, so L.insert(p, x) cannot insert relative to p.';
          renderAll();
          return;
        }
        const lbl = LETTERS[cs.letterCursor % LETTERS.length];
        cs.letterCursor += 1;
        cs.nextIdNum += 1;
        const newNode = { id: 'ns' + cs.nextIdNum, label: lbl, isNew: true };
        const beforeLabel = labelForTarget(cs, cs.p);
        pushSandboxHistory(cs, `L.insert(p, ${lbl})`);
        if (cs.p === 'EOL') {
          cs.nodes.push(newNode);
        } else {
          cs.nodes.splice(pIdx, 0, newNode);
        }
        cs.feedbackTone = 'ok';
        cs.feedbackText = `Inserted "${lbl}" BEFORE ${beforeLabel} — p stayed attached to ${beforeLabel}.`;
      } else if (op === 'save') {
        if (cs.p === 'INVALID' || cs.p === 'EOL') {
          cs.feedbackTone = 'err';
          cs.feedbackText = cs.p === 'INVALID'
            ? 'Undefined! Cannot read p.next() from a removed node.'
            : 'Undefined! Cannot call p.next() on L.EOL.';
          renderAll();
          return;
        }
        const nextId = (liveIdx + 1 < liveNodes.length) ? liveNodes[liveIdx + 1].id : 'EOL';
        pushSandboxHistory(cs, 'r = p.next()');
        cs.r = nextId;
        cs.feedbackTone = 'ok';
        cs.feedbackText = `Saved next node (${labelForTarget(cs, cs.r)}) in variable r.`;
      } else if (op === 'remove') {
        if (cs.p === 'INVALID' || cs.p === 'EOL') {
          cs.feedbackTone = 'err';
          cs.feedbackText = cs.p === 'INVALID'
            ? 'Undefined! That node was already removed.'
            : 'Undefined! Cannot remove L.EOL.';
          renderAll();
          return;
        }
        const removedLabel = labelForTarget(cs, cs.p);
        const removedId = cs.p;
        pushSandboxHistory(cs, `L.remove(${removedLabel})`);
        cs.nextIdNum += 1;
        const ghostNode = { id: 'ghost_' + removedId + '_' + cs.nextIdNum, label: removedLabel, ghost: true };
        const updated = [];
        cs.nodes.forEach((n, idx) => {
          if (idx === pIdx) updated.push(ghostNode);
          else if (!n.ghost) updated.push(n);
        });
        cs.nodes = updated;
        cs.p = 'INVALID';
        if (cs.r === removedId) {
          cs.r = 'INVALID';
        }
        cs.feedbackTone = 'warn';
        cs.feedbackText = (cs.r && cs.r !== 'INVALID')
          ? `Removed "${removedLabel}" (shown ghosted; neighbors relinked). p is now INVALID — click Restore (p = r) to recover!`
          : `Removed "${removedLabel}" (shown ghosted; neighbors relinked). Because r wasn't saved first, p is now INVALID!`;
      } else if (op === 'restore') {
        if (!cs.r) return;
        pushSandboxHistory(cs, 'p = r');
        if (cs.r === 'INVALID') {
          cs.p = 'INVALID';
          cs.r = null;
          cs.feedbackTone = 'err';
          cs.feedbackText = 'r also pointed to a removed node, so p remains INVALID!';
        } else {
          cs.p = cs.r;
          cs.r = null;
          cs.feedbackTone = 'ok';
          cs.feedbackText = `Restored p = r -> p now points cleanly to ${labelForTarget(cs, cs.p)}.`;
        }
      }

      renderAll();
    }

    function showInsertPreview(show) {
      const def = getActiveDef();
      const cs = getActiveCaseState();
      if (!show || def.id !== 'sandbox' || cs.p === 'INVALID') {
        el.insertHint.classList.remove('visible');
        return;
      }
      const nextLabel = LETTERS[cs.letterCursor % LETTERS.length];
      el.insertHint.querySelector('span').textContent = '+' + nextLabel;

      const wrapRect = el.canvasWrap.getBoundingClientRect();
      const targetBox = Array.from(el.nodesRow.querySelectorAll('.node-box')).find(b => b.dataset.id === cs.p && b.dataset.ghost !== 'true');
      if (!targetBox) {
        el.insertHint.classList.remove('visible');
        return;
      }
      const r = targetBox.getBoundingClientRect();
      el.insertHint.style.left = Math.max(16, (r.left - wrapRect.left) - 17) + 'px';
      el.insertHint.classList.add('visible');
    }

    // Bind events
    el.resetBtn.addEventListener('click', resetCurrentStage);
    el.checkBtn.addEventListener('click', checkDualPrediction);
    el.hintBtn.addEventListener('click', () => {
      const cDef = getActiveCaseDef();
      const cs = getActiveCaseState();
      if (!cs.awaiting) return;
      const step = cDef.steps[cs.stepIndex];
      cs.hintsUsed = (cs.hintsUsed || 0) + 1;
      cs.feedbackTone = 'warn';
      cs.feedbackText = 'Hint: ' + escalateHint(step, cs.hintsUsed, cs.pendingNode);
      renderAll();
    });
    el.revealBtn.addEventListener('click', () => {
      if (getActiveCaseState().awaiting) resolveCurrentStep(true);
    });
    el.nextStepBtn.addEventListener('click', advanceStep);

    el.nextStageBtn.addEventListener('click', () => {
      const action = el.nextStageBtn.dataset.action;
      const st = getActiveStage();
      if (action === 'next-case') {
        st.caseIndex += 1;
        renderAll();
      } else if (action === 'next-stage' && app.activeStageIndex + 1 < STAGE_DEFS.length) {
        app.activeStageIndex += 1;
        renderAll();
      }
    });

    el.nextTipBtn.addEventListener('click', () => {
      const cs = getActiveCaseState();
      cs.ideaIndex = (cs.ideaIndex + 1) % SANDBOX_IDEAS.length;
      renderAll();
    });

    document.querySelectorAll('.op-btn[data-op]').forEach(btn => {
      btn.addEventListener('click', () => runSandboxOp(btn.dataset.op));
    });

    el.insertBtn.addEventListener('mouseenter', () => showInsertPreview(true));
    el.insertBtn.addEventListener('touchstart', () => showInsertPreview(true), { passive: true });
    el.insertBtn.addEventListener('touchend', () => setTimeout(() => showInsertPreview(false), 800), { passive: true });
    el.insertBtn.addEventListener('mouseleave', () => showInsertPreview(false));
    el.insertBtn.addEventListener('focus', () => showInsertPreview(true));
    el.insertBtn.addEventListener('blur', () => showInsertPreview(false));

    el.undoBtn.addEventListener('click', () => {
      const cs = getActiveCaseState();
      const prev = cs.history.pop();
      if (!prev) return;
      cs.nodes = prev.nodes;
      cs.p = prev.p;
      cs.r = prev.r;
      cs.letterCursor = prev.letterCursor;
      cs.trail = cs.trail.slice(0, prev.trailLen);
      cs.feedbackTone = 'neutral';
      cs.feedbackText = 'Undid last Sandbox operation.';
      renderAll();
    });

    el.stage.addEventListener('scroll', () => {
      requestAnimationFrame(layoutArrowsAndPointers);
    }, { passive: true });

    window.addEventListener('resize', () => {
      requestAnimationFrame(layoutArrowsAndPointers);
    });

    window.addEventListener('orientationchange', () => {
      setTimeout(() => requestAnimationFrame(layoutArrowsAndPointers), 100);
    });

    renderAll();
  </script>
</body>
</html>
