<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walking a Node List</title>
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #f2ede4;
      --surface-alt: #e8e1d5;
      --card: #ffffff;
      --border: #d4cbbd;
      --border-soft: #e3dcd0;
      --text: #1f1e1b;
      --muted: #666055;
      --blue: #185a4f;
      --blue-soft: #ebf4f2;
      --blue-border: #94bfb7;
      --green: #26633a;
      --green-soft: #eef6f0;
      --green-border: #9ec9ab;
      --red: #a12828;
      --red-soft: #fdf1f1;
      --red-border: #e5a8a8;
      --amber: #9e4a1e;
      --amber-soft: #fbf2ec;
      --amber-border: #e2b89e;
      --violet: #6b3861;
      --violet-soft: #f6eff4;
      --violet-border: #cfb0c9;
      --radius: 6px;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    .btn-ghost,
    .btn-primary,
    .tab-btn,
    .subtab-btn,
    .mcq-btn,
    .op-btn,
    button.node-box {
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 18px 16px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .widget {
      max-width: 840px;
      margin: 0 auto;
      background: transparent;
      padding: 4px 0 16px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .title-group h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .title-group p {
      display: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .score-pill {
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 8px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
    }

    button {
      font-family: var(--font);
    }

    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .btn-ghost {
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }


    .btn-ghost:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 44px;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #ffffff;
      cursor: pointer;
      transition: opacity 0.12s ease;
    }


    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Stage Tabs: clean underline strip instead of pill boxes */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .tab-btn {
      font-size: 0.82rem;
      font-weight: 600;
      min-height: 44px;
      padding: 8px 12px;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.12s ease, border-color 0.12s ease;
    }


    .tab-btn[aria-selected="true"] {
      border-bottom-color: var(--blue);
      color: var(--blue);
    }

    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .tab-badge.mastered {
      color: var(--green);
    }

    .tab-badge.partial {
      color: var(--muted);
    }

    /* Stage Guide Row: quiet single-line caption, no box */
    .goal-row {
      padding: 0 2px;
      margin-bottom: 10px;
    }

    .stage-goal {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--muted);
    }

    /* Sub-case selector inside Loop Stage */
    .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .subtab-btn {
      font-size: 0.78rem;
      font-weight: 600;
      min-height: 44px;
      padding: 5px 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .subtab-btn.active {
      background: var(--blue-soft);
      border-color: var(--blue-border);
      color: var(--blue);
    }

    /* Workspace Split: Code + Prompt */
    .lesson-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 12px;
      margin-bottom: 12px;
    }

        @media (hover: hover) and (pointer: fine) {
      .btn-ghost:hover:not(:disabled) {
        background: var(--surface);
        border-color: var(--blue);
      }
      .btn-primary:hover:not(:disabled) {
        opacity: 0.9;
      }
      .tab-btn:hover {
        color: var(--text);
      }
      .mcq-btn:hover:not(:disabled) {
        border-color: var(--blue);
        background: var(--blue-soft);
      }
      button.node-box.clickable:hover {
        transform: translateY(-1px);
        border-color: var(--blue);
        background: var(--blue-soft);
      }
      .op-btn:hover:not(:disabled) {
        border-color: var(--blue);
        background: var(--blue-soft);
      }
    }

    button:active:not(:disabled),
    .btn-ghost:active:not(:disabled),
    .btn-primary:active:not(:disabled),
    .tab-btn:active,
    .subtab-btn:active,
    .mcq-btn:active:not(:disabled),
    .op-btn:active:not(:disabled),
    button.node-box.clickable:active {
      transform: scale(0.97);
      transition: transform 0.06s ease;
    }

    @media (max-width: 680px) {
      .lesson-grid {
        grid-template-columns: 1fr;
      }
      .topbar {
        gap: 8px;
      }
      .group-label {
        min-width: 76px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px 8px;
      }
      .widget {
        padding: 0 0 12px;
      }
      .title-group h1 {
        font-size: 1.05rem;
      }
      .topbar {
        margin-bottom: 8px;
      }
      .tabs {
        flex-wrap: nowrap;
        white-space: nowrap;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
      }
      .tab-btn {
        padding: 6px 10px;
        font-size: 0.78rem;
        flex-shrink: 0;
      }
      .subtabs {
        gap: 4px;
      }
      .subtab-btn {
        font-size: 0.74rem;
        padding: 4px 8px;
      }
      .code-card {
        padding: 10px 10px;
        font-size: 0.77rem;
      }
      .prompt-card {
        padding: 10px 10px;
        gap: 8px;
      }
      .question-text {
        font-size: 0.86rem;
      }
      .action-guide {
        font-size: 0.76rem;
      }
      .stage {
        padding: 10px 8px;
      }
      .canvas-wrap {
        min-height: 150px;
        padding-top: 48px;
        padding-bottom: 22px;
      }
      .nodes-row {
        gap: 28px;
        padding: 0 10px;
      }
      button.node-box {
        min-width: 54px;
        height: 48px;
        font-size: 0.92rem;
      }
      .group-label {
        width: 100%;
        margin-bottom: 2px;
      }
      .op-group {
        gap: 5px;
      }
      .feedback {
        font-size: 0.8rem;
      }
      .feedback.ok, .feedback.warn, .feedback.err {
        padding: 8px 10px;
      }
      .prompt-actions {
        width: 100%;
      }
      .prompt-actions button {
        flex: 1 1 auto;
      }
    }

    .code-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 0.81rem;
      line-height: 1.55;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .code-lines {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 2px 6px;
      border-radius: 3px;
      border-left: 2px solid transparent;
      white-space: pre;
    }

    .code-line.hl {
      background: rgba(24, 90, 79, 0.11);
      border-left-color: var(--blue);
      color: var(--text);
      font-weight: 600;
    }

    .code-line.crash {
      background: rgba(161, 40, 40, 0.13);
      border-left-color: var(--red);
      color: var(--red);
      font-weight: 700;
    }

    .line-num {
      color: #8c8579;
      min-width: 14px;
      user-select: none;
    }

    .line-arrow {
      color: var(--blue);
      min-width: 12px;
      user-select: none;
      font-weight: 700;
    }

    .code-line.crash .line-arrow {
      color: var(--red);
    }

    .watch-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .watch-chip {
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* Prompt Card: clean white panel, no nested inner box */
    .prompt-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
    }

    .prompt-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .step-badge {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--blue);
    }

    .attempt-pill {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .attempt-pill.used {
      color: var(--amber);
    }

    .question-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .action-guide {
      font-size: 0.79rem;
      line-height: 1.4;
      color: var(--muted);
      margin-top: 4px;
    }

    .mcq-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mcq-btn {
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 44px;
      padding: 6px 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s ease;
    }


    .mcq-btn[aria-pressed="true"] {
      border-color: var(--blue);
      background: var(--blue);
      color: #ffffff;
    }

    .mcq-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .mcq-btn.correct-choice {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
      font-weight: 700;
      opacity: 1;
    }

    .prompt-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Sandbox Try-This Bar */
    .try-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
    }

    .try-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex: 1 1 360px;
      font-size: 0.82rem;
      color: var(--text);
    }

    .tip-tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--amber);
      white-space: nowrap;
    }

    /* Node Stage */
    .stage {
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 14px 16px;
      margin-bottom: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      overscroll-behavior-x: contain;
    }

    .canvas-wrap {
      position: relative;
      min-width: max-content;
      min-height: 164px;
      padding-top: 56px;
      padding-bottom: 30px;
      display: flex;
      justify-content: center;
    }

    .links-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .nodes-row {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 40px;
      padding: 0 18px;
      z-index: 2;
    }

    button.node-box {
      position: relative;
      min-width: 60px;
      height: 50px;
      padding: 0 10px;
      margin: 0;
      border-radius: var(--radius);
      border: 1.5px solid #8c8478;
      background: var(--bg);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      user-select: none;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    }

    button.node-box:disabled {
      opacity: 1;
      cursor: default;
    }

    button.node-box.eol {
      border-style: dashed;
      border-color: var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    button.node-box.clickable {
      border-color: var(--blue);
      cursor: pointer;
    }


    button.node-box.selected-node {
      border-style: solid;
      border-color: var(--blue);
      background: var(--blue-soft);
      box-shadow: 0 0 0 2px rgba(24, 90, 79, 0.22);
    }

    button.node-box.active-p {
      border-style: solid;
      border-color: var(--blue);
      background: var(--blue-soft);
      box-shadow: 0 0 0 2px rgba(24, 90, 79, 0.14);
    }

    button.node-box.active-q {
      border-style: solid;
      border-color: var(--violet);
    }

    button.node-box.active-r {
      border-style: solid;
      border-color: #5c574f;
    }

    button.node-box.correct-flash {
      border-style: solid;
      border-color: var(--green);
      background: var(--green-soft);
    }

    button.node-box.wrong-flash {
      border-color: var(--red);
      background: var(--red-soft);
      animation: shake 0.26s ease;
    }

    button.node-box.read-pulse {
      box-shadow: 0 0 0 4px rgba(38, 99, 58, 0.24);
      border-color: var(--green);
    }

    button.node-box.ghost {
      border-style: dashed;
      border-color: var(--amber-border);
      background: var(--amber-soft);
      color: var(--muted);
      opacity: 0.65;
    }

    .ghost-label {
      text-decoration: line-through;
    }

    .removed-badge {
      position: absolute;
      bottom: -9px;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--amber);
      color: #ffffff;
    }

    .new-badge {
      position: absolute;
      bottom: -9px;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--green);
      color: #ffffff;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Floating Pointers */
    .ptr {
      position: absolute;
      top: 6px;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      transform: translateX(-50%);
      transition: left 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
      z-index: 4;
    }

    .ptr-label {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--blue);
      color: #ffffff;
      margin-bottom: 1px;
    }

    .ptr-label.crash {
      background: var(--red);
    }

    .ptr-r {
      top: 8px;
      z-index: 3;
    }

    .ptr-r .ptr-label {
      background: #5c574f;
      font-size: 0.71rem;
    }

    .ptr-q {
      top: 8px;
      z-index: 3;
    }

    .ptr-q .ptr-label {
      background: var(--violet);
      font-size: 0.71rem;
    }

    .ptr-status {
      position: absolute;
      top: 8px;
      left: 12px;
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px dashed var(--border);
      color: var(--muted);
      z-index: 4;
    }

    .ptr-status.invalid {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: var(--amber);
    }

    .ptr-status.crash {
      background: var(--red-soft);
      border-color: var(--red-border);
      color: var(--red);
      font-weight: 700;
    }

    .insert-hint {
      position: absolute;
      top: 20px;
      left: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--green);
      font-family: var(--mono);
      font-size: 0.73rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, left 0.14s ease;
      z-index: 5;
    }

    .insert-hint.visible {
      opacity: 1;
    }

    .sandbox-guide {
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--muted);
      padding: 2px 0 4px;
    }

    .sandbox-guide.warn {
      color: var(--amber);
      font-weight: 600;
    }

    /* Sandbox Controls */
    .sandbox-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      margin-bottom: 10px;
    }

    .op-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .group-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      min-width: 88px;
    }

    .op-btn {
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 44px;
      padding: 6px 11px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s ease;
    }


    .op-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .op-btn.boundary {
      border-style: dashed;
      border-color: var(--amber-border);
      background: var(--amber-soft);
      color: var(--muted);
    }

    .op-btn.ready-highlight {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
    }

    .op-code {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Feedback + Rule Box: subtle in neutral state, clear callout when active */
    .feedback {
      font-size: 0.83rem;
      padding: 6px 4px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 36px;
    }

    .feedback.ok {
      padding: 9px 12px;
      border-color: var(--green-border);
      border-left: 3px solid var(--green);
      background: var(--green-soft);
      color: var(--text);
    }

    .feedback.warn {
      padding: 9px 12px;
      border-color: var(--amber-border);
      border-left: 3px solid var(--amber);
      background: var(--amber-soft);

    .rule-callout {

      align-items: center;
      gap: 5px;

<body>
  <div class="widget">
    <div class="topbar">
      <div class="title-group">
        <h1>Walking a Node List</h1>
        <p>Predict pointer positions, trace <code>while</code> loops, and avoid common insert/remove traps.</p>
      </div>
      <div class="top-actions">
        <span id="score-pill" class="score-pill" aria-label="Formative practice score (first-try before reveal or reset)" title="Formative self-check: tracks first-try answers before reveal or reset">First-try: 0/0</span>

    </div>

    <div id="tabs" class="tabs" role="tablist" aria-label="Learning stages"></div>

    <div class="goal-row">

          <div class="prompt-meta">

            <span id="attempt-pill" class="attempt-pill">1st attempt eligible</span>
          </div>
          <div id="question-text" class="question-text" style="margin-top: 8px;"></div>
          <div id="action-guide" class="action-guide"></div>
        </div>
        <div id="mcq-row" class="mcq-row hidden"></div>
        <div class="prompt-actions">
          <button id="check-btn" class="btn-primary hidden" type="button">Check prediction</button>
          <button id="hint-btn" class="btn-ghost" type="button">Hint</button>

    </div>

    <div id="stage" class="stage">
      <div id="canvas-wrap" class="canvas-wrap">
        <svg id="links-svg" class="links-svg" aria-hidden="true"></svg>
        <div id="ptr-status" class="ptr-status hidden"></div>

        <div id="ptr-p" class="ptr" style="opacity: 0;">
          <span class="ptr-label">p</span>

            <path d="M7 0 L7 9 M3 6 L7 10.5 L11 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        </div>

            <path d="M7 0 L7 9 M3 6 L7 10.5 L11 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

          <span class="ptr-label">r</span>

            <path d="M7 0 L7 9 M3 6 L7 10.5 L11 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <div id="sandbox-panel" class="sandbox-panel hidden">
      <div id="sandbox-guide" class="sandbox-guide"></div>

        <span class="group-label">Move p:</span>
        <button type="button" class="op-btn" data-op="first">First <span class="op-code">L.first()</span></button>
        <button type="button" class="op-btn" data-op="prev">Back <span class="op-code">p.previous()</span></button>
        <button type="button" class="op-btn" data-op="next">Forward <span class="op-code">p.next()</span></button>
        <button type="button" class="op-btn" data-op="last">Last <span class="op-code">L.last()</span></button>
        <button type="button" class="op-btn" data-op="read">Read <span class="op-code">p.getElement()</span></button>
      </div>
      <div class="op-group">

        <span class="group-label">Safe remove:</span>
        <button type="button" class="op-btn" data-op="save">1. Save next <span class="op-code">r = p.next()</span></button>
        <button type="button" class="op-btn" data-op="remove">2. Remove <span class="op-code">L.remove(p)</span></button>

    <div id="feedback" class="feedback" role="status" aria-live="polite">

        <span id="feedback-msg"></span>
        <div id="rule-callout" class="rule-callout hidden"></div>
      </div>
      <button id="next-stage-btn" class="btn-primary hidden" type="button"></button>
    </div>

    <div id="trail" class="trail hidden"></div>
  </div>

  <script>
    const STAGE_DEFS = [
      {
        id: 'navigate',
        title: '1. Navigate',
        goal: 'Trace the highlighted statements from top to bottom, then click the node (or L.EOL) where p lands.',
        nextStageId: 'loops',
        nextStageTitle: '2. While Loops',
        cases: [
          {
            id: 'nav',
            title: 'Navigation',
            initialNodes: [
              { id: 'n1', label: 'A' },
              { id: 'n2', label: 'B' },
              { id: 'n3', label: 'C' },
              { id: 'n4', label: 'D' }
            ],
            initialP: 'UNSET',
            initialQ: null,
            initialR: null,
            steps: [
              {
                codeLines: ['p = L.first();', 'p = p.next();'],
                hl: [0, 1],
                kind: 'node',
                targetNode: 'n2',
                prompt: 'Where does p point after both statements finish?',
                setup: s => { s.p = 'UNSET'; s.pBadge = 'p = not set yet'; },
                apply: s => { s.p = 'n2'; s.pBadge = ''; },
                hints: [
                  clicked => clicked === 'n1'
                    ? 'A is where line 1 (L.first()) lands — now trace line 2 (p = p.next()) as well.'
                    : 'Trace both lines in order: L.first() puts p at the head, then p.next() steps one link right.',
                  () => 'Hint 2: After line 1, p points to A. Follow one forward arrow from A.',
                  () => 'Final hint: One step right from A lands on B.'
                ],
                rule: 'L.first() starts at the first element node, and p.next() advances one link forward.'
              },
              {
                codeLines: ['p = L.last();', 'p = p.previous();'],
                hl: [0, 1],
                kind: 'node',
                targetNode: 'n3',
                prompt: 'Starting from B, both statements run in order. Click the box where p points at the end:',
                setup: s => { s.p = 'n2'; s.pBadge = ''; },
                apply: s => { s.p = 'n3'; s.pBadge = ''; },
                hints: [
                  clicked => clicked === 'n4'
                    ? 'D is where L.last() jumps before line 2 (p = p.previous()) runs.'
                    : clicked === 'EOL'
                    ? 'Remember: L.last() returns the last element node, NOT L.EOL!'
                    : 'Trace line 1 (L.last()) first, then step backward once along the bottom arrow.',
                  () => 'Hint 2: L.last() sets p to D, then p.previous() moves one link left.',
                  () => 'Final hint: One backward step from D lands on C.'
                ],
                rule: 'L.last() skips straight to the final data node (D), and p.previous() steps backward.'
              },
              {
                codeLines: ['p = p.previous();', 'p = p.previous();'],
                hl: [0, 1],
                kind: 'node',
                targetNode: 'n1',
                prompt: 'Starting from C, where does p end up after both backward steps?',
                setup: s => { s.p = 'n3'; s.pBadge = ''; },
                apply: s => { s.p = 'n1'; s.pBadge = ''; },
                hints: [
                  clicked => clicked === 'n2'
                    ? 'B is after the first p.previous() — trace the second line too!'
                    : 'Follow the backward arrow twice starting from C.',
                  () => 'Hint 2: C -> B is one previous(); take one more backward link from B.',
                  () => 'Final hint: Two steps left from C lands on A.'
                ],
                rule: 'Calling p.previous() repeatedly walks leftward node by node (calling previous() on first() would be undefined).'
              },
              {
                codeLines: ['p = L.last();', 'p = p.next();'],
                hl: [0, 1],
                kind: 'node',
                targetNode: 'EOL',
                prompt: 'Where does p land after L.last() followed by p.next()?',
                setup: s => { s.p = 'n1'; s.pBadge = ''; },
                apply: s => { s.p = 'EOL'; s.pBadge = ''; },
                hints: [
                  clicked => clicked === 'n4'
                    ? 'D is L.last(), before line 2 executes p = p.next().'
                    : 'Step once right past the final element node D.',
                  () => 'Hint 2: Stepping one link past the last element enters the end-of-list marker.',
                  () => 'Final hint: D.next() returns L.EOL.'
                ],
                rule: 'On the last data node, p.next() returns L.EOL (End Of List) cleanly without crashing.'
              }
            ]
          }
        ]
      },
      {
        id: 'loops',
        title: '2. While Loops',
        goal: 'Trace each loop variant: select the running value and click where p points after each step.',
        nextStageId: 'insert',
        nextStageTitle: '3. Insert @ p',
        cases: [
          {
            id: 'sum',
            title: '1. Full: p != L.EOL',
            initialNodes: [
              { id: 'n1', label: '3' },
              { id: 'n2', label: '5' },
              { id: 'n3', label: '2' }
            ],
            initialP: 'UNSET',
            initialQ: null,
            initialR: null,
            initialSum: 0,
            initialIters: 0,
            steps: [
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [1],
                kind: 'node',
                targetNode: 'n1',
                prompt: 'Line 2 initializes p before the loop. Click where p points:',
                setup: s => { s.p = 'UNSET'; s.pBadge = 'p = not set yet'; },
                apply: s => { s.p = 'n1'; s.pBadge = ''; },
                hints: [
                  () => 'L.first() sets p directly onto the first element node.',
                  () => 'Hint 2: The first node holds 3.',
                  () => 'Final hint: Click node 3.'
                ],
                rule: 'Every traversal loop initializes p with L.first() before testing while (p != L.EOL).'
              },
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2, 3, 4],
                kind: 'dual',
                choices: ['0', '3', '5', '8'],
                valLabel: 'Pick sum after line 4:',
                targetVal: '3',
                targetNode: 'n2',
                prompt: 'Iteration 1 runs on 3: choose updated sum AND click new p after line 5.',
                setup: s => {},
                apply: s => { s.sum = 3; s.iters = 1; s.p = 'n2'; },
                hints: [
                  () => 'p currently points to 3, so sum becomes 0 + 3, then p = p.next() advances one link.',
                  () => 'Hint 2: sum = 3, and following the link from 3 moves p to 5.',
                  () => 'Final hint: Select 3 for sum and click node 5.'
                ],
                rule: 'Read the current node with p.getElement() before advancing p = p.next() at the end of the loop body.'
              },
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2, 3, 4],
                kind: 'dual',
                choices: ['5', '8', '10', '3'],
                valLabel: 'Pick sum after line 4:',
                targetVal: '8',
                targetNode: 'n3',
                prompt: 'Iteration 2 runs on 5: choose updated sum AND click new p after line 5.',
                setup: s => {},
                apply: s => { s.sum = 8; s.iters = 2; s.p = 'n3'; },
                hints: [
                  () => 'Add the element in p (5) to the previous sum (3), then step one link right.',
                  () => 'Hint 2: sum = 3 + 5 = 8, and 5.next() moves p onto 2.',
                  () => 'Final hint: Select 8 for sum and click node 2.'
                ],
                rule: 'Each iteration adds one element to sum and steps p one node closer to L.EOL.'
              },
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2, 3, 4],
                kind: 'dual',
                choices: ['2', '8', '10', '12'],
                valLabel: 'Pick sum after line 4:',
                targetVal: '10',
                targetNode: 'EOL',
                prompt: 'Iteration 3 runs on 2: choose updated sum AND click new p after line 5.',
                setup: s => {},
                apply: s => { s.sum = 10; s.iters = 3; s.p = 'EOL'; },
                hints: [
                  () => 'p is on the last element (2). Add 2 to sum (8), then advance past 2.',
                  () => 'Hint 2: sum = 8 + 2 = 10, and stepping past the last node lands on L.EOL.',
                  () => 'Final hint: Select 10 for sum and click L.EOL.'
                ],
                rule: 'The final element IS summed before p = p.next() steps onto L.EOL.'
              },
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2],
                kind: 'mcq',
                choices: ['0 times', '2 times', '3 times', '4 times'],
                targetVal: '3 times',
                prompt: 'Line 3 checks p != L.EOL and stops. How many times did the loop body run?',
                setup: s => {},
                apply: s => {},
                hints: [
                  () => 'Count how many data nodes existed — the body ran once per node before hitting L.EOL.',
                  () => 'Hint 2: Nodes 3, 5, and 2 each ran the body once; at L.EOL the check failed immediately.',
                  () => 'Final hint: 3 data nodes -> 3 times.'
                ],
                rule: 'For a list of n elements, while (p != L.EOL) executes the loop body exact n times (final sum = 10).'
              }
            ]
          },
          {
            id: 'skipLast',
            title: '2. p.next() != L.EOL Bug',
            initialNodes: [
              { id: 'n1', label: '3' },
              { id: 'n2', label: '5' },
              { id: 'n3', label: '2' }
            ],
            initialP: 'n1',
            initialQ: null,
            initialR: null,
            initialSum: 0,
            initialIters: 0,
            steps: [
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p.next() != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2, 3, 4],
                kind: 'dual',
                choices: ['5', '8', '10', '0'],
                valLabel: 'sum after 2 iterations:',
                targetVal: '8',
                targetNode: 'n3',
                prompt: 'Line 3 changed to while (p.next() != L.EOL). After 2 iterations from 3, pick sum and p:',
                setup: s => {},
                apply: s => { s.sum = 8; s.iters = 2; s.p = 'n3'; },
                hints: [
                  () => 'In iteration 1 (p at 3), 3.next() is 5 != EOL so sum += 3 and p -> 5. Trace iteration 2 similarly.',
                  () => 'Hint 2: Iteration 2 adds 5 (sum = 8) and moves p -> 2.',
                  () => 'Final hint: Select 8 and click node 2.'
                ],
                rule: 'So far 3 and 5 passed p.next() != L.EOL. Now watch what happens when p stands on the last element (2)!'
              },
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p.next() != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2],
                kind: 'mcq',
                choices: [
                  'Stops cleanly (sum = 8, 2 runs)',
                  'Runs body once more (sum = 10, 3 runs)',
                  'Stops cleanly (sum = 8, 3 runs)',
                  'Throws error on node 2'
                ],
                targetVal: 'Stops cleanly (sum = 8, 2 runs)',
                prompt: 'Now p points to node 2. Line 3 tests p.next() != L.EOL — what happens?',
                setup: s => {},
                apply: s => {},
                hints: [
                  () => 'Look at what 2.next() returns right now: node 2 is the last node, so 2.next() IS L.EOL!',
                  () => 'Hint 2: Because 2.next() != L.EOL is FALSE, the body does NOT run on 2.',
                  () => 'Final hint: Loop stops with sum = 8 after 2 runs (node 2 was skipped).'
                ],
                rule: 'Classic off-by-one bug: while (p.next() != L.EOL) skips the last element — AND fails with an error on an empty list!'
              }
            ]
          },
          {
            id: 'empty',
            title: '3. Empty List',
            initialNodes: [],
            initialP: 'UNSET',
            initialQ: null,
            initialR: null,
            initialSum: 0,
            initialIters: 0,
            steps: [
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [1],
                kind: 'mcq',
                valLabel: 'p = L.first() returns:',
                choices: ['L.EOL', 'Throws an error', 'Remains unset', 'Creates a placeholder node'],
                targetVal: 'L.EOL',
                prompt: 'List L is empty (0 elements). What does line 2 (p = L.first()) return?',
                setup: s => { s.p = 'UNSET'; s.pBadge = 'p = not set yet'; },
                apply: s => { s.p = 'EOL'; s.pBadge = ''; },
                hints: [
                  () => 'In this linked list, L.first() still returns a valid list position (L.EOL) on an empty list instead of crashing.',
                  () => 'Final hint: On an empty list, L.first() returns L.EOL.'
                ],
                rule: 'In this linked list, L.first() and L.last() both return L.EOL on an empty list.'
              },
              {
                codeLines: [
                  'int sum = 0;',
                  'p = L.first();',
                  'while (p != L.EOL) {',
                  '    sum = sum + p.getElement();',
                  '    p = p.next();',
                  '}'
                ],
                hl: [2],
                kind: 'mcq',
                choices: ['0 times, sum = 0', '1 time, sum = 0', '0 times, throws error', '1 time, throws error'],
                targetVal: '0 times, sum = 0',
                prompt: 'Line 3 checks while (p != L.EOL) on this empty list. What is the result?',
                setup: s => {},
                apply: s => {},
                hints: [
                  () => 'Evaluate p != L.EOL when p already equals L.EOL — the condition fails before entering the loop.',
                  () => 'Final hint: 0 iterations and sum stays 0 with no error.'
                ],
                rule: 'while (p != L.EOL) handles an empty list cleanly (0 iterations, sum = 0). By contrast, while (p.next() != L.EOL) calls next() on L.EOL and crashes!'
              }
            ]
          }
        ]
      },
      {
        id: 'insert',
        title: '3. Insert @ p',
        goal: 'The new node is already inserted and p is hidden (?). Click which node p points to after L.insert(p, x).',
        nextStageId: 'remove',
        nextStageTitle: '4. Remove & Loops',
        cases: [
          {
            id: 'ins',
            title: 'Insert behavior',
            initialNodes: [
              { id: 'n1', label: 'A' },
              { id: 'n2', label: 'B' },
              { id: 'n3', label: 'C' }
            ],
            initialP: 'n2',
            initialQ: null,
            initialR: null,
            steps: [
              {
                codeLines: ['// Before: p pointed to B', 'L.insert(p, "X");'],
                hl: [1],
                kind: 'node',
                targetNode: 'n2',
                prompt: 'Node "X" was just inserted while p pointed to B. Click which node p points to NOW:',
                setup: s => {
                  s.nodes = [
                    { id: 'n1', label: 'A' },
                    { id: 'nx', label: 'X', isNew: true },
                    { id: 'n2', label: 'B' },
                    { id: 'n3', label: 'C' }
                  ];
                  s.p = 'HIDDEN';
                  s.pBadge = 'p = ? (click below)';
                },
                apply: s => { s.p = 'n2'; s.pBadge = ''; },
                hints: [
                  clicked => clicked === 'nx'
                    ? 'Common misconception! L.insert(p, "X") links "X" into the list before p, without changing variable p itself.'
                    : 'Notice "X" appeared in front of B. Did L.insert reassign variable p?',
                  () => 'Hint 2: No p = ... assignment ran, so p still holds the exact node reference it pointed to beforehand.',
                  () => 'Final hint: p started on B and stays on B.'
                ],
                rule: 'Rule discovered: L.insert(p, x) inserts x BEFORE p, while p remains attached to its original node.'
              },
              {
                codeLines: ['// Starting from B:', 'p = p.next();', 'p = p.next();'],
                hl: [1, 2],
                kind: 'node',
                targetNode: 'EOL',
                prompt: 'Starting from B, both lines run. Click where p points afterward:',
                setup: s => {
                  s.nodes.forEach(n => { n.isNew = false; });
                  s.p = 'n2';
                  s.pBadge = '';
                },
                apply: s => { s.p = 'EOL'; s.pBadge = ''; },
                hints: [
                  clicked => clicked === 'n3'
                    ? 'C is one step forward (line 2) — trace line 3 (p = p.next()) from C too!'
                    : 'Follow two forward links starting from B.',

    function shuffleChoices(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function cloneNodes(list) {
      return list.map(n => ({ id: n.id, label: n.label, isNew: !!n.isNew, ghost: !!n.ghost }));
    }

    function createStageState(stageDef) {
      const stageState = {
        id: stageDef.id,
        caseIndex: 0,
        cases: stageDef.cases.map(c => ({
          id: c.id,
          stepIndex: 0,
          awaiting: c.steps.length > 0,
          attempts: 0,
          hintsUsed: 0,
          pendingNode: null,
          pendingVal: null,
          choiceOrders: c.steps.map(s => (s.kind === 'mcq' && Array.isArray(s.choices) ? shuffleChoices(s.choices) : null)),
          results: c.steps.map(() => null), // null | 'first-try' | 'assisted'
          nodes: cloneNodes(c.initialNodes),
          p: c.initialP,
          q: c.initialQ,
          r: c.initialR,
          pCrash: false,
          pBadge: '',
          sum: c.initialSum ?? null,
          iters: c.initialIters ?? null,
          feedbackText: stageDef.id === 'sandbox'
            ? 'Click any operation below to test how p moves.'
            : '',
          feedbackTone: 'neutral',
          ruleText: '',
          history: [],
          trail: [],
          letterCursor: 0,
          nextIdNum: 20,
          ideaIndex: 0
        }))
      };
      // Initialize step 0 setup for every sub-case cleanly
      stageState.cases.forEach((cState, cIdx) => {
        const cDef = stageDef.cases[cIdx];
        if (cDef.steps.length > 0) cDef.steps[0].setup(cState);
      });
      return stageState;
    }

    const app = {
      activeStageIndex: 0,
      stages: STAGE_DEFS.map(createStageState)
    };

    function getActiveDef() {
      return STAGE_DEFS[app.activeStageIndex];
    }

    function getActiveStage() {
      return app.stages[app.activeStageIndex];
    }

    function getActiveCaseDef() {
      return getActiveDef().cases[getActiveStage().caseIndex];
    }

    function getActiveCaseState() {
      return getActiveStage().cases[getActiveStage().caseIndex];
    }

    function resetCurrentStage() {
      const idx = app.activeStageIndex;
      app.stages[idx] = createStageState(STAGE_DEFS[idx]);
      renderAll();
    }

    function labelForTarget(cs, id) {
      if (id === 'EOL') return 'L.EOL';
      if (id === 'INVALID') return 'INVALID';
      if (id === 'HIDDEN') return '?';
      if (id === 'UNSET') return '(not set)';
      if (!id) return 'null';
      const found = cs.nodes.find(n => n.id === id);
      return found ? found.label : '(removed)';
    }

    function stageStats(stageIdx) {
      const st = app.stages[stageIdx];
      let total = 0;
      let solved = 0;
      let firstTry = 0;
      st.cases.forEach(c => {
        c.results.forEach(res => {
          total += 1;
          if (res !== null) solved += 1;
          if (res === 'first-try') firstTry += 1;
        });
      });
      return { total, solved, firstTry };
    }

    function renderTopScore() {
      let total = 0;
      let firstTry = 0;
      STAGE_DEFS.forEach((_, i) => {
        const s = stageStats(i);
        total += s.total;
        firstTry += s.firstTry;
      });
      el.scorePill.textContent = `First-try: ${firstTry}/${total}`;
    }

    function renderTabs() {
      el.tabs.innerHTML = '';
      STAGE_DEFS.forEach((def, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn';
        btn.setAttribute('role', 'tab');
        const selected = idx === app.activeStageIndex;
        btn.setAttribute('aria-selected', selected ? 'true' : 'false');
        btn.tabIndex = selected ? 0 : -1;

        const txt = document.createElement('span');
        txt.textContent = def.title;
        btn.appendChild(txt);

        const stats = stageStats(idx);
        if (stats.total > 0) {
          if (stats.solved === stats.total && stats.firstTry === stats.total) {
            const badge = document.createElement('span');
            badge.className = 'tab-badge mastered';
            badge.textContent = '✓';
            badge.title = `All ${stats.total} first-try correct!`;
            btn.appendChild(badge);
          } else if (stats.solved > 0 || stats.firstTry > 0) {
            const badge = document.createElement('span');
            badge.className = 'tab-badge partial';
            badge.textContent = `${stats.firstTry}/${stats.total}`;
            badge.title = `${stats.firstTry} of ${stats.total} first-try`;
            btn.appendChild(badge);
          }
        }

        btn.addEventListener('click', () => {
          app.activeStageIndex = idx;
          renderAll();
        });

        btn.addEventListener('keydown', e => {
          let nextIdx = null;
          if (e.key === 'ArrowRight') nextIdx = (idx + 1) % STAGE_DEFS.length;
          else if (e.key === 'ArrowLeft') nextIdx = (idx - 1 + STAGE_DEFS.length) % STAGE_DEFS.length;
          else if (e.key === 'Home') nextIdx = 0;
          else if (e.key === 'End') nextIdx = STAGE_DEFS.length - 1;
          if (nextIdx !== null) {
            e.preventDefault();
            app.activeStageIndex = nextIdx;
            renderAll();
            const newTab = el.tabs.querySelectorAll('[role="tab"]')[nextIdx];
            if (newTab) newTab.focus();
          }
        });

        el.tabs.appendChild(btn);
      });
    }

    function renderSubtabs() {
      const def = getActiveDef();
      const st = getActiveStage();
      if (def.cases.length <= 1) {
        el.subtabs.classList.add('hidden');
        return;
      }
      el.subtabs.classList.remove('hidden');
      el.subtabs.innerHTML = '';

      def.cases.forEach((cDef, cIdx) => {
        const cState = st.cases[cIdx];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'subtab-btn' + (cIdx === st.caseIndex ? ' active' : '');
        const firstCount = cState.results.filter(r => r === 'first-try').length;
        const done = cState.results.every(r => r !== null);
        const suffix = (done && firstCount === cDef.steps.length) ? ' ✓' : ` (${firstCount}/${cDef.steps.length})`;
        btn.textContent = cDef.title + suffix;
        btn.addEventListener('click', () => {
          st.caseIndex = cIdx;
          renderAll();
        });
        el.subtabs.appendChild(btn);
      });
    }

      if (step.kind === 'dual') {
        const pickedNode = cs.pendingNode ? labelForTarget(cs, cs.pendingNode) : null;
        if (cs.pendingVal !== null && cs.pendingNode !== null) {
          return `Ready to submit: value = "${cs.pendingVal}", p → ${pickedNode}. Click Check prediction.`;

        if (cs.pendingVal !== null) {
          return `Chosen value "${cs.pendingVal}". Now click a node box (or L.EOL) for p, then Check prediction.`;
        }
        if (cs.pendingNode !== null) {
          return `Chosen node "${pickedNode}". Now select a value option above, then Check prediction.`;
        }
        return 'Do 2 things: select a value option above AND click where p points below, then Check prediction.';
      }
      if (step.kind === 'mcq') {
        return 'Select one option below.';

      if (cs.p === 'INVALID') {
        return cs.q
          ? `p is INVALID; q points to ${labelForTarget(cs, cs.q)}. Click what q.next() returns below.`

      if (cs.p === 'HIDDEN') {

      }
      if (cs.p === 'UNSET') {
        return 'p starts unset. Click the node box (or L.EOL) where p lands.';
      }
      return `p starts on ${labelForTarget(cs, cs.p)}. Click where p finishes below.`;
    }
