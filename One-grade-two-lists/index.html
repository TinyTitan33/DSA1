      }

      g.appendChild(svgEl("rect", { x: RH.x, y: ry, width: RH.w, height: RH.h, rx: 14, fill: COLORS.cobalt }));
      g.appendChild(svgEl("rect", { x: RH.x + 12, y: ry, width: RH.w - 12, height: RH.h, rx: 12, fill: COLORS.ink }));
      g.appendChild(svgEl("text", {
        x: RH.x + 80, y: cy + 16, "text-anchor": "middle",
        class: "svg-ui", "font-size": 46, "font-weight": 600, fill: COLORS.panel,
      }, stu.name));
      g.appendChild(svgEl("circle", {
        cx: RH.x + RH.w, cy: cy, r: 9.5,
        fill: COLORS.cobalt, stroke: COLORS.panel, "stroke-width": 2.6,
      }));

      if (canTapHeader) {
        const tapRow = () => onSelectHeader("student", r);
        g.addEventListener("click", tapRow);
        g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapRow(); }
        });
      }
      layerHeaders.appendChild(g);
    });

    // Column headers (top)
    state.courses.forEach((crs, c) => {
      const cx = X_COLS[c];
      const rx = cx - CH.w / 2;
      const canTapHeader = state.step === 0 && !state.isAnimating && (state.predict.freeMode || state.predict.qIndex < PREDICT_QUESTIONS.length - 1);
      const isSelected = state.step === 0 && state.predict.selectedHeader && state.predict.selectedHeader.type === "course" && state.predict.selectedHeader.index === c;
      const isGuidedTarget = state.step === 0 && !state.predict.freeMode && PREDICT_QUESTIONS[state.predict.qIndex].type === "course" && PREDICT_QUESTIONS[state.predict.qIndex].index === c;
      const isBothGlow = state.step === 0 && state.predict.revealed && state.predict.activeChainType === "both" && c === 1;

      const g = svgEl("g", {
        "data-col-header": crs.name,
        "data-interactive": canTapHeader ? "true" : "false",
        "tabindex": canTapHeader ? "0" : "-1",
        "role": canTapHeader ? "button" : null,
        "aria-label": canTapHeader ? `Course ${crs.name}` : null,
      });

      g.appendChild(svgEl("rect", {
        x: cx - HIT_SZ / 2, y: 0, width: HIT_SZ, height: 168, rx: 14,
        fill: "transparent",
      }));

      if (isSelected || isBothGlow) {
        g.appendChild(svgEl("rect", {
          x: rx - 6, y: CH.y - 6, width: CH.w + 12, height: CH.h + 12, rx: 18,
          fill: "none", stroke: COLORS.saffronOutline, "stroke-width": 5.5,
        }));
      } else if (isGuidedTarget && !state.predict.selectedHeader) {
        g.appendChild(svgEl("rect", {
          x: rx - 5, y: CH.y - 5, width: CH.w + 10, height: CH.h + 10, rx: 17,
          fill: "none", stroke: COLORS.saffronOutline, "stroke-width": 3.6, "stroke-dasharray": "9 6",
        }));
      }

      g.appendChild(svgEl("rect", { x: rx, y: CH.y, width: CH.w, height: CH.h, rx: 14, fill: COLORS.saffron }));
      g.appendChild(svgEl("rect", { x: rx, y: CH.y + 11, width: CH.w, height: CH.h - 11, rx: 12, fill: COLORS.ink }));
      g.appendChild(svgEl("text", {
        x: cx, y: CH.y + 52, "text-anchor": "middle",
        class: "svg-ui", "font-size": 46, "font-weight": 600, fill: COLORS.panel,
      }, crs.name));
      g.appendChild(svgEl("circle", {
        cx: cx, cy: CH.y + CH.h, r: 9.5,
        fill: COLORS.saffron, stroke: COLORS.saffronOutline, "stroke-width": 2.6,
      }));

      if (canTapHeader) {
        const tapCol = () => onSelectHeader("course", c);
        g.addEventListener("click", tapCol);
        g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapCol(); }
        });
      }
      layerHeaders.appendChild(g);
    });

    // Draw all pointers directly from live node/header pointers
    drawAllPointers(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, membership);

    // Extras (+50 stack / Teacher headers)
    if (state.step === 1 && state.add.extraStudents > 0) {
      drawFiftyStack(layerExtras);
    }
    if (state.step === 3 && state.teacher.enabled) {
      drawTeacherHeaders(layerHeaders);
    }

    // Draw nodes (cards in layerNodes, digits/badges/dots in layerNodeContent above crossing arrows)
    for (const node of state.nodes) {
      drawGradeNode(layerNodes, layerNodeContent, layerExtras, node, membership);
    }

    updateSvgDescription();
  }

  function isNodeOnAnyChain(node, membership) {
    return (
      membership.onStudent[node.r].has(node.id) ||
      membership.onCourse[node.c].has(node.id) ||
      membership.onTeacher.has(node.id)
    );
  }

  function drawGradeNode(layer, contentLayer, layerExtras, node, membership) {
    const cx = X_COLS[node.c];
    const cy = Y_ROWS[node.r];
    const rx = cx - NODE_W / 2;
    const ry = cy - NODE_H / 2;

    const isStep1 = state.step === 0;
    const isStep2 = state.step === 1;
    const isStep3 = state.step === 2;
    const isStep4 = state.step === 3;

    const onAnyChain = isNodeOnAnyChain(node, membership);
    const isGhost = isStep2 && !onAnyChain;

    let fill = isGhost ? "none" : COLORS.panel;
    let opacity = isGhost ? 0.55 : 1;
    let interactive = false;
    const ariaLabel = `${STUDENTS[node.r]} ${COURSES[node.c]} grade ${node.grade}`;

    if (isStep1) {
      const p = state.predict;
      const isBothQ = !p.freeMode && p.qIndex === PREDICT_QUESTIONS.length - 1;
      interactive = !state.isAnimating && !p.revealed && (isBothQ || p.selectedHeader !== null);

      if (p.activeChainType === "both" && (p.mattiIds.has(node.id) || p.dsa1Ids.has(node.id))) {
        const onMatti = p.mattiIds.has(node.id);
        const onDsa1 = p.dsa1Ids.has(node.id);
        if (onMatti && onDsa1) fill = COLORS.panel;
        else if (onMatti) fill = "rgba(47, 93, 168, 0.18)";
        else fill = "rgba(224, 162, 27, 0.24)";
      } else if (p.visitedIds.has(node.id)) {
        if (p.activeChainType === "student") fill = "rgba(47, 93, 168, 0.20)";
        else if (p.activeChainType === "course") fill = "rgba(224, 162, 27, 0.26)";
      } else if (p.markedIds.has(node.id)) {
        fill = "url(#hatchPattern)";
      }
    } else if (isStep2) {
      if (!isGhost && state.add.newNodeId !== node.id) opacity = 0.72;
      interactive = !state.isAnimating;
    } else if (isStep3) {
      interactive = !state.isAnimating;
      if (state.del.visitedIds.has(node.id)) {
        fill = state.del.activeChain === "course" ? "rgba(224, 162, 27, 0.26)" : "rgba(47, 93, 168, 0.20)";
      }
      if (state.del.fadingNodeId === node.id) {
        opacity = 1;
      }
    } else if (isStep4) {
      if (state.teacher.matchedIds.has(node.id)) fill = "rgba(94, 125, 58, 0.24)";
      else if (state.teacher.visitedIds.has(node.id)) fill = "rgba(154, 147, 138, 0.20)";
    }

    const g = svgEl("g", {
      "data-node-id": node.id,
      "data-cell": `${node.r}-${node.c}`,
      "data-ghost": isGhost ? "true" : "false",
      "data-interactive": interactive ? "true" : "false",
      "data-disabled": isStep2 ? "true" : "false",
      "tabindex": interactive ? "0" : "-1",
      "role": interactive ? "button" : null,
      "aria-label": interactive ? ariaLabel : null,
      opacity,
    });

    if (isStep3 && state.del.suggestPulse && !state.del.selectedNodeId && node.r === 2 && node.c === 2) {
      g.classList.add("pulse-hint");
    }
    if (isStep1 && state.predict.bothPulse && node.r === 0 && node.c === 1) {
      g.classList.add("pulse-once");
    }

    g.appendChild(svgEl("rect", {
      x: cx - HIT_SZ / 2, y: node.r === 0 ? 168.5 : cy - HIT_SZ / 2, width: HIT_SZ, height: HIT_SZ, rx: 16,
      fill: "transparent",
    }));

    g.appendChild(svgEl("rect", {
      "data-main-rect": "true",
      x: rx, y: ry, width: NODE_W, height: NODE_H, rx: 14,
      fill,
      stroke: isGhost ? COLORS.muted : COLORS.ink,
      "stroke-width": isGhost ? 3.2 : 1.8,
      "stroke-opacity": isGhost ? 0.95 : 0.42,
      "stroke-dasharray": isGhost ? "9 6" : "none",
    }));

    if (!isGhost) {
      const cr = 14;
      g.appendChild(svgEl("line", { x1: rx + cr, y1: ry, x2: rx + NODE_W - cr, y2: ry, stroke: COLORS.saffronOutline, "stroke-width": 5.2, "stroke-linecap": "round" }));
      g.appendChild(svgEl("line", { x1: rx + cr, y1: ry + NODE_H, x2: rx + NODE_W - cr, y2: ry + NODE_H, stroke: COLORS.saffronOutline, "stroke-width": 5.2, "stroke-linecap": "round" }));
      g.appendChild(svgEl("line", { x1: rx, y1: ry + cr, x2: rx, y2: ry + NODE_H - cr, stroke: COLORS.cobalt, "stroke-width": 4.8, "stroke-linecap": "round" }));
      g.appendChild(svgEl("line", { x1: rx + NODE_W, y1: ry + cr, x2: rx + NODE_W, y2: ry + NODE_H - cr, stroke: COLORS.cobalt, "stroke-width": 4.8, "stroke-linecap": "round" }));
    }

    if (isStep1 && state.predict.markedIds.has(node.id) && !state.predict.revealed) {
      g.appendChild(svgEl("rect", {
        x: rx - 6, y: ry - 6, width: NODE_W + 12, height: NODE_H + 12, rx: 18,
        fill: "none", stroke: COLORS.ink, "stroke-width": 3.8, "stroke-dasharray": "8 5",
      }));
    }

    if (isStep1 && state.predict.feedback && state.predict.feedback.bothId === node.id) {
      g.appendChild(svgEl("rect", {
        x: rx - 7, y: ry - 7, width: NODE_W + 14, height: NODE_H + 14, rx: 18,
        fill: "none", stroke: COLORS.saffronOutline, "stroke-width": 5.4,
      }));
      g.appendChild(svgEl("rect", {
        x: rx - 14, y: ry - 14, width: NODE_W + 28, height: NODE_H + 28, rx: 21,
        fill: "none", stroke: COLORS.cobalt, "stroke-width": 5.0,
      }));
    }

    const contentOpacity = isGhost ? 0.85 : opacity;
    const contentG = svgEl("g", {
      "data-node-content": node.id,
      "data-cell": `${node.r}-${node.c}`,
      opacity: contentOpacity,
    });
    if (isStep3 && state.del.suggestPulse && !state.del.selectedNodeId && node.r === 2 && node.c === 2) {
      contentG.classList.add("pulse-hint");
    }
    if (isStep1 && state.predict.bothPulse && node.r === 0 && node.c === 1) {
      contentG.classList.add("pulse-once");
    }

    if (isStep1 && state.predict.feedback) {
      const fb = state.predict.feedback;
      if (fb.correctIds.has(node.id)) {
        contentG.appendChild(svgEl("circle", { cx: rx + NODE_W - 22, cy: ry + 24, r: 16, fill: COLORS.correct }));
        contentG.appendChild(svgEl("path", {
          d: `M ${rx + NODE_W - 30} ${ry + 24} l 5 5 l 11 -11`,
          fill: "none", stroke: "#FFFDF8", "stroke-width": 3.6, "stroke-linecap": "round", "stroke-linejoin": "round",
        }));
      }
      if (fb.missedIds.has(node.id)) {
        g.appendChild(svgEl("rect", {
          x: rx - 8, y: ry - 8, width: NODE_W + 16, height: NODE_H + 16, rx: 18,
          fill: "none", stroke: COLORS.brick, "stroke-width": 5.0,
        }));
      }
      if (fb.extraIds.has(node.id)) {
        contentG.appendChild(svgEl("circle", { cx: rx + NODE_W - 22, cy: ry + 24, r: 16, fill: COLORS.brick }));
        contentG.appendChild(svgEl("path", {
          d: `M ${rx + NODE_W - 28} ${ry + 18} l 12 12 M ${rx + NODE_W - 16} ${ry + 18} l -12 12`,
          fill: "none", stroke: "#FFFDF8", "stroke-width": 3.6, "stroke-linecap": "round",
        }));
      }
    }

    if (isStep3 && state.del.selectedNodeId === node.id) {
      g.appendChild(svgEl("rect", {
        x: rx - 8, y: ry - 8, width: NODE_W + 16, height: NODE_H + 16, rx: 18,
        fill: "none", stroke: COLORS.brick, "stroke-width": 5.0,
      }));
    }

    // "fail" shown inside the node under the digit (Fix 3)
    const showFailInside = isStep1 && state.predict.feedback && state.predict.activeChainType === "course" && state.predict.visitedIds.has(node.id) && node.grade === 0;
    const digitY = showFailInside ? cy + 2 : cy + 22;

    contentG.appendChild(svgEl("text", {
      x: cx, y: digitY, "text-anchor": "middle",
      class: "svg-ui", "font-size": 69, "font-weight": 700, fill: COLORS.ink,
    }, String(node.grade)));

    if (showFailInside) {
      contentG.appendChild(svgEl("text", {
        x: cx, y: cy + 52, "text-anchor": "middle",
        "data-fail-label": node.id,
        class: "svg-ui", "font-size": 46, "font-weight": 700, fill: COLORS.muted,
      }, "fail"));
    }

    // Teacher corner badge (Step 4)
    if (isStep4) {
      contentG.appendChild(svgEl("rect", {
        x: rx + 8, y: ry + 8, width: 44, height: 44, rx: 9,
        fill: node.teacher === "V" ? COLORS.moss : COLORS.linen,
        stroke: node.teacher === "V" ? COLORS.moss : COLORS.muted,
        "stroke-width": 2.2,
      }));
      contentG.appendChild(svgEl("text", {
        x: rx + 30, y: ry + 43, "text-anchor": "middle",
        class: "svg-ui", "font-size": 46, "font-weight": 700,
        fill: node.teacher === "V" ? "#FFFDF8" : COLORS.ink,
      }, node.teacher));
    }

    // "g" tag on new node during Step 2 insert (stays clear of routes)
    if (isStep2 && state.add.newNodeId === node.id) {
      const tagG = svgEl("g", { "data-g-tag": "true" });
      tagG.appendChild(svgEl("rect", {
        x: rx - 38, y: ry - 48, width: 42, height: 46, rx: 9,
        fill: COLORS.panel, stroke: COLORS.ink, "stroke-width": 2.4,
      }));
      tagG.appendChild(svgEl("text", {
        x: rx - 17, y: ry - 12, "text-anchor": "middle",
        class: "svg-mono", "font-size": 46, "font-weight": 700, fill: COLORS.ink,
      }, "g"));
      layerExtras.appendChild(tagG);
    }

    // Pointer dots (on top of crossing arrows)
    contentG.appendChild(svgEl("circle", {
      cx: rx + NODE_W, cy: cy, r: 9.5,
      fill: COLORS.cobalt, stroke: COLORS.panel, "stroke-width": 2.6,
    }));
    contentG.appendChild(svgEl("circle", {
      cx: cx, cy: ry + NODE_H, r: 9.5,
      fill: COLORS.saffron, stroke: COLORS.saffronOutline, "stroke-width": 2.6,
    }));
    if (isStep4 && state.teacher.enabled) {
      contentG.appendChild(svgEl("circle", {
        cx: cx + 59, cy: ry + NODE_H, r: 9,
        fill: COLORS.moss, stroke: COLORS.panel, "stroke-width": 2.4,
      }));
    }
    contentLayer.appendChild(contentG);

    if (isStep1 && interactive) {
      const tapNode = () => onPredictTapNode(node.id);
      g.addEventListener("click", tapNode);
      g.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapNode(); }
      });
    } else if (isStep2 && !state.isAnimating) {
      g.addEventListener("click", () => {
        state.add.cellNote = `${STUDENTS[node.r]} ${COURSES[node.c]} already has a grade.`;
        setAnnouncement(state.add.cellNote, "warn");
        renderSidePanel();
      });
    } else if (isStep3 && interactive) {
      const tapDel = () => onDeleteNode(node.id);
      g.addEventListener("click", tapDel);
      g.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapDel(); }
      });
    }

    layer.appendChild(g);
  }

  // ------------------------------------------------------------------
  // Draw-In Animation with Synchronized Arrowhead + Walking Dot (Fixes 3 & 4)
  // ------------------------------------------------------------------
  function setWalkerDot(pos, color, strokeColor = COLORS.panel) {
    const overlay = document.getElementById("layerOverlay");
    overlay.innerHTML = "";
    if (!pos) return;
    overlay.appendChild(svgEl("circle", {
      cx: pos.x, cy: pos.y, r: 14,
      fill: color, stroke: strokeColor, "stroke-width": 3.8,
    }));
  }

  function animateArrowDraw(chain, fromId, toId, durMs, token) {
    return new Promise((resolve) => {
      if (token !== state.animToken) { resolve(false); return; }
      const g = document.querySelector(
        `#layerArrows g[data-chain="${chain}"][data-from="${fromId}"][data-to="${toId}"], ` +
        `#layerCrossArrows g[data-chain="${chain}"][data-from="${fromId}"][data-to="${toId}"]`
      );
      const pathEl = g ? g.querySelector(".arrow-path") : null;
      const outEl = g ? g.querySelector(".arrow-outline") : null;
      if (!pathEl || reducedMotion() || chain === "teacher") {
        setTimeout(() => resolve(token === state.animToken), durMs);
        return;
      }

      const totalLen = pathEl.getTotalLength();
      [pathEl, outEl].filter(Boolean).forEach((el) => {
        el.style.strokeDasharray = `${totalLen}`;
        el.style.strokeDashoffset = `${totalLen}`;
      });

      // Moving arrowhead that rides the tip of the growing line (never shown at destination early)
      const overlay = document.getElementById("layerOverlay");
      const tipPath = chain === "course"
        ? svgEl("path", { d: "M -24 -12 L 4 0 L -24 12 z", fill: COLORS.saffron, stroke: COLORS.saffronOutline, "stroke-width": 2.6, "stroke-linejoin": "round" })
        : svgEl("path", { d: "M -20 -10 L 3 0 L -20 10 z", fill: COLORS.cobalt });
      overlay.appendChild(tipPath);

      const start = performance.now();
      function frame(now) {
        if (token !== state.animToken) {
          tipPath.remove();
          resolve(false);
          return;
        }
        const t = Math.min(1, (now - start) / Math.max(1, durMs));
        const curLen = t * totalLen;
        [pathEl, outEl].filter(Boolean).forEach((el) => {
          el.style.strokeDashoffset = `${totalLen - curLen}`;
        });
        const pt = pathEl.getPointAtLength(curLen);
        const ptPrev = pathEl.getPointAtLength(Math.max(0, curLen - 2));
        const angle = Math.atan2(pt.y - ptPrev.y, pt.x - ptPrev.x) * (180 / Math.PI);
        tipPath.setAttribute("transform", `translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) rotate(${angle.toFixed(2)})`);

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          tipPath.remove();
          pathEl.setAttribute("marker-end", chain === "course" ? "url(#tip-saffron)" : "url(#tip-cobalt)");
          resolve(true);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function animateSegment(from, to, color, strokeColor, durMs, token) {
    return new Promise((resolve) => {
      if (token !== state.animToken) { resolve(false); return; }
      if (reducedMotion()) {
        setWalkerDot(to, color, strokeColor);
        setTimeout(() => resolve(token === state.animToken), durMs);
        return;
      }
      const start = performance.now();
      function frame(now) {
        if (token !== state.animToken) { resolve(false); return; }
        const t = Math.min(1, (now - start) / Math.max(1, durMs));
        setWalkerDot({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t }, color, strokeColor);
        if (t < 1) requestAnimationFrame(frame);
        else resolve(true);
      }
      requestAnimationFrame(frame);
    });
  }

  function animateAlongPath(chain, fromId, toId, fallbackEnd, color, strokeColor, durMs, token) {
    return new Promise((resolve) => {
      if (token !== state.animToken) { resolve(false); return; }
      const g = document.querySelector(
        `#layerArrows g[data-chain="${chain}"][data-from="${fromId}"][data-to="${toId}"], ` +
        `#layerCrossArrows g[data-chain="${chain}"][data-from="${fromId}"][data-to="${toId}"]`
      );
      const pathEl = g ? g.querySelector(".arrow-path") : null;
      if (!pathEl || reducedMotion()) {
        setWalkerDot(fallbackEnd, color, strokeColor);
        setTimeout(() => resolve(token === state.animToken), durMs);
        return;
      }
      const totalLen = pathEl.getTotalLength();
      const start = performance.now();
      function frame(now) {
        if (token !== state.animToken) { resolve(false); return; }
        const t = Math.min(1, (now - start) / Math.max(1, durMs));
        const pt = pathEl.getPointAtLength(t * totalLen);
        setWalkerDot({ x: pt.x, y: pt.y }, color, strokeColor);
        if (t < 1) requestAnimationFrame(frame);
        else resolve(true);
      }
      requestAnimationFrame(frame);
    });
  }

  // ------------------------------------------------------------------
  // Side Panel Rendering
  // ------------------------------------------------------------------
  function renderSidePanel() {
    const panel = document.getElementById("sidePanel");
    panel.innerHTML = "";

    const feedbackStrip = document.createElement("div");
    feedbackStrip.className = "feedback-strip";

    const controlsStrip = document.createElement("div");
    controlsStrip.className = "controls-strip";

    if (state.step === 0) renderStep1Panel(feedbackStrip, controlsStrip);
    else if (state.step === 1) renderStep2Panel(feedbackStrip, controlsStrip);
    else if (state.step === 2) renderStep3Panel(feedbackStrip, controlsStrip);
    else renderStep4Panel(feedbackStrip, controlsStrip);

    const liveBox = document.createElement("div");
    liveBox.id = "ariaLiveBox";
    liveBox.className = `live-result ${state.liveAnnouncementTone}`;
    liveBox.setAttribute("aria-live", "polite");
    liveBox.innerHTML = state.liveAnnouncementHtml;
    feedbackStrip.appendChild(liveBox);

    const sideLegend = document.getElementById("legendStrip").cloneNode(true);
    sideLegend.id = "sideLegend";
    sideLegend.className = "legend-strip side-legend";
    controlsStrip.appendChild(sideLegend);

    panel.appendChild(feedbackStrip);
    panel.appendChild(controlsStrip);
  }

  function renderStep1Panel(feedbackStrip, controlsStrip) {
    const p = state.predict;
    const isBothQ = !p.freeMode && p.qIndex === PREDICT_QUESTIONS.length - 1;
    const qLabel = p.freeMode ? "Free mode: any chain" : `Question ${p.qIndex + 1} of ${PREDICT_QUESTIONS.length}`;

    const counters = document.createElement("div");
    counters.className = "counter-row";
    if (isBothQ) {
      counters.innerHTML = `<div class="stat-chip" id="visitedCounter">${p.revealed ? "On both chains: 1 node" : "On both chains: —"}</div>`;
    } else {
      const visitedLabel = p.visitedCount === null ? "visited: —" : `visited: ${p.visitedCount}`;
      const chipCls = p.activeChainType === "course" ? "saffron" : (p.activeChainType === "student" ? "cobalt" : "");
      counters.innerHTML = `
        <div class="stat-chip ${chipCls}" id="visitedCounter">${visitedLabel}</div>
        <div class="stat-chip">scanning all grades: 7</div>
      `;
    }
    feedbackStrip.appendChild(counters);

    const hdrDiv = document.createElement("div");
    hdrDiv.className = "panel-section";
    hdrDiv.innerHTML = `<div class="panel-label">${qLabel}</div>`;

    const actionRow = document.createElement("div");
    actionRow.className = "action-row";

    const revealBtn = document.createElement("button");
    revealBtn.type = "button";
    revealBtn.id = "revealBtn";
    revealBtn.className = "primary-btn";
    revealBtn.textContent = "Reveal";
    revealBtn.disabled = state.isAnimating || p.revealed || (isBothQ ? p.markedIds.size !== 1 : !p.selectedHeader);
    revealBtn.addEventListener("click", onRevealPredict);
    actionRow.appendChild(revealBtn);

    if (!p.freeMode) {
      const nextQBtn = document.createElement("button");
      nextQBtn.type = "button";
      nextQBtn.id = "nextQBtn";
      nextQBtn.textContent = p.qIndex < PREDICT_QUESTIONS.length - 1 ? "Next question" : "Free mode";
      nextQBtn.disabled = state.isAnimating || !p.revealed;
      nextQBtn.addEventListener("click", onNextPredictQuestion);
      actionRow.appendChild(nextQBtn);
    }

    hdrDiv.appendChild(actionRow);
    controlsStrip.appendChild(hdrDiv);
  }

  function renderStep2Panel(feedbackStrip, controlsStrip) {
    const a = state.add;

    const counters = document.createElement("div");
    counters.className = "counter-row";
    counters.innerHTML = `<div class="stat-chip ${a.writes > 2 ? "saffron" : (a.writes > 0 ? "cobalt" : "")}" id="writesCounter">reference writes: ${a.writes}</div>`;

    const codeRow = a.selectedCell ? a.selectedCell.r : (a.lastInserted ? a.lastInserted.r : null);
    const codeCol = a.selectedCell ? a.selectedCell.c : (a.lastInserted ? a.lastInserted.c : null);
    if (codeCol !== null || a.extraStudents > 0) {
      const targetCourseIdx = codeCol !== null ? codeCol : 0;
      const conceptualLen = walkChain(state.courses[targetCourseIdx].first, "nextOfCourse").length + a.extraStudents;
      counters.innerHTML += `<div class="stat-chip">${COURSES[targetCourseIdx]} chain length: ${conceptualLen}</div>`;
    }
    feedbackStrip.appendChild(counters);

    const stuVar = codeRow !== null ? STUDENTS[codeRow].toLowerCase() : "student";
    const crsVar = codeCol !== null ? COURSES[codeCol].toLowerCase() : "course";
    const lines = [
      `g.nextOfStudent = ${stuVar}.first;`,
      `${stuVar}.first = g;`,
      `g.nextOfCourse = ${crsVar}.first;`,
      `${crsVar}.first = g;`,
    ];
    const codeCard = document.createElement("div");
    codeCard.className = "code-card";
    lines.forEach((line, idx) => {
      const row = document.createElement("div");
      row.className = "code-line";
      if (a.activeLine === idx) row.classList.add(idx < 2 ? "active-cobalt" : "active-saffron");
      row.textContent = line;
      codeCard.appendChild(row);
    });
    feedbackStrip.appendChild(codeCard);

    const pickSec = document.createElement("div");
    pickSec.className = "panel-section";
    pickSec.innerHTML = `<div class="panel-label">Choose grade (0 = fail, 5 = max)</div>`;

    const picker = document.createElement("div");
    picker.className = "grade-picker";
    for (let g = 0; g <= 5; g++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "grade-btn";
      btn.textContent = String(g);
      btn.setAttribute("aria-pressed", a.selectedGrade === g ? "true" : "false");
      btn.disabled = state.isAnimating || a.insertCount >= 2;
      btn.addEventListener("click", () => {
        state.add.selectedGrade = g;
        renderTopBar();
        renderSidePanel();
      });
      picker.appendChild(btn);
    }
    pickSec.appendChild(picker);

    const actionRow = document.createElement("div");
    actionRow.className = "action-row";

    const insertBtn = document.createElement("button");
    insertBtn.type = "button";
    insertBtn.id = "insertBtn";
    insertBtn.className = "primary-btn";
    insertBtn.textContent = "Insert";
    insertBtn.disabled = state.isAnimating || !a.selectedCell || a.selectedGrade === null || a.insertCount >= 2;
    insertBtn.addEventListener("click", onInsertGrade);
    actionRow.appendChild(insertBtn);

    const fiftyBtn = document.createElement("button");
    fiftyBtn.type = "button";
    fiftyBtn.id = "fiftyBtn";
    fiftyBtn.textContent = a.extraStudents > 0 ? "50 more students added" : "Add 50 more students";
    fiftyBtn.disabled = state.isAnimating || a.extraStudents > 0;
    fiftyBtn.addEventListener("click", onAddFiftyStudents);
    actionRow.appendChild(fiftyBtn);

    pickSec.appendChild(actionRow);
    controlsStrip.appendChild(pickSec);
  }

  function renderStep3Panel(feedbackStrip, controlsStrip) {
    const d = state.del;

    const counters = document.createElement("div");
    counters.className = "counter-row";
    counters.innerHTML = `
      <div class="stat-chip cobalt" id="stuWalkChip">visited (student chain): ${d.studentWalkCount}</div>
      <div class="stat-chip saffron" id="crsWalkChip">visited (course chain): ${d.courseWalkCount}</div>
    `;
    feedbackStrip.appendChild(counters);

    const codeCard = document.createElement("div");
    codeCard.className = "code-card";
    if (d.codeLines.length === 0) {
      const placeholder = document.createElement("div");
      placeholder.className = "code-line";
      placeholder.textContent = "// Tap any grade node to unlink it";
      codeCard.appendChild(placeholder);
    } else {
      d.codeLines.forEach((entry, idx) => {
        const row = document.createElement("div");
        row.className = "code-line";
        if (d.activeLine === idx) row.classList.add(entry.chain === "course" ? "active-saffron" : "active-cobalt");

        codeCard.appendChild(row);
      });

      doublyBox.innerHTML = `With a <code>prev</code> reference in each chain (doubly linked), we could unlink right away, but each node then holds 6 references.`;
      controlsStrip.appendChild(doublyBox);
    }
  }

  function renderAll() {
    renderTopBar();
    renderSvgGrid();
    renderSidePanel();
  }

  // ------------------------------------------------------------------
  // Step 1 Handlers
  // ------------------------------------------------------------------
  function onSelectHeader(type, index) {
    if (state.isAnimating || state.step !== 0) return;
    const p = state.predict;
    if (!p.freeMode) {
      const q = PREDICT_QUESTIONS[p.qIndex];
      if (q.type !== type || q.index !== index) {
        setAnnouncement(`For Question ${p.qIndex + 1}, tap <strong>${q.label}</strong>.`, "warn");
        return;
      }
    }
    p.selectedHeader = { type, index };
    p.markedIds = new Set();
    p.visitedIds = new Set();
    p.revealed = false;
    p.feedback = null;
    p.visitedCount = null;
    p.activeChainType = type;
    const hName = type === "student" ? STUDENTS[index] : COURSES[index];
    setAnnouncement(`Selected: ${hName}. Marked nodes: 0.`, "");
    renderAll();
  }

  function onPredictTapNode(nodeId) {
    if (state.isAnimating || state.step !== 0 || state.predict.revealed) return;
    const p = state.predict;
    const isBothQ = !p.freeMode && p.qIndex === PREDICT_QUESTIONS.length - 1;
    if (isBothQ) {
      p.markedIds = new Set([nodeId]);
      setAnnouncement("Node picked. Tap Reveal to check.", "");
    } else {
      if (!p.selectedHeader) return;
      if (p.markedIds.has(nodeId)) p.markedIds.delete(nodeId);
      else p.markedIds.add(nodeId);
      const hName = p.selectedHeader.type === "student" ? STUDENTS[p.selectedHeader.index] : COURSES[p.selectedHeader.index];
      setAnnouncement(`Selected: ${hName}. Marked nodes: ${p.markedIds.size}.`, "");
    }
    renderAll();
  }

  async function walkSingleChainForPredict(chainType, idx, color, strokeCol, token, keepPreviousIds = false) {
    const p = state.predict;
    const headerObj = chainType === "student" ? state.students[idx] : state.courses[idx];
    const nextProp = chainType === "student" ? "nextOfStudent" : "nextOfCourse";
    const chain = walkChain(headerObj.first, nextProp);

    const keys = new Set();
    if (chain.length) {
      keys.add(`${chainType}:${headerObj.id}->${chain[0].id}`);
      for (let i = 0; i < chain.length - 1; i++) keys.add(`${chainType}:${chain[i].id}->${chain[i + 1].id}`);
    }
    state.walkedArrowKeys = keys;
    renderSvgGrid();

    let prevId = headerObj.id;
    let prevPos = headerExitPos(chainType, idx);
    setWalkerDot(prevPos, color, strokeCol);
    if (!(await sleep(stepDelay(0.45), token))) return null;

    for (let i = 0; i < chain.length; i++) {
      const node = chain[i];
      const ePos = entryPos(node, chainType);
      if (i > 0) {
        const xPos = exitPos(chain[i - 1], chainType);
        if (!(await animateSegment(prevPos, xPos, color, strokeCol, stepDelay(0.32), token))) return null;
      }
      if (!(await animateAlongPath(chainType, prevId, node.id, ePos, color, strokeCol, stepDelay(0.85), token))) return null;

      p.visitedIds.add(node.id);
      if (keepPreviousIds) {
        if (chainType === "student") p.mattiIds.add(node.id);
        else p.dsa1Ids.add(node.id);
      } else {
        p.visitedCount++;
      }
      renderSvgGrid();
      setWalkerDot(ePos, color, strokeCol);
      const vc = document.getElementById("visitedCounter");
      if (vc && !keepPreviousIds) vc.textContent = `visited: ${p.visitedCount}`;
      if (!(await sleep(stepDelay(0.45), token))) return null;

      prevId = node.id;
      prevPos = ePos;
    }

    if (chain.length > 0) {
      const lastNode = chain[chain.length - 1];
      const xPos = exitPos(lastNode, chainType);
      if (!(await animateSegment(prevPos, xPos, color, strokeCol, stepDelay(0.32), token))) return null;
      const nullEnd = chainType === "student" ? { x: xPos.x + 12, y: xPos.y } : { x: xPos.x, y: xPos.y + 12 };
      if (!(await animateSegment(xPos, nullEnd, color, strokeCol, stepDelay(0.35), token))) return null;
    }
    setWalkerDot(null);
    return chain;
  }

  async function onRevealPredict() {
    if (state.isAnimating || state.step !== 0) return;
    const p = state.predict;
    const isBothQ = !p.freeMode && p.qIndex === PREDICT_QUESTIONS.length - 1;
    const token = ++state.animToken;
    state.isAnimating = true;
    scrollGridIntoView();
    renderAll();

    if (isBothQ) {
      const pickedId = Array.from(p.markedIds)[0];
      const targetNode = nodeAt(0, 1);

      p.visitedIds = new Set();
      p.mattiIds = new Set();
      p.dsa1Ids = new Set();
      p.activeChainType = "both";

      const mattiOk = await walkSingleChainForPredict("student", 0, COLORS.cobalt, COLORS.panel, token, true);
      if (!mattiOk) return;
      const dsa1Ok = await walkSingleChainForPredict("course", 1, COLORS.saffron, COLORS.saffronOutline, token, true);
      if (!dsa1Ok) return;

      const bothKeys = new Set();
      mattiOk.forEach((n, i) => bothKeys.add(`student:${i === 0 ? state.students[0].id : mattiOk[i - 1].id}->${n.id}`));
      dsa1Ok.forEach((n, i) => bothKeys.add(`course:${i === 0 ? state.courses[1].id : dsa1Ok[i - 1].id}->${n.id}`));
      state.walkedArrowKeys = bothKeys;

      p.revealed = true;
      p.bothPulse = true;
      p.feedback = {
        correctIds: pickedId === targetNode.id ? new Set([targetNode.id]) : new Set(),
        missedIds: pickedId === targetNode.id ? new Set() : new Set([targetNode.id]),
        extraIds: pickedId !== targetNode.id ? new Set([pickedId]) : new Set(),
        bothId: targetNode.id,
      };
      const msg = `<strong>Same object, not a copy.</strong> Matti's chain and DSA1's chain both reach this one node.`;
      state.isAnimating = false;
      renderAll();
      setAnnouncement(msg, "both");
      return;
    }

    const { type, index } = p.selectedHeader;
    const color = type === "student" ? COLORS.cobalt : COLORS.saffron;
    const strokeCol = type === "student" ? COLORS.panel : COLORS.saffronOutline;
    p.visitedIds = new Set();
    p.visitedCount = 0;
    p.activeChainType = type;

    const chain = await walkSingleChainForPredict(type, index, color, strokeCol, token, false);
    if (!chain) return;

    const actualIds = new Set(chain.map((n) => n.id));
    const correctIds = new Set([...p.markedIds].filter((id) => actualIds.has(id)));
    const missedIds = new Set([...actualIds].filter((id) => !p.markedIds.has(id)));
    const extraIds = new Set([...p.markedIds].filter((id) => !actualIds.has(id)));

    p.feedback = { correctIds, missedIds, extraIds, bothId: null };
    p.revealed = true;

    let msg;
    if (type === "student") {
      const names = chain.map((n) => COURSES[n.c]).join(", ");
      msg = `${STUDENTS[index]}'s chain: ${names}. <strong>${chain.length} visits instead of 7.</strong>`;
    } else {
      const passed = chain.filter((n) => n.grade > 0).map((n) => STUDENTS[n.r]);
      const notPassed = chain.filter((n) => n.grade === 0).map((n) => STUDENTS[n.r]);
      const passedText = passed.length ? passed.join(" and ") : "none";
      const npNote = notPassed.length ? ` (${notPassed.join(", ")}: not passed)` : "";
      msg = `${COURSES[index]}: visited ${chain.length}, passed <strong>${passedText}</strong>${npNote}.`;
    }
    const tone = missedIds.size === 0 && extraIds.size === 0 ? "good" : "warn";

    state.isAnimating = false;
    renderAll();
    setAnnouncement(msg, tone);
  }

  function onNextPredictQuestion() {
    if (state.isAnimating) return;
    const p = state.predict;
    state.walkedArrowKeys = null;
    if (p.qIndex < PREDICT_QUESTIONS.length - 1) p.qIndex++;
    else p.freeMode = true;

    p.selectedHeader = null;
    p.markedIds = new Set();
    p.visitedIds = new Set();
    p.mattiIds = new Set();
    p.dsa1Ids = new Set();
    p.revealed = false;
    p.feedback = null;
    p.visitedCount = null;
    p.activeChainType = null;
    p.bothPulse = false;
    setAnnouncement(p.qIndex === PREDICT_QUESTIONS.length - 1 && !p.freeMode ? "Tap one node, then press Reveal." : "No header selected yet.", "");
    renderAll();
  }

  // ------------------------------------------------------------------
  // Step 2 Handlers (Fixes 1, 2, 4, 7, 8)
  // ------------------------------------------------------------------
  function onSelectEmptyCell(r, c) {
    if (state.isAnimating || state.step !== 1) return;
    const a = state.add;
    if (a.insertCount === 1 && a.extraStudents === 0) {
      setAnnouncement("Press Add 50 more students first before filling the second cell.", "warn");
      return;
    }
    if (a.insertCount >= 2) return;
    a.selectedCell = { r, c };
    a.cellNote = "";
    a.activeLine = -1;
    a.writes = 0;
    setAnnouncement(`Target cell: ${STUDENTS[r]} / ${COURSES[c]}.`, "");
    renderAll();
  }

  async function onInsertGrade() {
    if (state.isAnimating || state.step !== 1) return;
    const a = state.add;
    if (!a.selectedCell || a.selectedGrade === null) return;
    const { r, c } = a.selectedCell;
    if (nodeAt(r, c)) return;

    const token = ++state.animToken;
    state.isAnimating = true;
    scrollGridIntoView();
    a.writes = 0;
    a.cellNote = "";

    // Node appears BEFORE line 1 (ghosted, on no chain yet, both pointers null, with "g" tag)
    const newNode = {
      id: `n${state.nextNodeId++}`,
      r,
      c,
      grade: a.selectedGrade,
      teacher: "V",
      nextOfStudent: null,
      nextOfCourse: null,
      nextOfTeacher: null,
    };
    state.nodes.push(newNode);
    a.newNodeId = newNode.id;
    renderAll();
    if (!(await sleep(stepDelay(0.75), token))) return;

    const stu = state.students[r];
    const crs = state.courses[c];

    // Line 1: g.nextOfStudent = stu.first;
    a.activeLine = 0;
    a.writes = 1;
    newNode.nextOfStudent = stu.first;
    state.drawingArrowKey = newNode.nextOfStudent ? `student:${newNode.id}->${newNode.nextOfStudent.id}` : null;
    renderAll();
    if (state.drawingArrowKey) {
      if (!(await animateArrowDraw("student", newNode.id, newNode.nextOfStudent.id, stepDelay(0.95), token))) return;
    } else if (!(await sleep(stepDelay(0.95), token))) return;
    state.drawingArrowKey = null;

    const captureRenderedHeaderD = (chain, fromId) => {
      const el = document.querySelector(
        `#layerArrows g[data-chain="${chain}"][data-from="${fromId}"] .arrow-path, ` +
        `#layerCrossArrows g[data-chain="${chain}"][data-from="${fromId}"] .arrow-path`
      );
      return el ? el.getAttribute("d") : null;
    };

    // Line 2: stu.first = g; (g joins student chain -> becomes solid)
    a.activeLine = 1;
    a.writes = 2;
    const oldStuFirst = stu.first;
    const oldStuD = oldStuFirst ? captureRenderedHeaderD("student", stu.id) : null;
    state.fadingOldArrow = oldStuFirst ? { chain: "student", idx: r, toNode: oldStuFirst, d: oldStuD } : null;
    stu.first = newNode;
    state.drawingArrowKey = `student:${stu.id}->${newNode.id}`;
    renderAll();
    if (!(await animateArrowDraw("student", stu.id, newNode.id, stepDelay(0.95), token))) return;
    state.drawingArrowKey = null;
    state.fadingOldArrow = null;

    // Line 3: g.nextOfCourse = crs.first;
    a.activeLine = 2;
    a.writes = 3;
    newNode.nextOfCourse = crs.first;
    state.drawingArrowKey = newNode.nextOfCourse ? `course:${newNode.id}->${newNode.nextOfCourse.id}` : null;
    renderAll();
    if (state.drawingArrowKey) {
      if (!(await animateArrowDraw("course", newNode.id, newNode.nextOfCourse.id, stepDelay(0.95), token))) return;
    } else if (!(await sleep(stepDelay(0.95), token))) return;
    state.drawingArrowKey = null;

    // Line 4: crs.first = g;
    a.activeLine = 3;
    a.writes = 4;
    const oldCrsFirst = crs.first;
    const oldCrsD = oldCrsFirst ? captureRenderedHeaderD("course", crs.id) : null;
    state.fadingOldArrow = oldCrsFirst ? { chain: "course", idx: c, toNode: oldCrsFirst, d: oldCrsD } : null;
    crs.first = newNode;
    state.drawingArrowKey = `course:${crs.id}->${newNode.id}`;
    renderAll();
    if (!(await animateArrowDraw("course", crs.id, newNode.id, stepDelay(0.95), token))) return;
    state.drawingArrowKey = null;
    state.fadingOldArrow = null;

    a.insertCount++;
    a.lastInserted = { r, c, grade: a.selectedGrade };
    a.selectedCell = null;
    a.selectedGrade = null;
    a.newNodeId = null;

    const msg = a.extraStudents > 0
      ? "Still 4 writes. Insert doesn't depend on size."
      : "New grades go to the front, so chains aren't sorted. That's why it's O(1).";
    state.isAnimating = false;
    renderAll();
    setAnnouncement(msg, "good");
  }

  function onAddFiftyStudents() {
    if (state.isAnimating || state.step !== 1) return;
    state.add.extraStudents = 50;
    const msg = "50 more students added. Now insert into an empty cell to see the write count.";
    renderAll();
    setAnnouncement(msg, "");
  }

  // ------------------------------------------------------------------
  // Step 3 Handlers (Fixes 1, 2, 3, 4, 5, 9)
  // ------------------------------------------------------------------
  async function onDeleteNode(nodeId) {
    if (state.isAnimating || state.step !== 2) return;
    const target = state.nodes.find((n) => n.id === nodeId);
    if (!target) return;

    const token = ++state.animToken;
    state.isAnimating = true;
    scrollGridIntoView();

    const d = state.del;
    d.suggestPulse = false;
    d.selectedNodeId = target.id;
    d.fadingNodeId = null;
    d.studentWalkCount = 0;
    d.courseWalkCount = 0;
    d.visitedIds = new Set();

    const stu = state.students[target.r];
    const crs = state.courses[target.c];
    const stuName = stu.name.toLowerCase();
    const crsName = crs.name.toLowerCase();

    const stuChain = walkChain(stu.first, "nextOfStudent");
    const stuIdx = stuChain.findIndex((n) => n.id === target.id);
    const stuPrev = stuIdx > 0 ? stuChain[stuIdx - 1] : null;

    const crsChain = walkChain(crs.first, "nextOfCourse");
    const crsIdx = crsChain.findIndex((n) => n.id === target.id);
    const crsPrev = crsIdx > 0 ? crsChain[crsIdx - 1] : null;

    d.codeLines = [
      { chain: "student", text: stuPrev ? `// walk ${stuName} to prev (${stuIdx} hop${stuIdx === 1 ? "" : "s"})` : `// ${stuName}.first is already g` },
      { chain: "student", text: stuPrev ? "prev.nextOfStudent = g.nextOfStudent;" : `${stuName}.first = g.nextOfStudent;` },
      { chain: "course", text: crsPrev ? `// walk ${crsName} to prev (${crsIdx} hop${crsIdx === 1 ? "" : "s"})` : `// ${crsName}.first is already g` },
      { chain: "course", text: crsPrev ? "prev.nextOfCourse = g.nextOfCourse;" : `${crsName}.first = g.nextOfCourse;` },
    ];
    d.activeLine = 0;
    d.activeChain = "student";

    // Walk 1: Student chain along actual arrows
    const stuKeys = new Set();
    if (stuChain.length) {
      stuKeys.add(`student:${stu.id}->${stuChain[0].id}`);
      for (let i = 0; i < stuChain.length - 1; i++) stuKeys.add(`student:${stuChain[i].id}->${stuChain[i + 1].id}`);
    }
    state.walkedArrowKeys = stuKeys;
    renderAll();

    let prevId = stu.id;
    let prevPos = headerExitPos("student", target.r);
    setWalkerDot(prevPos, COLORS.cobalt, COLORS.panel);
    if (!(await sleep(stepDelay(0.45), token))) return;

    for (let i = 0; i <= stuIdx; i++) {
      const cur = stuChain[i];
      const ePos = entryPos(cur, "student");
      if (i > 0) {
        const xPos = exitPos(stuChain[i - 1], "student");
        if (!(await animateSegment(prevPos, xPos, COLORS.cobalt, COLORS.panel, stepDelay(0.32), token))) return;
      }
      if (!(await animateAlongPath("student", prevId, cur.id, ePos, COLORS.cobalt, COLORS.panel, stepDelay(0.85), token))) return;
      d.studentWalkCount++;
      d.visitedIds.add(cur.id);
      renderSvgGrid();
      setWalkerDot(ePos, COLORS.cobalt, COLORS.panel);
      const chip = document.getElementById("stuWalkChip");
      if (chip) chip.textContent = `visited (student chain): ${d.studentWalkCount}`;
      if (!(await sleep(stepDelay(0.4), token))) return;
      prevId = cur.id;
      prevPos = ePos;
    }

    // Student unlink write + straight bypass draw across still-visible node (Fix 2 & Fix 4)
    d.activeLine = 1;
    setWalkerDot(null);
    if (stuPrev) stuPrev.nextOfStudent = target.nextOfStudent;
    else stu.first = target.nextOfStudent;
    const stuBypassFrom = stuPrev ? stuPrev.id : stu.id;
    state.drawingArrowKey = target.nextOfStudent ? `student:${stuBypassFrom}->${target.nextOfStudent.id}` : null;
    // Update walkedArrowKeys to include new bypass
    const stuPostKeys = new Set();
    const postStuChain = walkChain(stu.first, "nextOfStudent");
    if (postStuChain.length) {
      stuPostKeys.add(`student:${stu.id}->${postStuChain[0].id}`);
      for (let i = 0; i < postStuChain.length - 1; i++) stuPostKeys.add(`student:${postStuChain[i].id}->${postStuChain[i + 1].id}`);
    }
    state.walkedArrowKeys = stuPostKeys;
    renderAll();
    if (state.drawingArrowKey) {
      if (!(await animateArrowDraw("student", stuBypassFrom, target.nextOfStudent.id, stepDelay(0.95), token))) return;
    } else if (!(await sleep(stepDelay(0.85), token))) return;
    state.drawingArrowKey = null;

    // Walk 2: Course chain along actual arrows
    d.activeChain = "course";
    d.activeLine = 2;
    d.visitedIds = new Set();
    const crsKeys = new Set();
    if (crsChain.length) {
      crsKeys.add(`course:${crs.id}->${crsChain[0].id}`);
      for (let i = 0; i < crsChain.length - 1; i++) crsKeys.add(`course:${crsChain[i].id}->${crsChain[i + 1].id}`);
    }
    state.walkedArrowKeys = crsKeys;
    renderAll();

    prevId = crs.id;
    prevPos = headerExitPos("course", target.c);
    setWalkerDot(prevPos, COLORS.saffron, COLORS.saffronOutline);
    if (!(await sleep(stepDelay(0.45), token))) return;

    for (let i = 0; i <= crsIdx; i++) {
      const cur = crsChain[i];
      const ePos = entryPos(cur, "course");
      if (i > 0) {
        const xPos = exitPos(crsChain[i - 1], "course");
        if (!(await animateSegment(prevPos, xPos, COLORS.saffron, COLORS.saffronOutline, stepDelay(0.32), token))) return;
      }
      if (!(await animateAlongPath("course", prevId, cur.id, ePos, COLORS.saffron, COLORS.saffronOutline, stepDelay(0.85), token))) return;
      d.courseWalkCount++;
      d.visitedIds.add(cur.id);
      renderSvgGrid();
      setWalkerDot(ePos, COLORS.saffron, COLORS.saffronOutline);
      const chip = document.getElementById("crsWalkChip");
      if (chip) chip.textContent = `visited (course chain): ${d.courseWalkCount}`;
      if (!(await sleep(stepDelay(0.4), token))) return;
      prevId = cur.id;
      prevPos = ePos;
    }

    // Course unlink write: draw bypass AND fade deleted node out BEFORE removing it from state.nodes (Fix 5)
    d.activeLine = 3;
    setWalkerDot(null);
    if (crsPrev) crsPrev.nextOfCourse = target.nextOfCourse;
    else crs.first = target.nextOfCourse;
    const crsBypassFrom = crsPrev ? crsPrev.id : crs.id;
    state.drawingArrowKey = target.nextOfCourse ? `course:${crsBypassFrom}->${target.nextOfCourse.id}` : null;
    const crsPostKeys = new Set();
    const postCrsChain = walkChain(crs.first, "nextOfCourse");
    if (postCrsChain.length) {
      crsPostKeys.add(`course:${crs.id}->${postCrsChain[0].id}`);
      for (let i = 0; i < postCrsChain.length - 1; i++) crsPostKeys.add(`course:${postCrsChain[i].id}->${postCrsChain[i + 1].id}`);
    }
    state.walkedArrowKeys = crsPostKeys;
    d.fadingNodeId = target.id;
    renderAll();

    // Fade node card & content out smoothly during the course bypass draw
    const fadeDur = stepDelay(0.95);
    const nodeEls = [
      document.querySelector(`#layerNodes g[data-node-id="${target.id}"]`),
      document.querySelector(`#layerNodeContent g[data-node-content="${target.id}"]`),
    ].filter(Boolean);
    nodeEls.forEach((el) => {
      if (!reducedMotion()) {
        el.style.transition = `opacity ${fadeDur}ms ease-out`;
        requestAnimationFrame(() => { el.style.opacity = "0"; });
      } else {
        el.style.opacity = "0.2";
      }
    });
    if (state.drawingArrowKey) {
      if (!(await animateArrowDraw("course", crsBypassFrom, target.nextOfCourse.id, fadeDur, token))) return;
    } else if (!(await sleep(fadeDur, token))) return;

    // Now remove node from state.nodes
    state.nodes = state.nodes.filter((n) => n.id !== target.id);
    state.drawingArrowKey = null;
    state.walkedArrowKeys = null;
    d.fadingNodeId = null;
    d.visitedIds = new Set();
    d.activeChain = null;
    d.selectedNodeId = null;

    const totalWalked = d.studentWalkCount + d.courseWalkCount;
    d.summaryText = `Walked ${totalWalked} node${totalWalked === 1 ? "" : "s"} (${d.studentWalkCount} student + ${d.courseWalkCount} course) to delete 1. Insert took 4 writes and no walk.`;

    state.isAnimating = false;
    renderAll();
    setAnnouncement(d.summaryText, "good");
  }

  // ------------------------------------------------------------------
  // Step 4 Handlers
  // ------------------------------------------------------------------
  async function onFindVirtanen() {
    if (state.isAnimating || state.step !== 3) return;
    const token = ++state.animToken;
    state.isAnimating = true;
    scrollGridIntoView();

    const t = state.teacher;
    t.visitedCount = 0;
    t.visitedIds = new Set();
    t.matchedIds = new Set();

    if (!t.enabled) {
      for (let r = 0; r < 3; r++) {
        const stu = state.students[r];
        const chain = walkChain(stu.first, "nextOfStudent");
        const keys = new Set();
        if (chain.length) {
          keys.add(`student:${stu.id}->${chain[0].id}`);
          for (let i = 0; i < chain.length - 1; i++) keys.add(`student:${chain[i].id}->${chain[i + 1].id}`);
        }
        state.walkedArrowKeys = keys;
        renderSvgGrid();

        let prevId = stu.id;
        let prevPos = headerExitPos("student", r);
        setWalkerDot(prevPos, COLORS.cobalt, COLORS.panel);
        if (!(await sleep(stepDelay(0.35), token))) return;

        for (let i = 0; i < chain.length; i++) {
          const node = chain[i];
          const ePos = entryPos(node, "student");
          if (i > 0) {
            const xPos = exitPos(chain[i - 1], "student");
            if (!(await animateSegment(prevPos, xPos, COLORS.cobalt, COLORS.panel, stepDelay(0.28), token))) return;
          }
          if (!(await animateAlongPath("student", prevId, node.id, ePos, COLORS.cobalt, COLORS.panel, stepDelay(0.75), token))) return;

          t.visitedCount++;
          t.visitedIds.add(node.id);
          if (node.teacher === "V") t.matchedIds.add(node.id);
          renderSvgGrid();
          setWalkerDot(ePos, node.teacher === "V" ? COLORS.moss : COLORS.cobalt, COLORS.panel);
          const vc = document.getElementById("teacherVisitedChip");
          if (vc) vc.textContent = `visited: ${t.visitedCount}`;
          if (!(await sleep(stepDelay(0.35), token))) return;
          prevId = node.id;
          prevPos = ePos;
        }
      }
      setWalkerDot(null);
      state.walkedArrowKeys = null;
      t.offVisited = t.visitedCount;
      t.resultText = `Teacher chain Off: visited all ${t.visitedCount} nodes to find Virtanen's 3 grades.`;
    } else {
      const vHeader = state.teachers[0];
      const vChain = walkChain(vHeader.first, "nextOfTeacher");
      const keys = new Set();
      if (vChain.length) {
        keys.add(`teacher:${vHeader.id}->${vChain[0].id}`);
        for (let i = 0; i < vChain.length - 1; i++) keys.add(`teacher:${vChain[i].id}->${vChain[i + 1].id}`);
      }
      state.walkedArrowKeys = keys;
      renderSvgGrid();

      let prevId = vHeader.id;
      let prevPos = headerExitPos("teacher", 0);
      setWalkerDot(prevPos, COLORS.moss, COLORS.panel);
      if (!(await sleep(stepDelay(0.35), token))) return;

      for (let i = 0; i < vChain.length; i++) {
        const node = vChain[i];
        const ePos = entryPos(node, "teacher");
        if (i > 0) {
          const xPos = exitPos(vChain[i - 1], "teacher");
          if (!(await animateSegment(prevPos, xPos, COLORS.moss, COLORS.panel, stepDelay(0.28), token))) return;
        }
        if (!(await animateAlongPath("teacher", prevId, node.id, ePos, COLORS.moss, COLORS.panel, stepDelay(0.85), token))) return;

        t.visitedCount++;
        t.visitedIds.add(node.id);
        t.matchedIds.add(node.id);
        renderSvgGrid();
        setWalkerDot(ePos, COLORS.moss, COLORS.panel);
        const vc = document.getElementById("teacherVisitedChip");
        if (vc) vc.textContent = `visited: ${t.visitedCount}`;
        if (!(await sleep(stepDelay(0.4), token))) return;
        prevId = node.id;
        prevPos = ePos;
      }
      if (vChain.length > 0) {
        const lastN = vChain[vChain.length - 1];
        const xPos = exitPos(lastN, "teacher");
        if (!(await animateSegment(prevPos, xPos, COLORS.moss, COLORS.panel, stepDelay(0.28), token))) return;
        if (!(await animateSegment(xPos, { x: xPos.x, y: xPos.y + 12 }, COLORS.moss, COLORS.panel, stepDelay(0.30), token))) return;
      }
      setWalkerDot(null);
      state.walkedArrowKeys = null;
      t.onVisited = t.visitedCount;
      t.resultText = `Teacher chain On: visited only ${t.visitedCount} nodes on Virtanen's chain.`;
    }

    state.isAnimating = false;
    renderAll();
    setAnnouncement(t.resultText, "good");
  }

  // ------------------------------------------------------------------
  // Navigation & Init
  // ------------------------------------------------------------------
  function switchStep(nextStep) {
    if (state.isAnimating) return;
    if (nextStep < 0 || nextStep > 3 || nextStep === state.step) return;
    state.step = nextStep;
    resetCurrentStep();
  }

  document.querySelectorAll(".step-nav .pill-btn").forEach((btn) => {
    btn.addEventListener("click", () => switchStep(Number(btn.dataset.step)));
  });

  document.getElementById("backBtn").addEventListener("click", () => switchStep(state.step - 1));
  document.getElementById("nextStepBtn").addEventListener("click", () => switchStep(state.step + 1));
  document.getElementById("resetBtn").addEventListener("click", resetCurrentStep);
  document.getElementById("speedBtn").addEventListener("click", () => {
    state.slower = !state.slower;
    renderTopBar();
  });

  resetCurrentStep();
})();
</script>
