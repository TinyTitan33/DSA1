<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>One grade, two lists — Multilist explorer</title>
<style>
  :root {
    color-scheme: light only;
    --bg-linen: #F4EEE3;
    --panel-bg: #FFFDF8;
    --panel-border: #D9D0C2;
    --ink: #2B2B2B;
    --muted: #9A938A;
    --cobalt: #2F5DA8;
    --cobalt-tint: rgba(47, 93, 168, 0.14);
    --saffron: #E0A21B;
    --saffron-outline: #9C6E0A;
    --saffron-tint: rgba(224, 162, 27, 0.20);
    --moss: #5E7D3A;
    --moss-tint: rgba(94, 125, 58, 0.16);
    --correct: #3E7D4F;
    --correct-tint: rgba(62, 125, 79, 0.14);
    --brick: #B5452F;
    --brick-tint: rgba(181, 69, 47, 0.14);
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --radius: 12px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-linen);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 4px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Top bar (max 2 rows on 360px portrait) */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
  }

  .step-nav {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    flex: 1 1 320px;
  }

  .top-actions {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    align-items: center;
  }

  button {
    font-family: var(--font-ui);
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel-bg);
    border: 1.5px solid var(--panel-border);
    border-radius: 10px;
    min-height: 44px;
    min-width: 44px;
    padding: 6px 10px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, opacity 140ms ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  button:focus-visible,
  [data-interactive="true"]:focus-visible {
    outline: 3px solid var(--cobalt);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.48;
    cursor: not-allowed;
  }

  .pill-btn {
    border-radius: 999px;
    padding: 6px 8px;
    font-size: 0.82rem;
    flex: 1 1 auto;
    white-space: nowrap;
  }

  .pill-btn[aria-current="step"] {
    background: var(--ink);
    color: var(--panel-bg);
    border-color: var(--ink);
  }

  .toggle-btn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--panel-bg);
    border-color: var(--ink);
  }

  .primary-btn {
    background: var(--cobalt);
    color: #FFFDF8;
    border-color: var(--cobalt);
  }

  .primary-btn.moss-mode {
    background: var(--moss);
    color: #FFFDF8;
    border-color: var(--moss);
  }

  /* Instruction bar */
  .instruction-bar {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-left: 5px solid var(--cobalt);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 0.90rem;
    font-weight: 600;
  }

  /* Workspace layout */
  .workspace {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    align-items: start;
  }

  .grid-card,
  .side-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 3px;
    min-width: 0;
  }

  .side-panel {
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .feedback-strip {
    display: flex;
    flex-direction: column;
    gap: 4px;
    order: 1;
  }

  .controls-strip {
    display: flex;
    flex-direction: column;
    gap: 7px;
    order: 2;
  }

  .grid-svg {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .svg-mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }

  .svg-ui {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .legend-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    padding: 4px 6px 2px;
    border-top: 1px solid var(--panel-border);
    margin-top: 2px;
    font-size: 0.78rem;
    color: var(--ink);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .side-legend {
    display: flex;
    margin-top: 2px;
  }

  #gridCard .legend-strip {
    display: none;
  }

  /* Panel components */
  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .panel-label {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .counter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .stat-chip {
    background: var(--bg-linen);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 4px 7px;
    font-size: 0.79rem;
    font-weight: 600;
    flex: 1 1 0;
    white-space: nowrap;
  }

  .stat-chip.cobalt {
    border-color: var(--cobalt);
    background: var(--cobalt-tint);
  }

  .stat-chip.saffron {
    border-color: var(--saffron-outline);
    background: var(--saffron-tint);
  }

  .stat-chip.moss {
    border-color: var(--moss);
    background: var(--moss-tint);
  }

  .live-result {
    background: var(--bg-linen);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 5px 9px;
    font-size: 0.83rem;
    min-height: 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .live-result.good {
    border-color: var(--correct);
    background: var(--correct-tint);
  }

  .live-result.warn {
    border-color: var(--brick);
    background: var(--brick-tint);
  }

  .live-result.both {
    border-color: var(--cobalt);
    box-shadow: inset 0 0 0 2px var(--saffron);
  }

  .note-box {
    background: var(--bg-linen);
    border: 1px dashed var(--muted);
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 0.84rem;
  }

  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .grade-picker {
    display: grid;
    grid-template-columns: repeat(6, minmax(44px, 1fr));
    gap: 5px;
  }

  .grade-btn {
    padding: 6px 4px;
    font-size: 0.96rem;
    font-weight: 700;
  }

  .grade-btn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--panel-bg);
    border-color: var(--ink);
  }

  /* Code panel */
  .code-card {
    background: var(--bg-linen);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 3px 5px;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    line-height: 1.25;
    overflow-x: auto;
  }

  .code-line {
    padding: 1.5px 5px;
    border-radius: 5px;
    white-space: pre;
    border-left: 4px solid transparent;
    transition: background-color 140ms ease, border-color 140ms ease;
  }

  .code-line.active-cobalt {
    background: var(--cobalt-tint);
    border-left-color: var(--cobalt);
    font-weight: 700;
  }

  .code-line.active-saffron {
    background: var(--saffron-tint);
    border-left-color: var(--saffron-outline);
    font-weight: 700;
  }

  /* Node anatomy mini diagram (Step 4) */
  .anatomy-card {
    background: var(--bg-linen);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .anatomy-slots {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
  }

  .slot-pill {
    padding: 3px 7px;
    border-radius: 6px;
    background: var(--panel-bg);
    border: 1.5px solid var(--panel-border);
    font-weight: 600;
  }

  .slot-pill.cobalt { border-color: var(--cobalt); color: var(--cobalt); }
  .slot-pill.saffron { border-color: var(--saffron-outline); color: var(--saffron-outline); }
  .slot-pill.moss { border-color: var(--moss); color: var(--moss); }

  /* Bottom Back/Next navigation */
  .bottombar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding-top: 2px;
  }

  .bottombar .step-progress {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }

  /* SVG interactive feedback */
  [data-interactive="true"] {
    cursor: pointer;
  }

  [data-disabled="true"] {
    cursor: not-allowed;
  }

  .pulse-hint {
    animation: gentlePulse 1.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  /* Shared node pulses twice then stays still (Fix 6) */
  .pulse-once {
    animation: pulseOnce 650ms ease-in-out 2;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes pulseOnce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .fade-enter {
    animation: quickFade 200ms ease-out;
  }

  @keyframes quickFade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Wide screens (>= 700 px) */
  @media (min-width: 700px) {
    .app {
      padding: 14px 18px 20px;
      gap: 12px;
    }

    #gridCard .legend-strip {
      display: flex;
    }

    .side-legend {
      display: none;
    }

    .pill-btn {
      flex: 0 1 auto;
      padding: 8px 13px;
      font-size: 0.88rem;
    }

    .workspace {
      grid-template-columns: minmax(0, 1.32fr) minmax(290px, 0.90fr);
      gap: 14px;
    }

    .grid-card {
      padding: 10px;
    }

    .side-panel {
      padding: 14px;
      gap: 12px;
    }

    .controls-strip { order: 1; }
    .feedback-strip { order: 2; }
    .stat-chip { font-size: 0.86rem; padding: 6px 10px; }
    .live-result { font-size: 0.90rem; padding: 8px 11px; min-height: 40px; }
    .code-card { font-size: 0.83rem; padding: 8px; line-height: 1.4; }
    .code-line { padding: 4px 8px; }
  }

  /* Landscape phones (e.g. 640x360, 740x360): >= 11px labels, >= 16px digits, >= 44px tap targets */
  @media (orientation: landscape) and (max-height: 500px) {
    .app {
      padding: 3px 6px 6px;
      gap: 3px;
    }

    .topbar {
      flex-wrap: nowrap;
    }

    .pill-btn {
      flex: 0 1 auto;
      padding: 5px 9px;
      font-size: 0.78rem;
    }

    .instruction-bar {
      padding: 3px 9px;
      font-size: 0.80rem;
      line-height: 1.2;
    }

    .workspace {
      grid-template-columns: max-content minmax(230px, 1fr);
      gap: 6px;
      align-items: start;
    }

    .grid-card {
      padding: 2px;
    }

    #gridCard .legend-strip {
      display: none;
    }

    .side-legend {
      display: flex;
      margin-top: 4px;
    }

    .grid-svg {
      height: calc(100vh - 86px);
      max-height: 320px;
      width: auto;
      max-width: 100%;
      margin: 0 auto;
    }

    .side-panel {
      max-height: calc(100vh - 86px);
      overflow-y: auto;
      padding: 6px 8px;
      gap: 6px;
    }

    .controls-strip { order: 1; }
    .feedback-strip { order: 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 120ms !important;
    }
    .pulse-hint,
    .pulse-once {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar" aria-label="Activity controls">
    <nav class="step-nav" aria-label="Steps">
      <button type="button" class="pill-btn" data-step="0" aria-current="step">1 Predict</button>
      <button type="button" class="pill-btn" data-step="1">2 Add</button>
      <button type="button" class="pill-btn" data-step="2">3 Delete</button>
      <button type="button" class="pill-btn" data-step="3">4 Teacher</button>
    </nav>
    <div class="top-actions">
      <button type="button" id="speedBtn" class="toggle-btn" aria-pressed="false">Speed: Normal</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="instruction-bar" id="instructionBar"></div>

  <section class="workspace" aria-label="Multilist interactive stage">
    <div class="grid-card" id="gridCard">
      <svg id="gridSvg" class="grid-svg" viewBox="0 0 1310 1014" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Student and course grade multilist grid</title>
        <desc id="svgDesc"></desc>
        <defs>
          <pattern id="hatchPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="12" height="12" fill="#FFFDF8"></rect>
            <line x1="0" y1="0" x2="0" y2="12" stroke="#2B2B2B" stroke-width="3.6" stroke-opacity="0.35"></line>
          </pattern>
          <marker id="tip-cobalt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
            <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2F5DA8"></path>
          </marker>
          <marker id="tip-saffron" viewBox="0 0 12 12" refX="9.5" refY="6" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 1.5 1.8 L 10.5 6 L 1.5 10.2 z" fill="#E0A21B" stroke="#9C6E0A" stroke-width="1.3" stroke-linejoin="round"></path>
          </marker>
          <marker id="tip-moss" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
            <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#5E7D3A"></path>
          </marker>
          <mask id="maskOutsideNodes" maskUnits="userSpaceOnUse" x="0" y="0" width="1310" height="1138"></mask>
          <mask id="maskCrossArrowCard" maskUnits="userSpaceOnUse" x="0" y="0" width="1310" height="1138"></mask>
        </defs>
        <g id="layerBackdrop"></g>
        <g id="layerCells"></g>
        <g id="layerUnderlays"></g>
        <g id="layerArrows"></g>
        <g id="layerHeaders"></g>
        <g id="layerNodes"></g>
        <g id="layerCrossUnderlays" style="pointer-events: none;"></g>
        <g id="layerCrossArrows" style="pointer-events: none;"></g>
        <g id="layerNodeContent" style="pointer-events: none;"></g>
        <g id="layerExtras"></g>
        <g id="layerOverlay"></g>
      </svg>

      <div class="legend-strip" id="legendStrip" aria-hidden="true">
        <span class="legend-item">
          <svg width="26" height="10" viewBox="0 0 26 10"><line x1="1" y1="5" x2="20" y2="5" stroke="#2F5DA8" stroke-width="3"></line><polygon points="19,1.5 25,5 19,8.5" fill="#2F5DA8"></polygon></svg>
          Student (cobalt, solid)
        </span>
        <span class="legend-item">
          <svg width="28" height="12" viewBox="0 0 28 12"><line x1="2" y1="6" x2="20" y2="6" stroke="#9C6E0A" stroke-width="6.4" stroke-linecap="round"></line><line x1="2" y1="6" x2="20" y2="6" stroke="#E0A21B" stroke-width="3.8" stroke-linecap="round"></line><polygon points="19,1.5 27,6 19,10.5" fill="#E0A21B" stroke="#9C6E0A" stroke-width="1.1"></polygon></svg>
          Course (saffron, outlined)
        </span>
        <span class="legend-item moss-legend" style="display:none;">
          <svg width="28" height="10" viewBox="0 0 28 10"><line x1="1" y1="5" x2="20" y2="5" stroke="#5E7D3A" stroke-width="3" stroke-dasharray="4.5 3"></line><polygon points="19,1.5 26,5 19,8.5" fill="#5E7D3A"></polygon></svg>
          Teacher (moss, dashed)
        </span>
      </div>
    </div>

    <aside class="side-panel" id="sidePanel" aria-label="Step controls and details"></aside>
  </section>

  <footer class="bottombar">
    <button type="button" id="backBtn">Back</button>
    <span class="step-progress" id="stepProgress">Step 1 of 4</span>
    <button type="button" id="nextStepBtn">Next</button>
  </footer>
</main>

<script>
(() => {
  "use strict";

  const COLORS = {
    linen: "#F4EEE3",
    panel: "#FFFDF8",
    border: "#D9D0C2",
    ink: "#2B2B2B",
    muted: "#9A938A",
    cobalt: "#2F5DA8",
    saffron: "#E0A21B",
    saffronOutline: "#9C6E0A",
    moss: "#5E7D3A",
    correct: "#3E7D4F",
    brick: "#B5452F",
  };

  const STUDENTS = ["Matti", "Maija", "Pekka"];
  const COURSES = ["Progr", "DSA1", "DSA2"];
  const TEACHERS = [
    { name: "Virtanen", short: "V", x: 361 },
    { name: "Lahti", short: "L", x: 719 },
  ];

  // Verified viewBox geometry (Fix 1 clearances + >=44px tap targets + >=12px/18px at 360px + >=11px/16px at 640x360)
  const VB_W = 1310;
  const VB_H_BASE = 1014;
  const VB_H_TALL = 1138;

  const RH = { x: 8, w: 148, h: 136 };
  const CH = { y: 6, w: 146, h: 68 };
  const X_COLS = [361, 719, 1077];
  const Y_ROWS = [246, 538, 830];
  const NODE_W = 146;
  const NODE_H = 136;
  const HIT_SZ = 184;

  // Reserved non-overlapping orthogonal routing lanes (all >= 24 from nodes, >= 14 apart, >= 10 from null labels, final stub >= 32)
  const STU_ENTRY_X = [252, 610, 968];   // 36 >= 32 final stub into col left edges (288, 646, 1004)
  const CRS_LANE_X = [562, 920, 1278];   // >= 14 past col null right (548.2, 906.2, 1264.2), slot+16 = 578, 936, 1294
  const MOSS_LANE_X = [202, 594, 952];   // 16 from CRS slot1 & STU_ENTRY, >= 52 final stub into cols 0..2

  const CRS_ENTRY_Y = [142, 434, 726];   // 36 >= 32 final stub into row top edges (178, 470, 762)
  const STU_LANE_Y = [374, 666, 958];    // >= 12 below row null bottom (<=362, <=654, <=946), slot+14 = 388, 680, 972
  const MOSS_LANE_Y = [404, 696, 988];   // >= 16 below STU slot1, >= 16 above CRS_ENTRY, slot+14 = 418, 710, 1002
  const MOSS_X_SLOTS = [
    [202, 220, 236],   // Col 0 entry lanes: >=46 from RH, >=20 from S-drop, >=16 from STU_ENTRY[0], >=52 final stub
    [594, 544, 526],   // Col 1 entry lanes: >=16 from CRS[0]+16/STU_ENTRY[1], >=18 from CRS[0], >=92 from col 0, >=52 stub
    [952, 904, 886],   // Col 2 entry lanes: >=16 from CRS[1]+16/STU_ENTRY[2], >=16 from CRS[1], >=94 from col 1, >=52 stub
  ];
  const MOSS_Y_SLOTS = [
    [404, 420],        // Row 0->1 moss horizontal lanes (16 apart, >=14 from STU_LANE/CRS_ENTRY)
    [696, 712],        // Row 1->2 moss horizontal lanes (16 apart, >=14 from STU_LANE/CRS_ENTRY)
    [988, 1004],       // Row 2 moss horizontal lanes (disjoint from header lanes 1018/1002)
  ];

  const BASE_NODES = [
    { r: 0, c: 0, grade: 4, teacher: "V" },
    { r: 0, c: 1, grade: 3, teacher: "L" },
    { r: 1, c: 0, grade: 5, teacher: "L" },
    { r: 1, c: 1, grade: 4, teacher: "L" },
    { r: 1, c: 2, grade: 2, teacher: "V" },
    { r: 2, c: 1, grade: 0, teacher: "L" },
    { r: 2, c: 2, grade: 3, teacher: "V" },
  ];

  const PREDICT_QUESTIONS = [
    { type: "student", index: 0, label: "Matti" },
    { type: "course", index: 1, label: "DSA1" },
    { type: "student", index: 1, label: "Maija" },
    { type: "course", index: 2, label: "DSA2" },
    { type: "both", studentIndex: 0, courseIndex: 1 },
  ];

  const SVG_NS = "http://www.w3.org/2000/svg";

  function svgEl(tag, attrs = {}, textContent = null) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v !== null && v !== undefined) {
        el.setAttribute(k, String(v));
      }
    }
    if (textContent !== null) {
      el.textContent = textContent;
    }
    return el;
  }

  function reducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function stepDelay(multiplier = 1) {
    if (reducedMotion()) return Math.round(120 * multiplier);
    const base = state.slower ? 1100 : 600;
    return Math.round(base * multiplier);
  }

  const state = {
    step: 0,
    slower: false,
    isAnimating: false,
    animToken: 0,

    students: [],
    courses: [],
    teachers: [],
    nodes: [],
    nextNodeId: 1,

    walkedArrowKeys: null,
    drawingArrowKey: null,
    fadingOldArrow: null,
    liveAnnouncementHtml: "",
    liveAnnouncementTone: "",

    predict: {
      qIndex: 0,
      freeMode: false,
      selectedHeader: null,
      markedIds: new Set(),
      visitedIds: new Set(),
      mattiIds: new Set(),
      dsa1Ids: new Set(),
      revealed: false,
      feedback: null,
      visitedCount: null,
      activeChainType: null,
      bothPulse: false,
    },

    add: {
      selectedCell: null,
      selectedGrade: null,
      cellNote: "",
      writes: 0,
      activeLine: -1,
      lastInserted: null,
      newNodeId: null,
      insertCount: 0,
      extraStudents: 0,
    },

    del: {
      selectedNodeId: null,
      fadingNodeId: null,
      studentWalkCount: 0,
      courseWalkCount: 0,
      visitedIds: new Set(),
      activeChain: null,
      codeLines: [],
      activeLine: -1,
      summaryText: "",
      suggestPulse: true,
    },

    teacher: {
      enabled: false,
      visitedCount: null,
      visitedIds: new Set(),
      matchedIds: new Set(),
      resultText: "",
      offVisited: null,
      onVisited: null,
    },
  };

  function buildBaseModel() {
    state.students = STUDENTS.map((name, idx) => ({ id: `S${idx}`, name, index: idx, first: null }));
    state.courses = COURSES.map((name, idx) => ({ id: `C${idx}`, name, index: idx, first: null }));
    state.teachers = TEACHERS.map((t, idx) => ({ id: `T${idx}`, name: t.name, short: t.short, index: idx, x: t.x, first: null }));
    state.nodes = [];
    state.nextNodeId = 1;

    for (const spec of BASE_NODES) {
      state.nodes.push({
        id: `n${state.nextNodeId++}`,
        r: spec.r,
        c: spec.c,
        grade: spec.grade,
        teacher: spec.teacher,
        nextOfStudent: null,
        nextOfCourse: null,
        nextOfTeacher: null,
      });
    }

    for (let r = 0; r < 3; r++) {
      const rowNodes = state.nodes.filter((n) => n.r === r).sort((a, b) => a.c - b.c);
      state.students[r].first = rowNodes[0] || null;
      for (let i = 0; i < rowNodes.length - 1; i++) {
        rowNodes[i].nextOfStudent = rowNodes[i + 1];
      }
    }

    for (let c = 0; c < 3; c++) {
      const colNodes = state.nodes.filter((n) => n.c === c).sort((a, b) => a.r - b.r);
      state.courses[c].first = colNodes[0] || null;
      for (let i = 0; i < colNodes.length - 1; i++) {
        colNodes[i].nextOfCourse = colNodes[i + 1];
      }
    }

    for (const th of state.teachers) {
      const tNodes = state.nodes.filter((n) => n.teacher === th.short).sort((a, b) => (a.r - b.r) || (a.c - b.c));
      th.first = tNodes[0] || null;
      for (let i = 0; i < tNodes.length - 1; i++) {
        tNodes[i].nextOfTeacher = tNodes[i + 1];
      }
    }
  }

  function walkChain(head, nextProp) {
    const out = [];
    let cur = head;
    let guard = 0;
    while (cur && guard < 30) {
      out.push(cur);
      cur = cur[nextProp];
      guard++;
    }
    return out;
  }

  function getChainMembership() {
    const onStudent = [new Set(), new Set(), new Set()];
    const onCourse = [new Set(), new Set(), new Set()];
    const onTeacher = new Set();
    state.students.forEach((s, r) => walkChain(s.first, "nextOfStudent").forEach((n) => onStudent[r].add(n.id)));
    state.courses.forEach((c, col) => walkChain(c.first, "nextOfCourse").forEach((n) => onCourse[col].add(n.id)));
    state.teachers.forEach((t) => walkChain(t.first, "nextOfTeacher").forEach((n) => onTeacher.add(n.id)));
    return { onStudent, onCourse, onTeacher };
  }

  function nodeAt(r, c) {
    return state.nodes.find((n) => n.r === r && n.c === c) || null;
  }

  function entryPos(node, chain) {
    const cx = X_COLS[node.c];
    const cy = Y_ROWS[node.r];
    if (chain === "student") return { x: cx - NODE_W / 2, y: cy };
    if (chain === "course") return { x: cx, y: cy - NODE_H / 2 };
    return { x: cx - NODE_W / 2, y: cy + 44 };
  }

  function exitPos(node, chain) {
    const cx = X_COLS[node.c];
    const cy = Y_ROWS[node.r];
    if (chain === "student") return { x: cx + NODE_W / 2, y: cy };
    if (chain === "course") return { x: cx, y: cy + NODE_H / 2 };
    return { x: cx + 59, y: cy + NODE_H / 2 };
  }

  function headerExitPos(chain, idx) {
    if (chain === "student") return { x: RH.x + RH.w, y: Y_ROWS[idx] };
    if (chain === "course") return { x: X_COLS[idx], y: CH.y + CH.h };
    return { x: TEACHERS[idx].x - 56, y: 1054 };
  }

  function setAnnouncement(html, tone = "") {
    state.liveAnnouncementHtml = html;
    state.liveAnnouncementTone = tone;
    const box = document.getElementById("ariaLiveBox");
    if (box) {
      box.className = `live-result ${tone}`;
      box.innerHTML = html;
    }
  }

  function resetCurrentStep() {
    state.animToken++;
    state.isAnimating = false;
    state.walkedArrowKeys = null;
    state.drawingArrowKey = null;
    state.fadingOldArrow = null;
    buildBaseModel();

    if (state.step === 0) {
      state.predict = {
        qIndex: 0,
        freeMode: false,
        selectedHeader: null,
        markedIds: new Set(),
        visitedIds: new Set(),
        mattiIds: new Set(),
        dsa1Ids: new Set(),
        revealed: false,
        feedback: null,
        visitedCount: null,
        activeChainType: null,
        bothPulse: false,
      };
      state.liveAnnouncementHtml = "No header selected yet.";
      state.liveAnnouncementTone = "";
    } else if (state.step === 1) {
      state.add = {
        selectedCell: null,
        selectedGrade: null,
        cellNote: "",
        writes: 0,
        activeLine: -1,
        lastInserted: null,
        newNodeId: null,
        insertCount: 0,
        extraStudents: 0,
      };
      state.liveAnnouncementHtml = "Tap any dashed empty cell on the grid.";
      state.liveAnnouncementTone = "";
    } else if (state.step === 2) {
      state.del = {
        selectedNodeId: null,
        fadingNodeId: null,
        studentWalkCount: 0,
        courseWalkCount: 0,
        visitedIds: new Set(),
        activeChain: null,
        codeLines: [],
        activeLine: -1,
        summaryText: "",
        suggestPulse: true,
      };
      state.liveAnnouncementHtml = "Try tapping Pekka's DSA2 grade (bottom-right) first.";
      state.liveAnnouncementTone = "";
    } else if (state.step === 3) {
      state.teacher = {
        enabled: false,
        visitedCount: null,
        visitedIds: new Set(),
        matchedIds: new Set(),
        resultText: "Teacher chain is Off. Press Find Virtanen's grades to scan all chains.",
        offVisited: null,
        onVisited: null,
      };
      state.liveAnnouncementHtml = state.teacher.resultText;
      state.liveAnnouncementTone = "";
    }

    renderAll();
  }

  window.__multilistDebug = {
    getState: () => state,
    walkChain,
  };

  function sleep(ms, token) {
    return new Promise((resolve) => {
      setTimeout(() => resolve(token === state.animToken), ms);
    });
  }

  function scrollGridIntoView() {
    const card = document.getElementById("gridCard");
    if (card && card.scrollIntoView) {
      card.scrollIntoView({ block: "nearest", behavior: reducedMotion() ? "auto" : "smooth" });
    }
  }

  // ------------------------------------------------------------------
  // Dynamic Instruction Line
  // ------------------------------------------------------------------
  function getInstructionText() {
    if (state.step === 0) {
      const p = state.predict;
      const isBothQ = !p.freeMode && p.qIndex === PREDICT_QUESTIONS.length - 1;
      if (isBothQ) {
        if (p.revealed) return "Press Free mode to explore any chain, or Next for Step 2.";
        if (p.markedIds.size === 1) return "Press Reveal to check your pick.";
        return "Final question: tap the node on BOTH Matti's chain and DSA1's chain, then press Reveal.";
      }
      if (p.revealed) {
        return p.freeMode ? "Tap another student or course header to explore." : "Press Next question to continue.";
      }
      if (p.selectedHeader) return "Tap the grades you think its chain reaches, then press Reveal.";
      return p.freeMode
        ? "Free mode: tap any student or course header."
        : `Tap ${PREDICT_QUESTIONS[p.qIndex].label} to begin Question ${p.qIndex + 1}.`;
    }

    if (state.step === 1) {
      const a = state.add;
      if (state.isAnimating) return "Updating pointers one reference write at a time...";
      if (a.insertCount === 1 && a.extraStudents === 0) {
        return "Now press Add 50 more students, then insert into the other empty cell.";
      }
      if (a.insertCount >= 2) return "Press Reset to try again.";
      if (a.extraStudents > 0 && a.insertCount >= 1) {
        return "Pick the remaining empty cell to test again, or press Reset.";
      }
      if (a.selectedCell && a.selectedGrade !== null) return "Press Insert to run the 4 reference writes.";
      if (a.selectedCell) return "Now choose a grade (0–5), then press Insert.";
      return "Pick an empty cell, choose a grade, then press Insert.";
    }

    if (state.step === 2) {
      if (state.isAnimating) return "Walking singly linked chains to find each predecessor...";
      if (state.nodes.length === 0) return "All grades deleted. Press Reset to restore.";
      if (state.del.summaryText) return "Tap another grade to delete it, or press Reset.";
      return "Tap a grade to delete it.";
    }

    const t = state.teacher;
    if (state.isAnimating) {
      return t.enabled ? "Walking Teacher Virtanen's moss chain..." : "Scanning every student chain...";
    }
    if (t.offVisited !== null && t.onVisited !== null) {
      return "Teacher chain (optional): compare 7 visits Off vs 3 visits On.";
    }
    if (!t.enabled && t.offVisited !== null) {
      return "Now switch Teacher chain to On and run Find Virtanen's grades again.";
    }
    if (t.enabled && t.onVisited === null) {
      return "Press Find Virtanen's grades to walk only the moss teacher chain.";
    }
    return "Teacher chain (optional): find Virtanen's grades with the toggle Off, then try On.";
  }

  function renderTopBar() {
    document.querySelectorAll(".step-nav .pill-btn").forEach((btn) => {
      const idx = Number(btn.dataset.step);
      btn.setAttribute("aria-current", idx === state.step ? "step" : "false");
      btn.disabled = state.isAnimating;
    });

    const speedBtn = document.getElementById("speedBtn");
    speedBtn.setAttribute("aria-pressed", state.slower ? "true" : "false");
    speedBtn.textContent = state.slower ? "Speed: Slower" : "Speed: Normal";

    document.getElementById("instructionBar").textContent = getInstructionText();

    const showMoss = state.step === 3 && state.teacher.enabled;
    document.querySelectorAll(".moss-legend").forEach((el) => {
      el.style.display = showMoss ? "inline-flex" : "none";
    });

    const backBtn = document.getElementById("backBtn");
    const nextStepBtn = document.getElementById("nextStepBtn");
    backBtn.disabled = state.isAnimating || state.step === 0;
    nextStepBtn.disabled = state.isAnimating || state.step === 3;
    document.getElementById("stepProgress").textContent = `Step ${state.step + 1} of 4`;
  }

  // ------------------------------------------------------------------
  // SVG Text Alternative
  // ------------------------------------------------------------------
  function updateSvgDescription() {
    const desc = document.getElementById("svgDesc");
    const studentLines = state.students.map((s) => {
      const items = walkChain(s.first, "nextOfStudent").map((n) => `${COURSES[n.c]} ${n.grade}`);
      return `${s.name}: ${items.length ? items.join(" -> ") : "empty"}`;
    });
    const courseLines = state.courses.map((c) => {
      const items = walkChain(c.first, "nextOfCourse").map((n) => `${STUDENTS[n.r]} ${n.grade}`);
      return `${c.name}: ${items.length ? items.join(" -> ") : "empty"}`;
    });
    let extra = "";
    if (state.step === 3 && state.teacher.enabled) {
      const tLines = state.teachers.map((t) => {
        const items = walkChain(t.first, "nextOfTeacher").map((n) => `${STUDENTS[n.r]}/${COURSES[n.c]} ${n.grade}`);
        return `${t.name}: ${items.length ? items.join(" -> ") : "empty"}`;
      });
      extra = ` Teacher chains: ${tLines.join("; ")}.`;
    }
    desc.textContent = `3 by 3 grade grid. Student chains: ${studentLines.join("; ")}. Course chains: ${courseLines.join("; ")}.${extra}`;
  }

  // ------------------------------------------------------------------
  // Orthogonal Routing (Fixes 1 & 2: clearances, >=32 stubs, membership blocking)
  // ------------------------------------------------------------------
  function roundedOrthoPath(pts, radius = 10) {
    if (pts.length < 2) return "";
    if (pts.length === 2) return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const prev = pts[i - 1];
      const cur = pts[i];
      const next = pts[i + 1];
      const dx1 = cur.x - prev.x;
      const dy1 = cur.y - prev.y;
      const len1 = Math.hypot(dx1, dy1);
      const dx2 = next.x - cur.x;
      const dy2 = next.y - cur.y;
      const len2 = Math.hypot(dx2, dy2);
      if (len1 < 0.01 || len2 < 0.01) {
        d += ` L ${cur.x} ${cur.y}`;
        continue;
      }
      const r = Math.min(radius, len1 * 0.45, len2 * 0.45);
      const pBefore = { x: cur.x - (dx1 / len1) * r, y: cur.y - (dy1 / len1) * r };
      const pAfter = { x: cur.x + (dx2 / len2) * r, y: cur.y + (dy2 / len2) * r };
      d += ` L ${pBefore.x.toFixed(2)} ${pBefore.y.toFixed(2)} Q ${cur.x.toFixed(2)} ${cur.y.toFixed(2)} ${pAfter.x.toFixed(2)} ${pAfter.y.toFixed(2)}`;
    }
    const last = pts[pts.length - 1];
    d += ` L ${last.x} ${last.y}`;
    return d;
  }

  function analyzeStudentStraight(fromIsHeader, r, sc, tc, memberSet) {
    if (!fromIsHeader && tc <= sc) return { straight: false, crossesEmpty: false, crossesNonMember: false };
    const startC = fromIsHeader ? 0 : sc + 1;
    let crossesEmpty = false;
    let crossesNonMember = false;
    for (let c = startC; c < tc; c++) {
      const n = nodeAt(r, c);
      if (!n) {
        crossesEmpty = true;
      } else if (memberSet.has(n.id)) {
        return { straight: false, crossesEmpty: false, crossesNonMember: false };
      } else {
        crossesNonMember = true;
      }
    }
    return { straight: true, crossesEmpty, crossesNonMember };
  }

  function analyzeCourseStraight(fromIsHeader, c, sr, tr, memberSet) {
    if (!fromIsHeader && tr <= sr) return { straight: false, crossesEmpty: false, crossesNonMember: false };
    const startR = fromIsHeader ? 0 : sr + 1;
    let crossesEmpty = false;
    let crossesNonMember = false;
    for (let r = startR; r < tr; r++) {
      const n = nodeAt(r, c);
      if (!n) {
        crossesEmpty = true;
      } else if (memberSet.has(n.id)) {
        return { straight: false, crossesEmpty: false, crossesNonMember: false };
      } else {
        crossesNonMember = true;
      }
    }
    return { straight: true, crossesEmpty, crossesNonMember };
  }

  function buildStudentRoute(fromIsHeader, r, sc, targetNode, slotOffset, memberSet) {
    const start = fromIsHeader ? headerExitPos("student", r) : exitPos(nodeAt(r, sc), "student");
    const end = entryPos(targetNode, "student");
    const tc = targetNode.c;

    const info = analyzeStudentStraight(fromIsHeader, r, sc, tc, memberSet);
    if (info.straight) {
      return {
        d: `M ${start.x} ${start.y} L ${end.x} ${end.y}`,
        crossesEmpty: info.crossesEmpty,
        crossesNonMember: info.crossesNonMember,
        start,
        end,
      };
    }

    // Slot offsets move toward middle of the gap (+16)
    const laneY = STU_LANE_Y[r] + slotOffset * 16;
    const entryX = STU_ENTRY_X[tc];
    const dropX = fromIsHeader ? 182 : start.x + 26;
    const pts = [
      start,
      { x: dropX, y: start.y },
      { x: dropX, y: laneY },
      { x: entryX, y: laneY },
      { x: entryX, y: end.y },
      end,
    ];
    return { d: roundedOrthoPath(pts, 10), crossesEmpty: false, crossesNonMember: false, start, end };
  }

  function buildCourseRoute(fromIsHeader, c, sr, targetNode, slotOffset, memberSet) {
    const start = fromIsHeader ? headerExitPos("course", c) : exitPos(nodeAt(sr, c), "course");
    const end = entryPos(targetNode, "course");
    const tr = targetNode.r;

    const info = analyzeCourseStraight(fromIsHeader, c, sr, tr, memberSet);
    if (info.straight) {
      return {
        d: `M ${start.x} ${start.y} L ${end.x} ${end.y}`,
        crossesEmpty: info.crossesEmpty,
        crossesNonMember: info.crossesNonMember,
        start,
        end,
      };
    }

    const laneX = CRS_LANE_X[c] + slotOffset * 16;
    const entryY = CRS_ENTRY_Y[tr];
    const dropY = fromIsHeader ? 104 : start.y + 26;
    const pts = [
      start,
      { x: start.x, y: dropY },
      { x: laneX, y: dropY },
      { x: laneX, y: entryY },
      { x: end.x, y: entryY },
      end,
    ];
    return { d: roundedOrthoPath(pts, 10), crossesEmpty: false, crossesNonMember: false, start, end };
  }

  function buildTeacherRoute(fromIsHeader, tIdx, fromNode, targetNode, laneY, entryX) {
    const start = fromIsHeader ? headerExitPos("teacher", tIdx) : exitPos(fromNode, "teacher");
    const end = entryPos(targetNode, "teacher");
    const pts = [
      start,
      { x: start.x, y: laneY },
      { x: entryX, y: laneY },
      { x: entryX, y: end.y },
      end,
    ];
    return { d: roundedOrthoPath(pts, 10), crossesEmpty: false, crossesNonMember: false, start, end };
  }

  function arrowOpacity(chain, fromId, toId) {
    const key = `${chain}:${fromId}->${toId}`;
    if (state.walkedArrowKeys) {
      return state.walkedArrowKeys.has(key) ? 1.0 : 0.35;
    }
    if (state.step === 3 && state.teacher.enabled && chain !== "teacher") {
      return 0.30;
    }
    return 1.0;
  }

  function appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, chain, fromId, toId, route, opacity) {
    const key = `${chain}:${fromId}->${toId}`;
    const isDrawing = state.drawingArrowKey === key;
    const targetArrowLayer = route.crossesNonMember ? layerCrossArrows : layerArrows;
    const targetUnderlayLayer = route.crossesNonMember ? layerCrossUnderlays : layerUnderlays;

    if (route.crossesEmpty || route.crossesNonMember) {
      targetUnderlayLayer.appendChild(svgEl("path", {
        d: route.d,
        fill: "none",
        stroke: COLORS.linen,
        "stroke-width": chain === "course" ? 17 : 13,
        "stroke-linecap": "round",
        opacity,
      }));
    }

    const g = svgEl("g", {
      "data-chain": chain,
      "data-from": fromId,
      "data-to": toId,
      "data-pointer": "true",
      opacity,
    });

    const useMarker = !(isDrawing && !reducedMotion());

    if (chain === "student") {
      g.appendChild(svgEl("path", {
        class: "arrow-path",
        d: route.d,
        fill: "none",
        stroke: COLORS.cobalt,
        "stroke-width": 4.8,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "marker-end": useMarker ? "url(#tip-cobalt)" : null,
      }));
    } else if (chain === "course") {
      g.appendChild(svgEl("path", {
        class: "arrow-outline",
        d: route.d,
        fill: "none",
        stroke: COLORS.saffronOutline,
        "stroke-width": 10.2,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
      }));
      g.appendChild(svgEl("path", {
        class: "arrow-path",
        d: route.d,
        fill: "none",
        stroke: COLORS.saffron,
        "stroke-width": 6.4,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "marker-end": useMarker ? "url(#tip-saffron)" : null,
      }));
    } else {
      g.appendChild(svgEl("path", {
        class: "arrow-path",
        d: route.d,
        fill: "none",
        stroke: COLORS.moss,
        "stroke-width": 4.4,
        "stroke-dasharray": "9 6",
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "marker-end": "url(#tip-moss)",
      }));
    }

    targetArrowLayer.appendChild(g);
  }

  function drawAllPointers(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, membership) {
    const rowSlotUsed = [0, 0, 0];
    const colSlotUsed = [0, 0, 0];

    // 1. Student headers & nodes
    state.students.forEach((stu, r) => {
      if (!stu.first) {
        drawNullRight(layerArrows, headerExitPos("student", r), COLORS.cobalt, state.walkedArrowKeys ? 0.35 : 1);
      } else {
        const route = buildStudentRoute(true, r, -1, stu.first, rowSlotUsed[r], membership.onStudent[r]);
        if (!analyzeStudentStraight(true, r, -1, stu.first.c, membership.onStudent[r]).straight) rowSlotUsed[r]++;
        appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, "student", stu.id, stu.first.id, route, arrowOpacity("student", stu.id, stu.first.id));
      }
    });

    for (const node of state.nodes) {
      if (!node.nextOfStudent) {
        const offRow = !membership.onStudent[node.r].has(node.id);
        drawNullRight(layerArrows, exitPos(node, "student"), COLORS.cobalt, state.walkedArrowKeys ? 0.35 : 1, offRow);
      } else {
        const route = buildStudentRoute(false, node.r, node.c, node.nextOfStudent, rowSlotUsed[node.r], membership.onStudent[node.r]);
        if (!analyzeStudentStraight(false, node.r, node.c, node.nextOfStudent.c, membership.onStudent[node.r]).straight) rowSlotUsed[node.r]++;
        appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, "student", node.id, node.nextOfStudent.id, route, arrowOpacity("student", node.id, node.nextOfStudent.id));
      }
    }

    // 2. Course headers & nodes
    state.courses.forEach((crs, c) => {
      if (!crs.first) {
        drawNullDown(layerArrows, headerExitPos("course", c), COLORS.saffronOutline, state.walkedArrowKeys ? 0.35 : 1);
      } else {
        const route = buildCourseRoute(true, c, -1, crs.first, colSlotUsed[c], membership.onCourse[c]);
        if (!analyzeCourseStraight(true, c, -1, crs.first.r, membership.onCourse[c]).straight) colSlotUsed[c]++;
        appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, "course", crs.id, crs.first.id, route, arrowOpacity("course", crs.id, crs.first.id));
      }
    });

    for (const node of state.nodes) {
      if (!node.nextOfCourse) {
        const offCol = !membership.onCourse[node.c].has(node.id) && (
          (state.courses[node.c].first && state.courses[node.c].first.r > node.r) ||
          state.nodes.some((other) => other.c === node.c && other.r < node.r && other.nextOfCourse && other.nextOfCourse.r > node.r)
        );
        const nudgeLeft = state.step === 3 && state.teacher.enabled && !offCol;
        drawNullDown(layerArrows, exitPos(node, "course"), COLORS.saffronOutline, state.walkedArrowKeys ? 0.35 : 1, nudgeLeft ? "below-left" : "below", offCol);
      } else {
        const route = buildCourseRoute(false, node.c, node.r, node.nextOfCourse, colSlotUsed[node.c], membership.onCourse[node.c]);
        if (!analyzeCourseStraight(false, node.c, node.r, node.nextOfCourse.r, membership.onCourse[node.c]).straight) colSlotUsed[node.c]++;
        appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, "course", node.id, node.nextOfCourse.id, route, arrowOpacity("course", node.id, node.nextOfCourse.id));
      }
    }

    // 3. Teacher headers & nodes (Step 4 when Teacher chain is On)
    if (state.step === 3 && state.teacher.enabled) {
      const usedMossV = [[], [], []]; // per-column { x, y0, y1 }
      const usedMossH = [];           // { y, x0, x1 }
      const overlap = (a0, a1, b0, b1, pad = 4) => Math.min(a1, b1) >= Math.max(a0, b0) - pad;

      function allocTeacherRoute(fromIsHeader, tIdx, fromNode, targetNode) {
        const start = fromIsHeader ? headerExitPos("teacher", tIdx) : exitPos(fromNode, "teacher");
        const end = entryPos(targetNode, "teacher");
        const col = targetNode.c;
        const xCands = MOSS_X_SLOTS[col];
        const yCands = fromIsHeader ? [1018 - tIdx * 16, 1002 - tIdx * 16] : MOSS_Y_SLOTS[fromNode.r];

        // Pick (laneY, entryX) with no overlapping H or V moss segments; prefer unused vertical X first
        let best = null;
        for (const cy of yCands) {
          for (const cx of xCands) {
            const x0 = Math.min(start.x, cx), x1 = Math.max(start.x, cx);
            const y0 = Math.min(cy, end.y), y1 = Math.max(cy, end.y);
            const hHit = usedMossH.some((h) => h.y === cy && overlap(x0, x1, h.x0, h.x1));
            const vHit = usedMossV[col].some((v) => v.x === cx && overlap(y0, y1, v.y0, v.y1));
            const vUsedCol = usedMossV[col].some((v) => v.x === cx);
            if (!hHit && !vHit) {
              if (!vUsedCol) {
                best = { laneY: cy, entryX: cx };
                break;
              }
              if (!best) best = { laneY: cy, entryX: cx };
            }
          }
          if (best && !usedMossV[col].some((v) => v.x === best.entryX)) break;
        }
        if (!best) best = { laneY: yCands[0], entryX: xCands[0] };

        const x0 = Math.min(start.x, best.entryX), x1 = Math.max(start.x, best.entryX);
        const y0 = Math.min(best.laneY, end.y), y1 = Math.max(best.laneY, end.y);
        usedMossH.push({ y: best.laneY, x0, x1 });
        usedMossV[col].push({ x: best.entryX, y0, y1 });
        return buildTeacherRoute(fromIsHeader, tIdx, fromNode, targetNode, best.laneY, best.entryX);
      }

      state.teachers.forEach((th, tIdx) => {
        if (!th.first) {
          drawNullDown(layerArrows, headerExitPos("teacher", tIdx), COLORS.moss, 1);
        } else {
          const route = allocTeacherRoute(true, tIdx, null, th.first);
          appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, "teacher", th.id, th.first.id, route, arrowOpacity("teacher", th.id, th.first.id));
        }
      });

      for (const node of state.nodes) {
        if (!node.nextOfTeacher) {
          drawNullDown(layerArrows, exitPos(node, "teacher"), COLORS.moss, 1, "right");
        } else {
          const route = allocTeacherRoute(false, 0, node, node.nextOfTeacher);
          appendArrowSvg(layerArrows, layerUnderlays, layerCrossArrows, layerCrossUnderlays, "teacher", node.id, node.nextOfTeacher.id, route, arrowOpacity("teacher", node.id, node.nextOfTeacher.id));
        }
      }
    }

    // Fading replaced header arrow during Step 2 Line 2 / Line 4 (keeps exact pre-change shape)
    if (state.step === 1 && state.fadingOldArrow) {
      const f = state.fadingOldArrow;
      const oldD = f.d || (f.chain === "student"
        ? buildStudentRoute(true, f.idx, -1, f.toNode, 0, membership.onStudent[f.idx]).d
        : buildCourseRoute(true, f.idx, -1, f.toNode, 0, membership.onCourse[f.idx]).d);
      const fadeG = svgEl("g", { class: "fading-old-arrow", opacity: "0.95" });
      fadeG.appendChild(svgEl("path", {
        d: oldD,
        fill: "none",
        stroke: f.chain === "student" ? COLORS.cobalt : COLORS.saffronOutline,
        "stroke-width": f.chain === "student" ? 4.4 : 8.0,
        "stroke-dasharray": "9 6",
      }));
      layerArrows.appendChild(fadeG);
      if (!reducedMotion()) {
        fadeG.style.transition = `opacity ${stepDelay(0.85)}ms ease-out`;
        requestAnimationFrame(() => { fadeG.style.opacity = "0"; });
      } else {
        fadeG.style.opacity = "0.25";
      }
    }
  }

  function drawNullRight(layer, dot, color, opacity = 1, offsetBelow = false) {

  function renderSvgGrid() {
    const svg = document.getElementById("gridSvg");
    const needTall = (state.step === 1 && state.add.extraStudents > 0) || (state.step === 3 && state.teacher.enabled);
    const vbH = needTall ? VB_H_TALL : VB_H_BASE;
    svg.setAttribute("viewBox", `0 0 ${VB_W} ${vbH}`);

    const layerBackdrop = document.getElementById("layerBackdrop");
    const layerCells = document.getElementById("layerCells");
    const layerUnderlays = document.getElementById("layerUnderlays");
    const layerArrows = document.getElementById("layerArrows");
    const layerHeaders = document.getElementById("layerHeaders");
    const layerNodes = document.getElementById("layerNodes");
    const layerCrossUnderlays = document.getElementById("layerCrossUnderlays");
    const layerCrossArrows = document.getElementById("layerCrossArrows");
    const layerNodeContent = document.getElementById("layerNodeContent");
    const layerExtras = document.getElementById("layerExtras");
    const layerOverlay = document.getElementById("layerOverlay");

    [
      layerBackdrop, layerCells, layerUnderlays, layerArrows, layerHeaders,
      layerNodes, layerCrossUnderlays, layerCrossArrows, layerNodeContent, layerExtras, layerOverlay,
    ].forEach((g) => { g.innerHTML = ""; });

    // Rebuild node exclusion & attenuation masks so crossing underlays never strip node cards
    // and crossing arrows read as passing behind node digits (~60% inside cards).
    const maskOut = document.getElementById("maskOutsideNodes");
    const maskFade = document.getElementById("maskCrossArrowCard");
    [maskOut, maskFade].forEach((m) => {
      m.innerHTML = "";
      m.setAttribute("height", String(vbH));
      m.appendChild(svgEl("rect", { x: 0, y: 0, width: VB_W, height: vbH, fill: "#FFFFFF" }));
    });
    for (const n of state.nodes) {
      const nrx = X_COLS[n.c] - NODE_W / 2;
      const nry = Y_ROWS[n.r] - NODE_H / 2;
      maskOut.appendChild(svgEl("rect", { x: nrx, y: nry, width: NODE_W, height: NODE_H, rx: 14, fill: "#000000" }));
      maskFade.appendChild(svgEl("rect", { x: nrx, y: nry, width: NODE_W, height: NODE_H, rx: 14, fill: "#999999" }));
    }
    layerCrossUnderlays.setAttribute("mask", "url(#maskOutsideNodes)");
    layerCrossArrows.setAttribute("mask", "url(#maskCrossArrowCard)");

    const membership = getChainMembership();

    // Subtle grid frame
    const gridX = 256;
    const gridY = 152;
    const gridW = 928;
    const gridH = 774;
    layerBackdrop.appendChild(svgEl("rect", {
      x: gridX, y: gridY, width: gridW, height: gridH, rx: 16,
      fill: "none", stroke: COLORS.muted, "stroke-width": 1.8, "stroke-opacity": 0.30,
    }));
    [540, 898].forEach((vx) => {
      layerBackdrop.appendChild(svgEl("line", {
        x1: vx, y1: gridY, x2: vx, y2: gridY + gridH,
        stroke: COLORS.muted, "stroke-width": 1.6, "stroke-opacity": 0.25,
      }));
    });
    [392, 684].forEach((hy) => {
      layerBackdrop.appendChild(svgEl("line", {
        x1: gridX, y1: hy, x2: gridX + gridW, y2: hy,
        stroke: COLORS.muted, "stroke-width": 1.6, "stroke-opacity": 0.25,
      }));
    });

    // Empty cells
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (nodeAt(r, c)) continue;
        const cx = X_COLS[c];
        const cy = Y_ROWS[r];
        const rx = cx - NODE_W / 2;
        const ry = cy - NODE_H / 2;

        const isStep2 = state.step === 1;
        const isLocked = isStep2 && state.add.insertCount === 1 && state.add.extraStudents === 0;
        const isSelected = isStep2 && state.add.selectedCell && state.add.selectedCell.r === r && state.add.selectedCell.c === c;
        const canTap = isStep2 && !state.isAnimating;

        const cellGroup = svgEl("g", {
          "data-empty-cell": `${r}-${c}`,
          "data-interactive": canTap ? "true" : "false",
          "data-locked": isLocked ? "true" : "false",
          "tabindex": canTap ? "0" : "-1",
          "role": isStep2 ? "button" : null,
          "aria-label": isStep2 ? `Empty cell ${STUDENTS[r]} ${COURSES[c]}` : null,
        });
        cellGroup.appendChild(svgEl("rect", {
          x: cx - HIT_SZ / 2, y: r === 0 ? 168.5 : cy - HIT_SZ / 2, width: HIT_SZ, height: HIT_SZ, rx: 16,
          fill: "transparent",
        }));
        cellGroup.appendChild(svgEl("rect", {
          x: rx, y: ry, width: NODE_W, height: NODE_H, rx: 14,
          fill: isSelected ? "rgba(47, 93, 168, 0.12)" : "transparent",
          stroke: isSelected ? COLORS.cobalt : COLORS.muted,
          "stroke-width": isSelected ? 4.2 : 3.0,
          "stroke-opacity": isLocked ? 0.35 : (isSelected ? 1 : 0.60),
          "stroke-dasharray": isSelected ? "none" : "10 8",
        }));
        if (isSelected) {
          cellGroup.appendChild(svgEl("text", {
            x: cx, y: cy + 16, "text-anchor": "middle",
            class: "svg-ui", "font-size": 46, "font-weight": 700, fill: COLORS.cobalt,
          }, "picked"));
        }
        if (canTap) {
          const pickEmpty = () => onSelectEmptyCell(r, c);
          cellGroup.addEventListener("click", pickEmpty);
          cellGroup.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickEmpty(); }
          });
        }
        layerCells.appendChild(cellGroup);
      }
    }

    // Row headers (left)
    state.students.forEach((stu, r) => {
      const cy = Y_ROWS[r];
      const ry = cy - RH.h / 2;
      const canTapHeader = state.step === 0 && !state.isAnimating && (state.predict.freeMode || state.predict.qIndex < PREDICT_QUESTIONS.length - 1);
      const isSelected = state.step === 0 && state.predict.selectedHeader && state.predict.selectedHeader.type === "student" && state.predict.selectedHeader.index === r;
      const isGuidedTarget = state.step === 0 && !state.predict.freeMode && PREDICT_QUESTIONS[state.predict.qIndex].type === "student" && PREDICT_QUESTIONS[state.predict.qIndex].index === r;
      const isBothGlow = state.step === 0 && state.predict.revealed && state.predict.activeChainType === "both" && r === 0;

      const g = svgEl("g", {
        "data-row-header": stu.name,
        "data-interactive": canTapHeader ? "true" : "false",
        "tabindex": canTapHeader ? "0" : "-1",
        "role": canTapHeader ? "button" : null,
        "aria-label": canTapHeader ? `Student ${stu.name}` : null,
      });

      g.appendChild(svgEl("rect", {
        x: 0, y: r === 0 ? 168.5 : cy - HIT_SZ / 2, width: HIT_SZ, height: HIT_SZ, rx: 14,
        fill: "transparent",
      }));

      if (isSelected || isBothGlow) {

          x: RH.x - 5, y: ry - 5, width: RH.w + 10, height: RH.h + 10, rx: 17,
          fill: "none", stroke: COLORS.cobalt, "stroke-width": 3.6, "stroke-dasharray": "9 6",
