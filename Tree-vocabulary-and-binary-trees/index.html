            state.feedback = { kind: "correct", text: "Correct. " + (task.explain || "") };
            completeCurrentTask();
          } else {
            state.attempts += 1;
            if (state.attempts === 1 && task.hints && task.hints.length > 0) {
              state.feedback = { kind: "wrong", text: task.hints[0] };
            } else {
              state.taskChoiceGuess = val;
              state.feedback = { kind: "revealed", text: "Answer revealed. " + (task.explain || "") };
              completeCurrentTask();
            }
          }
          saveSnapshot();
          renderAll(false);
        }

        function handleMultiCheck() {
          const task = currentTask();
          if (!task || state.taskDone) return;
          const result = task.checkMulti(Array.from(state.multiSelected));
          if (result.ok) {
            state.feedback = { kind: "correct", text: "Correct. " + (task.explain || "") };
            completeCurrentTask();
          } else {
            state.attempts += 1;
            if (state.attempts === 1) {
              state.feedback = { kind: "wrong", text: result.message };
            } else {
              state.feedback = { kind: "revealed", text: "Answer revealed. " + (task.explain || "") };
              completeCurrentTask();
            }
          }
          saveSnapshot();
          renderAll(false);
        }

        function handleContinue() {
          if (!state.taskDone) {
            completeCurrentTask();
          }
          advanceTaskOrStep();
        }

        function handleSlotFillOne() {
          const task = currentTask();
          if (!task || task.type !== "slotfill") return;
          const order = task.getFillOrder();
          if (state.fillCount >= order.length) return;
          const edge = order[state.fillCount];
          state.fillCount += 1;
          state.justFilledKey = edge.key;
          if (task.onFillUpdate) task.onFillUpdate(state.view, state);
          if (state.fillCount >= order.length) {
            const layout = binaryLayouts[task.treeKey || "c"];
            state.feedback = {
              kind: "correct",
              text: "Filled: " + order.length + " (that is n \u2212 1). Empty: " + layout.emptyCount + " (that is n + 1)."
            };
          } else if (state.fillCount === 1) {
            state.feedback = {
              kind: "correct",
              text: "Every node except the root sits in exactly one parent's slot."
            };
          } else {
            const sideWord = edge.side === "L" ? "left" : "right";
            state.feedback = {
              kind: "correct",
              text: "Node " + edge.to + " landed in " + edge.from + "'s " + sideWord + " slot."
            };
          }
          saveSnapshot();
          renderAll(false);
        }

        function handleSlotFillAll() {
          const task = currentTask();
          if (!task || task.type !== "slotfill") return;
          const order = task.getFillOrder();
          if (state.fillCount >= order.length) return;
          state.fillCount = order.length;
          state.usedFillAll = true;
          state.justFilledKey = null;
          if (task.onFillUpdate) task.onFillUpdate(state.view, state);
          const layout = binaryLayouts[task.treeKey || "c"];
          state.feedback = {
            kind: "correct",
            text: "Every node except the root sits in exactly one parent's slot. Filled: " + order.length + " (n \u2212 1), Empty: " + layout.emptyCount + " (n + 1)."
          };
          saveSnapshot();
          renderAll(false);
        }

        function handleReveal() {
          const task = currentTask();
          if (!task) return;
          state.revealedInfo = true;
          completeCurrentTask();
          state.feedback = { kind: "correct", text: task.explain || "Done." };
          saveSnapshot();
          renderAll(false);
        }

        function defaultGuidanceText(task) {
          if (task.type === "click") {
            if (task.idleFeedback) return task.idleFeedback;
            return "Click a node circle in the tree diagram to answer.";
          }
          if (task.type === "multiclick") {
            if (state.multiSelected.size === 0) {
              return "Click nodes in the tree diagram to select them, then press Check.";
            }
            return "Selected (" + state.multiSelected.size + "): " + Array.from(state.multiSelected).join(", ") + ". Press Check when ready.";
          }
          if (task.type === "explore") {
            if (state.exploredNodeId) {
              return "Inspecting node " + state.exploredNodeId + ". Click other nodes or press Continue.";
            }
            return task.idleFeedback || "Click any node to see its relatives light up.";
          }
          return "";
        }

        function scrollActiveChip() {
          const activeChip = config.stepperEl.querySelector(".step-chip.is-current");
          if (!activeChip || config.stepperEl.clientWidth === 0) return;
          const sRect = config.stepperEl.getBoundingClientRect();
          const cRect = activeChip.getBoundingClientRect();
          const targetLeft = config.stepperEl.scrollLeft + (cRect.left - sRect.left) - (config.stepperEl.clientWidth - cRect.width) / 2;
          if (typeof config.stepperEl.scrollTo === "function") {
            config.stepperEl.scrollTo({
              left: Math.max(0, targetLeft),
              behavior: prefersReducedMotion() ? "auto" : "smooth"
            });
          } else {
            config.stepperEl.scrollLeft = Math.max(0, targetLeft);
          }
        }

        function renderStepper() {
          config.stepperEl.replaceChildren();
          config.steps.forEach((step, i) => {
            const btn = document.createElement("button");
            btn.type = "button";
            const isCurrent = i === state.stepIndex;
            const isDone = state.finishedSteps.has(step.id);
            btn.className = "step-chip" + (isCurrent ? " is-current" : "") + (isDone ? " is-done" : "");
            btn.setAttribute("aria-current", isCurrent ? "step" : "false");
            btn.setAttribute("aria-label", "Step " + (i + 1) + ": " + step.title + (isDone ? " (finished)" : ""));

            const num = document.createElement("span");
            num.className = "chip-num";
            num.textContent = String(i + 1);
            btn.appendChild(num);

            const title = document.createElement("span");
            title.textContent = step.title;
            btn.appendChild(title);

            if (isDone) {
              const chk = document.createElement("span");
              chk.className = "chip-check";
              chk.setAttribute("aria-hidden", "true");
              chk.textContent = "\u2713";
              btn.appendChild(chk);
            }

            btn.addEventListener("click", () => enterStep(i, true));
            config.stepperEl.appendChild(btn);
          });
          scrollActiveChip();
        }

        function resetQuickCheckStep(step) {
          state.savedSteps.delete(step.id);
          for (let i = 0; i < step.tasks.length; i++) {
            state.savedTasks.delete(step.id + ":" + i);
          }
          state.finishedSteps.delete(step.id);
          state.quizScores = [];
          state.quizDone = false;
          state.quizVariant += 1;
          if (typeof step.buildVariant === "function") {
            step.tasks = step.buildVariant(state.quizVariant);
            prepareStepChoices(config.steps, state.quizVariant);
          }
        }

        function renderBanner(shouldFocus) {
          const step = currentStep();
          const task = currentTask();

          bannerTitle.textContent = step.title;

          if (step.intro) {
            bannerIntro.hidden = false;
            setRichText(bannerIntro, step.intro);
          } else {
            bannerIntro.hidden = true;
            bannerIntro.textContent = "";
          }

          if (step.isQuickCheck && state.quizDone) {
            bannerResult.hidden = false;
            taskBoxEl.hidden = true;
            bannerResult.replaceChildren();
            const total = step.tasks.length;
            const got = step.tasks.filter((_, i) => state.quizScores[i] === true).length;

            const score = document.createElement("p");
            score.className = "result-score";
            score.textContent = "You got " + got + " of " + total + ".";
            bannerResult.appendChild(score);

            const misses = step.tasks
              .map((t, i) => ({ t, i }))
              .filter(({ i }) => !state.quizScores[i]);

            if (misses.length > 0) {
              const ul = document.createElement("ul");
              ul.className = "miss-list";
              for (const { t } of misses) {
                const li = document.createElement("li");
                li.className = "miss-item";
                const msg = document.createElement("span");
                msg.textContent = t.missExplain || t.explain || "";
                li.appendChild(msg);
                if (t.reviewStepId !== undefined) {
                  const revIdx = config.steps.findIndex((s) => s.id === t.reviewStepId);
                  if (revIdx !== -1) {
                    const rev = document.createElement("button");
                    rev.type = "button";
                    rev.className = "btn";
                    rev.textContent = "Review step " + (revIdx + 1);
                    rev.addEventListener("click", () => enterStep(revIdx, true));
                    li.appendChild(rev);
                  }
                }
                ul.appendChild(li);
              }
              bannerResult.appendChild(ul);
            }

            if (step.rememberLines && step.rememberLines.length > 0) {
              const remTitle = document.createElement("p");
              remTitle.className = "predict-prompt";
              remTitle.textContent = "What to remember";
              bannerResult.appendChild(remTitle);

              const rul = document.createElement("ul");
              rul.className = "remember-list";
              for (const line of step.rememberLines) {
                const rli = document.createElement("li");
                rli.textContent = line;
                rul.appendChild(rli);
              }
              bannerResult.appendChild(rul);
            }

            const btnRow = document.createElement("div");
            btnRow.className = "task-controls";
            const tryBtn = document.createElement("button");
            tryBtn.type = "button";
            tryBtn.className = "btn";
            tryBtn.textContent = "Try again";
            tryBtn.addEventListener("click", () => {
              resetQuickCheckStep(step);
              enterStep(state.stepIndex, true, true);
            });
            btnRow.appendChild(tryBtn);

            const otherBtn = document.createElement("button");
            otherBtn.type = "button";
            otherBtn.className = "btn is-vermilion";
            otherBtn.textContent = config.nextPartLabel;
            otherBtn.addEventListener("click", () => config.onGoOtherPart());
            btnRow.appendChild(otherBtn);

            bannerResult.appendChild(btnRow);
          } else if (task) {
            bannerResult.hidden = true;
            bannerResult.replaceChildren();
            taskBoxEl.hidden = false;
            taskTopEl.replaceChildren();

            if (task.workedExample) {
              const we = document.createElement("div");
              we.className = "worked-example";
              if (task.workedExample.label) {
                const lbl = document.createElement("span");
                lbl.className = "worked-example-label";
                lbl.textContent = task.workedExample.label;
                we.appendChild(lbl);
              }
              const txt = document.createElement("span");
              setRichText(txt, task.workedExample.text);
              we.appendChild(txt);
              taskTopEl.appendChild(we);
            }

            const prompt = document.createElement("p");
            prompt.className = "task-prompt";
            setRichText(prompt, task.prompt);
            taskTopEl.appendChild(prompt);

            if (task.codeCard) {
              const pre = document.createElement("pre");
              pre.className = "code-card";
              const code = document.createElement("code");
              code.textContent = task.codeCard;
              pre.appendChild(code);
              taskTopEl.appendChild(pre);
            }

            const controls = document.createElement("div");
            controls.className = "task-controls";

            if (task.type === "slotfill") {
              const order = task.getFillOrder();
              const allFilled = state.fillCount >= order.length;
              if (!allFilled) {
                const oneBtn = document.createElement("button");
                oneBtn.type = "button";
                oneBtn.className = "btn is-primary";
                oneBtn.textContent = "Fill a slot";
                oneBtn.addEventListener("click", handleSlotFillOne);
                controls.appendChild(oneBtn);

                const allBtn = document.createElement("button");
                allBtn.type = "button";
                allBtn.className = "btn";
                allBtn.textContent = "Fill all";
                allBtn.addEventListener("click", handleSlotFillAll);
                controls.appendChild(allBtn);
              }
              const contBtn = document.createElement("button");
              contBtn.type = "button";
              contBtn.className = "btn is-primary";
              contBtn.textContent = "Continue";
              contBtn.disabled = !allFilled && !state.taskDone;
              contBtn.addEventListener("click", handleContinue);
              controls.appendChild(contBtn);
            } else if (task.type === "explore") {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "btn is-primary";
              btn.textContent = "Continue";
              btn.addEventListener("click", handleContinue);
              controls.appendChild(btn);
            } else if (task.type === "multiclick") {
              if (!state.taskDone) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn is-primary";
                btn.textContent = "Check";
                btn.disabled = state.multiSelected.size === 0;
                btn.addEventListener("click", handleMultiCheck);
                controls.appendChild(btn);
              }
            } else if (task.type === "choice") {
              controls.appendChild(buildVocabPredictBox(
                "Guess first, then check:",
                task.choices,
                state.taskDone ? state.taskChoiceGuess : null,
                task.answer,
                handleChoice,
                null
              ));
            } else if (task.type === "reveal") {
              if (!state.revealedInfo) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn is-primary";
                btn.textContent = task.buttonLabel || "Reveal";
                btn.addEventListener("click", handleReveal);
                controls.appendChild(btn);
              }
            }

            if (state.taskDone && task.type !== "explore" && task.type !== "slotfill") {
              if (state.taskIndex < step.tasks.length - 1) {
                const nextTaskBtn = document.createElement("button");
                nextTaskBtn.type = "button";
                nextTaskBtn.className = "btn is-vermilion";
                nextTaskBtn.textContent = step.isQuickCheck ? "Next question" : "Next task";
                nextTaskBtn.addEventListener("click", advanceTaskOrStep);
                controls.appendChild(nextTaskBtn);
              } else if (step.isQuickCheck && !state.quizDone) {
                const resBtn = document.createElement("button");
                resBtn.type = "button";
                resBtn.className = "btn is-vermilion";
                resBtn.textContent = "See results";
                resBtn.addEventListener("click", () => {
                  state.quizDone = true;
                  saveSnapshot();
                  renderAll(false);
                });
                controls.appendChild(resBtn);
              }
            }

            if (controls.childNodes.length > 0) {
              taskTopEl.appendChild(controls);
            }

            if (task.codeAccordion) {
              const det = document.createElement("details");
              det.className = "algebra-details";
              const sum = document.createElement("summary");
              sum.textContent = task.codeAccordion.summary;
              det.appendChild(sum);
              const pre = document.createElement("pre");
              pre.className = "code-card";
              const code = document.createElement("code");
              code.textContent = task.codeAccordion.code;
              pre.appendChild(code);
              det.appendChild(pre);
              taskTopEl.appendChild(det);
            }

            if (task.type === "slotfill") {
              const order = task.getFillOrder();
              if (state.fillCount >= 1) {
                const cap = document.createElement("p");
                cap.className = "task-subnote";
                cap.textContent = "Every node except the root sits in exactly one parent's slot.";
                taskTopEl.appendChild(cap);
              }
              if (state.fillCount >= order.length) {
                const layout = binaryLayouts[task.treeKey || "c"];
                const why = document.createElement("p");
                why.className = "task-subnote";
                why.textContent = "Every empty slot is a place where a search stops, a null check happens, or a new node can be attached.";
                taskTopEl.appendChild(why);

                const det = document.createElement("details");
                det.className = "algebra-details";
                const sum = document.createElement("summary");
                sum.textContent = "Show the algebra";
                det.appendChild(sum);
                const alg = document.createElement("p");
                alg.textContent = "2n slots \u2212 (n \u2212 1) filled = n + 1 empty  (" + (layout.nodeCount * 2) + " \u2212 " + layout.edgeCount + " = " + layout.emptyCount + ")";
                det.appendChild(alg);
                taskTopEl.appendChild(det);
              }
            }

            if (state.revealedInfo && task.postRevealNote) {
              const sub = document.createElement("p");
              sub.className = "task-subnote";
              sub.textContent = task.postRevealNote;
              taskTopEl.appendChild(sub);
            }

            feedbackEl.className = "task-feedback";
            if (state.feedback) {
              feedbackEl.hidden = false;
              feedbackEl.classList.add("is-" + state.feedback.kind);
              feedbackEl.textContent = state.feedback.text;
            } else {
              const guidance = defaultGuidanceText(task);
              if (guidance) {
                feedbackEl.hidden = false;
                feedbackEl.textContent = guidance;
              } else {
                feedbackEl.hidden = true;
                feedbackEl.textContent = "";
              }
            }
          }

          if (shouldFocus) {
            bannerTitle.focus();
          }
        }

        function renderSide() {
          const step = currentStep();
          config.sideEl.replaceChildren();

          if (step.ruleReminder) {
            const block = document.createElement("div");
            block.className = "side-block";
            const p = document.createElement("p");
            p.className = "rule-note";
            p.textContent = step.ruleReminder;
            block.appendChild(p);
            config.sideEl.appendChild(block);
          }

          if (state.exploredNodeId && config.buildFactsBlock) {
            const factsEl = config.buildFactsBlock(state.exploredNodeId, state.view);
            if (factsEl) config.sideEl.appendChild(factsEl);
          }

          if (step.codeNote) {
            const block = document.createElement("div");
            block.className = "side-block";
            const box = document.createElement("div");
            box.className = "code-fact";
            if (step.codeNote.label) {
              const lbl = document.createElement("span");
              lbl.className = "code-fact-label";
              lbl.textContent = step.codeNote.label;
              box.appendChild(lbl);
            }
            const pre = document.createElement("pre");
            pre.className = "code-fact-lines";
            const lines = step.codeNote.lines || [];
            lines.forEach((ln, idx) => {
              if (idx > 0) pre.appendChild(document.createTextNode("\n"));
              appendCodeWithNulls(pre, ln);
            });
            box.appendChild(pre);
            block.appendChild(box);
            config.sideEl.appendChild(block);
          }

          // Block 1: In this step (legend)
          const legendBlock = document.createElement("div");
          legendBlock.className = "side-block";
          const lh = document.createElement("h3");
          lh.className = "side-title";
          lh.textContent = "In this step";
          legendBlock.appendChild(lh);

          const ul = document.createElement("ul");
          ul.className = "legend-list";
          const items = step.legend || [
            { swatch: "default", text: "Circle = node" },
            { swatch: "highlight", text: "Terracotta = active or highlighted" }
          ];
          for (const item of items) {
            const li = document.createElement("li");
            li.className = "legend-item";
            const sw = document.createElement("span");
            sw.className = "swatch" + (item.swatch !== "default" ? " is-" + item.swatch : "");
            sw.setAttribute("aria-hidden", "true");
            li.appendChild(sw);
            const sp = document.createElement("span");
            sp.textContent = item.text;
            li.appendChild(sp);
            ul.appendChild(li);
          }
          legendBlock.appendChild(ul);
          config.sideEl.appendChild(legendBlock);

          // Block 2: Words so far (glossary)
          const glossBlock = document.createElement("div");
          glossBlock.className = "side-block";
          const gh = document.createElement("h3");
          gh.className = "side-title";
          gh.textContent = "Words so far";
          glossBlock.appendChild(gh);

          if (state.glossary.length === 0) {
            const p = document.createElement("p");
            p.className = "side-hint";
            p.textContent = "New words appear here as you meet them.";
            glossBlock.appendChild(p);
          } else {
            const gl = document.createElement("div");
            gl.className = "glossary-list";
            for (const term of state.glossary) {
              const row = document.createElement("div");
              row.className = "glossary-item" + (state.freshGlossary.has(term) ? " is-fresh" : "");
              const tSpan = document.createElement("span");
              tSpan.className = "glossary-term";
              tSpan.textContent = term + ": ";
              const dSpan = document.createElement("span");
              dSpan.className = "glossary-def";
              dSpan.textContent = GLOSSARY_DEFS[term] || "";
              row.appendChild(tSpan);
              row.appendChild(dSpan);
              gl.appendChild(row);
            }
            glossBlock.appendChild(gl);
          }
          config.sideEl.appendChild(glossBlock);
        }

        function renderNav() {
          const step = currentStep();
          const stepDone = state.finishedSteps.has(step.id);
          const nextStep = config.steps[state.stepIndex + 1];

          config.navEl.replaceChildren();

          const pair = document.createElement("div");
          pair.className = "nav-pair";

          const backBtn = document.createElement("button");
          backBtn.type = "button";
          backBtn.className = "btn";
          backBtn.textContent = "Back";
          backBtn.addEventListener("click", goBackStep);
          pair.appendChild(backBtn);

          const nextBtn = document.createElement("button");
          nextBtn.type = "button";
          if (stepDone) {
            nextBtn.className = "btn is-vermilion";
            nextBtn.textContent = nextStep ? "Next: " + nextStep.title : config.nextPartLabel;
          } else {
            nextBtn.className = "btn";
            nextBtn.textContent = "Skip step";
          }
          nextBtn.addEventListener("click", handleSkipOrNext);
          pair.appendChild(nextBtn);

          config.navEl.appendChild(pair);

          const restartBtn = document.createElement("button");
          restartBtn.type = "button";
          restartBtn.className = "link-btn";
          restartBtn.textContent = "Restart this part";
          restartBtn.addEventListener("click", resetPart);
          config.navEl.appendChild(restartBtn);
        }

        function renderView() {
          const task = currentTask();
          const clickable = Boolean(
            task && (task.type === "click" || task.type === "multiclick" || task.type === "explore") && !(state.taskDone && task.type !== "explore")
          );
          const isFirstClickTask = Boolean(
            task &&
            task.type === "click" &&
            clickable &&
            !state.taskDone &&
            state.stepIndex === 0 &&
            state.taskIndex === 0 &&
            (state.subIndex || 0) === 0 &&
            (!config.isPanelVisible || config.isPanelVisible())
          );
          const pulseFirst = isFirstClickTask && !state.pulsedFirstClick && !prefersReducedMotion();
          if (pulseFirst) {
            state.pulsedFirstClick = true;
          }
          config.renderTree(
            state.view,
            clickable ? handleNodeInteraction : null,
            {
              multiclick: Boolean(task && task.type === "multiclick"),
              pressedIds: Array.from(state.multiSelected),
              pulseFirst
            }
          );
        }

        function renderAll(shouldFocus) {
          renderStepper();
          renderBanner(shouldFocus);
          renderSide();
          renderNav();
          renderView();
        }

        function resetPart() {
          state.initialized = false;
          state.pulsedFirstClick = false;
          state.finishedSteps = new Set();
          state.savedSteps.clear();
          state.savedTasks.clear();
          state.glossary = [];
          state.freshGlossary = new Set();
          state.quizVariant = 0;
          for (const st of config.steps) {
            if (typeof st.buildVariant === "function") {
              st.tasks = st.buildVariant(0);
            }
          }
          prepareStepChoices(config.steps, 0);
          config.onQuickCheckChange(false);
          enterStep(0, true);
        }

        return {
          start: () => enterStep(0, false),
          refreshView: () => {
            renderView();
            scrollActiveChip();
          }
        };
      }

      const tabVocabBtn = document.getElementById("tab-vocab");
      const tabBinaryBtn = document.getElementById("tab-binary");

      function addFact(dl, label, value) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        dl.appendChild(dt);
        dl.appendChild(dd);
      }

      function buildVocabFactsBlock(id) {
        const block = document.createElement("div");
        block.className = "side-block";
        const h = document.createElement("h3");
        h.className = "side-title";
        h.textContent = "Node " + id;
        block.appendChild(h);

        const pId = vocabModel.parent[id];
        const kids = vocabModel.children[id];
        const sibs = vocabModel.getSiblings(id);

        const dl = document.createElement("dl");
        dl.className = "fact-list";
        addFact(dl, "Node", id);
        addFact(dl, "Parent", pId === null ? "none (root)" : pId);
        addFact(dl, "Children", kids.length ? kids.join(", ") : "none");
        addFact(dl, "Siblings", sibs.length ? sibs.join(", ") : "none");
        let role;
        if (kids.length === 0) {
          role = pId === null ? "root (leaf)" : "leaf";
        } else {
          role = pId === null ? "root (internal node)" : "internal node";
        }
        addFact(dl, "Role", role);
        block.appendChild(dl);
        return block;
      }

      function buildBinaryFactsBlock(id, view) {
        const treeKey = view && view.treeKey;
        const layout = treeKey ? binaryLayouts[treeKey] : null;
        const node = layout && layout.nodes[id];
        if (!node) return null;

        const block = document.createElement("div");
        block.className = "side-block";
        const h = document.createElement("h3");
        h.className = "side-title";
        h.textContent = "Node " + id;
        block.appendChild(h);

        const emptyHere = (node.l ? 0 : 1) + (node.r ? 0 : 1);
        const dl = document.createElement("dl");
        dl.className = "fact-list";
        addFact(dl, "Tree", layout.name);
        addFact(dl, "Left child", node.l || "none");
        addFact(dl, "Right child", node.r || "none");
        addFact(dl, "Empty slots here", String(emptyHere));
        block.appendChild(dl);

        const codeBox = document.createElement("div");
        codeBox.className = "code-fact";
        const lbl = document.createElement("span");
        lbl.className = "code-fact-label";
        lbl.textContent = "In code";
        codeBox.appendChild(lbl);

        const line = document.createElement("span");
        line.appendChild(document.createTextNode("node " + id + ": left = "));
        if (node.l) {
          line.appendChild(document.createTextNode(node.l));
        } else {
          const nl = document.createElement("span");
          nl.className = "code-null";
          nl.textContent = "null";
          line.appendChild(nl);
        }
        line.appendChild(document.createTextNode(", right = "));
        if (node.r) {
          line.appendChild(document.createTextNode(node.r));
        } else {
          const nr = document.createElement("span");
          nr.className = "code-null";
          nr.textContent = "null";
          line.appendChild(nr);
        }
        codeBox.appendChild(line);
        block.appendChild(codeBox);
        return block;
      }

      function buildPart1QuickCheckTasks(variant) {
        const v = variant || 0;
        const sibPool = ["7", "5", "2", "8", "6", "3"].filter((id) => vocabModel.getSiblings(id).length > 0);
        const sibTarget = sibPool[v % sibPool.length];
        const sibAns = vocabModel.getSiblings(sibTarget)[0];
        const sibSet = new Set(vocabModel.getSiblings(sibTarget));
        const sibDistractors = vocabModel.nodes.filter((id) => id !== sibTarget && !sibSet.has(id)).slice(0, 3);
        const sibChoices = [sibAns].concat(sibDistractors).map((x) => ({ value: x, label: x }));

        const depthPool = ["9", "6", "10", "2", "7", "4"].filter((id) => vocabModel.depth[id] !== undefined);
        const depthTarget = depthPool[v % depthPool.length];
        const depthAns = vocabModel.depth[depthTarget];

        const heightPool = ["2", "3", "7", "1", "4", "6"].filter((id) => vocabModel.height[id] !== undefined);
        const heightTarget = heightPool[v % heightPool.length];
        const heightAns = vocabModel.height[heightTarget];
        const heightPath = vocabModel.longestDownPath[heightTarget];

        const stmtVariants = [
          {
            choices: [
              { value: "a", label: "Node 4 is an ancestor of node 10" },
              { value: "b", label: "Node 10 is a descendant of node 3" },
              { value: "c", label: "Node 5 is a sibling of node 7" },
              { value: "d", label: "Node 1 has depth 1" }
            ],
            answer: "b",
            explain: "You can walk downward from 3 to 10 (3 \u2192 7 \u2192 10).",
            missExplain: "Q4 (true statement): Node 10 is a descendant of node 3 (3 \u2192 7 \u2192 10).",
            check: (val) => val === "b" && vocabModel.getDescendants("3").includes("10")
          },
          {
            choices: [
              { value: "a", label: "Node 3 is an ancestor of node 10" },
              { value: "b", label: "Node 8 is a parent of node 10" },
              { value: "c", label: "Node 6 is a sibling of node 7" },
              { value: "d", label: "Node 9 has height 1" }
            ],
            answer: "a",
            explain: "Node 3 sits on the path from root 1 down to node 10 (1 \u2192 3 \u2192 7 \u2192 10).",
            missExplain: "Q4 (true statement): Node 3 is an ancestor of node 10.",
            check: (val) => val === "a" && vocabModel.getAncestors("10").includes("3")
          },
          {
            choices: [
              { value: "a", label: "Node 7 is a leaf" },
              { value: "b", label: "Node 5 and node 6 are siblings" },
              { value: "c", label: "Node 2 is a descendant of node 3" },
              { value: "d", label: "Node 4 has depth 2" }
            ],
            answer: "b",
            explain: "5 and 6 share the same parent, node 2.",
            missExplain: "Q4 (true statement): Node 5 and node 6 are siblings (parent 2).",
            check: (val) => val === "b" && vocabModel.getSiblings("5").includes("6")
          }
        ];
        const stmt = stmtVariants[v % stmtVariants.length];

        return [
          {
            type: "choice",
            prompt: "Which node is a sibling of " + sibTarget + "?",
            action: "pick one option",
            choices: sibChoices,
            answer: sibAns,
            reviewStepId: "p1-meet",
            explain: sibTarget + " and " + sibAns + " share the same parent (node " + vocabModel.parent[sibTarget] + ").",
            missExplain: "Q1 (sibling of " + sibTarget + "): " + sibTarget + " and " + sibAns + " share parent " + vocabModel.parent[sibTarget] + ".",
            check: (val) => vocabModel.getSiblings(sibTarget).includes(val)
          },
          {
            type: "choice",
            prompt: "What is the depth of node " + depthTarget + "?",
            action: "pick one option",
            choices: makeIntChoices(0, Math.max(3, vocabModel.maxDepth), depthAns),
            answer: depthAns,
            reviewStepId: "p1-depth-vs-height",
            explain: vocabModel.rootPath[depthTarget].join(" \u2192 ") + " crosses " + depthAns + " " + edgeWord(depthAns) + " from the root.",
            missExplain: "Q2 (depth of " + depthTarget + "): " + vocabModel.rootPath[depthTarget].join(" \u2192 ") + " has " + depthAns + " " + edgeWord(depthAns) + " from the root.",
            check: (val) => val === depthAns
          },
          {
            type: "choice",
            prompt: "What is the height of node " + heightTarget + "?",
            action: "pick one option",
            choices: makeIntChoices(0, Math.max(3, vocabModel.treeHeight), heightAns),
            answer: heightAns,
            reviewStepId: "p1-depth-vs-height",
            explain: heightAns === 0
              ? "Node " + heightTarget + " is a leaf, so its height is 0."
              : "The longest path down from " + heightTarget + " (" + heightPath.join(" \u2192 ") + ") takes " + heightAns + " " + edgeWord(heightAns) + ".",
            missExplain: "Q3 (height of " + heightTarget + "): " + (heightAns === 0 ? "leaf has height 0." : heightPath.join(" \u2192 ") + " takes " + heightAns + " " + edgeWord(heightAns) + "."),
            check: (val) => val === heightAns
          },
          {
            type: "choice",
            prompt: "Which statement is true?",
            action: "pick the true statement",
            choices: stmt.choices,
            answer: stmt.answer,
            reviewStepId: "p1-above-below",
            explain: stmt.explain,
            missExplain: stmt.missExplain,
            check: stmt.check
          }
        ];
      }

      function buildPart2QuickCheckTasks(variant) {
        const v = variant || 0;
        const swapPool = [
          { treeKey: "a", id: "A" },
          { treeKey: "a", id: "B" },
          { treeKey: "c", id: "B" },
          { treeKey: "c", id: "C" }
        ].filter((item) => {
          const lay = binaryLayouts[item.treeKey];
          return lay && lay.nodes[item.id] && lay.nodes[item.id].l && lay.nodes[item.id].r;
        });
        const sw = swapPool[v % swapPool.length];
        const swLay = binaryLayouts[sw.treeKey];
        const swNode = swLay.nodes[sw.id];

        const n1Pool = [20, 15, 25, 30];
        const n1 = n1Pool[v % n1Pool.length];
        const n2Pool = [12, 8, 16, 24];
        const n2 = n2Pool[v % n2Pool.length];

        const slotScenarios = [
          {
            prompt: "A node has a left child but no right child. How many empty slots does that node have?",
            answer: 1,
            treeKey: "b",
            match: (n) => Boolean(n.l) && !n.r,
            explain: "The left slot holds a child; only the right slot is empty (1 empty slot).",
            missExplain: "Q4 (one child): one slot is filled, so 1 slot is empty."
          },
          {
            prompt: "A node is a leaf (no left child and no right child). How many empty slots does that node have?",
            answer: 2,
            treeKey: "a",
            match: (n) => !n.l && !n.r,
            explain: "Both the left slot and the right slot have no child (2 empty slots).",
            missExplain: "Q4 (leaf node): both slots are empty, so 2 slots are empty."
          },
          {
            prompt: "A node has both a left child and a right child. How many empty slots does that node have?",
            answer: 0,
            treeKey: "a",
            match: (n) => Boolean(n.l) && Boolean(n.r),
            explain: "Both the left slot and the right slot hold a child, leaving 0 empty slots.",
            missExplain: "Q4 (two children): both slots are filled, so 0 slots are empty."
          },
          {
            prompt: "A node has a right child but no left child. How many empty slots does that node have?",
            answer: 1,
            treeKey: "b",

                const order = getBinaryFillOrder(layout);
                const totalSlots = layout.nodeCount * 2;
                const empty = totalSlots - filled;
                view.treeKey = "c";
                view.showEmpties = "all";
                view.slotFill = {
                  order,
                  filledCount: filled,
                  justFilledKey: justKey
                };
                view.counterText = filled >= order.length
                  ? "Slots: " + totalSlots + " | Filled: " + filled + " (that is n \u2212 1) | Empty: " + empty + " (that is n + 1)"
                  : "Slots: " + totalSlots + " | Filled: " + filled + " | Empty: " + empty;
                view.counterNote = "Remember: " + layout.nodeCount + " nodes";
              }

              return {
                type: "slotfill",
                treeKey: "c",
                prompt: "Watch all " + (binaryLayouts.c.nodeCount * 2) + " slots start empty, then fill one slot per non-root node. What do you notice about the empty ones?",
                explain: "Every node except the root fills 1 parent slot, leaving n + 1 (" + emptySlots(binaryLayouts.c.nodeCount) + ") empty slots.",
                glossaryAdds: ["n + 1 rule"],
                getFillOrder: () => getBinaryFillOrder(binaryLayouts.c),
                onFillUpdate: (view, st) => applySlotFillView(view, st.fillCount, st.justFilledKey),
                onShow: (view, st) => applySlotFillView(view, st.fillCount || 0, st.justFilledKey || null),
                onDone: (view, st) => {
                  const order = getBinaryFillOrder(binaryLayouts.c);
                  st.fillCount = order.length;
                  st.justFilledKey = null;
                  applySlotFillView(view, order.length, null);
                }
              };
            })(),
            {
              type: "choice",
              prompt: "A binary tree has 10 nodes. How many empty slots?",
              choices: [9, 10, 11, 12].map((v) => ({ value: v, label: String(v) })),
              answer: emptySlots(10),
              hints: ["Think back to the pattern you saw when the slots filled one by one. How does the number of empty slots compare with the number of nodes?"],
              explain: "n + 1 = " + emptySlots(10) + ".",
              onShow: (view) => {
                view.treeKey = null;
                view.hiddenN = 10;
                view.showEmpties = "none";
                view.counterText = "";
              },
              check: (val) => val === emptySlots(10)
            }
          ]
        },
        (() => {
          const qcTasks = buildPart2QuickCheckTasks(0);
          const countWord = numberWord(qcTasks.length);
          const countCap = countWord[0].toUpperCase() + countWord.slice(1);
          return {
            id: "p2-quick-check",
            title: "Quick check",
            intro: countCap + " quick " + (qcTasks.length === 1 ? "question" : "questions") + " on binary trees, left/right order, and empty slots.",
            isQuickCheck: true,
            initialView: { treeKey: "a", edgeLabels: true, showEmpties: "none", counterText: "" },
            legend: [
              { swatch: "default", text: "Apply left/right order and the n + 1 rule" }
            ],
            rememberLines: [
              "Every node has a left slot and a right slot.",
              "A slot with no child is empty (null).",
              "n nodes always have n + 1 empty slots, whatever the shape.",
              "Every empty slot is a place where a search stops, a null check happens, or a new node can be attached."
            ],
            buildVariant: buildPart2QuickCheckTasks,
            tasks: qcTasks
          };
        })()
      ];

      const part1 = createPartController({
        stepperEl: document.getElementById("vocab-stepper"),
        bannerEl: document.getElementById("vocab-banner"),
        sideEl: document.getElementById("vocab-side"),
        navEl: document.getElementById("vocab-nav"),
        isPanelVisible: () => !tabPanels[0].hidden,
        baseView: { startId: null, highlightIds: [], highlightEdges: [], badges: {}, dimOthers: false },
        steps: part1Steps,
        renderTree: renderVocabView,
        buildFactsBlock: buildVocabFactsBlock,
        nextPartLabel: "Go to Part 2: Binary trees",
        onGoOtherPart: () => {
          activateTab(1);
          part2.refreshView();
        },
        onQuickCheckChange: (done) => {
          tabVocabBtn.textContent = done ? "Part 1 \u00b7 Vocabulary \u2713" : "Part 1 \u00b7 Vocabulary";
        }
      });

      const part2 = createPartController({
        stepperEl: document.getElementById("binary-stepper"),
        bannerEl: document.getElementById("binary-banner"),
        sideEl: document.getElementById("binary-side"),
        navEl: document.getElementById("binary-nav"),
        isPanelVisible: () => !tabPanels[1].hidden,
        baseView: { treeKey: "a", showEmpties: "none", edgeLabels: false, highlightIds: [], highlightEdges: [], counterText: "", counterNote: "" },
        steps: part2Steps,
        renderTree: renderBinaryView,
        buildFactsBlock: buildBinaryFactsBlock,
        nextPartLabel: "Back to Part 1",
        onBackAtStart: () => {
          activateTab(0);
          part1.refreshView();
        },
        onGoOtherPart: () => {
          activateTab(0);
          part1.refreshView();
        },
        onQuickCheckChange: (done) => {
          tabBinaryBtn.textContent = done ? "Part 2 \u00b7 Binary trees \u2713" : "Part 2 \u00b7 Binary trees";
        }
      });

      function validateLessonData() {
        const warn = (msg) => {
          console.warn("[Lesson data warning]", msg);
        };
        if (!vocabModel.root || vocabModel.parent[vocabModel.root] !== null) {
          warn("vocabModel.root is missing or has a non-null parent.");
        }
        const requiredVocabNodes = ["2", "3", "4", "6", "7", "9", "10"];
        for (const id of requiredVocabNodes) {
          if (vocabModel.depth[id] === undefined) {
            warn("vocabModel is missing expected node '" + id + "'.");
          }
        }
        if (vocabModel.depth["6"] !== undefined && vocabModel.parent["6"] === null) {
          warn("Expected node 6 to have a parent.");
        }
        if (vocabModel.children["2"] && vocabModel.children["2"].length < 1) {
          warn("Expected node 2 to have at least 1 child.");
        }
        if (vocabModel.depth["3"] !== undefined && vocabModel.getSiblings("3").length < 1) {
          warn("Expected node 3 to have at least 1 sibling.");
        }
        if (vocabModel.leaves.length < 1) {
          warn("Expected at least 1 leaf in vocabModel.");
        }
        if (vocabModel.depth["3"] !== undefined) {
          const desc3 = vocabModel.getDescendants("3");
          if (!desc3.some((id) => vocabModel.children[id].length === 0)) {
            warn("Expected node 3 to have at least 1 leaf descendant for p1-checkpoint.");
          }
          if (!desc3.includes("10") || desc3.includes("9")) {
            warn("Expected 10 (and not 9) to be a descendant of node 3.");
          }
          if (!vocabModel.longestDownPath["3"] || vocabModel.longestDownPath["3"].length < 2) {
            warn("Expected longest downward path from node 3 to have length >= 2.");
          }
        }
        if (vocabModel.depth["7"] !== undefined) {
          const p7 = vocabModel.parent["7"];
          const p7Other = p7 ? vocabModel.getDescendants(p7).filter((id) => id !== "7") : [];
          if (!p7 || p7Other.length < 1) {
            warn("Expected node 7's parent to have another descendant for p1-checkpoint.");
          }
        }
        if (!vocabModel.nodes.some((id) => vocabModel.depth[id] > vocabModel.height[id])) {
          warn("Expected at least one node with depth > height.");
        }

        for (const k of ["a", "b", "c"]) {
          const lay = binaryLayouts[k];
          if (!lay) {
            warn("Missing binaryLayouts." + k + ".");
            continue;
          }
          if (lay.emptyCount !== lay.nodeCount + 1) {
            warn("binaryLayouts." + k + " violates n + 1 empty slots rule.");
          }
        }
        const a = binaryLayouts.a;
        const b = binaryLayouts.b;
        const c = binaryLayouts.c;
        if (a) {
          if (!a.nodes.A || !a.nodes.A.l || !a.nodes.A.r) {
            warn("Expected binaryLayouts.a node A to have both left and right children.");
          }
          if (!a.nodes.C || a.nodes.C.l || a.nodes.C.r) {
            warn("Expected binaryLayouts.a node C to be a leaf (no children).");
          }
        }
        if (b) {
          if (!b.nodes.C || (b.nodes.C.l !== "D" && b.nodes.C.r !== "D")) {
            warn("Expected binaryLayouts.b node D to be a child of C.");
          }
          if (!b.nodes.D || (Boolean(b.nodes.D.l) === Boolean(b.nodes.D.r))) {
            warn("Expected binaryLayouts.b node D to have exactly one child.");
          }
        }
        if (a && b) {
          if (a.nodeCount !== b.nodeCount) {
            warn("Expected Tree (a) and Tree (b) to have the same nodeCount.");
          }
          if (!findDifferentChildPlace(a, b)) {
            warn("Expected Tree (a) and Tree (b) to differ in at least one child placement.");
          }
        }
        if (b && c && c.nodeCount === b.nodeCount) {
          warn("Expected Tree (c) to differ in size from Tree (b).");
        }
      }

      validateLessonData();
      initBinaryNodes();
      part1.start();
      part2.start();
    })();
  </script>
</body>
</html>
