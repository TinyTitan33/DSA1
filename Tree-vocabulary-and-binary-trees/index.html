<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tree vocabulary and binary trees</title>
  <style>
    :root {
      --paper: #fcebd0;
      --paper-alt: #f5cf92;
      --surface: #fffbf2;
      --ink: #2d0f31;
      --ink-muted: #582c5c;
      --ink-faint: #6e3f6c;
      --rule: #d89d58;
      --vermilion: #ba3813;
      --vermilion-tint: #fdede3;
      --vermilion-soft: rgba(186, 56, 19, 0.20);
      --amber: #e2871f;
      --font-sans: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --font-serif: "Georgia", "Times New Roman", serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
      --radius-sm: 4px;
      --radius-md: 8px;
      --shadow-paper: 0 3px 0 rgba(45, 15, 49, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, rgba(45, 15, 49, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(45, 15, 49, 0.045) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 14px 30px;
    }

    /* Header */
    .masthead {
      background: var(--surface);
      border: 1.5px solid var(--ink);
      border-top: 4px solid var(--amber);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      box-shadow: var(--shadow-paper);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2.5vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .lede {
      margin: 0;
      font-size: 0.92rem;
      color: var(--ink-muted);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 0;
    }

    .tab-btn {
      appearance: none;
      min-height: 44px;
      padding: 9px 16px;
      border: 1.5px solid var(--ink);
      border-bottom: 0;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: var(--paper-alt);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .tab-btn:hover:not([aria-selected="true"]) {
      background: var(--surface);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    @media (max-width: 480px) {
      .app-shell {
        padding: 12px 8px 24px;
      }
      .tab-btn {
        flex: 1 1 0;
        padding: 8px 10px;
        font-size: 0.8rem;
      }
      .tab-panel {
        padding: 10px;
      }
      .task-banner {
        padding: 12px 10px;
      }
      .svg-stage {
        padding: 8px 2px 4px;
      }
    }

    .tab-btn:focus-visible,
    .step-chip:focus-visible,
    .btn:focus-visible,
    .choice-btn:focus-visible,
    .link-btn:focus-visible {
      outline: 2px solid var(--vermilion);
      outline-offset: 2px;
    }

    /* Tab Panels */
    .tab-panel {
      background: var(--surface);
      border: 1.5px solid var(--ink);
      border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-paper);
    }

    /* Stepper Bar */
    .stepper {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .stepper::-webkit-scrollbar {
      display: none;
    }

    .step-chip {
      appearance: none;
      flex: 1 1 auto;
      justify-content: center;
      min-height: 44px;
      padding: 6px 6px;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-sm);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.77rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .step-chip:hover:not(.is-current) {
      background: var(--paper-alt);
    }

    .step-chip.is-current {
      background: var(--ink);
      color: var(--paper);
    }

    .step-chip.is-done:not(.is-current) {
      background: var(--surface);
    }

    .chip-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      opacity: 0.85;
    }

    .chip-check {
      font-family: var(--font-mono);
      font-size: 0.76rem;
    }

    @media (max-width: 480px) {
      .stepper {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 6px;
        padding-bottom: 4px;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .step-chip {
        flex: 0 0 auto;
        padding: 8px 10px;
        font-size: 0.78rem;
        gap: 5px;
      }
    }

    /* Task Banner */
    .task-banner {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .banner-title {
      margin: 0 0 6px;
      font-family: var(--font-serif);
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--ink);
      outline: none;
    }

    .banner-title:focus-visible {
      outline: 2px solid var(--vermilion);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .banner-intro {
      margin: 0 0 12px;
      font-size: 0.9rem;
      color: var(--ink);
    }

    .task-box {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-top {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-prompt {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.03rem;
      color: var(--ink);
    }

    .task-action {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .task-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .task-subnote {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .task-feedback {
      margin: 2px 0 0;
      padding: 8px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--ink);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      color: var(--ink);
      min-height: 36px;
    }

    .task-feedback.is-wrong {
      border-left-color: var(--vermilion);
      background: var(--vermilion-tint);
    }

    .task-feedback.is-correct {
      border-left-color: var(--ink);
      background: var(--paper);
    }

    .task-feedback.is-revealed {
      border-left-color: var(--vermilion);
      background: var(--paper);
    }

    /* Buttons */
    .btn {
      appearance: none;
      min-height: 44px;
      padding: 8px 14px;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      background: var(--paper-alt);
    }

    .btn.is-primary {
      background: var(--ink);
      color: var(--paper);
    }

    .btn.is-primary:hover:not(:disabled) {
      background: #471b4d;
    }

    .btn.is-vermilion {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: var(--surface);
    }

    .btn.is-vermilion:hover:not(:disabled) {
      background: #982c0d;
      border-color: #982c0d;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .link-btn {
      appearance: none;
      min-height: 44px;
      padding: 8px 6px;
      border: 0;
      background: transparent;
      color: var(--ink-muted);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .link-btn:hover {
      color: var(--ink);
    }

    /* Stage + Side Panel */
    .stage-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 12px;
      align-items: stretch;
    }

    @media (max-width: 759px) {
      .stage-grid {
        grid-template-columns: 1fr;
      }
      .tab-panel {
        border-radius: 0 0 var(--radius-md) var(--radius-md);
      }
    }

    .svg-stage {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 12px 6px 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
    }

    .worked-example {
      margin: 0;
      padding: 8px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--vermilion);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      color: var(--ink);
    }

    .worked-example-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .tree-svg {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }

    .stage-counter {
      margin: 4px 8px 2px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
    }

    .stage-counter.is-highlight {
      color: var(--vermilion);
    }

    .stage-counter-note {
      margin: 0 8px 2px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--ink-muted);
      text-align: center;
    }

    .stage-tree-name {
      margin: 0 8px 4px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-align: center;
    }

    @keyframes treeCrossFade {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
    }

    .is-crossfading {
      animation: treeCrossFade 0.28s ease-out;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 4px;
    }

    @media (max-width: 520px) {
      .compare-grid {
        grid-template-columns: 1fr;
      }
    }

    .compare-card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 8px 4px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .compare-title {
      margin: 0 0 2px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink);
    }

    .code-card {
      margin: 2px 0 0;
      padding: 9px 11px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--ink);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--ink);
      overflow-x: auto;
      max-width: 100%;
    }

    .code-fact {
      margin: 4px 0 0;
      padding: 7px 9px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      line-height: 1.45;
      color: var(--ink);
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .side-block > .code-fact:first-child {
      margin-top: 0;
    }

    .code-fact-lines {
      margin: 0;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      white-space: pre;
      overflow-x: auto;
      max-width: 100%;
    }

    .code-fact-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .code-null {
      color: var(--ink-faint);
      font-weight: 700;
    }

    .hidden-tree-panel {
      min-height: 220px;
      margin: 8px;
      padding: 24px 16px;
      background: var(--paper);
      border: 1.5px dashed var(--rule);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .hidden-n-readout {
      margin: 0;
      font-family: var(--font-mono);
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      color: var(--ink);
    }

    .hidden-n-note {
      margin: 0;
      font-size: 0.92rem;
      color: var(--ink-muted);
    }

    .algebra-details {
      margin-top: 2px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 0.84rem;
    }

    .algebra-details summary {
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink);
      padding: 4px 0;
    }

    .algebra-details summary:focus-visible {
      outline: 2px solid var(--vermilion);
      outline-offset: 2px;
    }

    .algebra-details p {
      margin: 6px 0 2px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--ink);
    }

    /* SVG Elements */
    .tree-edge {
      stroke: var(--ink);
      stroke-width: 1.5;
      stroke-linecap: round;
      transition: stroke 0.15s ease, stroke-width 0.15s ease, opacity 0.15s ease;
    }

    .tree-edge.is-dim {
      opacity: 0.25;
    }

    .tree-edge.is-highlight {
      stroke: var(--vermilion);
      stroke-width: 3.6;
      opacity: 1;
    }

    .edge-label-bg {
      fill: var(--surface);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .edge-label-text {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .tree-node {
      cursor: pointer;
      outline: none;
    }

    .tree-node.is-static {
      cursor: default;
    }

    .tree-node.is-dim {
      opacity: 0.35;
    }

    .bt-node {
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
      opacity: 1;
    }

    .bt-node.is-absent {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes nodeClickPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
        stroke: var(--vermilion);
      }
    }

    .node-circle {
      fill: var(--surface);
      stroke: var(--ink);
      stroke-width: 1.5;
      transition: fill 0.14s ease, stroke 0.14s ease, stroke-width 0.14s ease;
    }

    .tree-node.is-pulse:not(.is-static) .node-circle {
      animation: nodeClickPulse 0.85s ease-in-out 2;
    }

    .tree-node:not(.is-static):hover .node-circle {
      fill: var(--paper-alt);
    }

    .node-focus-ring {
      fill: none;
      stroke: var(--vermilion);
      stroke-width: 2.2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .tree-node:not(.is-static):hover .node-focus-ring {
      opacity: 0.4;
    }

    .tree-node:focus-visible .node-focus-ring {
      opacity: 1;
    }

    .node-hi-ring {
      fill: none;
      stroke: var(--vermilion);
      stroke-width: 1.5;
      opacity: 0;
      pointer-events: none;
    }

    .tree-node.is-selected .node-hi-ring,
    .tree-node.is-highlight .node-hi-ring {
      opacity: 1;
    }

    .tree-node:focus-visible .node-circle {
      stroke: var(--vermilion);
      stroke-width: 2.8;
    }

    .tree-node.is-selected .node-circle,
    .tree-node.is-highlight .node-circle {
      fill: var(--vermilion-tint);
      stroke: var(--vermilion);
      stroke-width: 3.2;
    }

    .tree-node.is-start .node-ring {
      stroke: var(--ink);
      stroke-width: 1.5;
      stroke-dasharray: 3 2;
      fill: none;
    }

    .node-label {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .tree-node.is-selected .node-label,
    .tree-node.is-highlight .node-label {
      fill: var(--vermilion);
    }

    .node-badge-bg {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1.2;
    }

    .tree-node.is-selected .node-badge-bg,
    .tree-node.is-highlight .node-badge-bg {
      fill: var(--vermilion);
      stroke: var(--vermilion);
    }

    .node-badge-text {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .tree-node.is-selected .node-badge-text,
    .tree-node.is-highlight .node-badge-text {
      fill: var(--surface);
    }

    .tree-node .node-badge-bg.is-depth {
      fill: var(--ink);
      stroke: var(--ink);
    }

    .tree-node .node-badge-text.is-depth {
      fill: var(--paper);
    }

    .tree-node .node-badge-bg.is-height {
      fill: var(--vermilion-tint);
      stroke: var(--vermilion);
      stroke-width: 1.5;
    }

    .tree-node .node-badge-text.is-height {
      fill: var(--vermilion);
    }

    /* Empty binary child slots */
    .empty-slot-edge {
      stroke: var(--ink-faint);
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
      transition: stroke 0.45s ease;
    }

    .empty-slot-box {
      fill: none;
      stroke: var(--ink-faint);
      stroke-width: 1.3;
      stroke-dasharray: 3 2.5;
      transition: stroke 0.45s ease, fill 0.45s ease;
    }

    .empty-slot-group.is-new .empty-slot-edge {
      stroke: var(--vermilion);
    }

    .empty-slot-group.is-new .empty-slot-box {
      stroke: var(--vermilion);
      fill: var(--vermilion-tint);
    }

    .slot-fill-edge.is-ghost {
      stroke: var(--ink-faint);
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
    }

    .slot-fill-edge.is-landing {
      stroke: var(--vermilion);
      stroke-width: 2.8;
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: slotEdgeLand 0.38s ease-out forwards;
    }

    @keyframes slotEdgeLand {
      to {
        stroke-dashoffset: 0;
      }
    }

    .slot-fill-square.is-ghost {
      fill: none;
      stroke: var(--ink-faint);
      stroke-width: 1.3;
      stroke-dasharray: 3 2.5;
    }

    .slot-fill-square.is-filled {
      fill: var(--paper-alt);
      stroke: var(--ink);
      stroke-width: 1.6;
      stroke-dasharray: none;
    }

    .slot-fill-square.is-just-filled {
      fill: var(--vermilion-tint);
      stroke: var(--vermilion);
      stroke-width: 2;
    }

    /* Side Panel */
    .side-panel {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .side-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .side-block + .side-block {
      padding-top: 10px;
      border-top: 1px solid var(--rule);
    }

    .side-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--ink);
    }

    .rule-note {
      margin: 0;
      padding: 7px 9px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.76rem;

<body>
  <div class="app-shell">

    <main>

  <script>
    (function () {
      "use strict";

      /* =====================================================================
       * HANDOUT TREE DATA (edit here if adapting to a different handout tree)
       * - vocab: Ex. 3.2 general 10-node tree (root 1, depth(6)=2, height(3)=2, tree height=3)
       * - binary: Fig. 3.3 pair (a, b) plus 7-node comparison tree (c)
       * ===================================================================== */
      const DATA = {
        vocab: {
          root: "1",
          children: {
            "1": ["2", "3", "4"],
            "2": ["5", "6"],
            "3": ["7", "8"],
            "4": ["9"],
            "5": [],
            "6": [],
            "7": ["10"],
            "8": [],
            "9": [],
            "10": []
          }
        },
        binary: {
          a: {
            name: "Tree (a)",
            root: "A",
            nodes: {
              A: { l: "B", r: "C" },
              B: { l: "D", r: "E" },
              C: { l: null, r: null },
              D: { l: null, r: null },
              E: { l: null, r: null }
            }
          },
          b: {
            name: "Tree (b)",
            root: "A",
            nodes: {
              A: { l: "B", r: "C" },
              B: { l: null, r: null },
              C: { l: "D", r: null },
              D: { l: null, r: "E" },
              E: { l: null, r: null }
            }
          },
          c: {
            name: "Tree (c)",
            root: "A",
            nodes: {
              A: { l: "B", r: "C" },
              B: { l: "D", r: "E" },
              C: { l: "F", r: "G" },
              D: { l: null, r: null },
              E: { l: null, r: null },
              F: { l: null, r: null },
              G: { l: null, r: null }
            }
          }
        }
      };

      const SVG_NS = "http://www.w3.org/2000/svg";

      function svgEl(tag, attrs, text) {
        const el = document.createElementNS(SVG_NS, tag);
        if (attrs) {
          for (const key of Object.keys(attrs)) {
            el.setAttribute(key, String(attrs[key]));
          }
        }
        if (text !== undefined) {
          el.textContent = String(text);
        }
        return el;
      }

      function edgeKey(u, v) {
        return u + "->" + v;
      }

      function setRichText(el, str) {
        el.replaceChildren();
        const re = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
        let last = 0;
        let match;
        while ((match = re.exec(str)) !== null) {
          if (match.index > last) {
            el.appendChild(document.createTextNode(str.slice(last, match.index)));
          }
          const token = match[0];
          if (token.startsWith("**")) {
            const strong = document.createElement("strong");
            strong.textContent = token.slice(2, -2);
            el.appendChild(strong);
          } else {
            const em = document.createElement("em");
            em.textContent = token.slice(1, -1);
            el.appendChild(em);
          }
          last = re.lastIndex;
        }
        if (last < str.length) {
          el.appendChild(document.createTextNode(str.slice(last)));
        }
      }

      function prefersReducedMotion() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function emptySlots(n) {
        return n + 1;
      }

      function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function seededShuffle(items, seedStr) {
        const out = items.slice();
        const rand = mulberry32(hashString(seedStr));
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const tmp = out[i];
          out[i] = out[j];
          out[j] = tmp;
        }
        return out;
      }

      function edgeWord(n) {
        return n === 1 ? "edge" : "edges";
      }

      function numberWord(n) {
        const words = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
        return n >= 0 && n < words.length ? words[n] : String(n);
      }

      function appendCodeWithNulls(el, text) {
        const re = /\bnull\b/g;
        let last = 0;
        let match;
        while ((match = re.exec(text)) !== null) {
          if (match.index > last) {
            el.appendChild(document.createTextNode(text.slice(last, match.index)));
          }
          const sp = document.createElement("span");
          sp.className = "code-null";
          sp.textContent = "null";
          el.appendChild(sp);
          last = re.lastIndex;
        }
        if (last < text.length) {
          el.appendChild(document.createTextNode(text.slice(last)));
        }
      }

      function makeIntChoices(minVal, maxVal, answer) {
        const vals = new Set();
        for (let v = minVal; v <= maxVal; v++) vals.add(v);
        vals.add(answer);
        let probe = maxVal + 1;
        while (vals.size < 4) {
          vals.add(probe);
          probe += 1;
        }
        return Array.from(vals).sort((a, b) => a - b).map((v) => ({ value: v, label: String(v) }));
      }

      function isNumericChoiceTask(task) {
        return task.choices.every((c) => typeof c.value === "number" || /^\d+$/.test(String(c.label).trim()));
      }

      function prepareStepChoices(steps, variantSalt) {
        let prevChoicePos = -1;
        let prevNumericPos = -1;
        for (const step of steps) {
          for (let ti = 0; ti < step.tasks.length; ti++) {
            const task = step.tasks[ti];
            if (task.type !== "choice" || task.fixedOrder || !Array.isArray(task.choices) || task.choices.length < 2) {
              continue;
            }
            const baseSeed = step.id + ":" + ti + (variantSalt ? ":v" + variantSalt : "");
            if (!task._rawChoices) {
              task._rawChoices = task.choices.slice();
            }
            const numeric = isNumericChoiceTask(task);
            let salt = 0;
            let candidate = seededShuffle(task._rawChoices, baseSeed);
            let ansPos = candidate.findIndex((c) => c.value === task.answer);
            while ((ansPos === prevChoicePos || (numeric && ansPos === prevNumericPos)) && salt < 24) {
              salt += 1;
              candidate = seededShuffle(task._rawChoices, baseSeed + "#" + salt);
              ansPos = candidate.findIndex((c) => c.value === task.answer);
            }
            task.choices = candidate;
            prevChoicePos = ansPos;
            if (numeric) prevNumericPos = ansPos;
          }
        }
      }

      function getBinaryFillOrder(layout) {
        const order = [];
        const queue = [layout.root];
        const edgeByChild = {};
        for (const edge of layout.edges) {
          edgeByChild[edge.to] = edge;
        }
        while (queue.length > 0) {
          const cur = queue.shift();
          const node = layout.nodes[cur];
          if (!node) continue;
          if (node.l) {
            if (edgeByChild[node.l]) order.push(edgeByChild[node.l]);
            queue.push(node.l);
          }
          if (node.r) {
            if (edgeByChild[node.r]) order.push(edgeByChild[node.r]);
            queue.push(node.r);
          }
        }
        return order;
      }

      function findDifferentChildPlace(layA, layB) {
        const parentOf = (lay, target) => {
          for (const id of lay.labels) {
            const n = lay.nodes[id];
            if (n.l === target) return { parent: id, side: "left" };
            if (n.r === target) return { parent: id, side: "right" };
          }
          return null;
        };
        for (const id of layA.labels) {
          if (!layB.nodes[id]) continue;
          const pa = parentOf(layA, id);
          const pb = parentOf(layB, id);
          if (pa && pb && (pa.parent !== pb.parent || pa.side !== pb.side)) {
            return { id, a: pa, b: pb };
          }
        }
        return null;
      }

      function findDepthVsHeightPair(model) {
        if (
          model.nodes.includes("3") &&
          model.nodes.includes("7") &&
          model.depth["7"] > model.depth["3"] &&
          model.height["3"] > model.height["7"]
        ) {
          return ["3", "7"];
        }
        for (const a of model.nodes) {
          for (const b of model.nodes) {
            if (a !== b && model.depth[b] > model.depth[a] && model.height[a] > model.height[b]) {
              return [a, b];
            }
          }
        }
        return [model.root, model.leaves[0] || model.root];
      }

      /* ---------------------------------------------------------------------
       * TAB SWITCHING
       * --------------------------------------------------------------------- */
      const tabButtons = [
        document.getElementById("tab-vocab"),
        document.getElementById("tab-binary")
      ];
      const tabPanels = [
        document.getElementById("panel-vocab"),
        document.getElementById("panel-binary")
      ];

      function activateTab(index) {
        if (!tabPanels[index].hidden) return;
        tabButtons.forEach((btn, i) => {
          const active = i === index;
          btn.setAttribute("aria-selected", active ? "true" : "false");
          btn.tabIndex = active ? 0 : -1;
          tabPanels[i].hidden = !active;
        });
        if (index === 0 && typeof part1 !== "undefined") part1.refreshView();
        if (index === 1 && typeof part2 !== "undefined") part2.refreshView();
      }

      tabButtons.forEach((btn, idx) => {
        btn.addEventListener("click", () => activateTab(idx));
        btn.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
            e.preventDefault();
            const next = (idx + (e.key === "ArrowRight" ? 1 : -1) + tabButtons.length) % tabButtons.length;
            activateTab(next);
            tabButtons[next].focus();
          } else if (e.key === "Home") {
            e.preventDefault();
            activateTab(0);
            tabButtons[0].focus();
          } else if (e.key === "End") {
            e.preventDefault();
            const last = tabButtons.length - 1;
            activateTab(last);
            tabButtons[last].focus();
          }
        });
      });

      /* ---------------------------------------------------------------------
       * TREE MODELS & LAYOUTS (reused)
       * --------------------------------------------------------------------- */
      function buildVocabModel(spec) {
        const nodes = Object.keys(spec.children);
        const parent = {};
        const depth = {};
        const height = {};
        const longestDownPath = {};
        const rootPath = {};
        parent[spec.root] = null;

        function computeDepth(id, d, path) {
          depth[id] = d;
          rootPath[id] = path.concat(id);
          for (const ch of spec.children[id]) {
            parent[ch] = id;
            computeDepth(ch, d + 1, rootPath[id]);
          }
        }
        computeDepth(spec.root, 0, []);

        // Convention: edges, leaf = 0. Change here only if the course textbook counts nodes.
        function computeHeight(id) {
          const kids = spec.children[id];
          if (!kids || kids.length === 0) {
            height[id] = 0;
            longestDownPath[id] = [id];
            return 0;
          }
          let bestH = -1;
          let bestChild = kids[0];
          for (const ch of kids) {
            const chH = computeHeight(ch);
            if (chH > bestH) {
              bestH = chH;
              bestChild = ch;
            }
          }
          height[id] = 1 + bestH;
          longestDownPath[id] = [id].concat(longestDownPath[bestChild]);
          return height[id];
        }
        computeHeight(spec.root);

        const maxDepth = Math.max(...nodes.map((id) => depth[id]));
        const treeHeight = height[spec.root];

        const leaves = [];
        function collectLeaves(id) {
          const kids = spec.children[id];
          if (!kids || kids.length === 0) {
            leaves.push(id);
            return;
          }
          for (const ch of kids) collectLeaves(ch);
        }
        collectLeaves(spec.root);

        const pos = {};
        const marginX = 80;
        const spanX = 640 - 2 * marginX;
        const leafStep = leaves.length > 1 ? spanX / (leaves.length - 1) : 0;
        const topY = 52;
        const levelGap = maxDepth > 0 ? Math.min(96, 288 / maxDepth) : 0;

        let leafIdx = 0;
        function assignPos(id) {
          const kids = spec.children[id];
          const y = topY + depth[id] * levelGap;
          if (!kids || kids.length === 0) {
            const x = leaves.length === 1 ? 320 : marginX + leafIdx * leafStep;
            leafIdx += 1;
            pos[id] = { x, y };
            return x;
          }
          const childXs = kids.map(assignPos);
          const x = (childXs[0] + childXs[childXs.length - 1]) / 2;
          pos[id] = { x, y };
          return x;
        }
        assignPos(spec.root);

        const edges = [];
        for (const u of nodes) {
          for (const v of spec.children[u]) {
            edges.push([u, v]);
          }
        }

        function getSiblings(id) {
          const p = parent[id];
          if (p === null) return [];
          return spec.children[p].filter((ch) => ch !== id);
        }

        function getAncestors(id) {
          return rootPath[id].slice(0, -1);
        }

        function getDescendants(id) {
          const out = [];
          function walk(cur) {
            for (const ch of spec.children[cur]) {
              out.push(ch);
              walk(ch);
            }
          }
          walk(id);
          return out;
        }

        return {
          root: spec.root,
          nodes,
          children: spec.children,
          parent,
          depth,
          height,
          maxDepth,
          treeHeight,
          rootPath,
          longestDownPath,
          pos,
          edges,
          leaves,
          getSiblings,
          getAncestors,
          getDescendants
        };
      }

      function buildBinaryLayout(treeSpec) {
        const labels = Object.keys(treeSpec.nodes);
        const inOrder = [];
        const depth = {};

        function walk(id, d) {
          if (!id) return;
          const node = treeSpec.nodes[id];
          depth[id] = d;
          walk(node.l, d + 1);
          inOrder.push(id);
          walk(node.r, d + 1);
        }
        walk(treeSpec.root, 0);

        const n = inOrder.length;
        const marginX = n > 5 ? 80 : 100;
        const stepX = n > 1 ? (640 - 2 * marginX) / (n - 1) : 0;
        const topY = 44;
        const stepY = 68;

        const pos = {};
        inOrder.forEach((id, idx) => {
          pos[id] = {
            x: n === 1 ? 320 : marginX + idx * stepX,
            y: topY + depth[id] * stepY
          };
        });

        const edges = [];
        const empties = [];
        for (const id of labels) {
          const node = treeSpec.nodes[id];
          const p = pos[id];
          if (node.l) {
            edges.push({ key: id + ":l:" + node.l, from: id, to: node.l, side: "L" });
          } else {
            empties.push({ key: id + ":empty-l", parent: id, side: "L", x: p.x - 34, y: p.y + 56 });
          }
          if (node.r) {
            edges.push({ key: id + ":r:" + node.r, from: id, to: node.r, side: "R" });
          } else {
            empties.push({ key: id + ":empty-r", parent: id, side: "R", x: p.x + 34, y: p.y + 56 });
          }
        }

        return {
          name: treeSpec.name,
          root: treeSpec.root,
          nodes: treeSpec.nodes,
          labels,
          pos,
          edges,
          empties,
          nodeCount: n,
          edgeCount: edges.length,
          emptyCount: empties.length
        };
      }

      const vocabModel = buildVocabModel(DATA.vocab);
      const binaryLayouts = {};
      for (const key of Object.keys(DATA.binary)) {
        binaryLayouts[key] = buildBinaryLayout(DATA.binary[key]);
      }

      /* ---------------------------------------------------------------------
       * PREDICT CHOICE WIDGET (reused)
       * --------------------------------------------------------------------- */
      function buildVocabPredictBox(promptText, choices, guess, answer, onChoose, revealText) {
        const box = document.createElement("div");
        box.className = "predict-box";

        if (promptText) {
          const prompt = document.createElement("p");
          prompt.className = "predict-prompt";
          prompt.textContent = promptText;
          box.appendChild(prompt);
        }

        const row = document.createElement("div");
        row.className = "choice-row";
        const isRevealed = guess !== null;

        for (const ch of choices) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.disabled = isRevealed;

          if (isRevealed) {
            const isAnswer = ch.value === answer;
            const isGuess = ch.value === guess;
            if (isGuess && !isAnswer) {
              btn.classList.add("is-wrong-guess");
              btn.textContent = "\u2717 " + ch.label + " (you said " + ch.label + ")";
            } else if (isAnswer && isGuess) {
              btn.classList.add("is-just-revealed");
              btn.textContent = "\u2713 " + ch.label;
            } else if (isAnswer) {
              btn.classList.add("is-correct-answer");
              btn.textContent = "\u2713 " + ch.label;
            } else {
              btn.textContent = ch.label;
            }
          } else {
            btn.textContent = ch.label;
            btn.addEventListener("click", () => onChoose(ch.value));
          }
          row.appendChild(btn);
        }
        box.appendChild(row);

        if (revealText) {
          const res = document.createElement("p");
          res.className = "reveal-result";
          res.textContent = revealText;
          box.appendChild(res);
        }

        return box;
      }

      /* ---------------------------------------------------------------------
       * GLOSSARY DEFINITIONS
       * --------------------------------------------------------------------- */
      const GLOSSARY_DEFS = {
        tree: "A layout of nodes linked by edges, growing down from one root.",
        node: "A circle in the tree that holds a value.",
        edge: "A line joining a parent node to a child node.",
        root: "The single top node with no parent.",
        parent: "The node one edge directly above a node.",
        child: "A node one edge directly below a node.",
        sibling: "Another node that shares the same parent.",
        leaf: "A node at the end of a branch, with no children.",
        "internal node": "A node that has one or more children.",
        ancestor: "Any node on the path going up to the root.",
        descendant: "Any node reachable by going down through children.",
        subtree: "A node together with every descendant below it.",
        depth: "Edges from the root down to a node.",
        height: "Edges on the longest route from a node down to a leaf. A leaf has height 0.",
        "height of the tree": "The height of the root, from top to deepest leaf (counted in edges, like depth).",
        "binary tree": "A tree where every node has at most two children.",
        "left child": "The child attached to a node's left slot.",
        "right child": "The child attached to a node's right slot.",
        slot: "One of the two child places (left or right) under each node.",
        "empty slot (null)": "A slot with no child (written as null in code).",
        "n + 1 rule": "A binary tree with n nodes always has n + 1 empty slots."
      };

      /* ---------------------------------------------------------------------
       * VIEW RENDERERS (declarative vocabView & binaryView)
       * --------------------------------------------------------------------- */
      const vocabSvg = document.getElementById("vocab-svg");
      const binaryTreeName = document.getElementById("binary-tree-name");
      const binarySvg = document.getElementById("binary-svg");
      const binaryCompare = document.getElementById("binary-compare");
      const binaryHiddenPanel = document.getElementById("binary-hidden-panel");
      const binaryHiddenReadout = document.getElementById("binary-hidden-readout");
      const binaryCounter = document.getElementById("binary-counter");
      const binaryCounterNote = document.getElementById("binary-counter-note");

      function renderBadgePills(g, badgeVal, nodeX) {
        const list = Array.isArray(badgeVal) ? badgeVal : [badgeVal];
        const sideDir = nodeX > 510 ? -1 : 1;
        list.forEach((entry, idx) => {
          const isObj = entry && typeof entry === "object";
          const text = String(isObj ? entry.text : entry);
          const kind = isObj && entry.kind ? entry.kind : "";
          const w = Math.max(18, Math.round(text.length * 6.4 + 10));
          const h = 18;
          let cx;
          let cy;
          if (list.length === 1 && w <= 22) {
            cx = 18;
            cy = -18;
          } else {
            cx = sideDir * (14 + w / 2);
            cy = list.length > 1 ? (idx === 0 ? -12 : 12) : -16;
          }
          g.appendChild(svgEl("rect", {
            x: cx - w / 2,
            y: cy - h / 2,
            width: w,
            height: h,
            rx: 4,
            class: "node-badge-bg" + (kind ? " is-" + kind : "")
          }));
          g.appendChild(svgEl("text", {
            x: cx,
            y: cy,
            class: "node-badge-text" + (kind ? " is-" + kind : ""),
            "data-badge-val": text
          }, text));
        });
      }

      function renderVocabView(view, onNodeClick, interaction) {
        vocabSvg.setAttribute("aria-label", vocabModel.nodes.length + "-node general tree");
        vocabSvg.replaceChildren();
        const edgesG = svgEl("g", { class: "edges-layer" });
        const nodesG = svgEl("g", { class: "nodes-layer" });

        const hiIds = new Set(view.highlightIds || []);
        const hiEdges = new Set(view.highlightEdges || []);
        const pressedIds = new Set((interaction && interaction.pressedIds) || []);
        const isMulticlick = Boolean(interaction && interaction.multiclick);
        const clickable = Boolean(onNodeClick);
        const pulseFirst = Boolean(interaction && interaction.pulseFirst) && clickable && !prefersReducedMotion();

        for (const [u, v] of vocabModel.edges) {
          const p1 = vocabModel.pos[u];
          const p2 = vocabModel.pos[v];
          const isHi = hiEdges.has(edgeKey(u, v));
          const cls = ["tree-edge"];
          if (isHi) cls.push("is-highlight");
          else if (view.dimOthers) cls.push("is-dim");

          edgesG.appendChild(svgEl("line", {
            x1: p1.x,
            y1: p1.y,
            x2: p2.x,
            y2: p2.y,
            class: cls.join(" ")
          }));
        }

        for (const id of vocabModel.nodes) {
          const p = vocabModel.pos[id];
          const isStart = view.startId === id;
          const isHi = hiIds.has(id) || pressedIds.has(id);

          const cls = ["tree-node"];
          if (!clickable) cls.push("is-static");
          if (pulseFirst) cls.push("is-pulse");
          if (isHi) cls.push("is-highlight");
          else if (view.dimOthers && !isStart) cls.push("is-dim");
          if (isStart) cls.push("is-start");

          const attrs = {
            class: cls.join(" "),
            transform: "translate(" + p.x + "," + p.y + ")",
            "data-node": id
          };
          if (clickable) {
            attrs.tabindex = "0";
            attrs.role = "button";
            attrs["aria-label"] = "Node " + id;
            if (isMulticlick) {
              attrs["aria-pressed"] = pressedIds.has(id) ? "true" : "false";
            }
          }

          const g = svgEl("g", attrs);
          g.appendChild(svgEl("circle", { r: 29.5, class: "node-focus-ring" }));
          g.appendChild(svgEl("circle", { r: 25.5, class: "node-hi-ring" }));
          if (isStart) {
            g.appendChild(svgEl("circle", { r: 28, class: "node-ring" }));
          }
          g.appendChild(svgEl("circle", { r: 22, class: "node-circle" }));
          g.appendChild(svgEl("text", { class: "node-label", x: 0, y: 0 }, id));

          if (view.badges && view.badges[id] !== undefined) {
            renderBadgePills(g, view.badges[id], p.x);
          }

          if (clickable) {
            g.addEventListener("click", () => onNodeClick(id));
            g.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                onNodeClick(id);
              }
            });
          }
          nodesG.appendChild(g);
        }

        vocabSvg.appendChild(edgesG);
        vocabSvg.appendChild(nodesG);
      }

      // Binary SVG persistent layers (keyed by label for CSS transform animation)
      const btEdgesLayer = svgEl("g", { class: "bt-edges-layer" });
      const btEdgeLabelsLayer = svgEl("g", { class: "bt-edge-labels-layer" });
      const btEmptiesLayer = svgEl("g", { class: "bt-empties-layer" });
      const btNodesLayer = svgEl("g", { class: "bt-nodes-layer" });
      binarySvg.appendChild(btEdgesLayer);
      binarySvg.appendChild(btEdgeLabelsLayer);
      binarySvg.appendChild(btEmptiesLayer);
      binarySvg.appendChild(btNodesLayer);

      const allBinaryLabels = [];
      const btFallbackPos = {};
      (function collectBinaryLabels() {
        const seen = new Set();
        for (const key of Object.keys(binaryLayouts)) {
          const lay = binaryLayouts[key];
          for (const id of lay.labels) {
            if (!seen.has(id)) {
              seen.add(id);
              allBinaryLabels.push(id);
              btFallbackPos[id] = { x: lay.pos[id].x, y: lay.pos[id].y };
            }
          }
        }
      })();

      const btNodeEls = {};
      const btNodePresent = {};
      const btCurrentPos = {};
      let btClickHandler = null;
      let btInspectHandler = null;
      let edgeAnimFrame = null;
      let lastBinaryTreeKey = null;

      function initBinaryNodes() {
        const layout = binaryLayouts.a;
        for (const id of allBinaryLabels) {
          const p = layout.pos[id] || btFallbackPos[id];
          const present = Boolean(layout.pos[id]);
          btCurrentPos[id] = { x: p.x, y: p.y };
          btNodePresent[id] = present;
          const g = svgEl("g", {
            class: "tree-node bt-node" + (present ? "" : " is-absent"),
            role: "button",
            "aria-label": "Node " + id,
            "data-bt-node": id
          });
          if (present) {
            g.setAttribute("tabindex", "0");
          } else {
            g.setAttribute("aria-hidden", "true");
          }
          g.style.transform = "translate(" + p.x + "px, " + p.y + "px)";
          g.appendChild(svgEl("circle", { r: 29.5, class: "node-focus-ring" }));
          g.appendChild(svgEl("circle", { r: 25.5, class: "node-hi-ring" }));
          g.appendChild(svgEl("circle", { r: 22, class: "node-circle" }));
          g.appendChild(svgEl("text", { class: "node-label", x: 0, y: 0 }, id));
          g.addEventListener("click", () => {
            if (btClickHandler && btNodePresent[id]) btClickHandler(id);
          });
          g.addEventListener("mouseenter", () => {
            if (btInspectHandler && btNodePresent[id]) btInspectHandler(id);
          });
          g.addEventListener("focus", () => {
            if (btInspectHandler && btNodePresent[id]) btInspectHandler(id);
          });
          g.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.key === " ") && btClickHandler && btNodePresent[id]) {
              e.preventDefault();
              btClickHandler(id);
            }
          });
          btNodeEls[id] = g;
          btNodesLayer.appendChild(g);
        }
        lastBinaryTreeKey = "a";
      }

      function getLiveNodePos(id, fallback) {
        const tr = getComputedStyle(btNodeEls[id]).transform;
        if (tr && tr !== "none") {
          const m = new DOMMatrix(tr);
          if (Number.isFinite(m.e) && Number.isFinite(m.f)) {
            return { x: m.e, y: m.f };
          }
        }
        return fallback;
      }

      function drawBinaryEdgesAt(layout, posMap, view) {
        btEdgesLayer.replaceChildren();
        btEdgeLabelsLayer.replaceChildren();
        const hiEdges = new Set((view && view.highlightEdges) || []);
        const sf = view && view.slotFill ? view.slotFill : null;

        if (sf) {
          const filledSet = new Set(sf.order.slice(0, sf.filledCount).map((e) => e.key));
          const reduce = prefersReducedMotion();
          for (const edge of sf.order) {
            const p1 = posMap[edge.from];
            const p2 = posMap[edge.to];
            const sx = (p1.x + p2.x) / 2;
            const sy = (p1.y + p2.y) / 2;
            const isFilled = filledSet.has(edge.key);
            const isJust = isFilled && sf.justFilledKey === edge.key;

            if (isFilled) {
              const cls = ["tree-edge"];
              if (isJust && !reduce) {
                cls.push("slot-fill-edge", "is-landing");
              } else if (isJust) {
                cls.push("is-highlight");
              }
              btEdgesLayer.appendChild(svgEl("line", {
                x1: p1.x,
                y1: p1.y,
                x2: p2.x,
                y2: p2.y,
                class: cls.join(" ")
              }));
            } else {
              btEdgesLayer.appendChild(svgEl("line", {
                x1: p1.x,
                y1: p1.y,
                x2: sx,
                y2: sy,
                class: "slot-fill-edge is-ghost"
              }));
            }

            const sqCls = ["slot-fill-square"];
            if (isFilled) {
              sqCls.push("is-filled");
              if (isJust) sqCls.push("is-just-filled");
            } else {
              sqCls.push("is-ghost");
            }
            btEdgesLayer.appendChild(svgEl("rect", {
              x: sx - 9,
              y: sy - 9,
              width: 18,
              height: 18,
              rx: 2,
              class: sqCls.join(" "),
              "data-slot": edge.key
            }));
          }
          return;
        }

        for (const edge of layout.edges) {
          const p1 = posMap[edge.from];
          const p2 = posMap[edge.to];
          const isHi = hiEdges.has(edgeKey(edge.from, edge.to));
          btEdgesLayer.appendChild(svgEl("line", {
            x1: p1.x,
            y1: p1.y,
            x2: p2.x,
            y2: p2.y,
            class: "tree-edge" + (isHi ? " is-highlight" : "")
          }));

          if (view && view.edgeLabels) {
            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;
            btEdgeLabelsLayer.appendChild(svgEl("rect", {
              x: mx - 8,
              y: my - 8,
              width: 16,
              height: 16,
              rx: 3,
              class: "edge-label-bg"
            }));
            btEdgeLabelsLayer.appendChild(svgEl("text", {
              x: mx,
              y: my,
              class: "edge-label-text"
            }, edge.side));
          }
        }
      }

      function renderBinaryEmpties(layout, view) {
        btEmptiesLayer.replaceChildren();
        const mode = view.showEmpties || "none";
        if (mode === "none") return;

        const filterParents = Array.isArray(mode) ? new Set(mode) : null;
        const shouldFlash = Boolean(view.flashEmpties) && !prefersReducedMotion();
        for (const emp of layout.empties) {
          if (filterParents && !filterParents.has(emp.parent)) continue;
          const p = layout.pos[emp.parent];
          const grp = svgEl("g", {
            class: "empty-slot-group" + (shouldFlash ? " is-new" : ""),
            "data-empty": emp.key
          });
          grp.appendChild(svgEl("line", {
            x1: p.x,
            y1: p.y,
            x2: emp.x,
            y2: emp.y,
            class: "empty-slot-edge"
          }));
          grp.appendChild(svgEl("rect", {
            x: emp.x - 10,
            y: emp.y - 10,
            width: 20,
            height: 20,
            rx: 2,
            class: "empty-slot-box"
          }));
          btEmptiesLayer.appendChild(grp);
        }

        if (shouldFlash) {
          setTimeout(() => {
            btEmptiesLayer.querySelectorAll(".empty-slot-group.is-new").forEach((el) => {
              el.classList.remove("is-new");
            });
          }, 900);
        }
      }

      function renderCompareBinaryView(compareKeys, view) {
        binaryCompare.replaceChildren();
        const hiByTree = view.compareHighlights || {};
        const hiEdgesByTree = view.compareHighlightEdges || {};

        for (const key of compareKeys) {
          const layout = binaryLayouts[key];
          if (!layout) continue;
          const card = document.createElement("div");
          card.className = "compare-card";

          const title = document.createElement("p");
          title.className = "compare-title";
          title.textContent = layout.name;
          card.appendChild(title);

          const xs = layout.labels.map((id) => layout.pos[id].x);
          const ys = layout.labels.map((id) => layout.pos[id].y);
          const minX = Math.min(...xs) - 42;
          const maxX = Math.max(...xs) + 42;
          const minY = Math.min(...ys) - 34;
          const maxY = Math.max(...ys) + 36;
          const svg = svgEl("svg", {
            class: "tree-svg",
            viewBox: minX + " " + minY + " " + (maxX - minX) + " " + (maxY - minY),
            "aria-label": layout.name + ", " + layout.nodeCount + "-node binary tree"
          });

          const hiIds = new Set(hiByTree[key] || []);
          const hiEdges = new Set(hiEdgesByTree[key] || []);

          const eLayer = svgEl("g", {});
          const lLayer = svgEl("g", {});
          const nLayer = svgEl("g", {});

          for (const edge of layout.edges) {
            const p1 = layout.pos[edge.from];
            const p2 = layout.pos[edge.to];
            const isHi = hiEdges.has(edgeKey(edge.from, edge.to));
            eLayer.appendChild(svgEl("line", {
              x1: p1.x,
              y1: p1.y,
              x2: p2.x,
              y2: p2.y,
              class: "tree-edge" + (isHi ? " is-highlight" : "")
            }));
            const mx = (p1.x + p2.x) / 2;
            const my = (p1.y + p2.y) / 2;
            lLayer.appendChild(svgEl("rect", {
              x: mx - 8,
              y: my - 8,
              width: 16,
              height: 16,
              rx: 3,
              class: "edge-label-bg"
            }));
            lLayer.appendChild(svgEl("text", {
              x: mx,
              y: my,
              class: "edge-label-text"
            }, edge.side));
          }

          for (const id of layout.labels) {
            const p = layout.pos[id];
            const g = svgEl("g", {
              class: "tree-node is-static" + (hiIds.has(id) ? " is-highlight" : ""),
              transform: "translate(" + p.x + "," + p.y + ")"
            });
            g.appendChild(svgEl("circle", { r: 22, class: "node-circle" }));
            g.appendChild(svgEl("text", { class: "node-label", x: 0, y: 0 }, id));
            nLayer.appendChild(g);
          }

          svg.appendChild(eLayer);
          svg.appendChild(lLayer);
          svg.appendChild(nLayer);
          card.appendChild(svg);
          binaryCompare.appendChild(card);
        }
      }

      function updateStageCounter(text, note, highlight) {
        if (text) {
          binaryCounter.hidden = false;
          binaryCounter.textContent = text;
          binaryCounter.classList.toggle("is-highlight", Boolean(highlight));
        } else {
          binaryCounter.hidden = true;
          binaryCounter.textContent = "";
          binaryCounter.classList.remove("is-highlight");
        }
        if (text && note) {
          binaryCounterNote.hidden = false;
          binaryCounterNote.textContent = note;
        } else {
          binaryCounterNote.hidden = true;
          binaryCounterNote.textContent = "";
        }
      }

      function renderBinaryView(view, onNodeClick, interaction) {
        if (edgeAnimFrame) {
          cancelAnimationFrame(edgeAnimFrame);
          edgeAnimFrame = null;
        }

        const reduce = prefersReducedMotion();
        btInspectHandler = (interaction && interaction.onInspectHover) || null;

        if (Array.isArray(view.compareKeys) && view.compareKeys.length > 0) {
          lastBinaryTreeKey = null;
          btClickHandler = null;
          binaryTreeName.hidden = false;
          binaryTreeName.textContent = view.compareKeys.map((k) => binaryLayouts[k].name).join(" vs. ");
          binarySvg.setAttribute("hidden", "");
          binaryHiddenPanel.hidden = true;
          binaryCompare.hidden = false;
          renderCompareBinaryView(view.compareKeys, view);
          updateStageCounter("", "", false);
          return;
        }

        binaryCompare.hidden = true;

        if (!view.treeKey) {
          lastBinaryTreeKey = null;
          btClickHandler = null;
          binaryTreeName.hidden = true;
          binaryTreeName.textContent = "";
          binarySvg.setAttribute("hidden", "");
          binaryHiddenPanel.hidden = false;
          binaryHiddenReadout.textContent = "n = " + (view.hiddenN !== undefined ? view.hiddenN : "?");
          updateStageCounter(view.counterText, view.counterNote, false);
          return;
        }

        binarySvg.removeAttribute("hidden");
        binaryHiddenPanel.hidden = true;

        const treeKey = view.treeKey;
        const layout = binaryLayouts[treeKey];
        const treeChanged = lastBinaryTreeKey !== null && lastBinaryTreeKey !== treeKey;
        lastBinaryTreeKey = treeKey;

        binaryTreeName.hidden = false;
        binaryTreeName.textContent = layout.name;

        const isVisible = !tabPanels[1].hidden;
        const shouldAnimate = treeChanged && isVisible && !reduce && view.animate !== false;
        if (shouldAnimate) {
          binaryTreeName.classList.remove("is-crossfading");
          btEdgeLabelsLayer.classList.remove("is-crossfading");
          void binaryTreeName.offsetWidth;
          binaryTreeName.classList.add("is-crossfading");
          btEdgeLabelsLayer.classList.add("is-crossfading");
        } else {
          binaryTreeName.classList.remove("is-crossfading");
          btEdgeLabelsLayer.classList.remove("is-crossfading");
        }

        btClickHandler = onNodeClick || null;
        binarySvg.setAttribute("aria-label", layout.name + ", " + layout.nodeCount + "-node binary tree");

        const hiIds = new Set(view.highlightIds || []);
        const sf = view.slotFill || null;
        const filledNodes = sf ? new Set([layout.root].concat(sf.order.slice(0, sf.filledCount).map((e) => e.to))) : null;
        const clickable = Boolean(onNodeClick);
        const pulseFirst = Boolean(interaction && interaction.pulseFirst) && clickable && !reduce;

        updateStageCounter(view.counterText, view.counterNote, view.flashEmpties);

        if (!shouldAnimate) {
          for (const id of allBinaryLabels) {
            const el = btNodeEls[id];
            const target = layout.pos[id];
            el.style.transition = "none";
            if (target) {
              el.style.transform = "translate(" + target.x + "px, " + target.y + "px)";
              el.classList.remove("is-absent");
              el.classList.toggle("is-highlight", hiIds.has(id));
              el.classList.toggle("is-dim", Boolean(filledNodes && !filledNodes.has(id)));
              el.classList.toggle("is-static", !clickable);
              el.classList.toggle("is-pulse", pulseFirst);
              if (clickable) {
                el.setAttribute("tabindex", "0");
                el.setAttribute("role", "button");
              } else {
                el.removeAttribute("tabindex");
                el.removeAttribute("role");
              }
              el.removeAttribute("aria-hidden");
              btCurrentPos[id] = { x: target.x, y: target.y };
              btNodePresent[id] = true;
            } else {
              el.classList.add("is-absent");
              el.classList.remove("is-highlight", "is-dim", "is-pulse");
              el.removeAttribute("tabindex");
              el.removeAttribute("role");
              el.setAttribute("aria-hidden", "true");
              btNodePresent[id] = false;
            }
          }
          void binarySvg.getBoundingClientRect();
          for (const id of allBinaryLabels) {
            btNodeEls[id].style.transition = "";
          }
          drawBinaryEdgesAt(layout, btCurrentPos, view);
          renderBinaryEmpties(layout, view);
          return;
        }

        const enteringNodes = [];
        for (const id of allBinaryLabels) {
          const el = btNodeEls[id];
          const target = layout.pos[id];
          const wasPresent = btNodePresent[id];

          el.classList.toggle("is-highlight", Boolean(target) && hiIds.has(id));
          el.classList.toggle("is-dim", Boolean(target && filledNodes && !filledNodes.has(id)));
          el.classList.toggle("is-static", !clickable);
          el.classList.toggle("is-pulse", Boolean(target) && pulseFirst);

          if (!target) {
            el.classList.add("is-absent");
            el.removeAttribute("tabindex");
            el.removeAttribute("role");
            el.setAttribute("aria-hidden", "true");
            btNodePresent[id] = false;
          } else if (!wasPresent) {
            el.style.transition = "none";
            el.style.transform = "translate(" + target.x + "px, " + target.y + "px)";
            btCurrentPos[id] = { x: target.x, y: target.y };
            enteringNodes.push(el);
            btNodePresent[id] = true;
          } else {
            el.classList.remove("is-absent");
            if (clickable) {
              el.setAttribute("tabindex", "0");
              el.setAttribute("role", "button");
            } else {
              el.removeAttribute("tabindex");
              el.removeAttribute("role");
            }
            el.removeAttribute("aria-hidden");
            el.style.transform = "translate(" + target.x + "px, " + target.y + "px)";
            btNodePresent[id] = true;
          }
        }

        if (enteringNodes.length > 0) {
          void binarySvg.getBoundingClientRect();
          for (const el of enteringNodes) {
            el.style.transition = "";
            el.classList.remove("is-absent");
            if (clickable) {
              el.setAttribute("tabindex", "0");
              el.setAttribute("role", "button");
            } else {
              el.removeAttribute("tabindex");
              el.removeAttribute("role");
            }
            el.removeAttribute("aria-hidden");
          }
        }

        let startTime = null;
        const maxDuration = 420;
        btEmptiesLayer.replaceChildren();

        function tick(now) {
          if (startTime === null) startTime = now;
          const elapsed = now - startTime;
          let allSettled = true;
          for (const id of layout.labels) {
            const target = layout.pos[id];
            const live = getLiveNodePos(id, target);
            btCurrentPos[id] = live;
            if (Math.hypot(live.x - target.x, live.y - target.y) > 0.4) {
              allSettled = false;
            }
          }
          drawBinaryEdgesAt(layout, btCurrentPos, view);

          if ((elapsed < 30 || !allSettled) && elapsed < maxDuration) {
            edgeAnimFrame = requestAnimationFrame(tick);
          } else {
            for (const id of layout.labels) {
              btCurrentPos[id] = { x: layout.pos[id].x, y: layout.pos[id].y };
            }
            drawBinaryEdgesAt(layout, btCurrentPos, view);
            edgeAnimFrame = null;
            renderBinaryEmpties(layout, view);
          }
        }
        edgeAnimFrame = requestAnimationFrame(tick);
      }

      /* ---------------------------------------------------------------------
       * STEP ENGINE (shared by Part 1 and Part 2)
       * --------------------------------------------------------------------- */
      function cloneView(v) {
        return JSON.parse(JSON.stringify(v));
      }

      function createPartController(config) {
        prepareStepChoices(config.steps, 0);

        const state = {
          initialized: false,
          stepIndex: 0,
          taskIndex: 0,
          attempts: 0,
          finishedSteps: new Set(),
          savedSteps: new Map(),
          savedTasks: new Map(),
          glossary: [],
          freshGlossary: new Set(),
          taskDone: false,
          taskChoiceGuess: null,
          multiSelected: new Set(),
          exploredClicks: 0,
          exploredNodeId: null,
          revealedInfo: false,
          fillCount: 0,
          justFilledKey: null,
          usedFillAll: false,
          feedback: null, // { kind: "correct"|"wrong"|"revealed", text: string }
          view: null,
          quizScores: [], // for quickCheck steps
          quizDone: false,
          quizVariant: 0,
          subIndex: 0,
          pulsedFirstClick: false,
          animToken: 0
        };

        const bannerTitle = document.createElement("h2");
        bannerTitle.className = "banner-title";
        bannerTitle.tabIndex = -1;
        const bannerIntro = document.createElement("p");
        bannerIntro.className = "banner-intro";
        const bannerResult = document.createElement("div");
        bannerResult.className = "result-card";
        bannerResult.hidden = true;
        const taskBoxEl = document.createElement("div");
        taskBoxEl.className = "task-box";
        const taskTopEl = document.createElement("div");
        taskTopEl.className = "task-top";
        const feedbackEl = document.createElement("p");
        feedbackEl.className = "task-feedback";
        feedbackEl.setAttribute("aria-live", "polite");
        feedbackEl.setAttribute("aria-atomic", "true");
        taskBoxEl.appendChild(taskTopEl);
        taskBoxEl.appendChild(feedbackEl);

        config.bannerEl.replaceChildren();
        config.bannerEl.appendChild(bannerTitle);
        config.bannerEl.appendChild(bannerIntro);
        config.bannerEl.appendChild(bannerResult);
        config.bannerEl.appendChild(taskBoxEl);

        function addGlossaryTerms(terms) {
          if (!terms || terms.length === 0) return;
          for (const t of terms) {
            if (!state.glossary.includes(t)) {
              state.glossary.push(t);
              state.freshGlossary.add(t);
            }
          }
        }

        function currentStep() {
          return config.steps[state.stepIndex];
        }

        function currentTask() {
          const step = currentStep();
          return step.tasks[state.taskIndex] || null;
        }

        function saveSnapshot(viewOverride) {
          const step = currentStep();
          if (!step || !state.view) return;
          state.savedSteps.set(step.id, {
            taskIndex: state.taskIndex,
            quizScores: state.quizScores.slice(),
            quizDone: state.quizDone
          });
          state.savedTasks.set(step.id + ":" + state.taskIndex, {
            attempts: state.attempts,
            subIndex: state.subIndex,
            taskDone: state.taskDone,
            taskChoiceGuess: state.taskChoiceGuess,
            multiSelected: Array.from(state.multiSelected),
            exploredClicks: state.exploredClicks,
            exploredNodeId: state.exploredNodeId,
            revealedInfo: state.revealedInfo,
            fillCount: state.fillCount,
            justFilledKey: state.justFilledKey,
            usedFillAll: state.usedFillAll,
            feedback: state.feedback ? { kind: state.feedback.kind, text: state.feedback.text } : null,
            view: cloneView(viewOverride || state.view)
          });
        }

        function loadOrInitTask() {
          const step = currentStep();
          const snap = state.savedTasks.get(step.id + ":" + state.taskIndex);
          if (snap) {
            state.animToken += 1;
            state.attempts = snap.attempts;
            state.subIndex = snap.subIndex || 0;
            state.taskDone = snap.taskDone;
            state.taskChoiceGuess = snap.taskChoiceGuess;
            state.multiSelected = new Set(snap.multiSelected);
            state.exploredClicks = snap.exploredClicks;
            state.exploredNodeId = snap.exploredNodeId;
            state.revealedInfo = snap.revealedInfo;
            state.fillCount = snap.fillCount;
            state.justFilledKey = snap.justFilledKey;
            state.usedFillAll = snap.usedFillAll;
            state.feedback = snap.feedback ? { kind: snap.feedback.kind, text: snap.feedback.text } : null;
            state.view = cloneView(snap.view);
            return;
          }
          initTask();
        }

        function enterStep(idx, shouldFocus, skipOutgoingSave) {
          if (state.initialized && !skipOutgoingSave) {
            saveSnapshot();
          }
          state.animToken += 1;
          state.stepIndex = idx;
          state.freshGlossary = new Set();
          const step = currentStep();
          const savedStep = state.savedSteps.get(step.id);
          state.quizScores = savedStep ? savedStep.quizScores.slice() : [];
          state.quizDone = savedStep ? Boolean(savedStep.quizDone) : false;

          if (step.isQuickCheck && state.quizDone && savedStep) {
            state.taskIndex = savedStep.taskIndex;
          } else if (state.finishedSteps.has(step.id)) {
            state.taskIndex = 0;
          } else if (savedStep) {
            state.taskIndex = savedStep.taskIndex;
          } else {
            state.taskIndex = 0;
          }

          addGlossaryTerms(step.glossaryIntro || []);
          loadOrInitTask();
          state.initialized = true;
          saveSnapshot();
          renderAll(shouldFocus);
        }

        function initTask() {
          state.animToken += 1;
          state.attempts = 0;
          state.subIndex = 0;
          state.taskDone = false;
          state.taskChoiceGuess = null;
          state.multiSelected = new Set();
          state.exploredClicks = 0;
          state.exploredNodeId = null;
          state.revealedInfo = false;
          state.fillCount = 0;
          state.justFilledKey = null;
          state.usedFillAll = false;
          state.feedback = null;
          state.view = cloneView(config.baseView);

          const step = currentStep();
          if (step.initialView) {
            Object.assign(state.view, cloneView(step.initialView));
          }
          const task = currentTask();
          if (task && task.onShow) {
            task.onShow(state.view, state, renderView);
          }
        }

        function completeCurrentTask() {
          const step = currentStep();
          const task = currentTask();
          state.taskDone = true;
          if (task && task.glossaryAdds) {
            addGlossaryTerms(task.glossaryAdds);
          }
          if (task && task.onDone) {
            task.onDone(state.view, state);
          }
          if (state.taskIndex >= step.tasks.length - 1) {
            state.finishedSteps.add(step.id);
            if (step.glossaryOnFinish) {
              addGlossaryTerms(step.glossaryOnFinish);
            }
            if (step.isQuickCheck) {
              config.onQuickCheckChange(true);
            }
          }
          saveSnapshot();
        }

        function advanceTaskOrStep() {
          saveSnapshot();
          const step = currentStep();
          if (state.taskIndex < step.tasks.length - 1) {
            state.taskIndex += 1;
            loadOrInitTask();
            saveSnapshot();
            renderAll(false);
          } else {
            goNextStep();
          }
        }

        function goNextStep() {
          if (state.stepIndex < config.steps.length - 1) {
            enterStep(state.stepIndex + 1, true);
          } else {
            config.onGoOtherPart();
          }
        }

        function goBackStep() {
          if (state.stepIndex > 0) {
            enterStep(state.stepIndex - 1, true);
          } else if (config.onBackAtStart) {
            config.onBackAtStart();
          } else {
            state.feedback = { kind: "correct", text: "You are at Step 1." };
            renderAll(true);
          }
        }

        function handleSkipOrNext() {
          const step = currentStep();
          if (state.finishedSteps.has(step.id)) {
            goNextStep();
            return;
          }
          // Skip step: reveal current task answer, add step glossary terms, and mark step finished
          const task = currentTask();
          state.finishedSteps.add(step.id);
          for (const t of step.tasks) {
            if (t.glossaryAdds) addGlossaryTerms(t.glossaryAdds);
          }
          if (step.glossaryOnFinish) addGlossaryTerms(step.glossaryOnFinish);
          if (step.isQuickCheck) {
            for (let i = 0; i < step.tasks.length; i++) {
              if (state.quizScores[i] === undefined) state.quizScores[i] = false;
            }
            state.quizDone = true;
            config.onQuickCheckChange(true);
            saveSnapshot();
            renderAll(false);
            return;
          }
          if (task) {
            if (task.type === "choice" && task.answer !== undefined) {
              state.taskChoiceGuess = task.answer;
            }
            if (task.onDone) task.onDone(state.view, state);
            state.taskDone = true;
            state.feedback = {
              kind: "revealed",
              text: "Skipped. " + (task.explain || "Moving on is fine \u2014 use Next when ready.")
            };
          }
          saveSnapshot();
          renderAll(false);
        }

        function handleNodeInteraction(id) {
          const task = currentTask();
          if (!task) return;

          if (task.type === "click") {
            if (state.taskDone) return;
            const hasSubs = Array.isArray(task.subChecks) && task.subChecks.length > 0;
            const subIdx = hasSubs ? state.subIndex : 0;
            const checkFn = hasSubs ? task.subChecks[subIdx] : task.check;
            const ok = checkFn(id);

            if (ok) {
              if (hasSubs && subIdx < task.subChecks.length - 1) {
                state.subIndex = subIdx + 1;
                state.attempts = 0;
                state.animToken += 1;
                if (task.onSubDone) {
                  task.onSubDone(subIdx, state.view, state);
                }
                const subMsg = (task.subExplains && task.subExplains[subIdx]) || "Good. Keep going.";
                state.feedback = { kind: "correct", text: subMsg };
                saveSnapshot();
                renderAll(false);
                return;
              }
              state.animToken += 1;
              state.feedback = { kind: "correct", text: "Correct. " + (task.explain || "") };
              completeCurrentTask();
            } else {
              state.attempts += 1;
              const hintText = task.hints && task.hints.length > 0 ? task.hints[0] : "";
              const hasVisual = typeof task.visualHint === "function" || (hasSubs && typeof task.subVisualHint === "function");

              if (state.attempts === 1) {
                state.feedback = {
                  kind: "wrong",
                  text: hintText || ("Not node " + id + " \u2014 try again.")
                };
              } else if (state.attempts === 2 && hasVisual) {
                state.feedback = {
                  kind: "wrong",
                  text: hintText || "Look at the highlighted area on the tree, then try again."
                };
                const cleanView = cloneView(state.view);
                if (hasSubs && task.subVisualHint) {
                  task.subVisualHint(subIdx, state.view, state);
                } else {
                  task.visualHint(state.view, state);
                }
                state.animToken += 1;
                const tok = state.animToken;
                saveSnapshot(cleanView);
                renderAll(false);
                setTimeout(() => {
                  if (state.animToken !== tok || state.taskDone) return;
                  state.view = cleanView;
                  renderView();
                }, 2000);
                return;
              } else {
                state.animToken += 1;
                state.feedback = { kind: "revealed", text: "Answer revealed. " + (task.explain || "") };
                completeCurrentTask();
              }
            }
            saveSnapshot();
            renderAll(false);
          } else if (task.type === "multiclick") {
            if (state.taskDone) return;
            if (state.multiSelected.has(id)) {
              state.multiSelected.delete(id);
            } else {
              state.multiSelected.add(id);
            }
            if (state.feedback && state.feedback.kind === "wrong") {
              state.feedback = null;
            }
            saveSnapshot();
            renderAll(false);
          } else if (task.type === "explore") {
            state.exploredClicks += 1;
            state.exploredNodeId = id;
            if (task.onExplore) task.onExplore(id, state.view, state);
            saveSnapshot();
            renderAll(false);
          }
        }

        function handleChoice(val) {
          const task = currentTask();
          if (!task || state.taskDone) return;
          const ok = task.check(val);
          const step = currentStep();

          if (step.isQuickCheck) {
            state.taskChoiceGuess = val;
            state.quizScores[state.taskIndex] = ok;
            state.feedback = {
              kind: ok ? "correct" : "revealed",
              text: (ok ? "Correct. " : "Not quite. ") + (task.explain || "")
            };
            completeCurrentTask();
            saveSnapshot();
            renderAll(false);
            return;
          }

          if (ok) {
            state.taskChoiceGuess = val;
